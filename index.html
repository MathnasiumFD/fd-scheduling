  html+='<div class="row2"><div><label>From</label><select onchange="setEditInstructorField(\'yearMin\', Number(this.value))">'
    +YEARS.map(function(y){ return '<option value="'+y+'"'+(y===f.yearMin?' selected':'')+'>'+yearLabel(y)+'</option>'; }).join('')
    +'</select></div>'
    +'<div><label>To</label><select onchange="setEditInstructorField(\'yearMax\', Number(this.value))">'
    +YEARS.map(function(y){ return '<option value="'+y+'"'+(y===f.yearMax?' selected':'')+'>'+yearLabel(y)+'</option>'; }).join('')
    +'</select></div></div>';
  if(instr.authUserId){
    html+='<p class="small muted">They already have a login — changing the email above only updates their contact record here, not what they actually sign in with.</p>';
  }
  // One-off, per-instructor exception (Sept 2026, per Allie: "orange at 15 mins, red at 5 minutes,
  // purple from 0" — "this is for harry only"): everyone else keeps the standard pack-up countdown
  // colours on their own "My Pod today" board; this checkbox is the only way this differs per
  // instructor, rather than hardcoding a name anywhere.
  html+='<label style="display:flex;align-items:center;gap:8px;margin-top:10px">'
    +'<input type="checkbox" '+(f.packUpCustomColors?'checked':'')+' onchange="setEditInstructorField(\'packUpCustomColors\', this.checked)"/> '
    +'Custom pack-up countdown colours (orange at 15 min, red at 5 min, purple from 0)</label>';
  // Personal combined online+physical ratio override (Sept 2026, per Allie) — almost everyone leaves
  // this blank and uses the standard ratio (ONLINE_COMBINED_CAP); only affects how many kids this
  // instructor's own Online group can combine with their physical Pod headcount to, never a Pod's
  // own physical seat capacity.
  html+='<label style="margin-top:10px">Combined online+physical ratio override <span class="small muted">(blank = standard ratio of 1:'+ONLINE_COMBINED_CAP+')</span></label>'
    +'<input type="number" min="1" step="1" placeholder="'+ONLINE_COMBINED_CAP+'" value="'+f.combinedCapOverride+'" oninput="setEditInstructorField(\'combinedCapOverride\', this.value)" style="max-width:100px"/>';
  if(f.error) html+='<div class="banner danger">'+f.error+'</div>';

    +'<button class="btn ghost" onclick="closeEditInstructorForm()">Cancel</button>'
    +'<button class="btn primary" onclick="saveEditInstructor()">Save</button>'
  +'</div>';
  html+='</div></div>';
  return html;
}

function openRecurringForm(studentId){
  const student=findStudent(studentId);
  const starts=possibleStarts(student.duration);
  let slots = (student.recurring||[]).map(function(r){ return {weekday:r.weekday, start:r.start}; });
  while(slots.length<student.sessionsPerWeek) slots.push({weekday:'Mon', start:starts[0]});
  slots=slots.slice(0,student.sessionsPerWeek);
  // Snapshot of what each row actually was BEFORE this edit, kept untouched for the life of the
  // form purely to show "Currently: ..." next to each picker (see renderRecurringPickers) — slots
  // itself gets overwritten row by row as the pickers change, so without a separate copy there'd be
  // nothing left to compare against once you started editing.
  state.recurringForm={studentId, slots, originalSlots: slots.map(function(s){ return {weekday:s.weekday, start:s.start}; })};
  render();
}
function closeRecurringForm(){ state.recurringForm=null; render(); }
function setRecurringSlot(idx, field, value){
  state.recurringForm.slots[idx][field] = field==='start'? Number(value) : value;
  render();
}
function saveRecurringForm(){
  const f=state.recurringForm;
  const student=findStudent(f.studentId);
  student.recurring = f.slots.map(function(s){ return {weekday:s.weekday, start:s.start}; });

  // Persist the edited pattern to student_recurring_slots — the table loadAllData() actually
  // rebuilds student.recurring from on every page load. This form used to only ever change
  // student.recurring in memory, so the edit looked saved but would quietly revert to whatever was
  // last written here the next time anyone reloaded the app (found alongside the ghost-session bug
  // just above, Sept 2026) — delete-then-insert, same convention saveNewStudent() uses at signup.
  dbWrite('saving an edited regular schedule', function(){
    return supabaseClient.from('student_recurring_slots').delete().eq('student_id', student.id).then(function(){
      if(!student.recurring.length) return;
      return supabaseClient.from('student_recurring_slots').insert(student.recurring.map(function(rec){
        return {student_id:student.id, weekday:rec.weekday, start_min:rec.start};
      }));
    });
  });

  // Clear out every upcoming STANDING occurrence generated under the OLD pattern before rebuilding
  // from the new one. Found Sept 2026: editing a student's regular schedule here overwrote
  // student.recurring and generated fresh sessions for the new pattern, but never touched sessions
  // already generated under the old one — they just sat there indefinitely as live "scheduled"
  // bookings alongside the new ones (a student edited from Mon/Fri 4pm to Mon 3pm/Wed 4:45pm still
  // had real Mon/Fri 4pm sessions weeks into the future). Mirrors the exact clear-then-regenerate
  // approach applyTimeChange()/savePlanChange() already use for the "Stop / change plan" form; only
  // recurring:true placeholders are touched, so a one-off/make-up booking is never disturbed, and a
  // credit already redeemed against a cleared session is restored, same as any other cancellation.
  let clearedCount=0;
  sessions.forEach(function(s){
    if(s.studentId!==student.id || !s.recurring || s.status!=='scheduled') return;
    if(toKey(s.date) < toKey(simNow())) return;
    s.status='cancelled';
    clearedCount++;
    dbWrite('cancelling a session for an edited regular schedule', function(){ return supabaseClient.from('sessions').update({status:'cancelled'}).eq('id', s.id); });
    if(s.creditId){
      const cr=findCredit(s.creditId);
      if(cr && cr.status==='redeemed' && toKey(cr.expiryDate)>=toKey(simNow())){
        cr.status='available'; cr.redeemedSessionId=null;
        dbWrite('restoring a make-up credit', function(){ return supabaseClient.from('credits').update({status:'available', redeemed_session_id:null}).eq('id', cr.id); });
      }
    }
  });

  const made=generateRecurringSessions(student, HORIZON_WEEKS);
  const uncovered=slotsWithoutCoverage(student.recurring, student.duration, student.year);
  if(uncovered.length){
    toast(student.name+'’s regular schedule saved, but no Pod '+student.name+' qualifies for (by age) is currently staffed for '+describeUncoveredSlots(uncovered)+' — those session(s) couldn\'t be pre-booked yet. Assign coverage on the Schedule tab, then reopen this schedule and save it again.', 9000);
  } else {
    toast(student.name+'’s regular schedule saved — '+made+' upcoming session(s) pre-booked.'+(clearedCount? ' '+clearedCount+' old-schedule session(s) cleared.' : ''));
  }
  state.recurringForm=null;
  render();
}

/* ---------- student holds (front desk only) ---------- */
function openHoldForm(studentId){
  // grantMakeupCredits starts null, not false — a hold that turns out to touch any late-notice
  // session (see holdLateNoticeSessions below) can't save until front desk actually picks one of
  // the two options; see setHoldMakeupChoice.
  state.holdForm={studentId, start:toKey(simNow()), end:toKey(addDays(simNow(),7)), note:'', error:'', grantMakeupCredits:null};
  render();
}
function closeHoldForm(){ state.holdForm=null; render(); }
function setHoldField(field, value){
  state.holdForm[field]=value;
  state.holdForm.error='';
  // The start/end range (or which student it even applies to, now that "+ Hold" on the Holds tab
  // can open this with no student picked yet) decides which sessions (if any) fall inside the 7-day
  // billing-notice window, so any previous answer to "how should those be handled" no longer
  // necessarily applies — clear it and make them confirm again against the new range.
  if(field==='start' || field==='end' || field==='studentId'){ state.holdForm.grantMakeupCredits=null; }
  render();
}
function setHoldMakeupChoice(v){ state.holdForm.grantMakeupCredits=v; state.holdForm.error=''; render(); }
// Sept 2026, per Allie: "if front staff is placing a child on hold without sufficient notice, we
// should be prompted" — front desk placing a hold directly used to never issue make-up credits at
// all, full stop (see applyHold's own comment: "per desk discretion"). Now, whenever the date range
// they've entered would actually cancel a session that falls inside the 7-day-before-the-month
// billing-notice window (monthNoticeOk, same rule the parent-facing hold/cancel requests already
// use), front desk has to explicitly say whether that's fine as-is (notice was actually given some
// other way, payment's being adjusted, no make-up owed) or whether those specific sessions should
// become make-up credits instead — rather than the app silently doing the same "just cancel, no
// credit" thing regardless.
function holdLateNoticeSessions(studentId, startKey, endKey){
  if(!startKey || !endKey) return [];
  return sessions.filter(function(s){
    // Same condition applyHold() itself gates the credit-issuing branch on — a session already tied
    // to an existing credit (s.creditId) always just gets that credit restored regardless of notice
    // (see applyHold's own `if(s.creditId)` branch above the `else if` this mirrors), so it's not
    // actually a "which way do you want to handle this" decision at all — nothing new to choose.
    if(s.studentId!==studentId || s.status!=='scheduled' || s.creditId) return false;
    const dk=toKey(s.date);
    return dk>=startKey && dk<=endKey && !monthNoticeOk(s.date);
  });
}
// Shared by front desk placing a hold directly (saveHold) and front desk approving a parent's
// hold request (approveEnrollmentRequest) — same effect either way, just a different entry point.
// grantMakeupCredits gates whether late-notice credit logic applies at ALL (true only via a parent's
// own request; a front-desk-entered hold never auto-issues these, per desk discretion). When it's
// on, the actual "was there enough notice" check is per SESSION, not once for the whole hold — each
// session is tested against its own billing month's 1st, not just the hold's start date (Sept 2026,
// per Allie: "when approving a hold request that hasn't received enough notice... the missed
// sessions need to be automatically credited as make-up credits. Any sessions that fall in the
// period of sufficient notice, should just be automatically cancelled"). A hold spanning, say, late
// September into November can straddle both: September sessions (this cycle's billing already
// locked in) get a make-up credit, while November sessions (plenty of notice by now) just get a
// plain cancellation — exactly like an ordinary, well-notified hold.
function applyHold(student, start, end, note, grantMakeupCredits){
  const hold={id:newId()||('hold'+(nextSessionId++)), start:start, end:end, note:(note||'').trim(), creditsIssued:0};
  student.holds=student.holds||[];
  student.holds.push(hold);
  // Free up any of this student's own already-booked sessions that fall inside the hold window —
  // standing or one-off alike — so those Pod slots immediately show as available. A session paid
  // for with a make-up credit gets its credit restored (unless already past its own expiry),
  // same as any other cancelled make-up.
  let cancelledCount=0, madeUpCount=0;
  sessions.forEach(function(s){
    if(s.studentId!==student.id || s.status!=='scheduled') return;
    const dk=toKey(s.date);
    if(dk<toKey(hold.start) || dk>toKey(hold.end)) return;
    s.status='cancelled';
    cancelledCount++;
    dbWrite('cancelling a session for a hold', function(){ return supabaseClient.from('sessions').update({status:'cancelled'}).eq('id', s.id); });
    if(s.creditId){
      const credit=findCredit(s.creditId);
      if(credit && toKey(simNow())<=toKey(credit.expiryDate)){
        credit.status='available'; credit.redeemedSessionId=null;
        dbWrite('restoring a make-up credit', function(){ return supabaseClient.from('credits').update({status:'available', redeemed_session_id:null}).eq('id', credit.id); });
      }
    } else if(grantMakeupCredits && !monthNoticeOk(s.date)){
      // Named to this specific missed session's own date, not the hold's overall start–end range —
      // a hold that straddles a late-notice month and a well-notified one only issues credits for
      // sessions in the former, so the note should point at the actual session, not the whole hold.
      // issuedDate is likewise the missed SESSION's own date, not simNow() (today, whenever the hold
      // happens to get entered/approved) — same convention every other absence-driven credit already
      // follows (closure cancellations and ordinary excused-absence credits, just above and below),
      // so the Credits section lists it against when it was actually earned, not when it was
      // processed (Sept 2026, per Allie: "when issuing makeup credits for hold periods with
      // insufficient notice... i need it to be issued for the missed sessions, not for when they were
      // put through").
      const issued=s.date, expiry=addMonths(issued,3);
      const c={id:newId()||('c'+(nextCreditId++)), studentId:student.id, issuedDate:issued, expiryDate:expiry, status:'available', redeemedSessionId:null, warningSent:false, source:'excused-absence', note:'Missed during a late-notice hold — session on '+fmtShort(s.date)};
      credits.push(c);
      madeUpCount++;
      dbWrite('issuing a make-up credit (hold)', function(){ return supabaseClient.from('credits').insert({
        id:c.id, student_id:c.studentId, issued_date:toKey(c.issuedDate), expiry_date:toKey(c.expiryDate),
        status:c.status, redeemed_session_id:c.redeemedSessionId, warning_sent:c.warningSent, source:c.source, note:c.note
      }); });
    }
  });
  hold.creditsIssued=madeUpCount;
  // Fired only now, once creditsIssued is actually known — the hold row itself was pushed to local
  // state above (so the UI reflects it immediately) but its remote insert waits until after the
  // cancel/credit sweep so credits_issued lands correct on the very first write, rather than 0
  // followed by a separate update (Sept 2026, per Allie: "how many makeup they got if any" — the new
  // Holds tab's billing-support view).
  dbWrite('placing a hold', function(){ return supabaseClient.from('student_holds').insert({
    id:hold.id, student_id:student.id, start_date:toKey(hold.start), end_date:toKey(hold.end), note:hold.note, credits_issued:hold.creditsIssued
  }); });
  toast(student.name+' placed on hold '+fmtShort(hold.start)+'–'+fmtShort(hold.end)
    +(cancelledCount>0? ' — '+cancelledCount+' session(s) freed up for one-off bookings.' : '.')
    +(madeUpCount>0? ' '+madeUpCount+' make-up credit(s) issued (late-notice hold).' : ''));
  return hold;
}
function saveHold(){
  const f=state.holdForm;
  if(!f.studentId){ f.error='Choose a student.'; render(); return; }
  const student=findStudent(f.studentId);
  if(!f.start || !f.end){ f.error='Choose a start and end date.'; render(); return; }
  if(f.end<f.start){ f.error='End date must be on or after the start date.'; render(); return; }
  // Mirrors the disabled-Confirm-button guard in renderHoldModal — kept here too since this is the
  // actual save path, not just the button state.
  if(holdLateNoticeSessions(student.id, f.start, f.end).length>0 && f.grantMakeupCredits===null){
    f.error='This hold includes a session inside the notice window — choose how to handle it below.';
    render();
    return;
  }
  applyHold(student, new Date(f.start), new Date(f.end), f.note, !!f.grantMakeupCredits);
  state.holdForm=null;
  render();
}
function removeHold(studentId, holdId){
  const student=findStudent(studentId);
  student.holds=(student.holds||[]).filter(function(h){ return h.id!==holdId; });
  dbWrite('removing a hold', function(){ return supabaseClient.from('student_holds').delete().eq('id', holdId); });
  const made=regenerateAllRecurring();
  toast('Hold removed'+(made>0? ' — '+made+' standing session(s) re-booked.' : '.'));
  render();
}

/* ---------- Holds tab (billing support) ---------- */
// Sept 2026, per Allie: "I need a new tab for holds. In there I need to keep track of which
// students are on hold, how many makeup they got if any and how many sessions were cancelled if
// any. This is for billing which i know we havent set up but will still help overall." Every hold
// ever placed (front desk direct or an approved parent request — both funnel through applyHold())
// stays on student.holds forever unless explicitly removed, so this is a straightforward ledger
// over data that already exists, plus one new persisted field (hold.creditsIssued) for the one
// number that genuinely can't be recomputed after the fact — the make-up-credit decision made at
// the moment the hold was placed.
function holdStatus(hold){
  const now=simNow();
  if(toKey(hold.end)<toKey(now)) return 'ended';
  if(toKey(hold.start)<=toKey(now)) return 'active';
  return 'upcoming';
}
// Every student's hold, flattened into one list with its owning student attached, most recent
// start date first — mirrors how the Credits tab flattens every credit across every student rather
// than making front desk hunt through each student's own record one at a time.
function allHoldsFlat(){
  const out=[];
  students.forEach(function(s){
    (s.holds||[]).forEach(function(h){ out.push({student:s, hold:h}); });
  });
  return out.sort(function(a,b){ return toKey(b.hold.start).localeCompare(toKey(a.hold.start)); });
}
// Splits a hold's effect on billing by calendar month. For any day that already has a real session
// row, uses its actual status (ground truth — respects excused absences, other holds, anything else
// that genuinely happened). For a day that doesn't have a row yet — typically because it's further
// out than HORIZON_WEEKS, the pre-booking horizon — falls back to asking studentPlanOn() (the same
// resolver every other schedule feature uses, so a dated plan change mid-hold is honoured exactly
// like everywhere else) whether that day would normally be one of the student's regular sessions at
// all, and whether it falls inside this hold or not.
//
// The fallback is what makes this correct arbitrarily far into the future rather than silently
// under-counting "scheduled" for months beyond the horizon — real occurrences the family is
// genuinely on track for, just not pre-booked into a row yet (Sept 2026, per Allie, after checking
// her own math against a longer hold: "how far into the future does this look? because ... there
// should be more in the scheduled count"). It respects the student's own enrolment start date too,
// so a month that started before they'd even enrolled never counts days from before then.
function holdMonthlyBreakdown(studentId, hold){
  const student=findStudent(studentId);
  const startKey=toKey(hold.start), endKey=toKey(hold.end);
  const startD=new Date(startKey), endD=new Date(endKey);
  const months=[];
  let y=startD.getFullYear(), m=startD.getMonth();
  while(y<endD.getFullYear() || (y===endD.getFullYear() && m<=endD.getMonth())){
    months.push({sortKey:y*12+m, label:new Date(y,m,1).toLocaleDateString('en-AU',{month:'long',year:'numeric'}), cancelled:0, scheduled:0});
    m++; if(m>11){ m=0; y++; }
  }
  const findMonth=function(sortKey){ return months.find(function(x){ return x.sortKey===sortKey; }); };
  const seenDates={}; // dateKey -> true, so the pattern-based fallback below never double-counts a day that already has a real row
  // Collapse every raw session row down to one verdict per calendar date first. Repeated schedule
  // edits (saveRecurringForm) cancel old-pattern rows without ever deleting them, so the same date
  // can accumulate several historical 'cancelled' rows over time — summing rows directly (as this
  // used to) double- or triple-counts those ghosts. A cancelled-within-this-hold's-range row always
  // wins for its date; a scheduled/attended row only counts if nothing on that date is cancelled.
  const byDate={};
  sessions.forEach(function(s){
    if(s.studentId!==studentId) return;
    const dk=toKey(s.date);
    if(s.status==='cancelled' && dk>=startKey && dk<=endKey){
      byDate[dk]={cancelled:true};
    } else if((s.status==='scheduled' || s.status==='attended') && !(byDate[dk] && byDate[dk].cancelled)){
      byDate[dk]={cancelled:false};
    }
  });
  Object.keys(byDate).forEach(function(dk){
    seenDates[dk]=true;
    const parts=dk.split('-'); // local-safe parse (new Date(dk) parses as UTC midnight and can land on the wrong local day)
    const d=new Date(Number(parts[0]), Number(parts[1])-1, Number(parts[2]));
    const entry=findMonth(d.getFullYear()*12+d.getMonth());
    if(!entry) return; // outside every month this hold touches — not relevant here
    if(byDate[dk].cancelled) entry.cancelled++;
    else entry.scheduled++;
  });
  months.forEach(function(entry){
    const y2=Math.floor(entry.sortKey/12), m2=entry.sortKey%12;
    const lastDay=new Date(y2, m2+1, 0).getDate();
    for(let day=1; day<=lastDay; day++){
      const date=new Date(y2, m2, day);
      const dk=toKey(date);
      if(seenDates[dk]) continue; // already counted for real above
      if(student.startDate && dk<toKey(student.startDate)) continue; // not enrolled yet
      if(isClosedDate(date)) continue; // centre closed — never a session either way
      const weekday=WEEKDAY_KEYS[(date.getDay()+6)%7]; // undefined on a Sat/Sun — never matches a recurring slot below
      const plan=studentPlanOn(studentId, date); // resolves whichever plan (incl. any dated change) actually governs this date
      if(!(plan.recurring||[]).some(function(r){ return r.weekday===weekday; })) continue; // not one of their regular days
      if(dk>=startKey && dk<=endKey){
        entry.cancelled++; // falls inside THIS hold — would have happened but for it
      } else if(!isStudentOnHold(studentId, date)){
        // Still on track for that same month — not cancelled by this hold (or any other one).
        entry.scheduled++;
      }
    }
  });
  return months;
}
// Shared row-builder for both the current and the past holds tables below (Sept 2026, per Allie:
// "once the hold period has passed, can you place them into a different box and make that always
// collapsed" — mirrors the exact split the Credits tab already uses for booked vs. completed/expired).
function holdReportRowHtml(r){
  const st=holdStatus(r.hold);
  const statusBadge = st==='active'? '<span class="badge hold">Active</span>' : st==='upcoming'? '<span class="badge soon">Upcoming</span>' : '<span class="badge completed">Ended</span>';
  const breakdown=holdMonthlyBreakdown(r.student.id, r.hold);
  const monthsCell = breakdown.length
    ? breakdown.map(function(m){ return '<div>'+m.label+': <b>'+m.cancelled+'</b> cancelled, <b>'+m.scheduled+'</b> scheduled</div>'; }).join('')
    : '<span class="small muted">—</span>';
  return '<tr><td>'+r.student.name+'</td>'
    +'<td>'+fmtShort(r.hold.start)+'–'+fmtShort(r.hold.end)+'</td>'
    +'<td>'+statusBadge+'</td>'
    +'<td class="small">'+(r.hold.note||'—')+'</td>'
    +'<td>'+(r.hold.creditsIssued||0)+'</td>'
    +'<td class="small">'+monthsCell+'</td>'
    +'<td><button class="btn sm ghost" onclick="removeHold(\''+r.student.id+'\',\''+r.hold.id+'\')">Remove</button></td></tr>';
}
function currentHolds(){
  return allHoldsFlat().filter(function(r){ return holdStatus(r.hold)!=='ended'; });
}
function pastHolds(){
  return allHoldsFlat().filter(function(r){ return holdStatus(r.hold)==='ended'; });
}
function renderCurrentHoldsPanel(){
  const rows=currentHolds();
  let html=sectionOpen('holdsCurrent','Current & upcoming holds ('+rows.length+')',
    '<button class="btn sm primary" onclick="openHoldForm(\'\')">+ Hold</button>');
  html+='<p>Every active or scheduled hold — placed here or from an approved parent request — for keeping billing in sync: any make-up credits issued for late notice, and month by month how many sessions were cancelled versus how many they\'re still on track to attend.</p>';
  if(rows.length===0){ html+='<div class="empty-note">No current or upcoming holds.</div>'; }
  else{
    html+='<table><tr><th>Student</th><th>Dates</th><th>Status</th><th>Note</th><th>Make-up credits</th><th>Sessions by month</th><th></th></tr>';
    rows.forEach(function(r){ html+=holdReportRowHtml(r); });
    html+='</table>';
  }
  html+='</div>';
  html+=renderHoldModal();
  return html;
}
// Past (ended) holds — kept around as a permanent billing record, but tucked into its own
// collapsed-by-default section once the hold period has passed, same convention as Settled credits
// and Inactive Students/Parents, so old holds don't bury the ones still worth acting on.
function renderPastHoldsPanel(){
  const rows=pastHolds();
  let html=sectionOpen('holdsPast','Past holds ('+rows.length+')','');
  html+='<p>Holds whose end date has already passed — kept here as a record for billing, no action needed.</p>';
  if(rows.length===0){ html+='<div class="empty-note">No past holds yet.</div>'; }
  else{
    html+='<table><tr><th>Student</th><th>Dates</th><th>Status</th><th>Note</th><th>Make-up credits</th><th>Sessions by month</th><th></th></tr>';
    rows.forEach(function(r){ html+=holdReportRowHtml(r); });
    html+='</table>';
  }
  html+='</div>';
  return html;
}

/* ---------- render: shell ---------- */
// Every state change re-renders by rebuilding the whole #app innerHTML from scratch (no virtual
// DOM/diffing) — simple and reliable, but naively doing that on every keystroke would tear down
// and recreate the very <input> the person is typing into, kicking focus out and forcing them to
// click back in before every single character. To avoid that: note which field (and cursor
// position) was focused, rebuild the HTML as usual, then find the same field in the new markup —
// by its position among the other text fields in the same modal, since these forms don't carry
// individual ids — and restore focus/cursor there. A plain click, dropdown change, or button press
// has nothing focused that this applies to, so it's a no-op the rest of the time.
function render(){
  const app=document.getElementById('app');
  const active = (typeof document!=='undefined') ? document.activeElement : null;
  // Only text/search/tel/password/textarea reliably support reading/setting a cursor position in
  // every browser — email/number/date inputs throw or silently misbehave on selectionStart in
  // several browsers (observed: cursor resets to 0 on every keystroke, so each new character gets
  // inserted at the very front instead of where it was typed — e.g. typing "send" comes out
  // "dnes"). Those types still get their focus restored below, just not a cursor position.
  const focusableTypes=['text','email','password','number','search','tel','date'];
  const selectableTypes=['text','search','tel','password'];
  const isTextField = active && (active.tagName==='TEXTAREA' || (active.tagName==='INPUT' && focusableTypes.indexOf(active.type)>=0));
  const canSelect = active && (active.tagName==='TEXTAREA' || (active.tagName==='INPUT' && selectableTypes.indexOf(active.type)>=0));
  let restore=null;
  if(isTextField && app.contains(active)){
    const scope = (active.closest && active.closest('.modal')) || app;
    const fields = Array.prototype.slice.call(scope.querySelectorAll('input, textarea'));
    const idx = fields.indexOf(active);
    if(idx>=0){
      restore={ inModal: scope!==app, idx:idx, start:null, end:null };
      if(canSelect){
        try{ restore.start=active.selectionStart; restore.end=active.selectionEnd; }catch(e){}
      }
    }
  }
  app.innerHTML = renderTop() + renderTabs() + renderRole() + (state.toast? '<div class="toast">'+state.toast+'</div>':'') + renderFooter();
  if(restore){
    const scope = restore.inModal ? app.querySelector('.modal') : app;
    const el = scope && scope.querySelectorAll('input, textarea')[restore.idx];
    if(el){
      // {preventScroll:true} matters here (Sept 2026 fix — "click anywhere and the page jumps
      // halfway down on its own"): focus() on an element outside the current viewport otherwise
      // scrolls it into view as a side effect. That's fine right after a keystroke (the field IS
      // the viewport), but this restore also fires after a click on something else entirely —
      // clicking a non-focusable control (a collapsible section header, a plain label) never blurs
      // whatever text field was last focused, e.g. the check-in search box, so `active` above is
      // still that field even though the user's attention has clearly moved on. Without
      // preventScroll, every one of those unrelated clicks yanked the page back to wherever that
      // stale field happened to be sitting.
      el.focus({preventScroll:true});
      if(restore.start!=null && restore.end!=null && typeof el.setSelectionRange==='function'){
        try{ el.setSelectionRange(restore.start, restore.end); }catch(e){}
      }
    }
  }
}

// Sept 2026, per Allie: "kicked out of dropdown boxes if I don't make a selection quickly" — a
// background refresh (the 500ms live-sync debounce after ANY other login's change, the 30s
// heartbeat, or the 30s checked-in-countdown tick, all below) used to call render() unconditionally.
// render() rebuilds the whole page from scratch, and while it knows how to put a text field's own
// focus/cursor back afterward, a <select> has no such recovery — recreating it while its native
// options list is open just closes that list outright, with nothing to reopen it. None of these
// three background refreshes need to repaint the screen the instant fresh data arrives — only to
// have it ready for whatever render happens next. So they call this instead of render() directly: it
// still fetches/applies the new data every time, just skips the visual rebuild while the person has
// an input, textarea, or select focused (mid-typing, or an open dropdown), and paints normally again
// on their very next interaction.
function isEditingAField(){
  const active=(typeof document!=='undefined') ? document.activeElement : null;
  return !!(active && (active.tagName==='INPUT' || active.tagName==='TEXTAREA' || active.tagName==='SELECT'));
}
function renderUnlessEditing(){
  if(isEditingAField()) return;
  render();
}

// The name shown in the "Welcome" greeting — an instructor's or parent's own record has a real
// name; a staff login has no individual name on file at all (by design — every front-desk account
// has full access and isn't tied to one specific person, see app_users), so their sign-in email is
// the closest thing to "who am I logged in as" for that role.
function currentUserDisplayName(){
  if(!currentUser) return '';
  if(currentUser.role==='instructor'){ const i=findInstructor(currentUser.instructorId); if(i) return i.name; }
  if(currentUser.role==='parent'){ const p=parents.find(function(x){ return x.id===currentUser.parentId; }); if(p) return p.name; }
  return currentUser.email || 'Front Desk';
}
function renderTop(){
  const now=simNow();
  const clockControls = currentUser
    ? '<div class="clock"><span>Welcome, <b>'+currentUserDisplayName()+'</b></span><span>Today: <b>'+fmtLong(now)+'</b></span></div>'
    : '<div class="clock">'
      +'<span>Simulated today: <b>'+fmtLong(now)+'</b></span>'
      +'<button class="btn sm" onclick="advanceClock(1)">+1 day</button>'
      +'<button class="btn sm" onclick="advanceClock(7)">+1 week</button>'
      +'<button class="btn sm" onclick="advanceClock(30)">+1 month</button>'
      +'<button class="btn sm" onclick="advanceClock(365)">+1 year</button>'
      +(state.offsetDays!==0? '<button class="btn sm ghost" onclick="resetClock()">Reset</button>':'')
    +'</div>';
  return '<div class="top">'
    +'<div><div class="brand-logo mathq-logo"><img src="'+MATHQ_LOGO+'" alt="MATHQ — Scheduling Hub"/></div></div>'
    +clockControls
  +'</div>';
}
function renderTabs(){
  const tabs=[['staff','🖥️ Front Desk'],['instructor','🧑‍🏫 Instructor'],['parent','👪 Parent']]
  if(currentUser){
    const label=(tabs.find(function(t){ return t[0]===currentUser.role; })||[null,currentUser.role])[1];
    return '<div class="tabs"><span class="tab active">'+label+'</span>'
      +'<button class="btn sm ghost" onclick="logOut()" style="margin-left:auto">Log out</button></div>';
  }
  return '<div class="tabs">'+tabs.map(function(t){
    return '<button class="tab'+(state.role===t[0]?' active':'')+'" onclick="setRole(\''+t[0]+'\')">'+t[1]+'</button>';
  }).join('')+'</div>';
}

function renderRole(){
  if(state.role==='staff') return renderStaff();
  if(state.role==='instructor') return renderInstructor();
  return renderParent();
}

/* ---------- STAFF ---------- */
function podCoverageSummary(podId, weekday, date){
  const dayOv=dayOverrideFor(podId, toKey(date));
  if(dayOv) return (dayOv.instructorId? findInstructor(dayOv.instructorId).name : 'Unassigned')+' '+rangeLabel(dayOv.start,dayOv.end-dayOv.start)+' · one-off';
  const blocks=podBlocksForDay(podId, weekday);
  if(blocks.length===0) return 'Unassigned';
  return blocks.map(function(b){
    const instrId=blockInstructorOn(b, date);
    return (instrId? findInstructor(instrId).name : 'Unassigned')+' '+rangeLabel(b.start,b.end-b.start);
  }).join(' → ');
}

// At-a-glance "who's covering what" — every Pod down the side, Mon-Fri across the top, for
// whichever week the Schedule tab is currently showing (This week / Next week toggle). Reuses the
// exact same podCoverageSummary() the day-by-day pod cards below already show one pod/day at a
// time, just laid out so the whole week's coverage (or any gaps in it) is visible without clicking
// through every day. A cell with no instructor assigned at all is called out in red, since that's
// exactly the situation that leaves a regular-schedule slot unable to pre-book (see 5.10 fix).
function renderCoverageGrid(weekDates){
  let html='<div style="overflow-x:auto"><table style="margin-bottom:12px"><tr><th>Pod</th>'
    + weekDates.map(function(d){
        const wd=WEEKDAY_KEYS[(d.getDay()+6)%7];
        return '<th>'+wd+'<br><span class="small muted" style="font-weight:400">'+d.toLocaleDateString('en-AU',{month:'short',day:'numeric'})+'</span></th>';
      }).join('')
    + '</tr>';
  pods.forEach(function(pod){
    html+='<tr><td><b>'+pod.name+'</b></td>';
    weekDates.forEach(function(d){
      const wd=WEEKDAY_KEYS[(d.getDay()+6)%7];
      const dk=toKey(d);
      const summary=podCoverageSummary(pod.id, wd, d);
      const gap=summary==='Unassigned' || summary.indexOf('Unassigned')>=0;
      // Every cell is clickable (Sept 2026, per Allie: "click on a staff or unassigned name in the
      // schedule grid ... change the instructor and/or times for that day and pod, but I don't want
      // the change to reflect on the ongoing scheduling") — opens a one-off, single-date-only editor
      // (openDayOverrideForm/renderDayOverrideModal) regardless of whether this cell currently shows
      // the normal weekly pattern, an existing one-off, or "Unassigned" with no shift here at all.
      html+='<td style="cursor:pointer'+(gap?';color:var(--danger)':'')+'" onclick="openDayOverrideForm(\''+pod.id+'\',\''+dk+'\')" title="Click to change '+pod.name+' for '+d.toLocaleDateString('en-AU',{month:'short',day:'numeric'})+' only — won\'t touch the regular '+wd+' schedule">'+summary+'</td>';
    });
    html+='</tr>';
  });
  html+='</table></div>';
  return html;
}

// The "regular" companion to the grid above — Mon-Fri column headers with no dates, so it doesn't
// change week to week, and each cell shows who's ROSTERED onto that Pod/weekday from the ongoing
// assignment history alone (blockInstructorOngoing — see blockInstructorOn() above), ignoring any
// one-off swap or single-day override in effect right now. This is "what the roster says," not
// "what's actually happening this particular week" (that's the grid above). Clicking a cell opens
// the existing ongoing/effective-dated editor (openPodAssignForm/renderPodAssignModal, same as the
// "Assign" button on the Pod seating cards) — a change made here is a real, permanent change to the
// weekly schedule from whichever date is chosen in that editor, not a one-off (Sept 2026, per Allie:
// "one that looks similar but is more static... showing the instructors regular rostered shifts...
// allow me to click on a cell to make changes but this time ongoing changes").
function renderRosteredShiftsGrid(){
  const today=simNow();
  let html='<div style="overflow-x:auto"><table style="margin-bottom:12px"><tr><th>Pod</th>'
    + WEEKDAY_KEYS.map(function(wd){ return '<th>'+wd+'</th>'; }).join('')
    + '</tr>';
  pods.forEach(function(pod){
    html+='<tr><td><b>'+pod.name+'</b></td>';
    WEEKDAY_KEYS.forEach(function(wd){
      const blocks=podBlocksForDay(pod.id, wd);
      // Resolve against THIS weekday's own next occurrence, not "today" — a column for a weekday
      // later in the week than today can have an ongoing reassignment already scheduled (effective
      // from that weekday's own upcoming date) that hasn't taken effect as of today yet. Evaluating
      // every column against "today" made those columns show the OLD instructor, out of step with
      // what the Today tab's coverage grid shows once that date actually arrives (Sept 2026, per
      // Allie: "regular rostered shifts not speaking well with schedule in today tab").
      const occurrence=nextRegularOccurrence(wd, today);
      let summary;
      if(blocks.length===0) summary='Unassigned';
      else summary=blocks.map(function(b){
        const instrId=blockInstructorOngoing(b, occurrence);
        return (instrId? findInstructor(instrId).name : 'Unassigned')+' '+rangeLabel(b.start,b.end-b.start);
      }).join(' → ');
      const gap=summary==='Unassigned' || summary.indexOf('Unassigned')>=0;
      html+='<td style="cursor:pointer'+(gap?';color:var(--danger)':'')+'" onclick="openPodAssignForm(\''+pod.id+'\',\''+wd+'\')" title="Change '+pod.name+'\'s regular '+wd+' shift — an ongoing change, from whichever date you choose">'+summary+'</td>';
    });
    html+='</tr>';
  });
  html+='</table></div>';
  return html;
}

// Total expected PHYSICAL headcount across the whole centre, bucketed into 15-min intervals across
// the afternoon (Sept 2026, per Allie: "one more section that shows me the number of kids expected
// in the centre split into 15 min intervals"). A staffing-planning view, not a live board — like
// Regular rostered shifts and Pod seating above, each weekday uses its own next upcoming occurrence
// (nextRegularOccurrence) so it always reflects the CURRENT standing pattern regardless of what day
// it actually is right now, and every non-cancelled session that weekday overlapping a given 15-min
// slot counts toward it — Online sessions are deliberately excluded, since this is specifically about
// who's physically walking in the door (not the day's total enrolment; Online already has its own
// occupancy badges elsewhere).
//
// "From" date (Sept 2026, per Allie: "in expected headcount, i need to be able to select a 'from'
// date") — state.expectedHeadcountFromDate, set via setExpectedHeadcountFromDate() from the date
// input in this section's header (see renderStaff()). Each weekday's "next occurrence" is worked
// out relative to THIS date instead of always today, so Allie can preview the standing pattern as
// it'll look starting from any date she chooses — e.g. after a batch of schedule changes take
// effect next month — not just whatever the very next week happens to show. Defaults to today
// (null → simNow() inside nextRegularOccurrence) until the picker is first touched.
function renderExpectedHeadcountGrid(){
  const fromDate = state.expectedHeadcountFromDate? new Date(state.expectedHeadcountFromDate) : simNow();
  const slots=[];
  for(let t=CENTER_OPEN; t<CENTER_CLOSE; t+=15) slots.push(t);
  let html='<div style="overflow-x:auto"><table style="margin-bottom:12px"><tr><th>Day</th>'
    + slots.map(function(t){ return '<th>'+minToLabel(t)+'</th>'; }).join('')
    + '</tr>';
  WEEKDAY_KEYS.forEach(function(wd){
    const occurrence=nextRegularOccurrence(wd, fromDate);
    const dateKey=toKey(occurrence);

    html+='<tr><td><b>'+wd+'</b> <span class="small muted">'+occurrence.toLocaleDateString('en-AU',{month:'short',day:'numeric'})+'</span></td>';
    slots.forEach(function(t){
      const count=dayList.filter(function(s){ return s.start<t+15 && t<s.start+s.duration; }).length;
      html+='<td class="'+(count===0?'muted':'')+'" style="text-align:center">'+count+'</td>';
    });
    html+='</tr>';
  });
  html+='</table></div>';
  return html;
}
function setExpectedHeadcountFromDate(value){ state.expectedHeadcountFromDate=value||null; render(); }

// Suggested shift durations — NOT per Pod (Sept 2026, per Allie: "i dont want it to be matched per
// pod, the instructors are very able to walk around, the main thing is maintaining the 1:8"). Works
// off the whole centre's total expected headcount instead — the exact same 15-min-slot curve as
// Expected headcount above, using the same "next occurrence of this weekday" standing pattern —
// since instructors move freely between Pods and the only real constraint is that enough of them
// are on shift at any moment to keep the 1:8 ratio, not which specific Pod each one is tied to.
//
// For each 15-min slot this works out how many instructors are actually needed
// (ceil(headcount/RATIO_PER_INSTRUCTOR)), then "peels" that requirement curve into however many
// overlapping shifts are needed to cover it: the 1st shift spans every slot where at least 1
// instructor is needed, the 2nd spans every slot where at least 2 are needed, and so on — splitting
// into separate shifts wherever a layer's own coverage isn't one continuous run (e.g. a midday lull
// that drops back below that layer and later climbs past it again). Summed across every layer, this
// always adds up to exactly the same total instructor-minutes as the raw headcount curve itself —
// the minimum possible, since at every instant at least ceil(headcount/8) instructors must be
// present regardless of how shifts are arranged — before SHIFT_WAIT_TOLERANCE/MIN_SHIFT_MINUTES (the
// same two rules as before) pad each individual shift out where the business rules require it.
//
// One more hard rule, given directly (Sept 2026, per Allie): "I also must have an instructor in the
// centre by 3pm" — regardless of whether any booking actually starts right at open, so the required-
// instructor curve treats CENTER_OPEN as always needing at least 1, and that opening run's start
// skips the usual arrival grace entirely (it's capped at CENTER_OPEN itself, not CENTER_OPEN+10) —
// every OTHER run, at every other level, still gets the normal grace. ("Usually somebody will start
// at 2 and help with phone calls, but not a necessity" — that earlier start is real practice, not a
// rule this tool should bake in, so it isn't modelled here.)
//
// Padding a run out to MIN_SHIFT_MINUTES (or anchoring it to CENTER_OPEN) can occasionally stretch
// it far enough to butt up against, or overlap, another run at that same level — e.g. a mandatory
// "someone open at 3pm" shift padded out past a gap in bookings, right into a separate afternoon
// run that starts on its own shortly after. mergeOverlapping() below collapses same-level runs like
// that back into one, so the grid never shows two overlapping shifts for the same staffing level.
var RATIO_PER_INSTRUCTOR=8; // the 1:8 ratio itself
function mergeOverlapping(intervals){
  const sorted=intervals.slice().sort(function(a,b){ return a.start-b.start; });
  const out=[];
  sorted.forEach(function(iv){
    const last=out.length? out[out.length-1] : null;
    if(last && iv.start<=last.end) last.end=Math.max(last.end, iv.end);
    else out.push({start:iv.start, end:iv.end});
  });
  return out;
}
function suggestedShiftsForWeekday(wd){
  const dateKey=toKey(nextRegularOccurrence(wd));
  const dayList=scheduleListForDay(dateKey).filter(function(s){ return !s.online; });
  // A departing kid overlapping a newly-arriving one for a brief handover doesn't need a second
  // instructor just for that overlap (INSTRUCTOR_OVERLOAD_TOLERANCE_MIN) — same mechanism as the
  // Pod-seat handover forgiveness above, applied to the ratio instead of a seat.
  const tolerant=tolerantOccupancyIntervals(
    dayList.map(function(s){ return {start:s.start, end:s.start+s.duration}; }),
    INSTRUCTOR_OVERLOAD_TOLERANCE_MIN
  );
  const slots=[];
  for(let t=CENTER_OPEN; t<CENTER_CLOSE; t+=15) slots.push(t);
  const required=slots.map(function(t){
    const headcount=tolerant.filter(function(iv){ return iv.start<t+15 && t<iv.end; }).length;
    return Math.ceil(headcount/RATIO_PER_INSTRUCTOR);
  });
  required[0]=Math.max(required[0], 1); // someone must be in the centre right from CENTER_OPEN, bookings or not
  const peak=Math.max.apply(null, required.concat([0]));
  const shifts=[];
  for(let level=1; level<=peak; level++){
    // First pass: every maximal raw (unpadded) run of slots at this level — this run covers slot
    // indices [i, j-1], i.e. minutes slots[i] through slots[j-1]+15.
    const runs=[];
    let i=0;
    while(i<slots.length){
      if(required[i]<level){ i++; continue; }
      let j=i;
      while(j<slots.length && required[j]>=level) j++;
      runs.push({rawStart:slots[i], rawEnd:slots[j-1]+15});
      i=j;
    }
    // Bridge short gaps between consecutive raw runs BEFORE padding (see SHORT_GAP_MERGE_MINUTES) —
    // otherwise two nearby short bursts can each get padded toward each other and merge into one
    // shift spanning the whole gap plus both paddings, stretching much further than either needed.
    const bridged=[];
    runs.forEach(function(r){
      const last=bridged.length? bridged[bridged.length-1] : null;
      if(last && r.rawStart-last.rawEnd<=SHORT_GAP_MERGE_MINUTES) last.rawEnd=r.rawEnd;
      else bridged.push({rawStart:r.rawStart, rawEnd:r.rawEnd});
    });
    const raw=bridged.map(function(r){
      const openingRun = level===1 && r.rawStart===CENTER_OPEN;
      let start=openingRun? CENTER_OPEN : r.rawStart+SHIFT_WAIT_TOLERANCE;
      let end=r.rawEnd;
      if(end-start<MIN_SHIFT_MINUTES){
        end=start+MIN_SHIFT_MINUTES;
        if(end>CENTER_CLOSE){ end=CENTER_CLOSE; start=end-MIN_SHIFT_MINUTES; }
      }
      return {start:start, end:end};
    });
    mergeOverlapping(raw).forEach(function(m){ shifts.push({level:level, start:m.start, end:m.end}); });
  }
  shifts.sort(function(a,b){ return a.start-b.start || a.end-b.end; });
  return {peak:peak, shifts:shifts, totalMinutes:shifts.reduce(function(sum,s){ return sum+(s.end-s.start); }, 0)};
}
// Total instructor-minutes CURRENTLY rostered across every Pod for a weekday — the comparison point
// for the suggested total (Sept 2026, per Allie: "can you add a column to compare to current
// totals?"). Summed across all Pods rather than any one, since the suggestion itself no longer is.
function currentRosteredMinutesForWeekday(wd){
  const today=simNow();
  let total=0;
  pods.forEach(function(pod){
    podBlocksForDay(pod.id, wd).forEach(function(b){
      if(blockInstructorOngoing(b, today)) total += (b.end-b.start);
    });
  });
  return total;
}
// The read-only grid itself — one row per weekday rather than per Pod (Sept 2026, per Allie: "can we
// build this as a section" — after weighing click-to-apply against a plain read-only display, she
// went with read-only; since a suggested shift here isn't tied to any one Pod, there's no single
// "Rostered shifts" cell to apply it to directly — it's a staffing target to roster instructors
// against, however she splits them across Pods that day).
function renderSuggestedShiftsGrid(){
  let totalSuggestedAll=0, totalCurrentAll=0;
  let html='<div style="overflow-x:auto"><table style="margin-bottom:12px"><tr><th>Day</th><th>Instructors needed at peak</th><th>Suggested shifts</th><th>Suggested total</th><th>Currently rostered</th></tr>';
  WEEKDAY_KEYS.forEach(function(wd){
    const result=suggestedShiftsForWeekday(wd);
    const currentMin=currentRosteredMinutesForWeekday(wd);
    const diff=currentMin-result.totalMinutes;
    totalSuggestedAll+=result.totalMinutes;
    totalCurrentAll+=currentMin;
    const shiftsHtml=result.shifts.length
      ? result.shifts.map(function(s){ return rangeLabel(s.start, s.end-s.start); }).join('<br>')
      : '<span class="small muted">No instructors needed</span>';
    html+='<tr><td><b>'+wd+'</b></td><td style="text-align:center">'+result.peak+'</td><td>'+shiftsHtml+'</td>'
      +'<td style="text-align:center">'+hoursMinutesLabel(result.totalMinutes)+'</td>'
      +'<td style="text-align:center">'+hoursMinutesLabel(currentMin)
      +(diff!==0? '<br><span class="small muted">('+(diff>0?'–':'+')+hoursMinutesLabel(Math.abs(diff))+')</span>' : '')
      +'</td></tr>';
  });
  html+='</table></div>';
  const totalDiff=totalCurrentAll-totalSuggestedAll;
  html+='<p class="small muted">Total across the week: '+hoursMinutesLabel(totalSuggestedAll)+' suggested vs '+hoursMinutesLabel(totalCurrentAll)+' currently rostered'
    +(totalDiff!==0? ' — a potential '+(totalDiff>0?'saving':'increase')+' of '+hoursMinutesLabel(Math.abs(totalDiff))+'.' : ' — already matched.')
    +'</p>';
  return html;
}

// Per-Pod cards for the day the Schedule section is showing — capacity, who's covering it, and the
// actual seated roster, all together (brought back Sept 2026, per Allie: "we need to bring back
// the pod-based scheduling" — this had briefly been split into a compact badge/pill strip plus one
// separate flat student list; this restores the single per-Pod view, without changing any of the
// underlying actions). "Assign" on a card's header is about STAFFING the Pod (which instructor runs
// it) — a different concern from which students sit in it, which is each row's own "Move to"
// dropdown (locationOptionsHtml/setSessionLocation).
// Names of every student sitting at each Pod on the given day — for TODAY that means "checked in
// and not yet checked out" (a live, moment-to-moment roster: a name drops off the instant that
// student is checked out, freeing the seat), which is what drives the live 1/8, 2/8... occupancy
// badge in renderPodSummaryStrip() below (5.28). For any OTHER day — a day already past, whose
// checked-in students have long since been checked out — dropping the "not checked out" filter
// turns this into that day's actual historical seating record instead: everyone who ever attended
// there that day, kept for training/adjustment reference (Sept 2026, per Allie). A future day
// naturally comes back empty either way, since nobody's attended yet.
function checkedInNamesByPod(dayKey){
  const live = dayKey===toKey(simNow());
  const byPod={};
  sessions.forEach(function(s){
    if(s.status!=='attended' || !s.podId || toKey(s.date)!==dayKey) return;
    if(live && s.checkedOut) return;
    const student=findStudent(s.studentId);
    if(!student) return;
    (byPod[s.podId]=byPod[s.podId]||[]).push(student.name);
  });
  Object.keys(byPod).forEach(function(podId){ byPod[podId].sort(function(a,b){ return a.localeCompare(b, undefined, {sensitivity:'base'}); }); });
  return byPod;
}
// Same idea, keyed by instructor instead of Pod, for whoever's sitting in that instructor's Online
// group — the Online strip's own equivalent of checkedInNamesByPod, live-vs-historical the same way.
function checkedInNamesByOnlineInstructor(dayKey){
  const live = dayKey===toKey(simNow());
  const byInstr={};
  sessions.forEach(function(s){
    if(s.status!=='attended' || !s.online || toKey(s.date)!==dayKey) return;
    if(live && s.checkedOut) return;
    const student=findStudent(s.studentId);
    if(!student) return;
    (byInstr[s.instructorId]=byInstr[s.instructorId]||[]).push(student.name);
  });
  Object.keys(byInstr).forEach(function(id){ byInstr[id].sort(function(a,b){ return a.localeCompare(b, undefined, {sensitivity:'base'}); }); });
  return byInstr;
}
// The combined (physical + online) headcount an instructor is personally minding on a given day —
// the number the 1:9 ratio caps — mirroring checkedInNamesByPod()'s live-vs-historical rule: live
// (checked in, not yet checked out) for today, everyone who attended that day at all for any other
// day. Deliberately independent of instructorCombinedPeak() (below), which stays schedule/peak-based
// for booking-time capacity checks on a session that may not have happened yet — this is the
// "how many are actually sitting with this instructor right now" figure for the summary strip badge.
function instructorOccupantCount(instructorId, dayKey){
  const live = dayKey===toKey(simNow());
  return sessions.filter(function(s){
    if(s.status!=='attended' || toKey(s.date)!==dayKey) return false;
    if(live && s.checkedOut) return false;
    return s.instructorId===instructorId || s.instructorId2===instructorId;
  }).length;
}

// One row of the seating table — a single session, with its own "Move to" (Pod/Online) picker and
// check-in/no-show/cancel actions. Factored out so every card (each Pod, each Online instructor
// group, and Unassigned) renders rows identically — the exact same markup the old single flat list
// used per row, just grouped differently now.
function sessionRowHtml(sess, weekday, dayKey, now){
  const student=findStudent(sess.studentId);
  if(!student) return '';
  const actualNote = sess.actualStart!=null? ' · checked in '+minToLabel(sess.actualStart)+', ran to '+minToLabel(sess.actualEnd) : '';
  let handoffNote='';
  if(sess.instructorId2){
    handoffNote = ' · '+findInstructor(sess.instructorId).name+' until '+minToLabel(sess.handoff)+', then '+findInstructor(sess.instructorId2).name;
  } else if(sess.instructorId){
    handoffNote = ' · with '+findInstructor(sess.instructorId).name+(sess.online? ' (online)' : '');
  }
  let html='<tr><td><b>'+student.name+'</b></td><td>'+yearLabel(student.year)+'</td><td>'+rangeLabel(sess.start,sess.duration)+'</td>';
  // This "Move to" picker lives only in the Pod seating section (see renderPodSummaryStrip) — a
  // PERMANENT standing change from this weekday forward (setPermanentSessionLocation), not the
  // one-off single-session move every other Pod/Online picker in the app uses (setSessionLocation).
  html+='<td><select onchange="setPermanentSessionLocation(\''+sess.id+'\',\''+weekday+'\',\''+dayKey+'\',this.value)">'
    +'<option value=""'+(sessionLocationValue(sess)===''?' selected':'')+'>Unassigned</option>'
    +locationOptionsHtml(weekday, dayKey, sess.start, sess.duration, sessionLocationValue(sess), sess.id)
  +'</select></td>';
  html+='<td class="small muted">'+sess.status+(sess.bookedBy==='parent'?' · 👪 parent':'')+(sess.recurring?' · regular':'')+handoffNote+actualNote+'</td>';
  let actions='';
  if(sess.status==='scheduled' && toKey(sess.date)<=toKey(now)){
    actions+='<button class="btn sm success" onclick="openCheckIn(\''+sess.id+'\')">✓ Check in</button>'
      +'<button class="btn sm ghost" onclick="markStatus(\''+sess.id+'\',\'excused\')" title="They let us know in advance — issues a make-up credit">Issue Make-up Credit</button>'
      +'<button class="btn sm danger" onclick="markStatus(\''+sess.id+'\',\'no-show\')" title="No word from them — no make-up credit">Not in Today</button>';
  } else if(sess.status==='scheduled'){
    actions+='<button class="btn sm ghost" onclick="markStatus(\''+sess.id+'\',\'cancelled\')">Cancel</button>';
  } else if(sess.status==='attended'){
    actions+='<button class="btn sm ghost" onclick="undoCheckIn(\''+sess.id+'\')">Undo check-in</button>';
  }
  html+='<td>'+actions+'</td></tr>';
  return html;
}
// Checked-in students first, then whoever's still to arrive — each half keeping the same
// arrival-time order scheduleListForDay() already sorted `rows` into (originally alphabetical by
// name, per Allie's 5.35 request; changed Sept 2026 per a later Allie request to order by arrival
// instead — see scheduleListForDay()'s own comment). A no-show is neither — it's grouped with
// "still to arrive" since it never actually checked in, same as a plain scheduled session.
function rosterTableHtml(rows, weekday, dayKey, now){
  const checkedIn=rows.filter(function(s){ return s.status==='attended'; });
  const upcoming=rows.filter(function(s){ return s.status!=='attended'; });
  let html='<table><tr><th>Student</th><th>Year</th><th>Time</th><th>Move to</th><th>Status</th><th></th></tr>';
  html+=checkedIn.map(function(sess){ return sessionRowHtml(sess, weekday, dayKey, now); }).join('');
  if(checkedIn.length && upcoming.length){
    html+='<tr><td colspan="6" class="small muted" style="text-align:center;padding:4px 0">— yet to arrive —</td></tr>';
  }
  html+=upcoming.map(function(sess){ return sessionRowHtml(sess, weekday, dayKey, now); }).join('');
  html+='</table>';
  return html;
}

// Live per-Pod (and Online) "who's here" board — literally just names and leave times, grouped by
// where they're actually sitting, updating automatically as students check in and out (a spot
// reopens the instant someone checks out, since they simply drop off the list) — Sept 2026, per
// Allie: "as the students get checked into a pod, we are able to see them in that pod... as they
// leave theres a spot again... i just need it to say the kids name and the time they leave".
// Deliberately much lighter than the full-day roster in renderPodSummaryStrip just below it (no
// year, no status) — this is meant to be read at a glance, not worked from; corrections to a
// checked-in/exit time still happen on the "Checked in today" panel above. A student's own name IS
// still clickable, though (Sept 2026, per Allie: "if i click on a kid's name in the whos here right
// now box, it allows me to change the pod they are sitting in for today") — see openQuickMoveForm(),
// wired up by the renderer below using the sessionId carried on each entry here.
// Same live-vs-historical rule as checkedInNamesByPod(): today shows who's still actually present
// (checked out students drop off immediately), any other day shows that whole day's attended record.
function liveOccupancyGroups(dayKey){
  const live = dayKey===toKey(simNow());
  const weekday=WEEKDAY_KEYS[(new Date(dayKey).getDay()+6)%7];
  const byPod={}, byOnlineInstr={};
  sessions.forEach(function(s){
    if(s.status!=='attended' || toKey(s.date)!==dayKey) return;
    if(live && s.checkedOut) return;
    const student=findStudent(s.studentId);
    if(!student) return;
    const entry={name:student.name, exit:s.actualEnd, sessionId:s.id};
    if(s.online){ (byOnlineInstr[s.instructorId]=byOnlineInstr[s.instructorId]||[]).push(entry); }
    else if(s.podId){ (byPod[s.podId]=byPod[s.podId]||[]).push(entry); }
  });
  const sortEntries=function(list){
    return list.slice().sort(function(a,b){
      const ea = a.exit==null? Infinity : a.exit, eb = b.exit==null? Infinity : b.exit;
      return ea-eb || a.name.localeCompare(b.name, undefined, {sensitivity:'base'});
    });
  };
  // podId carried through (null for an Online group) so the renderer can look up that Pod's own
  // capacity for the seat-map/badge below — Online has a different capacity model entirely (the
  // combined 1:9 ratio, not a fixed 8 seats), so it deliberately gets neither.
  // A Pod with nobody checked in still shows up here — but only on the live (today) view, and only
  // when it actually has a shift scheduled for today's weekday (Sept 2026, per Allie: "make the
  // checked in today section show the pods, (empty) but with the staff allocated to them even if
  // there are no students check in" — scoped, per her own choice, to "only pods with a shift
  // scheduled today"). A Pod with no shift at all today (e.g. it doesn't run on this weekday) stays
  // hidden, same as before. This deliberately isn't extended to a past day's view: that board is
  // already a definitive attendance record, so an all-empty staffed Pod there isn't the same kind of
  // useful "who's actually here" read this was built for.
  const groups=[];
  pods.forEach(function(pod){
    const list=byPod[pod.id];
    if(list && list.length){ groups.push({label:pod.name, podId:pod.id, entries:sortEntries(list)}); }
    else if(live && podBlocksForDay(pod.id, weekday).length){ groups.push({label:pod.name, podId:pod.id, entries:[]}); }
  });
  Object.keys(byOnlineInstr).forEach(function(instrId){
    const instr=findInstructor(instrId);
    if(!instr) return;
    groups.push({label:'Online — '+instr.name, podId:null, entries:sortEntries(byOnlineInstr[instrId])});
  });
  return groups;
}
// Who's here right now — grid layout matching the Availability lookup's own look (Sept 2026, per
// Allie: "can we make Who's here right now look like the availability lookup table? similar set up,
// with a different colour per cell, only displaying the pods that have students in them"). Columns
// are Pods with at least one student present right now (per her follow-up: "can we swap for pods to
// be columns?"); rows are seat slots 1..capacity, earliest-to-leave first (matching sortEntries()'s
// own order); every cell is coloured the same simple occupied(red)/empty(green) way the app's other
// capacity badges already use — per her clarification, NOT a distinct colour per Pod and NOT a
// colour tied to how soon someone's leaving. Online groups have no fixed seat count to grid against
// (they run on the combined 1:9 ratio, not 8 physical seats), so they keep the plain name/leave-time
// list format below the grid, same as before.
// Which instructor is actually rostered against a Pod's board column, for the small label under its
// name (Sept 2026, per Allie: "Can we have the instructor name as well in small writing under the
// pod number"). Resolves exactly the way openQuickCoverageForm() picks its starting block — whichever
// shift covers the current wall-clock time, falling back to the day's last block — then reads
// blockInstructorOn() for that calendar date, so a one-off coverage swap or a dated permanent change
// both show up correctly, on any day, not just today.
function podInstructorLabel(podId, dayKey){
  const date=new Date(dayKey);
  const weekday=WEEKDAY_KEYS[(date.getDay()+6)%7];
  const blocks=podBlocksForDay(podId, weekday);
  if(!blocks.length) return null;
  const nowMin=nowMinutesOfDay();
  const block = blocks.find(function(b){ return nowMin>=b.start && nowMin<b.end; }) || blocks[blocks.length-1];
  const instrId=blockInstructorOn(block, date);
  return instrId? findInstructor(instrId).name : null;
}
function renderLiveOccupancyBoard(dayKey){
  // No extra filtering needed here — liveOccupancyGroups() already only returns a group when it's
  // either occupied, or (live view only) a Pod with a shift scheduled today, so an empty group here
  // always means "staffed, nobody in yet" rather than "nothing to show."
  const groups=liveOccupancyGroups(dayKey);
  const podGroups=groups.filter(function(g){ return g.podId; });
  const onlineGroups=groups.filter(function(g){ return !g.podId; });
  const live = dayKey===toKey(simNow());
  let html='<div class="card"><h2>Who\'s here'+(live? ' right now':'')+'</h2>';
  if(!groups.length){
    html+='<div class="empty-note">'+(live? 'Nobody checked in yet today.' : 'Nobody was checked in this day.')+'</div></div>';
    return html;
  }
  if(podGroups.length){
    // Row count per column has to be the larger of the Pod's stated capacity and how many are
    // ACTUALLY sitting in it right now — not just capacity — because a same-day Pod move is
    // deliberately allowed to go over capacity (movePodSession() skips the capacity check entirely
    // once isToday is true, per Allie: "on the day students can be moved to other pods, disregarding
    // pod fullness"). Before this fix, maxCap (and each column's own effective row count below) was
    // capacity-only, so checking a student into an already-full Pod silently dropped them off this
    // grid entirely — seat index 8 in a capacity-8 Pod was simply never iterated over, even though
    // the header badge above correctly showed "9/8". They were never actually removed from anywhere
    // in the data (still 'attended', still that podId) — just never drawn (Sept 2026, per Allie:
    // "when i check in a student, and i change the pod they are in for the day, they won't come up").
    const effectiveCap=function(g){ return Math.max(podCapacity(g.podId), g.entries.length); };
    const maxCap=Math.max.apply(null, podGroups.map(effectiveCap));
    html+='<div class="liveboard-grid" style="grid-template-columns:70px repeat('+podGroups.length+',1fr);'+(onlineGroups.length? 'margin-bottom:14px':'')+'">';
    html+='<div></div>'+podGroups.map(function(g){
      const cap=podCapacity(g.podId);
      const occupancy=g.entries.length;
      // Clickable only on the live (today) view — a quick coverage change only ever makes sense for
      // today, and this board also does double duty rendering a past day's historical record, where
      // there's nothing "quick" left to change (Sept 2026, per Allie: "maybe by clicking on th epod
      // number under whos here right now").
      const headAttrs = live? ' style="cursor:pointer" onclick="openQuickCoverageForm(\''+g.podId+'\')" title="Quick same-day coverage change"' : '';
      const instrName=podInstructorLabel(g.podId, dayKey);
      return '<div class="cal-head"'+headAttrs+'>'+g.label+' <span class="badge '+(occupancy>=cap?'full':'available')+'" style="margin-left:4px">'+occupancy+'/'+cap+'</span>'
        +(instrName? '<br><span class="small muted">'+instrName+'</span>' : '')
      +'</div>';
    }).join('');
    for(let seat=0; seat<maxCap; seat++){
      html+='<div class="cal-row-label small muted">Seat '+(seat+1)+'</div>';
      html+=podGroups.map(function(g){
        // Blank filler only once we're past BOTH this Pod's stated capacity AND how many are
        // actually seated in it (see the maxCap comment above) — so a narrower Pod still fills
        // blank once truly exhausted, but an over-capacity Pod keeps rendering its real occupants
        // instead of a narrower column's own limit hiding them.
        if(seat>=effectiveCap(g)) return '<div></div>';
        const entry=g.entries[seat];
        // A student's own name is clickable on the live (today) view only — same "only makes sense
        // for today" rule as the Pod header's quick coverage change just above (Sept 2026, per
        // Allie: "if i click on a kid's name in the whos here right now box, it allows me to change
        // the pod they are sitting in for today"). A past day's record is just that — a record.
        const nameHtml = (live && entry)
          ? '<a href="#" onclick="openQuickMoveForm(\''+entry.sessionId+'\');return false;" style="color:inherit" title="Move to a different Pod, today only">'+entry.name+'</a>'
          : (entry? entry.name : '');
        return entry
          ? '<div class="avail-cell full-cell">'+nameHtml+'<br><span class="small">'+(entry.exit!=null? minToLabel(entry.exit) : '—')+'</span></div>'
          : '<div class="avail-cell on">Open</div>';
      }).join('');
    }
    html+='</div>';
  }
  if(onlineGroups.length){
    html+='<div style="display:flex;flex-wrap:wrap;gap:16px">'
      +onlineGroups.map(function(g){
        return '<div style="min-width:150px"><h4 style="margin:0 0 4px 0">'+g.label+'</h4>'
          +'<table><tr><th>Student</th><th>Leaves</th></tr>'
          +g.entries.map(function(e){
            const nameHtml = live
              ? '<a href="#" onclick="openQuickMoveForm(\''+e.sessionId+'\');return false;" style="color:inherit" title="Move to a different Pod, today only">'+e.name+'</a>'
              : e.name;
            return '<tr><td>'+nameHtml+'</td><td>'+(e.exit!=null? minToLabel(e.exit) : '—')+'</td></tr>';
          }).join('')
          +'</table></div>';
      }).join('')
      +'</div>';
  }
  html+='</div>';
  return html;
}

// Quick same-day-only Pod (or Online) move, launched by clicking a student's own name on the live
// "Who's here right now" board just above (Sept 2026, per Allie: "if i click on a kid's name in the

// Quick same-day-only coverage change, launched by clicking a Pod's header on the live "Who's here
// right now" board just above (Sept 2026, per Allie: "I need a quick way to assign an instructor to
// a pod, even if they're technically assigned to a different one" — then, once a first pass wired
// this into the PERMANENT weekly Pod Assignment editor instead, corrected to: "I dont want it to be
// a permanent change, just a quick on the day change - maybe by clicking on th epod number under
// whos here right now"). Deliberately reuses the exact same oneOffCoverage mechanism a filled shift
// coverage request writes into (fillCoverageRequest) rather than the dated `assignments` history a
// permanent change uses — so it only ever affects today, the regular weekly assignment underneath is
// left alone, and no formal coverageRequests record needs to exist first. The instructor list is
// every active instructor, unrestricted by availability or an existing assignment elsewhere — same
// "front desk is trusted" philosophy as assignCoverageManually() — since the whole point is
// overriding a clash on the spot, not hunting through who's technically free.
function openQuickCoverageForm(podId){
  const today=simNow();
  const weekday=WEEKDAY_KEYS[(today.getDay()+6)%7];
  const blocks=podBlocksForDay(podId, weekday);
  if(!blocks.length){ toast('No shift is scheduled for '+findPod(podId).name+' today.'); render(); return; }
  const nowMin=nowMinutesOfDay();
  // Prefer whichever shift block actually covers right now; if the click lands outside every
  // block's hours (e.g. someone lingering past the end of their shift), fall back to the day's last
  // block so there's still something sensible to change.
  const block = blocks.find(function(b){ return nowMin>=b.start && nowMin<b.end; }) || blocks[blocks.length-1];
  const currentId=blockInstructorOn(block, today);
  state.quickCoverageForm={podId:podId, weekday:weekday, blockId:block.id, instructorId:currentId||'', error:''};
  render();
}
function closeQuickCoverageForm(){ state.quickCoverageForm=null; render(); }
function setQuickCoverageField(field, value){
  state.quickCoverageForm[field]=value;
  state.quickCoverageForm.error='';
  render();
}
function saveQuickCoverage(){
  const f=state.quickCoverageForm;
  if(!f.instructorId){ f.error='Choose an instructor.'; render(); return; }
  const block=podBlocksForDay(f.podId, f.weekday).find(function(b){ return b.id===f.blockId; });
  const today=simNow();
  const todayKey=toKey(today);
  const instr=findInstructor(f.instructorId);
  block.oneOffCoverage=(block.oneOffCoverage||[]).filter(function(o){ return toKey(o.date)!==todayKey; });
  block.oneOffCoverage.push({date:new Date(today), instructorId:f.instructorId});
  dbWrite('recording a same-day coverage change', function(){
    return supabaseClient.from('pod_shift_one_off_coverage').delete().eq('block_id', block.id).eq('the_date', todayKey).then(function(){
      return supabaseClient.from('pod_shift_one_off_coverage').insert({block_id:block.id, the_date:todayKey, instructor_id:f.instructorId});
    });
  });
  regenerateAllRecurring();
  toast(instr.name+' is covering '+findPod(f.podId).name+' for today only — their regular schedule is unchanged.');
  state.quickCoverageForm=null;
  render();
}
// Undoes a same-day change made in error, falling back to whoever's actually assigned to the shift
// on its regular dated schedule — a plain removal from oneOffCoverage rather than pushing a fresh
// entry, so blockInstructorOn() resolves straight through to the underlying assignment again.
function clearQuickCoverage(){
  const f=state.quickCoverageForm;
  const block=podBlocksForDay(f.podId, f.weekday).find(function(b){ return b.id===f.blockId; });
  const todayKey=toKey(simNow());
  const hadOverride=(block.oneOffCoverage||[]).some(function(o){ return toKey(o.date)===todayKey; });
  if(!hadOverride){ state.quickCoverageForm=null; render(); return; }
  block.oneOffCoverage=(block.oneOffCoverage||[]).filter(function(o){ return toKey(o.date)!==todayKey; });
  dbWrite('clearing a same-day coverage change', function(){
    return supabaseClient.from('pod_shift_one_off_coverage').delete().eq('block_id', block.id).eq('the_date', todayKey);
  });
  regenerateAllRecurring();
  toast(findPod(f.podId).name+'’s regular schedule is back in effect for today.');
  state.quickCoverageForm=null;
  render();
}
function renderQuickCoverageModal(){
  const f=state.quickCoverageForm;

  if(f.error) html+='<div class="banner danger">'+f.error+'</div>';

  html+='<div class="row2" style="align-items:flex-end">'

      +instructors.filter(function(i){ return i.active!==false; }).slice().sort(function(a,b){ return a.name.localeCompare(b.name); }).map(function(i){
        return '<option value="'+i.id+'"'+(i.id===f.instructorId?' selected':'')+'>'+i.name+'</option>';
      }).join('')
    +'</select></div>'
    +'<button class="btn sm primary" onclick="saveQuickCoverage()">Save</button>'
  +'</div>';
  html+='<div style="display:flex;gap:8px;margin-top:14px;justify-content:space-between">'

    +'<button class="btn ghost" onclick="closeQuickCoverageForm()">Close</button>'

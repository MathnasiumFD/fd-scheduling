<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mathnasium Five Dock — Scheduling</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<style>
  /* Brand palette below is Mathnasium Five Dock's own design system (extracted from the
     Claude Design homepage export): red-500/600/700 as the brand accent family, a warm
     ink/paper neutral scale (not cool grey/blue), and Plus Jakarta Sans for display/heading
     type paired with Inter for body copy. Every existing selector below is unchanged — only
     the token VALUES were re-themed, so no markup or JS needed to change. */
  :root{
    --bg:#faf9f7; --surface:#ffffff; --surface-2:#f1efec; --border:#e3e0da; --text:#1a1a1a; --text-muted:#78716f;
    --primary:#ef3e33; --primary-text:#ffffff; --accent:#1a1a1a; --accent-bg:#f1efec;
    --success:#2f9e58; --success-bg:#e7f5ea; --danger:#b5121b; --danger-bg:#fce6e4;
    --warning:#9a640c; --warning-bg:#fdf2e0; --info:#4a4547; --info-bg:#e3e0da; --muted-bg:#e3e0da;
    --radius:10px; --shadow:0 1px 2px rgba(24,21,22,.08), 0 4px 16px rgba(24,21,22,.06);
    --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-display: "Plus Jakarta Sans", "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#171513; --surface:#211e1b; --surface-2:#2b2723; --border:#3c3630; --text:#f5f3f0; --text-muted:#b0a89f;
      --primary:#ff5c50; --primary-text:#1a1a1a; --accent:#e8e2da; --accent-bg:#2b2723;
      --success:#57c37e; --success-bg:#1c3325; --danger:#ff6b61; --danger-bg:#3a1815;
      --warning:#f0b94a; --warning-bg:#3a2c10; --info:#b0a89f; --info-bg:#2b2723; --muted-bg:#2b2723;
      --shadow:0 1px 3px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#171513; --surface:#211e1b; --surface-2:#2b2723; --border:#3c3630; --text:#f5f3f0; --text-muted:#b0a89f;
    --primary:#ff5c50; --primary-text:#1a1a1a; --accent:#e8e2da; --accent-bg:#2b2723;
    --success:#57c37e; --success-bg:#1c3325; --danger:#ff6b61; --danger-bg:#3a1815;
    --warning:#f0b94a; --warning-bg:#3a2c10; --info:#b0a89f; --info-bg:#2b2723; --muted-bg:#2b2723;
    --shadow:0 1px 3px rgba(0,0,0,.5);
  }

  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--font); }
  .wrap{ max-width:1080px; margin:0 auto; padding:20px 16px 60px; }
  h1,h2,h3{ margin:0 0 4px; font-family:var(--font-display); font-weight:800; }
  h1{ font-size:1.3rem; }
  h2{ font-size:1.05rem; font-weight:700; }
  h3{ font-size:.95rem; margin-bottom:2px; font-weight:700; }
  p{ margin:0 0 10px; color:var(--text-muted); font-size:.88rem; line-height:1.5; }
  .muted{ color:var(--text-muted); }
  .top{ display:flex; flex-wrap:wrap; align-items:flex-start; justify-content:space-between; gap:14px; margin-bottom:16px; }
  /* Logo has a white background baked into the source file, so it gets its own white chip —
     keeps it looking intentional against the page background in both light and dark mode. */
  .brand-logo{ display:flex; align-items:center; gap:12px; margin-bottom:10px; flex-wrap:wrap; }
  .brand-logo img{ height:44px; width:auto; display:block; background:#ffffff; padding:6px 10px; border-radius:8px; box-shadow:var(--shadow); }
  .login-wrap{ min-height:80vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .login-card{ width:100%; max-width:360px; text-align:center; }
  .login-card .brand-logo{ justify-content:center; }
  .login-card label{ text-align:left; margin-top:10px; }
  .login-card .btn{ width:100%; margin-top:16px; }
  .pill{ background:var(--surface-2); border:1px solid var(--border); border-radius:999px; padding:3px 10px; }

  .tabs{ display:flex; gap:6px; background:var(--surface-2); border:1px solid var(--border); border-radius:999px; padding:4px; width:max-content; margin-bottom:16px; }
  .tab{ border:none; background:transparent; padding:7px 16px; border-radius:999px; font-size:.85rem; font-weight:700; font-family:var(--font-display); color:var(--text-muted); cursor:pointer; }
  .tab.active{ background:var(--primary); color:var(--primary-text); }

  .card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px 18px; margin-bottom:16px; }
  .card-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
  /* Collapsible front-desk sections: clicking a section's own title toggles it — everything in the
     card except the header row (buttons included) just gets hidden via CSS, so no section's markup
     had to be restructured to support this. */
  .sec-toggle{ cursor:pointer; user-select:none; display:inline-flex; align-items:center; gap:6px; }
  .sec-toggle .chev{ display:inline-block; transition:transform .15s ease; font-size:.75em; }
  .card.collapsed .chev{ transform:rotate(-90deg); }
  .card.collapsed > *:not(.card-head){ display:none; }
  .card.collapsed{ margin-bottom:8px; }

  .clock{ display:flex; align-items:center; gap:8px; font-size:.78rem; background:var(--surface); border:1px solid var(--border); border-radius:999px; padding:6px 8px 6px 14px; box-shadow:var(--shadow); }
  .clock b{ color:var(--text); }
  .btn{ border:1px solid var(--border); background:var(--surface-2); color:var(--text); padding:6px 12px; border-radius:6px; font-size:.78rem; font-weight:600; cursor:pointer; font-family:var(--font); }
  .btn:hover{ filter:brightness(0.97); }
  .btn.primary{ background:var(--primary); color:var(--primary-text); border-color:transparent; }
  .btn.primary:hover{ filter:brightness(1.08); }
  .btn.ghost{ background:transparent; }
  .btn.danger{ background:var(--danger-bg); color:var(--danger); border-color:transparent; }
  .btn.success{ background:var(--success-bg); color:var(--success); border-color:transparent; }
  .btn.sm{ padding:4px 9px; font-size:.72rem; border-radius:4px; }
  .btn:disabled{ opacity:.45; cursor:default; }

  .daypicker{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
  .daybtn{ border:1px solid var(--border); background:var(--surface-2); border-radius:6px; padding:6px 12px; font-size:.78rem; cursor:pointer; color:var(--text); }
  .daybtn.active{ background:var(--primary); color:var(--primary-text); border-color:transparent; }
  .daybtn .d2{ display:block; font-size:.68rem; color:inherit; opacity:.75; }

  .pod-card{ border:1px solid var(--border); border-radius:var(--radius); padding:12px 14px; margin-bottom:10px; }
  .pod-card.singles{ border-style:dashed; }
  .pod-card .card-head{ margin-bottom:8px; }
  .sess-chip{ display:flex; justify-content:space-between; align-items:center; gap:8px; border:1px solid var(--border); border-left:4px solid var(--info); border-radius:8px; padding:7px 10px; margin-bottom:6px; font-size:.8rem; flex-wrap:wrap; }
  .sess-chip .time{ font-weight:700; display:inline-block; min-width:118px; }
  .sess-chip.status-attended{ border-left-color:var(--success); }
  .sess-chip.status-no-show{ border-left-color:var(--danger); background:var(--danger-bg); }
  .sess-chip.status-cancelled{ border-left-color:var(--border); opacity:.55; }
  .sess-chip.handoff{ border-left-color:var(--accent); }
  .sess-chip .actions{ display:flex; gap:4px; flex-wrap:wrap; }

  table{ width:100%; border-collapse:collapse; font-size:.8rem; }
  th{ text-align:left; font-size:.7rem; text-transform:uppercase; letter-spacing:.03em; color:var(--text-muted); border-bottom:1px solid var(--border); padding:6px 8px; }
  td{ padding:8px; border-bottom:1px solid var(--border); vertical-align:top; }
  tr:last-child td{ border-bottom:none; }

  .badge{ display:inline-block; padding:2px 9px; border-radius:999px; font-size:.7rem; font-weight:700; }
  .badge.available{ background:var(--success-bg); color:var(--success); }
  .badge.soon{ background:var(--warning-bg); color:var(--warning); }
  .badge.expired{ background:var(--muted-bg); color:var(--text-muted); }
  .badge.booked{ background:var(--info-bg); color:var(--info); }
  .badge.completed{ background:var(--muted-bg); color:var(--text-muted); }
  .badge.full{ background:var(--danger-bg); color:var(--danger); }
  .badge.handoff{ background:var(--accent-bg); color:var(--accent); }
  .badge.hold{ background:var(--warning-bg); color:var(--warning); }

  .banner{ border-radius:8px; padding:10px 12px; font-size:.8rem; margin-bottom:12px; display:flex; gap:8px; align-items:flex-start; }
  .banner.warn{ background:var(--warning-bg); color:var(--warning); }
  .banner.info{ background:var(--info-bg); color:var(--info); }
  .banner.danger{ background:var(--danger-bg); color:var(--danger); }
  .banner.accent{ background:var(--accent-bg); color:var(--accent); }

  .avail-grid{ display:grid; grid-template-columns: 90px repeat(4,1fr); gap:6px; }
  .avail-cell{ border:1px solid var(--border); border-radius:8px; padding:8px 4px; text-align:center; font-size:.72rem; background:var(--surface-2); color:var(--text-muted); }
  .avail-cell.on{ background:var(--success-bg); color:var(--success); border-color:var(--success); font-weight:700; }
  .avail-cell.full-cell{ background:var(--danger-bg); color:var(--danger); border-color:var(--danger); font-weight:700; }
  .avail-cell.nostaff-cell{ font-style:italic; }
  .cal-head{ font-size:.72rem; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:.03em; padding:6px 4px; }
  .cal-row-label{ display:flex; flex-direction:column; justify-content:center; font-size:.78rem; font-weight:600; padding:6px; background:var(--surface-2); border-radius:8px; }

  .login-box{ max-width:340px; margin:20px auto; }
  input[type=email], input[type=password], input[type=text], input[type=date], select{
    width:100%; padding:8px 10px; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--text); font-size:.85rem; margin-bottom:10px;
  }
  label{ font-size:.75rem; font-weight:600; color:var(--text-muted); display:block; margin-bottom:4px; }

  .overlay{ position:fixed; inset:0; background:rgba(10,12,16,.45); display:flex; align-items:center; justify-content:center; padding:16px; z-index:50; overflow-y:auto; }
  .modal{ background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); max-width:460px; width:100%; padding:18px 20px; border:1px solid var(--border); margin:20px 0; }
  .row2{ display:flex; gap:10px; }
  .row2 > div{ flex:1; }

  .toast{ position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--text); color:var(--bg); padding:10px 18px; border-radius:999px; font-size:.8rem; box-shadow:var(--shadow); z-index:60; max-width:80vw; text-align:center; }

  .slot-opt{ border:1px solid var(--border); border-radius:8px; padding:8px 10px; display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; font-size:.8rem; }
  .credit-card{ border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; margin-bottom:12px; }
  .credit-card .row{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:6px; }
  .small{ font-size:.72rem; }
  .empty-note{ font-size:.8rem; color:var(--text-muted); padding:6px 0 10px; }
  .footer-note{ font-size:.72rem; color:var(--text-muted); margin-top:24px; text-align:center; }
  .recurring-row{ margin-bottom:8px; }
  .hours-row{ display:flex; align-items:flex-end; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
  .hours-row .day-toggle{ flex:0 0 108px; }
  .hours-row .day-toggle label.chk{ display:flex; align-items:center; gap:6px; cursor:pointer; font-weight:400; color:var(--text); }
  .hours-row > div:not(.day-toggle){ flex:1; min-width:110px; }
  .block-row{ display:flex; align-items:flex-end; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
  .block-row > div{ flex:1; min-width:100px; }
  @media (max-width:640px){
    .avail-grid{ grid-template-columns: 60px repeat(4,1fr); }
    .row2{ flex-direction:column; }
  }
</style>

<script>
/* ---------- Supabase (live mode) ---------- */
// Publishable/anon key only — safe to ship in browser code, since every table it can reach is
// still governed by the Row Level Security policies in supabase_schema.sql. The service_role/
// secret key must NEVER appear here or anywhere else client-side.
// Supabase appends "#access_token=...&type=invite" or "...&type=recovery" to the redirect URL for
// an invite link or a password-reset link. Captured as the very first thing this script does —
// before window.supabase.createClient() runs and has any chance to process/clear the URL — so it's
// reliable regardless of exactly which auth event name a given supabase-js version fires for each
// case. (This was previously computed after createClient() ran, which let the SDK occasionally win
// the race and strip the hash first, silently skipping the "set your password" screen entirely.)
var AUTH_REDIRECT_TYPE = (function(){
  if(typeof window==='undefined' || !window.location || !window.location.hash) return null;
  const m=window.location.hash.match(/type=(\w+)/);
  return m? m[1] : null;
})();

var SUPABASE_URL = 'https://irtydpjjrscmtctoeffc.supabase.co';
var SUPABASE_ANON_KEY = 'sb_publishable_rcmZZ2KIplqWI1nGeuLlMg_tusxf0KG';
var supabaseClient = (typeof window !== 'undefined' && window.supabase)
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;
var currentUser = null; // {role, instructorId, parentId} — set once login resolves
var SITE_URL = 'https://fd-scheduling.vercel.app/'; // update if the production Vercel URL ever changes — used as the redirect target for invite/password-reset emails


// A real UUID when live (so a newly-created record's local id already matches what Postgres will
// store — no reconciliation needed), or null in demo/offline mode so callers fall back to the
// original 'sess'+(nextSessionId++) style counters unchanged.
function newId(){ return (currentUser && typeof crypto!=='undefined' && crypto.randomUUID) ? crypto.randomUUID() : null; }

// Fire-and-forget write to Supabase: the UI already updated optimistically (same as the old
// local-only behaviour), this just persists it in the background. A failed write is logged and
// surfaced with a toast, but — for this first pass — doesn't roll back the local change; if that
// ever matters in practice (e.g. someone's offline), it's the next thing to harden.
function dbWrite(label, promiseFn){
  if(!supabaseClient || !currentUser) return; // demo/offline mode — local-only, exactly as before
  promiseFn().then(function(r){
    if(r && r.error){ console.error('Supabase write failed ('+label+'):', r.error); toast("Couldn't save to the server — "+label+'. Your change is visible here but may not have saved.'); }
  }).catch(function(err){
    console.error('Supabase write failed ('+label+'):', err);
    toast("Couldn't save to the server — "+label+'. Your change is visible here but may not have saved.');
  });
}

/* ---------- date + time helpers ---------- */
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function addMonths(d,n){ const x=new Date(d); const day=x.getDate(); x.setMonth(x.getMonth()+n); if(x.getDate()!==day) x.setDate(0); return x; }
function toKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtShort(d){ return d.toLocaleDateString('en-AU',{weekday:'short',month:'short',day:'numeric'}); }
function fmtLong(d){ return d.toLocaleDateString('en-AU',{weekday:'long',month:'long',day:'numeric',year:'numeric'}); }
function getMonday(d){ const x=new Date(d); const day=x.getDay(); const diff = x.getDate()-day+(day===0?-6:1); x.setDate(diff); return x; }
function daysUntil(from,to){ return Math.round((new Date(toKey(to))-new Date(toKey(from)))/86400000); }
function sameDay(a,b){ return toKey(a)===toKey(b); }

// Which "school-year cohort" a date belongs to, for automatic year promotion. Approximates the
// Australian school year starting Feb 1 — a date in January still belongs to the previous
// cohort, since the new school year hasn't started yet. (The exact cutoff date is a policy
// decision for the real build, e.g. matching term-1 start; Feb 1 is a reasonable default.)
function schoolYearIndex(date){
  const y=date.getFullYear();
  const cutoff=new Date(y,1,1); // Feb 1
  return date<cutoff ? y-1 : y;
}

function timeStrToMin(s){ const [h,m]=s.split(':').map(Number); return h*60+m; }
function minToTimeStr(min){ const h=Math.floor(min/60), m=min%60; return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0'); }
function minToLabel(min){
  let h=Math.floor(min/60), m=min%60;
  const period = h>=12? 'pm':'am';
  let h12 = h%12; if(h12===0) h12=12;
  return h12+(m? ':'+String(m).padStart(2,'0') : '')+period;
}
function rangeLabel(start,duration){ return minToLabel(start)+'–'+minToLabel(start+duration); }

// One-click account setup (front desk only): creates the real Supabase Auth login and emails an
// invite the person uses to set their own password — replacing the old two-step "add them in the
// Supabase dashboard, then paste SQL to link their role" process. Unlike dbWrite(), this isn't
// fire-and-forget — front desk is actively waiting to know whether the invite actually went out,
// so it always leaves a toast either way.
function inviteLogin(email, role, linkedId, personName){
  if(!supabaseClient || !currentUser){ toast('Invites only work when signed in to the live app.'); return; }
  supabaseClient.functions.invoke('invite-user', {body:{email:email, role:role, linkedId:linkedId}}).then(function(r){
    const errMsg = (r && r.error && r.error.message) || (r && r.data && r.data.error);

    if(role==='instructor'){ const i=findInstructor(linkedId); if(i) i.authUserId='pending'; }

    toast('Invite sent to '+email+' — they\'ll get an email to set their own password.');
    render();
  }).catch(function(err){ toast('Could not invite '+personName+' — '+(err&&err.message?err.message:'unknown error')); });
}

// Who's actually covering a shift block on a given date — the assignment with the latest
// effectiveFrom on or before that date. Returns null if the block didn't exist yet / has no
// assignment history reaching back that far (e.g. a brand-new block whose first assignment is
// itself dated in the future).
function blockInstructorOn(block, date){
  const dateKey=toKey(date);
  // A same-day coverage swap (see "shift coverage requests" below) always wins for its exact date —
  // same one-off-beats-ongoing resolution order as instructor availability — then the regular
  // dated assignment history applies for every other date, untouched.
  const oneOff=(block.oneOffCoverage||[]).find(function(o){ return toKey(o.date)===dateKey; });
  if(oneOff) return oneOff.instructorId;
  const candidates=block.assignments.filter(function(a){ return toKey(a.effectiveFrom)<=dateKey; });
  if(candidates.length===0) return null;
  candidates.sort(function(a,b){ return toKey(a.effectiveFrom).localeCompare(toKey(b.effectiveFrom)); });
  return candidates[candidates.length-1].instructorId;
}
// Which instructors have themselves declared availability covering this block's day/time as of a
// given date — used to keep the "assign an instructor" picker limited to real candidates only.
// Takes `weekday` explicitly rather than deriving it from `date.getDay()` (as instructorAvailabilityOn
// does) — `date` here is usually an assignment's effective-from cutoff, which need not itself fall on
// the block's weekday (e.g. lining up a Wednesday shift "starting today" when today's a Friday). A
// one-off exception on that exact calendar date still overrides, same as instructorAvailabilityOn.
function qualifyingInstructorsForBlock(weekday, block, date){
  const dateKey=toKey(date);
  return instructors.filter(function(instr){
    if(instr.active===false) return false; // deactivated instructors are never offered for a new shift/coverage
    const oneOff=instr.oneOffs.find(function(o){ return toKey(o.date)===dateKey; });
    if(oneOff) return !oneOff.off && block.start>=oneOff.start && block.end<=oneOff.end;
    const candidates=instr.availRules.filter(function(r){ return r.weekday===weekday && toKey(r.effectiveFrom)<=dateKey; });
    if(candidates.length===0) return false;
    candidates.sort(function(a,b){ return toKey(a.effectiveFrom).localeCompare(toKey(b.effectiveFrom)); });
    const active=candidates[candidates.length-1];
    return !active.off && block.start>=active.start && block.end<=active.end;
  });
}

function autoExitTime(sess, offset){

// Real wall-clock minutes-since-midnight, "right now" — used only for the checked-in countdown.
// Session/exit times are always real clock times (3–7pm), so this stays independent of the
// simulated calendar date used everywhere else in this demo (see simNow()) — a countdown to
// pickup is about actual elapsed time today, not which simulated day the demo is parked on.
function nowMinutesOfDay(){
  const d=new Date();
  return d.getHours()*60+d.getMinutes();
}
// A short "time until pickup" label + badge color for a checked-in student, measured against
// their recorded exit time (defaulted at check-in, or since adjusted by staff).
function countdownInfo(exitMinute){
  const diff=exitMinute-nowMinutesOfDay();
  if(diff>10){
    const h=Math.floor(diff/60), m=diff%60;
    return {label:'Leaves in '+(h>0? h+'h'+(m? ' '+m+'m':'') : m+' min'), cls:'available'};
  }
  if(diff>=0) return {label:(diff===0? 'Leaves now' : 'Leaves in '+diff+' min'), cls:'soon'};
  return {label:(-diff)+' min overdue', cls:'full'};
}

function findInstructor(id){ return instructors.find(i=>i.id===id); }

/* ---------- pod scheduling & capacity ---------- */
// Sessions booked into a Pod that day (any status but cancelled) — capacity belongs to the Pod
// as a whole, not to whichever instructor happens to be covering it at a given moment.
function sessionsForDay(podId, dateKey){
  return sessions.filter(s=> s.podId===podId && toKey(s.date)===dateKey && s.status!=='cancelled');
}
// Sessions a given INSTRUCTOR is personally involved in that day, across any Pod — used for their
// own "my schedule" view, not for capacity math.
function sessionsInvolvingInstructor(instructorId, dateKey){
  return sessions.filter(s=> (s.instructorId===instructorId || s.instructorId2===instructorId) && toKey(s.date)===dateKey && s.status!=='cancelled');
}

// A student's full attendance history — every session ever booked for them, regardless of status,
// most recent first — showing exactly which Pod they sat in and which instructor(s) covered it.
// Front-desk only (5.5): instructors only ever see today's checked-in roster at their own Pod
// (5.13), and parents never see Pod/instructor detail at all (5.7) — this is the one place the
// full where-and-with-whom history lives, and it's deliberately not exposed anywhere else.
function studentAttendanceLog(studentId){
  return sessions.filter(function(s){ return s.studentId===studentId; })
    .slice()
    .sort(function(a,b){ return b.date-a.date || b.start-a.start; });
}

// Peak simultaneous headcount in a Pod on a day — the real capacity question, since sessions of
// different lengths starting at different times can overlap partially. Pass `extra`
// ({start,duration}) to see what the peak WOULD be if that session were added.
function peakConcurrency(podId, dateKey, extra){
  const list = sessionsForDay(podId, dateKey).map(function(s){ return {start:s.start, end:s.start+s.duration}; });
  if(extra) list.push({start:extra.start, end:extra.start+extra.duration});
  if(list.length===0) return 0;
  const events=[];
  list.forEach(iv=>{ events.push([iv.start,1]); events.push([iv.end,-1]); });
  events.sort((a,b)=> a[0]-b[0] || a[1]-b[1]); // an ending session frees its seat before a same-instant start fills it
  let cur=0, peak=0;
  events.forEach(function(e){ cur+=e[1]; if(cur>peak) peak=cur; });
  return peak;
}
// Peak concurrency restricted to a specific window (e.g. one hour) — used by the availability lookup.
function peakInWindow(podId, dateKey, winStart, winEnd){
  const list = sessionsForDay(podId, dateKey)
    .filter(function(s){ return s.start<winEnd && winStart<s.start+s.duration; })
    .map(function(s){ return {start:Math.max(s.start,winStart), end:Math.min(s.start+s.duration,winEnd)}; });
  if(list.length===0) return 0;
  const events=[];
  list.forEach(function(iv){ events.push([iv.start,1]); events.push([iv.end,-1]); });
  events.sort(function(a,b){ return a[0]-b[0] || a[1]-b[1]; });
  let cur=0, peak=0;
  events.forEach(function(e){ cur+=e[1]; if(cur>peak) peak=cur; });
  return peak;
}

// How many currently-scheduled students overlapping this window in this Pod are the same school
// year — used to prefer grouping same-year students together when the system auto-assigns a Pod.
function sameYearCount(podId, dateKey, start, duration, year){
  return sessions.filter(function(s){
    return s.podId===podId && toKey(s.date)===dateKey && s.status!=='cancelled'
      && s.start<start+duration && start<s.start+s.duration
      && findStudent(s.studentId).year===year;
  }).length;
}

// What an instructor is available for on a specific calendar date — resolved from their history
// of ongoing changes (each effective from a given date, until superseded by a later one for that
// same weekday) and one-off changes (a single specific date, which always takes priority over the
// ongoing pattern for that one date). Returns {start,end}, or null if not available that day.
function instructorAvailabilityOn(instructorId, date){
  const instr=findInstructor(instructorId);
  const dateKey=toKey(date);
  const oneOff=instr.oneOffs.find(function(o){ return toKey(o.date)===dateKey; });
  if(oneOff) return oneOff.off? null : {start:oneOff.start, end:oneOff.end};
  const weekday=WEEKDAY_KEYS[(date.getDay()+6)%7];
  const candidates=instr.availRules.filter(function(r){ return r.weekday===weekday && toKey(r.effectiveFrom)<=dateKey; });
  if(candidates.length===0) return null;
  candidates.sort(function(a,b){ return toKey(a.effectiveFrom).localeCompare(toKey(b.effectiveFrom)); });
  const active=candidates[candidates.length-1];
  return active.off? null : {start:active.start, end:active.end};
}
// The rule currently in effect for a weekday, as of "today" — used to summarize an instructor's
// standing pattern and to softly cross-check a Pod assignment against their own declared hours.
function instructorCurrentWeeklyPattern(instructorId){
  const now=simNow();
  const monday=getMonday(now);
  const out={};
  WEEKDAY_KEYS.forEach(function(day, i){ out[day]=instructorAvailabilityOn(instructorId, addDays(monday,i)); });
  return out;
}

// Which block (if any) in this Pod's weekly schedule covers a given moment, and who's actually
// covering it on the given date (per that block's dated assignment history).
function podBlockAt(podId, weekday, minute, date){
  const block=podBlocksForDay(podId, weekday).find(function(b){ return b.start<=minute && minute<b.end; });
  if(!block) return null;
  return {start:block.start, end:block.end, instructorId:blockInstructorOn(block, date)};
}
// How far (in absolute minutes) a Pod's schedule covers a session starting at `start` on `date`,
// before either the covering block ends or the session ends — whichever comes first. Returns
// {boundary, instructorId}; instructorId is null if nothing is assigned to the Pod at `start` at
// all, or the block exists but nobody's assignment history reaches back to this date.
function podCoverageBoundary(podId, weekday, start, duration, date){
  const end=start+duration;
  const block=podBlockAt(podId, weekday, start, date);
  if(!block) return {boundary:start, instructorId:null};
  return {boundary:Math.min(end, block.end), instructorId:block.instructorId};
}

// Full instructor coverage for a window in a Pod — including a handoff partway through if one
// block's assignment runs out before the session ends. Shared by staff booking and by moving an
// already-seated student to a different Pod, so both pick up whoever actually covers the new Pod.
function resolvePodCoverage(podId, weekday, start, duration, date){
  const end=start+duration;
  const seg1=podCoverageBoundary(podId, weekday, start, duration, date);
  if(!seg1.instructorId) return {instructorId:null, instructorId2:null, handoff:null};
  if(seg1.boundary>=end) return {instructorId:seg1.instructorId, instructorId2:null, handoff:null};
  const seg2=podCoverageBoundary(podId, weekday, seg1.boundary, end-seg1.boundary, date);
  return {instructorId:seg1.instructorId, instructorId2:seg2.instructorId||null, handoff:seg2.instructorId? seg1.boundary : null};
}

// Moves an already-booked/seated session to a different Pod — front desk can do this for any
// student, and an instructor can do it for a student currently checked in at their own Pod.
// Re-resolves instructor coverage for the new Pod at the same day/time; blocked if the target
// Pod is already at capacity for that window.
function movePodSession(sessionId, newPodId){
  const sess=findSession(sessionId);
  if(!sess) return {ok:false, error:'Session not found.'};
  if(sess.podId===newPodId) return {ok:true};
  const newPod=findPod(newPodId);
  const dateKey=toKey(sess.date);
  const weekday=WEEKDAY_KEYS[(sess.date.getDay()+6)%7];
  const cap=podCapacity(newPodId);
  const wouldBePeak=peakConcurrency(newPodId, dateKey, {start:sess.start, duration:sess.duration});
  if(wouldBePeak>cap){
    return {ok:false, error:newPod.name+' is already full at that time ('+cap+'/'+cap+') — pick another Pod.'};
  }
  const oldPod=findPod(sess.podId);
  const cov=resolvePodCoverage(newPodId, weekday, sess.start, sess.duration, sess.date);
  sess.podId=newPodId;
  sess.instructorId=cov.instructorId;
  sess.instructorId2=cov.instructorId2;
  sess.handoff=cov.handoff;
  dbWrite('moving a session to a different Pod', function(){ return supabaseClient.from('sessions').update({
    pod_id:sess.podId, instructor_id:sess.instructorId, instructor_id_2:sess.instructorId2, handoff_min:sess.handoff
  }).eq('id', sess.id); });
  return {ok:true, oldPod:oldPod, newPod:newPod};
}

function studentOverlapClash(studentId, dateKey, start, duration, excludeSessionId){
  const end=start+duration;
  return sessions.some(function(s){
    return s.studentId===studentId && s.status!=='cancelled' && s.id!==excludeSessionId
      && toKey(s.date)===dateKey && s.start<end && start<s.start+s.duration;
  });
}

function possibleStarts(duration){
  const arr=[];
  for(let t=CENTER_OPEN; t+duration<=CENTER_CLOSE; t+=START_STEP) arr.push(t);
  return arr;
}

// Whether a covering instructor's "best suited for" range (5.3) includes a given year — a
// preference used for Pod ranking, never a hard requirement: every instructor can actually teach
// any year (5.3), so this only ever nudges which Pod gets picked, and is never a reason a booking
// or auto-assignment gets blocked.
function instructorSuitedFor(instr, year){ return year>=instr.yearMin && year<=instr.yearMax; }
// Auto-assignment used wherever the system (not staff directly) needs to pick a Pod: parent
// make-up booking and standing-schedule pre-booking. The Pod's assigned instructor for the full
// window (a single instructor — auto-assignment never arranges a handoff; that's a staff judgment
// call, see 5.1/5.8) must actually be staffed there, and the Pod must have room — that's the only
// hard requirement. Among the options that pass, prefer a Pod whose instructor is best suited for
// the student's year (5.3), then whichever already has more same-year students in that window —
// grouping kids of a similar school year together — then whichever has more room.
// Picks an available, under-capacity Pod for a standing/auto-generated session. If `preferredPodId`
// is given (a student's pinned standing Pod — see studentAssignedPodOn()), only that Pod is
// considered — feasible-or-not, there's no falling back to a different Pod behind the family's
// back; infeasible just means this occurrence is skipped, same as any other gap (5.8).
function pickBestPod(weekday, dateKey, start, duration, year, preferredPodId){
  const date=new Date(dateKey);
  if(preferredPodId){
    const pod=findPod(preferredPodId);
    if(!pod) return null;
    const cov=podCoverageBoundary(pod.id, weekday, start, duration, date);
    if(!cov.instructorId || cov.boundary < start+duration) return null;
    const cap=podCapacity(pod.id);
    const wouldBePeak=peakConcurrency(pod.id, dateKey, {start, duration});
    if(wouldBePeak>cap) return null;
    return pod.id;
  }
  let best=null, bestSuited=-1, bestSameYear=-1, bestRoom=-1;
  pods.forEach(function(pod){
    const cov=podCoverageBoundary(pod.id, weekday, start, duration, date);
    if(!cov.instructorId || cov.boundary < start+duration) return; // needs full single-instructor coverage
    const instr=findInstructor(cov.instructorId);
    const cap=podCapacity(pod.id);
    const wouldBePeak=peakConcurrency(pod.id, dateKey, {start, duration});
    if(wouldBePeak>cap) return;
    const room=cap-wouldBePeak;
    const suited=instructorSuitedFor(instr, year)? 1 : 0;
    const sameYear=sameYearCount(pod.id, dateKey, start, duration, year);
    if(suited>bestSuited || (suited===bestSuited && (sameYear>bestSameYear || (sameYear===bestSameYear && room>bestRoom)))){
      best=pod.id; bestSuited=suited; bestSameYear=sameYear; bestRoom=room;
    }
  });
  return best;
}

function creditDisplayStatus(c){
  const now=simNow();
  if(c.status==='redeemed'){
    const sess=findSession(c.redeemedSessionId);
    if(sess && sess.status==='cancelled'){ return 'cancelled-int'; }
    if(sess && new Date(toKey(sess.date)) < new Date(toKey(now)) ){ return 'completed'; }
    return 'booked';
  }
  if(c.status==='expired') return 'expired';
  if(new Date(toKey(c.expiryDate)) < new Date(toKey(now))) return 'expired';
  if(daysUntil(now,c.expiryDate) <= CREDIT_EXPIRY_NOTICE_DAYS) return 'soon';
  return 'available';
}

function toast(msg){ state.toast=msg; render(); setTimeout(function(){ state.toast=null; render(); }, 3400); }

/* ---------- standing weekly schedule (pre-booking) ---------- */
// Front-desk-only "hold": the student keeps their standing recurring pattern (it isn't touched),
// but no session gets generated — or an already-generated one gets cancelled — for any date that
// falls inside a hold's date range. Because capacity is always computed from actual `sessions`
// records, a held date simply has one fewer occupant, which is exactly what makes that Pod slot
// available for a one-off booking during the hold.
function isStudentOnHold(studentId, date){
  const student=findStudent(studentId);
  const dateKey=toKey(date);
  return (student.holds||[]).some(function(h){ return toKey(h.start)<=dateKey && dateKey<=toKey(h.end); });
}
// The soonest hold that hasn't fully ended yet (current or upcoming) — used for the Students panel badge.
function currentOrUpcomingHold(studentId){
  const now=simNow();
  const student=findStudent(studentId);
  return (student.holds||[]).filter(function(h){ return toKey(h.end)>=toKey(now); })
    .sort(function(a,b){ return toKey(a.start).localeCompare(toKey(b.start)); })[0] || null;
}

// A student's enrollment plan (sessions/week + standing days) is normally just the current
// student.recurring/sessionsPerWeek fields — kept up to date by applyPlanChanges() below. But
// front desk can also schedule a plan change ("stop attending" or "change to Nx/week") to take
// effect from a future date, without disturbing the plan between now and then. student.planChanges
// holds those not-yet-effective changes; this resolves which plan governs a specific date.
function studentPlanOn(studentId, date){
  const student=findStudent(studentId);
  const dateKey=toKey(date);
  const pending=(student.planChanges||[]).filter(function(pc){ return toKey(pc.effectiveFrom)<=dateKey; });
  if(pending.length===0) return {sessionsPerWeek:student.sessionsPerWeek, recurring:student.recurring, stopped:false};
  pending.sort(function(a,b){ return toKey(a.effectiveFrom).localeCompare(toKey(b.effectiveFrom)); });
  const active=pending[pending.length-1];
  return {sessionsPerWeek: active.stopped?0:active.sessionsPerWeek, recurring: active.stopped?[]:active.recurring, stopped:!!active.stopped};
}
// Promotes any scheduled plan change whose effective date has arrived into the student's actual
// current plan (student.recurring/sessionsPerWeek), so ordinary display code always just reads
// "today's plan" directly. Mirrors applyPromotions() — run on every clock tick.
function applyPlanChanges(){
  let appliedCount=0;
  students.forEach(function(student){
    const due=(student.planChanges||[]).filter(function(pc){ return toKey(pc.effectiveFrom)<=toKey(simNow()); });
    if(due.length===0) return;
    due.sort(function(a,b){ return toKey(a.effectiveFrom).localeCompare(toKey(b.effectiveFrom)); });
    const latest=due[due.length-1];
    student.sessionsPerWeek = latest.stopped? 0 : latest.sessionsPerWeek;
    student.recurring = latest.stopped? [] : latest.recurring;
    student.stoppedFrom = latest.stopped? latest.effectiveFrom : null;
    student.planChanges = (student.planChanges||[]).filter(function(pc){ return toKey(pc.effectiveFrom) > toKey(simNow()); });
    appliedCount++;
  });
  return appliedCount;
}
function currentOrUpcomingPlanChange(studentId){
  const student=findStudent(studentId);
  return (student.planChanges||[]).slice().sort(function(a,b){ return toKey(a.effectiveFrom).localeCompare(toKey(b.effectiveFrom)); })[0] || null;
}

/* ---------- plan changes: stop or change frequency from a future date (5.16b) ---------- */
function openPlanChangeForm(studentId){
  const student=findStudent(studentId);
  state.planChangeForm={
    studentId, mode:'stop', effectiveFrom:toKey(simNow()),
    sessionsPerWeek: student.sessionsPerWeek,
    recurring: (student.recurring||[]).map(function(r){ return {weekday:r.weekday, start:r.start}; }),
    error:''
  };
  render();
}
function closePlanChangeForm(){ state.planChangeForm=null; render(); }
function setPlanChangeMode(mode){ state.planChangeForm.mode=mode; state.planChangeForm.error=''; render(); }
function setPlanChangeField(field, value){ state.planChangeForm[field]=value; state.planChangeForm.error=''; render(); }
function setPlanChangeSessionsPerWeek(v){
  const f=state.planChangeForm;
  const student=findStudent(f.studentId);
  f.sessionsPerWeek=Number(v);
  const starts=possibleStarts(student.duration);
  while(f.recurring.length<f.sessionsPerWeek) f.recurring.push({weekday:'Mon', start:starts[0]});
  f.recurring=f.recurring.slice(0,f.sessionsPerWeek);
  f.error='';
  render();
}
function setPlanChangeRecurringSlot(idx, field, value){
  state.planChangeForm.recurring[idx][field] = field==='start'? Number(value) : value;
  render();
}
function savePlanChange(){
  const f=state.planChangeForm;
  const student=findStudent(f.studentId);
  if(!f.effectiveFrom){ f.error='Choose an effective date.'; render(); return; }
  if(toKey(new Date(f.effectiveFrom))<toKey(simNow())){ f.error='Effective date must be today or in the future.'; render(); return; }
  const stopped = f.mode==='stop';
  if(!stopped && f.recurring.length===0){ f.error='Add at least one standing day/time.'; render(); return; }
  const change={
    id:newId()||('pc'+(nextPlanChangeId++)),
    effectiveFrom:new Date(f.effectiveFrom), stopped,
    sessionsPerWeek: stopped? 0 : Number(f.sessionsPerWeek),
    recurring: stopped? [] : f.recurring.map(function(r){ return {weekday:r.weekday, start:r.start}; }),
  };
  // One pending change per effective date — re-saving the same date replaces it, same convention
  // as the standing Pod pin (saveStudentPodAssignment) uses for its own dated history.
  student.planChanges = (student.planChanges||[]).filter(function(pc){ return toKey(pc.effectiveFrom)!==f.effectiveFrom; });
  student.planChanges.push(change);

  // Cancel already-generated future standing occurrences from the effective date forward — same
  // as a standing Pod pin (saveStudentPodAssignment) — so a "stop" or a frequency change actually
  // takes hold for every upcoming standing session, not just ones not yet generated. Restores any
  // linked make-up credit first, same as any other cancellation (5.11). One-off/staff-placed
  // sessions are left alone; only the auto-generated standing ones regenerate.
  let movedCount=0;
  sessions.forEach(function(s){
    if(s.studentId!==student.id || !s.recurring || s.status!=='scheduled') return;
    if(toKey(s.date) < f.effectiveFrom) return;
    s.status='cancelled';
    movedCount++;
    dbWrite('cancelling a session for a plan change', function(){ return supabaseClient.from('sessions').update({status:'cancelled'}).eq('id', s.id); });
    if(s.creditId){
      const cr=findCredit(s.creditId);
      if(cr && cr.status==='redeemed' && toKey(cr.expiryDate)>=toKey(simNow())){
        cr.status='available'; cr.redeemedSessionId=null;
        dbWrite('restoring a make-up credit', function(){ return supabaseClient.from('credits').update({status:'available', redeemed_session_id:null}).eq('id', cr.id); });
      }
    }
  });

  dbWrite('scheduling a plan change', function(){
    // Deleting any existing row for this exact date first (cascades its own recurring rows) keeps
    // this idempotent on re-save, same as the local array replace above.
    return supabaseClient.from('student_plan_changes').delete().eq('student_id', student.id).eq('effective_from', f.effectiveFrom).then(function(){
      return supabaseClient.from('student_plan_changes').insert({
        id:change.id, student_id:student.id, effective_from:f.effectiveFrom, stopped:stopped, sessions_per_week:change.sessionsPerWeek
      });
    }).then(function(r){
      if(r.error || stopped || !change.recurring.length) return r;
      return supabaseClient.from('student_plan_change_recurring').insert(change.recurring.map(function(rec){
        return {plan_change_id:change.id, weekday:rec.weekday, start_min:rec.start};
      }));
    });
  });
  regenerateAllRecurring();
  toast(student.name+(stopped
    ? ' scheduled to stop attending from '+fmtShort(new Date(f.effectiveFrom))+'.'
    : '’s schedule changing to '+change.sessionsPerWeek+'x/week from '+fmtShort(new Date(f.effectiveFrom))+'.')
    +(movedCount? ' '+movedCount+' upcoming standing session'+(movedCount===1?'':'s')+' regenerated to match.' : ''));
  state.planChangeForm=null;
  render();
}
function cancelPlanChange(studentId, effectiveFromKey){
  const student=findStudent(studentId);
  student.planChanges=(student.planChanges||[]).filter(function(pc){ return toKey(pc.effectiveFrom)!==effectiveFromKey; });
  dbWrite('cancelling a scheduled plan change', function(){ return supabaseClient.from('student_plan_changes').delete()
    .eq('student_id', studentId).eq('effective_from', effectiveFromKey); });
  const made=regenerateAllRecurring();
  toast('Scheduled plan change removed'+(made>0? ' — '+made+' standing session(s) re-booked.' : '.'));
  render();
}

// Everything a parent should be told is changing about a child's schedule (5.20) — any front-desk-
// scheduled hold, plan change (stop / frequency change), or standing Pod move that hasn't taken
// effect yet. Purely informational on the parent side; they can't edit any of it themselves, only
// front desk can (5.4/5.9c/5.16b). An already-active hold is included too (still worth surfacing),
// but a Pod pin already in effect is not — only ones still ahead count as a "change".
function upcomingChangesForStudent(studentId){
  const out=[];
  const hold=currentOrUpcomingHold(studentId);
  if(hold) out.push({type:'hold', hold:hold});
  const planChange=currentOrUpcomingPlanChange(studentId);
  if(planChange) out.push({type:'plan', planChange:planChange});
  currentOrUpcomingPodAssignments(studentId)
    .filter(function(a){ return toKey(a.effectiveFrom) > toKey(simNow()); })
    .forEach(function(a){ out.push({type:'pod', podAssignment:a}); });
  return out;
}
function describeUpcomingChange(change){
  // effectiveFrom/date fields on these records may be a Date or a plain "YYYY-MM-DD" string
  // depending on how they were created (form saves always store a Date; a couple of these record
  // shapes — like planChanges, still without a dedicated save form — aren't fully pinned down yet).
  // new Date(x) accepts either, so wrap everything here rather than assume one or the other.
  if(change.type==='hold'){
    const h=change.hold;
    const active = toKey(h.start)<=toKey(simNow());
    return active
      ? '⏸️ Currently on hold through '+fmtShort(new Date(h.end))+(h.note? ' ('+h.note+')' : '')+' — sessions resume automatically after.'
      : '⏸️ Scheduled hold '+fmtShort(new Date(h.start))+'–'+fmtShort(new Date(h.end))+(h.note? ' ('+h.note+')' : '')+'.';
  }
  if(change.type==='plan'){
    const pc=change.planChange;
    return pc.stopped
      ? '📋 Scheduled to stop attending from '+fmtShort(new Date(pc.effectiveFrom))+'.'
      : '📋 Schedule changing to '+pc.sessionsPerWeek+'x/week from '+fmtShort(new Date(pc.effectiveFrom))+'.';
  }
  if(change.type==='pod'){
    const a=change.podAssignment;
    return a.podId
      ? '↪️ Moving to '+findPod(a.podId).name+' from '+fmtShort(new Date(a.effectiveFrom))+'.'
      : '↪️ Returning to an auto-assigned Pod from '+fmtShort(new Date(a.effectiveFrom))+'.';
  }
  return '';
}

// A student's pinned standing Pod, if front desk has set one — resolved the same dated-history way
// as an instructor's own availability or a Pod shift's assignment: whichever entry has the latest
// effectiveFrom on or before the date wins. A null podId entry explicitly means "back to
// auto-assign" from that date forward; no entries at all (the normal case) means auto-assign has
// always applied — pickBestPod() picks freely among qualified, available, under-capacity Pods.
function studentAssignedPodOn(studentId, date){
  const student=findStudent(studentId);
  const dateKey=toKey(date);
  const applicable=(student.podAssignments||[]).filter(function(a){ return toKey(a.effectiveFrom)<=dateKey; });
  if(applicable.length===0) return null;
  applicable.sort(function(a,b){ return toKey(a.effectiveFrom).localeCompare(toKey(b.effectiveFrom)); });
  return applicable[applicable.length-1].podId;
}
function currentOrUpcomingPodAssignments(studentId){
  const student=findStudent(studentId);
  return (student.podAssignments||[]).slice().sort(function(a,b){ return toKey(a.effectiveFrom).localeCompare(toKey(b.effectiveFrom)); });
}

function openStudentPodForm(studentId){

  dbWrite('pinning standing Pod', function(){

      return supabaseClient.from('student_pod_assignments').insert({student_id:student.id, pod_id:f.podId||null, effective_from:f.effectiveFrom});
    });
  });

  // Cancel already-generated future standing occurrences from the effective date forward, so the
  // new pin actually takes hold for every upcoming standing session — not just ones not yet
  // generated — restoring any linked make-up credit first, same as any other cancellation (5.11).
  // One-off/staff-placed sessions are left alone; only the auto-generated standing ones regenerate.
  let movedCount=0;
  sessions.forEach(function(s){
    if(s.studentId!==student.id || !s.recurring || s.status!=='scheduled') return;
    if(toKey(s.date) < f.effectiveFrom) return;
    s.status='cancelled';
    movedCount++;
    dbWrite('cancelling a session for a Pod move', function(){ return supabaseClient.from('sessions').update({status:'cancelled'}).eq('id', s.id); });
    if(s.creditId){
      const cr=findCredit(s.creditId);
      if(cr && cr.status==='redeemed' && toKey(cr.expiryDate)>=toKey(simNow())){
        cr.status='available'; cr.redeemedSessionId=null;
        dbWrite('restoring a make-up credit', function(){ return supabaseClient.from('credits').update({status:'available', redeemed_session_id:null}).eq('id', cr.id); });
      }
    }
  });
  regenerateAllRecurring();
  const podName=f.podId? findPod(f.podId).name : 'auto-assign';
  toast(student.name+' moves to '+podName+' from '+fmtShort(new Date(f.effectiveFrom))+(movedCount? ' — '+movedCount+' upcoming standing session'+(movedCount===1?'':'s')+' regenerated to match' : '')+'.');
  state.studentPodForm=null;
  render();
}
function removeStudentPodAssignment(studentId, effectiveFromKey){
  const student=findStudent(studentId);
  student.podAssignments=(student.podAssignments||[]).filter(function(a){ return toKey(a.effectiveFrom)!==effectiveFromKey; });
  dbWrite('removing standing Pod pin', function(){ return supabaseClient.from('student_pod_assignments').delete()
    .eq('student_id', studentId).eq('effective_from', effectiveFromKey); });
  regenerateAllRecurring();
  render();
}

function generateRecurringSessions(student, weeksAhead){
  const startMonday=getMonday(simNow());
  let created=0;
  for(let w=0; w<weeksAhead; w++){
    const monday=addDays(startMonday, w*7);
    WEEKDAY_KEYS.forEach(function(weekday, dayIdx){
      const date=addDays(monday, dayIdx);
      if(date < new Date(toKey(simNow()))) return; // never backfill the past
      const dateKey=toKey(date);
      if(isStudentOnHold(student.id, date)) return; // on hold — leave this occurrence unbooked
      const plan=studentPlanOn(student.id, date); // respects any scheduled stop/frequency change
      const slot=(plan.recurring||[]).find(function(r){ return r.weekday===weekday; });
      if(!slot) return; // this weekday isn't part of whichever plan governs this date
      const dup=sessions.some(function(s){ return s.studentId===student.id && toKey(s.date)===dateKey && s.start===slot.start && s.status!=='cancelled'; });
      if(dup) return;
      if(studentOverlapClash(student.id, dateKey, slot.start, student.duration, null)) return;
      const pinnedPodId=studentAssignedPodOn(student.id, date); // front desk's standing Pod pin, if any (else auto-assign)
      const podId=pickBestPod(weekday, dateKey, slot.start, student.duration, student.year, pinnedPodId);
      if(!podId) return;
      const cov=podCoverageBoundary(podId, weekday, slot.start, student.duration, date);
      const recSess={id:newId()||('sess'+(nextSessionId++)), studentId:student.id, podId, instructorId:cov.instructorId, date, start:slot.start, duration:student.duration, status:'scheduled', bookedBy:'staff', creditId:null, recurring:true};
      sessions.push(recSess);
      dbWrite('pre-booking a standing session', function(){ return supabaseClient.from('sessions').insert({
        id:recSess.id, student_id:recSess.studentId, pod_id:recSess.podId, instructor_id:recSess.instructorId,
        the_date:toKey(recSess.date), start_min:recSess.start, duration:recSess.duration, status:recSess.status,
        booked_by:recSess.bookedBy, credit_id:recSess.creditId, is_recurring:true
      }); });
      created++;
    });
  }
  return created;
}
function regenerateAllRecurring(){
  let total=0;
  students.forEach(function(s){ total+=generateRecurringSessions(s, HORIZON_WEEKS); });
  return total;
}
function recurringSummary(student){
  if(!student.recurring || student.recurring.length===0) return 'Not set';
  return student.recurring.map(function(r){ return r.weekday+' '+minToLabel(r.start); }).join(', ');
}

/* ---------- automatic school-year promotion ---------- */
function applyPromotions(){
  const idx=schoolYearIndex(simNow());
  let promoted=0;
  students.forEach(function(s){
    const target=Math.min(YEAR_CAP, s.baseYear + Math.max(0, idx - s.yearBaseline));
    if(s.year!==target){ s.year=target; promoted++; }
  });
  return promoted;
}

/* ---------- actions ---------- */
function setRole(r){ state.role=r; state.booking=null; state.parentBookingCreditId=null; render(); }

function advanceClock(days){
  state.offsetDays += days;
  const promoted=applyPromotions();
  applyPlanChanges();
  regenerateAllRecurring();
  if(promoted>0) toast(promoted+' student'+(promoted===1?'':'s')+' promoted to their next school year.');
  else render();
}

function openBooking(podId, dateKey){
  const d = new Date(dateKey);
  if(d < new Date(toKey(simNow()))) return; // can't book into the past
  const dur=90;
  state.booking={podId, dateKey};
  state.bookingForm={studentId:'', duration:dur, start:possibleStarts(dur)[0], overrideOk:false};
  render();
}
function closeBooking(){ state.booking=null; render(); }

function setBookingStudent(sid){
  state.bookingForm.studentId=sid;
  if(sid){
    const dur=findStudent(sid).duration;
    state.bookingForm.duration=dur;
    const starts=possibleStarts(dur);
    if(!starts.includes(state.bookingForm.start)) state.bookingForm.start=starts[0];
  }

}
function setBookingDuration(v){
  state.bookingForm.duration=Number(v);
  const starts=possibleStarts(state.bookingForm.duration);
  if(!starts.includes(state.bookingForm.start)) state.bookingForm.start=starts[0];
  state.bookingForm.overrideOk=false;
  render();
}
function setBookingStart(v){ state.bookingForm.start=Number(v); state.bookingForm.overrideOk=false; render(); }
function toggleOverride(){ state.bookingForm.overrideOk=!state.bookingForm.overrideOk; render(); }

function confirmBooking(){
  const b=state.booking; const f=state.bookingForm;
  if(!f.studentId || f.start==null) return;
  const dateKey=b.dateKey, date=new Date(dateKey);
  const student=findStudent(f.studentId);
  const pod=findPod(b.podId);
  const weekday=WEEKDAY_KEYS[(date.getDay()+6)%7];
  const end=f.start+f.duration;

  if(studentOverlapClash(student.id, dateKey, f.start, f.duration, null)){
    toast('Blocked — '+student.name+' already has an overlapping session that day.');
    return;
  }

  const seg1=podCoverageBoundary(pod.id, weekday, f.start, f.duration, date);
  const totallyUnassigned = !seg1.instructorId;
  const instr1 = seg1.instructorId? findInstructor(seg1.instructorId) : null;
  const fullyCovered = !totallyUnassigned && seg1.boundary>=end;
  const needsHandoff = !totallyUnassigned && !fullyCovered;
  let seg2=null, instr2=null;
  if(needsHandoff){
    seg2=podCoverageBoundary(pod.id, weekday, seg1.boundary, end-seg1.boundary, date);
    if(seg2.instructorId){ instr2=findInstructor(seg2.instructorId); }
  }
  // Which years an instructor is "best suited" for (5.3) is a preference, not a requirement —
  // every instructor can actually teach any year — so it never factors into whether an override is
  // needed. An override is only ever about actual staffing: nobody assigned at all, or a handoff
  // that runs out before the session ends.
  const gapAfterHandoff = needsHandoff && (!seg2.instructorId || seg2.boundary<end);
  const needsOverride = totallyUnassigned || (needsHandoff && gapAfterHandoff);

  if(needsOverride && !f.overrideOk) return; // needs explicit override checkbox

  const cap=podCapacity(pod.id);
  const wouldBePeak = peakConcurrency(pod.id, dateKey, {start:f.start, duration:f.duration});
  if(wouldBePeak > cap){
    toast('Blocked — this would put '+pod.name+' over capacity ('+wouldBePeak+'/'+cap+').');
    return;
  }

  const instructorId2 = (needsHandoff && seg2 && seg2.instructorId && !gapAfterHandoff)? seg2.instructorId : null;
  const handoff = instructorId2? seg1.boundary : null;

  const newSess={id:newId()||('sess'+(nextSessionId++)), studentId:student.id, podId:pod.id, instructorId: seg1.instructorId, instructorId2, handoff, date, start:f.start, duration:f.duration, status:'scheduled', bookedBy:'staff', creditId:null};
  sessions.push(newSess);
  dbWrite('booking a session', function(){ return supabaseClient.from('sessions').insert({
    id:newSess.id, student_id:newSess.studentId, pod_id:newSess.podId, instructor_id:newSess.instructorId,
    instructor_id_2:newSess.instructorId2, handoff_min:newSess.handoff, the_date:toKey(newSess.date),
    start_min:newSess.start, duration:newSess.duration, status:newSess.status, booked_by:newSess.bookedBy, credit_id:newSess.creditId
  }); });
  const handoffNote = instructorId2? (' with a handoff to '+findInstructor(instructorId2).name+' at '+minToLabel(handoff)) : '';
  const withNote = seg1.instructorId? (' with '+instr1.name) : '';
  toast(student.name+' booked into '+pod.name+withNote+', '+fmtShort(date)+' '+rangeLabel(f.start,f.duration)+handoffNote+'.');
  state.booking=null;
  render();
}

function markStatus(sessionId, status){
  const sess=findSession(sessionId);
  sess.status=status;
  dbWrite('updating attendance', function(){ return supabaseClient.from('sessions').update({status}).eq('id', sess.id); });
  if(status==='no-show'){
    const issued=sess.date;
    const expiry=addMonths(issued,3);
    const c={id:newId()||('c'+(nextCreditId++)), studentId:sess.studentId, issuedDate:issued, expiryDate:expiry, status:'available', redeemedSessionId:null, warningSent:false, source:'no-show', note:''};
    credits.push(c);
    dbWrite('issuing a make-up credit', function(){ return supabaseClient.from('credits').insert({
      id:c.id, student_id:c.studentId, issued_date:toKey(c.issuedDate), expiry_date:toKey(c.expiryDate),
      status:c.status, redeemed_session_id:c.redeemedSessionId, warning_sent:c.warningSent, source:c.source, note:c.note

// Whether it's already too late to request a make-up for today (5.7) — past the 10:00am
// same-day cutoff. Split out from openSlotsForCredit so the picker can explain a missing "today"
// rather than just silently starting the list at tomorrow.
function sameDayMakeUpCutoffPassed(){ return nowMinutesOfDay()>=MAKEUP_SAME_DAY_CUTOFF; }
function openSlotsForCredit(credit){
  // Parents choose a date + time only — never which Pod or instructor, and never a duration
  // (that's fixed to the student's usual session length). The system auto-assigns a specific
  // qualified, available, under-capacity Pod behind the scenes (see pickBestPod).
  const student=findStudent(credit.studentId);
  const duration=student.duration;
  const now=simNow();
  const todayKey=toKey(now);
  const sameDayCutoffPassed=sameDayMakeUpCutoffPassed();
  const opts=[];
  [0,1].forEach(function(weekOff){
    const monday=addDays(getMonday(now), weekOff*7);
    for(let i=0;i<5;i++){
      const date=addDays(monday,i);
      if(date < new Date(todayKey)) continue;
      if(sameDayCutoffPassed && toKey(date)===todayKey) continue; // past 10am — today's no longer offered
      const weekday=WEEKDAY_KEYS[i];
      const dateKey=toKey(date);
      possibleStarts(duration).forEach(function(start){
        if(studentOverlapClash(student.id, dateKey, start, duration, null)) return;
        const podId=pickBestPod(weekday, dateKey, start, duration, student.year);
        if(podId){
          const cov=podCoverageBoundary(podId, weekday, start, duration, date);
          opts.push({date, start, duration, podId, instructorId:cov.instructorId});
        }
      });
    }
  });
  opts.sort(function(a,b){ return toKey(a.date)===toKey(b.date) ? a.start-b.start : new Date(a.date)-new Date(b.date); });
  return opts;
}

function bookSlot(creditId, dateKey, start, duration, podId, instructorId){

/* ---------- availability lookup (front-desk sales reference) ---------- */
// Open seats in a given window, summed across every Pod with an assigned instructor covering that
// window — the number front desk can quote straight to a parent on a call. Every instructor can
// teach any year (5.3), so unlike an earlier version of this tool, a seat counts here regardless of
// the student's year — "best suited for" only ever affects which Pod auto-assignment prefers
// (5.8), never whether front desk can quote a family a seat. Also reports how many Pods are
// staffed at all in that window, so "0 seats, nobody's on" reads differently from "0 seats, fully
// booked." (The `year` parameter is accepted but no longer filters — kept for callers that still
// pass one.)
function openSeatsAt(dateKey, weekday, blockStart, year, blockLen){
  let seats=0, staffed=0;
  const blockEnd=blockStart+blockLen;
  const date=new Date(dateKey);
  pods.forEach(function(pod){
    const cov=podCoverageBoundary(pod.id, weekday, blockStart, blockLen, date);
    if(!cov.instructorId) return;
    const winStart=blockStart, winEnd=Math.min(blockEnd, cov.boundary);
    if(winEnd<=winStart) return;
    staffed++;
    const peak=peakInWindow(pod.id, dateKey, winStart, winEnd);
    seats += Math.max(0, podCapacity(pod.id)-peak);
  });
  return {seats, staffed};
}
function setAvailWeek(w){ state.availWeekOffset=w; render(); }

/* ---------- waitlist for full day/time slots (5.17) ---------- */
// The soonest upcoming date that falls on a given weekday, from a given date (inclusive) — used to
// pick one concrete, checkable occurrence for a weekday+time waitlist entry.
function nextDateForWeekday(fromDate, weekday){
  let d=new Date(fromDate);
  while(WEEKDAY_KEYS[(d.getDay()+6)%7]!==weekday){ d=addDays(d,1); }
  return d;
}
// Same peak-headcount calculation as peakConcurrency, but can also account for seats already
// virtually claimed by other waitlist entries in the same first-in-first-served pass (see
// waitlistClaimsBefore) — so two families waiting for the same Pod/date don't both get told the
// same single opening is theirs.
function peakConcurrencyWithClaims(podId, dateKey, extra, claims){
  const list = sessionsForDay(podId, dateKey).map(function(s){ return {start:s.start, end:s.start+s.duration}; });
  (claims||[]).forEach(function(c){
    if(c.podId===podId && c.dateKey===dateKey) list.push({start:c.start, end:c.start+c.duration});
  });
  if(extra) list.push({start:extra.start, end:extra.start+extra.duration});
  if(list.length===0) return 0;
  const events=[];
  list.forEach(function(iv){ events.push([iv.start,1]); events.push([iv.end,-1]); });
  events.sort(function(a,b){ return a[0]-b[0] || a[1]-b[1]; });
  let cur=0, peak=0;
  events.forEach(function(e){ cur+=e[1]; if(cur>peak) peak=cur; });
  return peak;
}
// Same auto-pick logic as pickBestPod's no-preferred-Pod branch (5.8) — full single-instructor
// coverage, under capacity, preferring an instructor best suited for the year (5.3, never a hard
// requirement) — but capacity also counts any seats already virtually claimed by earlier waitlist
// entries in this pass. Kept as its own function rather than changing pickBestPod itself, since
// pickBestPod is relied on elsewhere (standing generation, 5.8) and has no reason to know about
// the waitlist.
function pickBestPodWithClaims(weekday, dateKey, start, duration, year, claims){
  const date=new Date(dateKey);
  let best=null, bestSuited=-1, bestSameYear=-1, bestRoom=-1;
  pods.forEach(function(pod){
    const cov=podCoverageBoundary(pod.id, weekday, start, duration, date);
    if(!cov.instructorId || cov.boundary < start+duration) return;
    const instr=findInstructor(cov.instructorId);
    const cap=podCapacity(pod.id);
    const wouldBePeak=peakConcurrencyWithClaims(pod.id, dateKey, {start, duration}, claims);
    if(wouldBePeak>cap) return;
    const room=cap-wouldBePeak;
    const suited=instructorSuitedFor(instr, year)? 1 : 0;
    const sameYear=sameYearCount(pod.id, dateKey, start, duration, year);
    if(suited>bestSuited || (suited===bestSuited && (sameYear>bestSameYear || (sameYear===bestSameYear && room>bestRoom)))){
      best=pod.id; bestSuited=suited; bestSameYear=sameYear; bestRoom=room;
    }
  });
  return best;
}
// First-in-first-served (5.17): every waiting entry strictly older (by dateAdded) than this one
// gets to "claim" its seat first. Walks the queue oldest-first, and for each entry ahead of this
// one that currently resolves to a real Pod, reserves that Pod/date/time so a later entry can't
// also be told the exact same opening is theirs.
function waitlistClaimsBefore(entry){
  const claims=[];
  const waiting=waitlist.filter(function(w){ return w.status==='waiting'; })
    .sort(function(a,b){ return new Date(a.dateAdded)-new Date(b.dateAdded); });
  for(let i=0;i<waiting.length;i++){
    const w=waiting[i];
    if(entry && w.id===entry.id) break; // reached this entry's own place in the queue
    const year = w.studentId? findStudent(w.studentId).year : w.year;
    const dateKey = toKey(nextDateForWeekday(simNow(), w.weekday));
    const podId = pickBestPodWithClaims(w.weekday, dateKey, w.start, w.duration, year, claims);
    if(podId) claims.push({podId, dateKey, start:w.start, duration:w.duration});
  }
  return claims;
}
// Is there actually a seat for this entry right now, once everyone who's been waiting longer for
// an overlapping slot has first claim on whatever's open? Reuses the same coverage/qualification/
// capacity check standing bookings rely on (5.8), against the soonest upcoming occurrence of the
// entry's weekday. An existing student's CURRENT year is used (so a promotion, 5.9, is reflected
// automatically); a new enquiry uses whatever year was logged at the time they were added.
function waitlistOpenSeat(entry){
  const year = entry.studentId? findStudent(entry.studentId).year : entry.year;
  const date = nextDateForWeekday(simNow(), entry.weekday);
  const claims = waitlistClaimsBefore(entry);
  const podId = pickBestPodWithClaims(entry.weekday, toKey(date), entry.start, entry.duration, year, claims);
  return podId? {podId, date} : null;
}
// For the panel only: would this entry have a seat if the queue were ignored? Used to tell "someone
// who's been waiting longer has first claim on this one" apart from "nothing is open here at all."
function waitlistWouldFitIgnoringQueue(entry){
  const year = entry.studentId? findStudent(entry.studentId).year : entry.year;
  const dateKey = toKey(nextDateForWeekday(simNow(), entry.weekday));
  return !!pickBestPodWithClaims(entry.weekday, dateKey, entry.start, entry.duration, year, []);
}

/* ---------- render: shell ---------- */
// Every state change re-renders by rebuilding the whole #app innerHTML from scratch (no virtual
// DOM/diffing) — simple and reliable, but naively doing that on every keystroke would tear down
// and recreate the very <input> the person is typing into, kicking focus out and forcing them to
// click back in before every single character. To avoid that: note which field (and cursor
// position) was focused, rebuild the HTML as usual, then find the same field in the new markup —
// by its position among the other text fields in the same modal, since these forms don't carry
// individual ids — and restore focus/cursor there. A plain click, dropdown change, or button press
// has nothing focused that this applies to, so it's a no-op the rest of the time.
function render(){
  const app=document.getElementById('app');
  const active = (typeof document!=='undefined') ? document.activeElement : null;
  // Only text/search/tel/password/textarea reliably support reading/setting a cursor position in
  // every browser — email/number/date inputs throw or silently misbehave on selectionStart in
  // several browsers (observed: cursor resets to 0 on every keystroke, so each new character gets
  // inserted at the very front instead of where it was typed — e.g. typing "send" comes out
  // "dnes"). Those types still get their focus restored below, just not a cursor position.
  const focusableTypes=['text','email','password','number','search','tel','date'];
  const selectableTypes=['text','search','tel','password'];
  const isTextField = active && (active.tagName==='TEXTAREA' || (active.tagName==='INPUT' && focusableTypes.indexOf(active.type)>=0));
  const canSelect = active && (active.tagName==='TEXTAREA' || (active.tagName==='INPUT' && selectableTypes.indexOf(active.type)>=0));
  let restore=null;
  if(isTextField && app.contains(active)){
    const scope = (active.closest && active.closest('.modal')) || app;
    const fields = Array.prototype.slice.call(scope.querySelectorAll('input, textarea'));
    const idx = fields.indexOf(active);
    if(idx>=0){
      restore={ inModal: scope!==app, idx:idx, start:null, end:null };
      if(canSelect){
        try{ restore.start=active.selectionStart; restore.end=active.selectionEnd; }catch(e){}
      }
    }
  }
  app.innerHTML = renderTop() + renderTabs() + renderRole() + (state.toast? '<div class="toast">'+state.toast+'</div>':'') + renderFooter();
  if(restore){
    const scope = restore.inModal ? app.querySelector('.modal') : app;
    const el = scope && scope.querySelectorAll('input, textarea')[restore.idx];
    if(el){
      el.focus();
      if(restore.start!=null && restore.end!=null && typeof el.setSelectionRange==='function'){
        try{ el.setSelectionRange(restore.start, restore.end); }catch(e){}
      }
    }
  }
}

function podCoverageSummary(podId, weekday, date){
  const blocks=podBlocksForDay(podId, weekday);
  if(blocks.length===0) return 'Unassigned';
  return blocks.map(function(b){
    const instrId=blockInstructorOn(b, date);
    return (instrId? findInstructor(instrId).name : 'Unassigned')+' '+rangeLabel(b.start,b.end-b.start);
  }).join(' → ');
}

// Collapse state for front-desk sections lives on `state` (so it survives the full-page
// re-render every action triggers) but isn't persisted anywhere beyond the current browser tab —
// each section just remembers whether it's open or closed for the rest of this visit.
function sectionCollapsed(id){ return !!(state.collapsedSections && state.collapsedSections[id]); }
function toggleSection(id){
  state.collapsedSections = state.collapsedSections || {};
  state.collapsedSections[id] = !state.collapsedSections[id];
  render();
}
// Builds the opening "<div class='card'><div class='card-head'><h2>...</h2>" markup shared by
// every front-desk section, with the collapse toggle wired onto the title itself (not the whole
// header row) so any action buttons placed in extraHeaderHtml stay independently clickable.
function sectionOpen(id, title, extraHeaderHtml){
  return '<div class="card'+(sectionCollapsed(id)?' collapsed':'')+'">'
    +'<div class="card-head"><h2 class="sec-toggle" onclick="toggleSection(\''+id+'\')"><span class="chev">▾</span>'+title+'</h2>'
    +(extraHeaderHtml||'')+'</div>';
}

function renderStaff(){
  const now=simNow();
  const monday=addDays(getMonday(now), state.weekOffset*7);
  const weekDates=[0,1,2,3,4].map(function(i){ return addDays(monday,i); });
  let dayKey=state.selectedDayKey;
  if(!dayKey || !weekDates.some(function(d){ return toKey(d)===dayKey; })){
    const todayInWeek=weekDates.find(function(d){ return sameDay(d,now); });
    dayKey = todayInWeek? toKey(todayInWeek) : toKey(weekDates[0]);
  }
  const selectedDate=new Date(dayKey);
  const weekday=WEEKDAY_KEYS[(selectedDate.getDay()+6)%7];
  const isPast = selectedDate < new Date(toKey(now));

  let html=renderCoverageRequestsPanel();
  html+=renderCheckedInPanel();
  html+=renderAvailabilityLookup();
  html+=renderWaitlistPanel();

  html+=sectionOpen('schedule','Schedule',
      '<div style="display:flex;gap:6px">'
        +'<button class="btn sm'+(state.weekOffset===0?' primary':'')+'" onclick="setWeek(0)">This week</button>'
        +'<button class="btn sm'+(state.weekOffset===1?' primary':'')+'" onclick="setWeek(1)">Next week</button>'
      +'</div>');
  html+='<p>Up to 6 group Pods, plus a Singles pod for 1:1 work. Assign an instructor to each Pod for the day (they can hand off to another instructor partway through); students are then booked into the Pod, not directly to a person. Standing weekly bookings pre-fill this calendar automatically from each student\'s set schedule (see Students below).</p>';
  html+='<div class="daypicker">'+weekDates.map(function(d){
    const k=toKey(d);
    return '<button class="daybtn'+(k===dayKey?' active':'')+'" onclick="selectDay(\''+k+'\')">'+WEEKDAY_KEYS[(d.getDay()+6)%7]+'<span class="d2">'+d.toLocaleDateString('en-AU',{month:'short',day:'numeric'})+'</span></button>';
  }).join('')+'</div>';

  pods.forEach(function(pod){
    const roster=sessionsForDay(pod.id, dayKey).slice().sort(function(a,b){ return a.start-b.start; });
    const peak=peakConcurrency(pod.id, dayKey);
    const cap=podCapacity(pod.id);
    const coverage=podCoverageSummary(pod.id, weekday, selectedDate);
    html+='<div class="pod-card'+(pod.name==='Singles'?' singles':'')+'">';
    html+='<div class="card-head"><div><h3>'+pod.name+'</h3><span class="small muted">'+coverage+'</span></div>'
      +'<div style="display:flex;align-items:center;gap:8px">'
        +'<span class="badge '+(peak>=cap?'full':'available')+'">'+peak+'/'+cap+'</span>'
        +'<button class="btn sm ghost" onclick="openPodAssignForm(\''+pod.id+'\',\''+weekday+'\')">Assign</button>'
        +(isPast? '' : '<button class="btn sm primary" onclick="openBooking(\''+pod.id+'\',\''+dayKey+'\')">+ Book a session</button>')
      +'</div></div>';
    if(roster.length===0){ html+='<div class="empty-note">Nothing booked yet.</div>'; }
    roster.forEach(function(sess){
      const student=findStudent(sess.studentId);
      const actualNote = sess.actualStart!=null? ' · checked in '+minToLabel(sess.actualStart)+', ran to '+minToLabel(sess.actualEnd)+(sess.checkInOffset>LATE_GRACE_MIN? ' (capped)':'') : '';
      let handoffNote='';
      if(sess.instructorId2){
        handoffNote = ' · '+findInstructor(sess.instructorId).name+' until '+minToLabel(sess.handoff)+', then '+findInstructor(sess.instructorId2).name;
      } else if(sess.instructorId){
        handoffNote = ' · with '+findInstructor(sess.instructorId).name;
      }
      html+='<div class="sess-chip status-'+sess.status+(sess.instructorId2?' handoff':'')+'">'
        +'<div><span class="time">'+rangeLabel(sess.start,sess.duration)+'</span> · <b>'+student.name+'</b> <span class="small muted">'+yearLabel(student.year)+' · '+sess.status+(sess.bookedBy==='parent'?' · 👪 parent':'')+(sess.recurring?' · standing':'')+handoffNote+actualNote+'</span></div>';
      let actions='';
      if(sess.status==='scheduled' && toKey(sess.date)<=toKey(now)){
        actions+='<button class="btn sm success" onclick="openCheckIn(\''+sess.id+'\')">✓ Check in</button>'
          +'<button class="btn sm danger" onclick="markStatus(\''+sess.id+'\',\'no-show\')">No-show</button>';
      } else if(sess.status==='scheduled'){
        actions+='<button class="btn sm ghost" onclick="markStatus(\''+sess.id+'\',\'cancelled\')">Cancel</button>';
      }
      if(sess.status==='scheduled' || sess.status==='attended'){
        actions+='<button class="btn sm ghost" onclick="openMoveForm(\''+sess.id+'\')">Move pod</button>';
      }
      if(actions) html+='<div class="actions">'+actions+'</div>';
      html+='</div>';
    });
    html+='</div>';
  });

  html+='</div>'; // closes the Schedule card opened by sectionOpen('schedule', ...) above — the pod
                   // cards just rendered are the last thing that belongs inside it. This was
                   // previously left unclosed (harmless before the collapsible-sections feature,
                   // since it just meant later cards were technically-invalid nested children
                   // rather than siblings) — now that collapsing hides a card's direct children,
                   // that missing tag was making "Schedule" swallow everything after it.

  html+=renderBookingModal();
  html+=renderPodAssignModal();
  html+=renderCheckInModal();
  html+=renderMoveModal();
  html+=renderWaitlistModal();
  html+=renderStudentsPanel();
  html+=renderInstructorsPanel();
  html+=renderParentsPanel();
  html+=renderCreditsReport();
  return html;
}

// A student can be checked in for right now, or backdated earlier (catching up on one missed
// earlier in the shift), but not meaningfully into the future (5.29, per Allie) — so for a session
// dated TODAY, the latest selectable arrival is (effectively) the actual current clock; for one
// dated before today, "the future" isn't a meaningful idea (the whole day is already over), so the
// full center-hours range stays open, same as ever.
//
// "Effectively", because flooring strictly to the real clock (the original 5.29 behaviour) meant a
// student walking in at 3:58 always got rounded DOWN to 3:55 even though 4:00 — only two minutes
// away — was the genuinely closer 5-minute mark on the picker's own grid. Revised Sept 2026 per
// Allie: "round to the nearest 5 minutes, even if it's ahead of time, but never more than 3 minutes
// into the future." Rounding whole minutes to the nearest multiple of EXIT_STEP can only ever land
// up to 2 minutes ahead of the real clock, so the +3 ceiling below is a safety margin rather than
// something normal rounding will actually hit.
function checkInMaxArrival(sess){
  if(toKey(sess.date)!==toKey(simNow())) return CENTER_CLOSE;
  const now=nowMinutesOfDay();
  const nearestFive=Math.round(now/EXIT_STEP)*EXIT_STEP;
  return Math.min(nearestFive, now+3);
}
// The arrival dropdown's actual option list — CHECKIN_TIME_OPTIONS trimmed to whatever's not in the
// future per checkInMaxArrival() above. Falls back to just the center's opening time in the (very
// unlikely) case check-in is happening before the center has even opened for the day, so the list
// is never empty.
function checkInArrivalOptions(sess){
  const cap=checkInMaxArrival(sess);
  const options=CHECKIN_TIME_OPTIONS.filter(function(t){ return t<=cap; });
  return options.length? options : [CHECKIN_TIME_OPTIONS[0]];
}
// Defaults the arrival dropdown to whichever CHECKIN_TIME_OPTIONS value is closest to the real
// current clock (5.24, revised 5.27 to use an absolute time rather than an offset from this
// session's own scheduled start — see the comment on CHECKIN_TIME_OPTIONS above for why) — front
// desk is checking someone in AS they arrive, so "on time" is a poor default the moment that's not
// true; this saves having to manually correct it on every late (or early) check-in. Still fully
// overridable, down to any earlier time, but never a later one (5.29).
// Quick check-in/out student search (Sept 2026, per Allie: "a search-bar that suggests the closest
// matched student name, upon selecting it, it once again gives the option to change check in or
// check out time, as well as the pod they'll be sitting at") — matches only against today's own
// roster, and only the two states a quick action actually applies to: still to arrive (routes to
// Check-in, which already has its own Pod picker), or already here and not yet checked out (routes
// to Check-out). No-show/excused/cancelled/already-checked-out sessions are excluded — nothing left
// to do for those from this box.
function checkInSearchCandidates(query){
  const q=String(query||'').trim().toLowerCase();
  if(!q) return [];
  const todayKey=toKey(simNow());
  return sessions.filter(function(s){
    if(toKey(s.date)!==todayKey) return false;
    if(s.status==='attended' && s.checkedOut) return false;
    if(s.status!=='attended' && s.status!=='scheduled') return false;
    const student=findStudent(s.studentId);
    return student && student.name.toLowerCase().indexOf(q)!==-1;
  }).map(function(s){
    return {sess:s, name:findStudent(s.studentId).name};
  }).sort(function(a,b){
    const an=a.name.toLowerCase(), bn=b.name.toLowerCase();
    const aStarts=an.indexOf(q)===0, bStarts=bn.indexOf(q)===0;
    if(aStarts!==bStarts) return aStarts? -1 : 1;
    return a.name.localeCompare(b.name, undefined, {sensitivity:'base'});
  }).slice(0,8);
}
function setCheckInSearchQuery(v){ state.checkInSearchQuery=v; render(); }
// Picking a suggestion goes straight to whichever modal actually applies right now — Check-in
// (Pod + arrival time) if they haven't arrived yet, Check-out (exit time) if they're already here —
// instead of making front desk scroll the Schedule list or Pod seating section to find that same row.
function selectCheckInSearchResult(sessionId){
  const sess=findSession(sessionId);
  state.checkInSearchQuery='';
  if(!sess){ render(); return; }
  if(sess.status==='attended' && !sess.checkedOut){ openCheckOut(sessionId); }
  else { openCheckIn(sessionId); }
}
function renderCheckInSearchPanel(){
  const q=state.checkInSearchQuery||'';
  const results=checkInSearchCandidates(q);
  let html='<div class="card" style="margin-bottom:12px">';
  html+='<input type="text" placeholder="Check a student in or out — start typing their name…" value="'+q.replace(/"/g,'&quot;')+'" oninput="setCheckInSearchQuery(this.value)" style="margin-bottom:0"/>';
  if(q.trim()){
    if(results.length){
      html+='<div style="margin-top:8px;display:flex;flex-direction:column;gap:4px">'
        +results.map(function(r){
          const s=r.sess;
          const alreadyHere=s.status==='attended' && !s.checkedOut;
          const pod=findPod(s.podId);
          const where = s.online? ('Online'+(findInstructor(s.instructorId)? ' — '+findInstructor(s.instructorId).name : '')) : (pod? pod.name : 'Unassigned');
          const actionBadge = alreadyHere? '<span class="badge soon">Check out</span>' : '<span class="badge available">Check in</span>';
          // Marking someone absent only makes sense before they've actually arrived — once alreadyHere,
          // the only sensible action left is checking them back out (Sept 2026, per Allie: buttons for
          // "Issue Make-up Credit" and "Not in Today" right next to the check-in button in this same
          // dropdown, same two actions the Schedule list's own row buttons already offer as
          // Excused/No-show — see markStatus() — just reachable without leaving the search box).
          const extraActions = alreadyHere? '' :
            '<button class="btn sm ghost" title="They let us know in advance — issues a make-up credit" onclick="markStatus(\''+s.id+'\',\'excused\')">Issue Make-up Credit</button>'
            +'<button class="btn sm danger" title="No word from them — no make-up credit" onclick="markStatus(\''+s.id+'\',\'no-show\')">Not in Today</button>';
          return '<div style="display:flex;gap:4px;align-items:stretch">'
            +'<button class="btn sm ghost" style="text-align:left;justify-content:flex-start;flex:1;min-width:0" onclick="selectCheckInSearchResult(\''+s.id+'\')">'
              +'<b>'+r.name+'</b> · '+rangeLabel(s.start,s.duration)+' · '+where+' &nbsp; '+actionBadge
            +'</button>'
            +extraActions
          +'</div>';
        }).join('')
        +'</div>';
    } else {
      html+='<div class="empty-note" style="margin-top:8px;padding-bottom:0">No match among today\'s students still to arrive or already checked in.</div>';
    }
  }
  html+='</div>';
  return html;
}

function openCheckIn(sessionId){
  const sess=findSession(sessionId);
  // Belt-and-suspenders alongside the row-action button already being hidden for a future date
  // (renderStaff() only shows "Check in" when toKey(sess.date)<=toKey(now)) — this is the actual
  // gate, so check-in can never be triggered for a session that hasn't happened yet no matter how
  // it's reached.
  if(toKey(sess.date)>toKey(simNow())){
    toast("Can't check in "+findStudent(sess.studentId).name+" yet — that session is on "+fmtShort(sess.date)+', a future date.');
    return;
  }
  const arrival=nearestOption(checkInArrivalOptions(sess), nowMinutesOfDay());
  // If the student walks in with nowhere chosen yet (booked as Unassigned, or auto-assignment never
  // found one), suggest somewhere right away — same "pre-filled, editable" pattern used everywhere
  // else — so front desk isn't forced to check in first and go hunt them down in the Schedule list
  // afterward just to pick a Pod. Silent (no toast) since nothing has been confirmed yet; the Pod
  // field below is still freely editable before Confirm. Checks `!sess.online` too (not just
  // `!sess.podId`) — an already-online session (booked or pinned that way) also has a null podId,
  // and must NOT get silently reassigned onto a physical Pod here (5.32 fix).
  if(!sess.podId && !sess.online){
    const student=findStudent(sess.studentId);
    const weekday=WEEKDAY_KEYS[(sess.date.getDay()+6)%7];
    const onlineInstructorId=studentAssignedOnlineInstructorOn(student.id, sess.date);
    if(onlineInstructorId){
      const eligible=instructorsOnShift(weekday, sess.start, sess.duration, sess.date).some(function(i){ return i.id===onlineInstructorId; })
        && !instructorOnlineBlocked(onlineInstructorId, toKey(sess.date), sess.start, sess.duration, sess.id);
      if(eligible) setSessionOnline(sessionId, onlineInstructorId);
    } else {
      const suggested=pickBestPod(weekday, toKey(sess.date), sess.start, sess.duration, student.year, studentAssignedPodOn(student.id, sess.date));
      if(suggested) movePodSession(sessionId, suggested);
    }
  }
  state.checkIn={sessionId, arrival, exitTime:autoExitTime(sess, arrival-sess.start)};
  render();
}
function closeCheckIn(){ state.checkIn=null; render(); }
function setCheckInArrival(v){
  const sess=findSession(state.checkIn.sessionId);
  // Re-clamped against checkInArrivalOptions() rather than trusted as-is — belt-and-suspenders
  // against a value that was valid when the dropdown rendered but no longer is (the clock ticked
  // forward past it while the modal sat open); nearestOption() is a no-op whenever v is still one
  // of the allowed options, which is every ordinary click.
  state.checkIn.arrival=nearestOption(checkInArrivalOptions(sess), Number(v));
  state.checkIn.exitTime=autoExitTime(sess, state.checkIn.arrival-sess.start);
  render();
}
function setCheckInExit(v){ state.checkIn.exitTime=Number(v); render(); }

// The actual check-in write, factored out of confirmCheckIn() so the "they're here right now" quick
// option on a same-day booking (confirmBooking(), below) can apply the exact same effect — status,
// actual start/end, checkInOffset, and the parent notification — without duplicating it (Sept 2026,
// per Allie: "i need an option to add a student on a day when they show up unexpectedly").
// deferWrite (Sept 2026, per the checkInNewBookingNow() fix above): when true, local state is still
// applied immediately as always, but the remote write is NOT fired here — it's handed back for the
// caller to chain onto something else first (a new session's own insert, so the UPDATE can never
// reach Postgres before the row it's matching against exists). Every other, pre-existing caller
// (confirmCheckIn — the session it's checking in already exists on the server) leaves this off and
// keeps firing immediately, exactly as before.
function applyCheckIn(sess, arrival, exitTime, deferWrite){
  const offset=arrival-sess.start;
  sess.checkInOffset=offset;
  sess.actualStart=arrival;
  sess.actualEnd=exitTime;
  sess.status='attended';
  const write=function(){
    return supabaseClient.from('sessions').update({
      check_in_offset:sess.checkInOffset, actual_start_min:sess.actualStart, actual_end_min:sess.actualEnd, status:sess.status
    }).eq('id', sess.id).then(function(r){ if(!r || !r.error) notifyParentOfCheckIn(sess.id, sess.actualStart, sess.actualEnd); return r; });
  };
  if(deferWrite) return write;
  dbWrite('checking in', write);
  return offset;
}
function confirmCheckIn(){
  const sess=findSession(state.checkIn.sessionId);
  if(toKey(sess.date)>toKey(simNow())){
    toast("Can't check in "+findStudent(sess.studentId).name+" yet — that session is on "+fmtShort(sess.date)+', a future date.');
    state.checkIn=null;
    render();
    return;
  }
  // Same belt-and-suspenders re-clamp as setCheckInArrival() — guards the rare case where the
  // modal was left open long enough that the arrival it was last set to is now later than "right
  // now" (only possible for a session dated today; checkInMaxArrival() never restricts a past date).
  state.checkIn.arrival=nearestOption(checkInArrivalOptions(sess), state.checkIn.arrival);
  const autoEnd=autoExitTime(sess, state.checkIn.arrival-sess.start);
  applyCheckIn(sess, state.checkIn.arrival, state.checkIn.exitTime);
  const adjusted = sess.actualEnd!==autoEnd;
  state.checkIn=null;
  if(adjusted){
    toast(findStudent(sess.studentId).name+' checked in — exit time set to '+minToLabel(sess.actualEnd)+' (usually would\'ve been '+minToLabel(autoEnd)+').');
  } else {
    toast(findStudent(sess.studentId).name+' checked in — running '+minToLabel(sess.actualStart)+'–'+minToLabel(sess.actualEnd)+'.');
  }
  render();
}

// Reverts an accidental check-in — front desk checked in the wrong student, or the right student
// against the wrong session. Puts the session back to exactly 'scheduled' and clears every
// check-in-specific field, so it's as if the check-in never happened: it drops back into the
// "still to arrive" half of its Pod's roster (see rosterTableHtml), ready to be checked in again,
// correctly, from scratch. Doesn't touch credits — check-in/out never consumes or issues one, so
// there's nothing to reverse there. Works regardless of whether the session's already been checked
// OUT too (undoing should still be possible if the mistake is only noticed after the fact).
function undoCheckIn(sessionId){
  const sess=findSession(sessionId);
  if(!sess || sess.status!=='attended') return;
  const student=findStudent(sess.studentId);
  if(!confirm('Undo '+student.name+'\'s check-in?\n\nThis puts the session back to "scheduled", as if it never happened — use this if the wrong student was checked in by mistake.')) return;
  sess.status='scheduled';
  sess.actualStart=null;
  sess.actualEnd=null;
  sess.checkInOffset=null;
  sess.checkedOut=false;
  dbWrite('undoing a check-in', function(){ return supabaseClient.from('sessions').update({
    status:'scheduled', actual_start_min:null, actual_end_min:null, check_in_offset:null, checked_out:false
  }).eq('id', sess.id); });
  toast(student.name+"'s check-in was undone.");
  render();
}

function openMoveForm(sessionId){ state.moveForm={sessionId, location:''}; render(); }
function closeMoveForm(){ state.moveForm=null; render(); }
function setMoveFormLocation(v){ state.moveForm.location=v; render(); }
function confirmMovePod(){
  const f=state.moveForm;
  if(!f || !f.location) return;
  const sess=findSession(f.sessionId);
  const student=findStudent(sess.studentId);
  if(String(f.location).indexOf('online:')===0){
    const result=setSessionOnline(f.sessionId, f.location.slice(7));
    if(!result.ok){ toast(result.error); return; }
    toast(result.oldPod? (student.name+' moved from '+result.oldPod.name+' to Online — '+result.instr.name+'.')
      : result.wasOnline? (student.name+' moved to Online — '+result.instr.name+'.')
      : (student.name+' assigned to Online — '+result.instr.name+'.'));
  } else {
    // No age/year check (removed Sept 2026) — capacity is the only thing movePodSession itself can
    // still say no to.
    const result=movePodSession(f.sessionId, f.location);
    if(!result.ok){ toast(result.error); return; }
    toast(result.oldPod? (student.name+' moved from '+result.oldPod.name+' to '+result.newPod.name+'.') : (student.name+' assigned to '+result.newPod.name+'.'));
  }
  state.moveForm=null;
  render();
}

function renderMoveModal(){
  const f=state.moveForm;
  if(!f) return '';
  const sess=findSession(f.sessionId);
  if(!sess) return '';
  const student=findStudent(sess.studentId);
  const currentPod=findPod(sess.podId);
  const currentOnlineInstr=sess.online? findInstructor(sess.instructorId) : null;
  const currentLabel = currentPod? currentPod.name : (currentOnlineInstr? 'Online — '+currentOnlineInstr.name : null);
  const dateKey=toKey(sess.date);
  const weekday=WEEKDAY_KEYS[(sess.date.getDay()+6)%7];
  let html='<div class="overlay" onclick="if(event.target===this) closeMoveForm()"><div class="modal">';
  html+='<h3>'+(currentLabel? 'Move '+student.name+' to a different Pod' : 'Assign '+student.name+' to a Pod')+'</h3>';
  html+='<p>'+(currentLabel? 'Currently in '+currentLabel : 'Currently unassigned — no Pod could be found for this session when it was created')+', '+rangeLabel(sess.start,sess.duration)+' on '+fmtShort(sess.date)+'. The instructor shown for this session updates automatically to whoever covers the new Pod at this time.</p>';
  const onlineChoices=instructorsOnShift(weekday, sess.start, sess.duration, sess.date).filter(function(instr){ return !(sess.online && instr.id===sess.instructorId); });
  // Same-day moves are allowed to exceed the 1:8 ratio (see movePodSession()) — this dropdown only
  // disables/marks a Pod "full" when the move would actually be refused, i.e. for a future date.
  const isTodayMove=dateKey===toKey(simNow());
  html+='<label>Move to</label><select onchange="setMoveFormLocation(this.value)"><option value="">Choose…</option>'
    +pods.filter(function(p){ return p.id!==sess.podId; }).map(function(p){
      const peak=peakConcurrency(p.id, dateKey, {start:sess.start, duration:sess.duration});
      const cap=podCapacity(p.id);
      const full=podCapacityBlocked(p.id, dateKey, {start:sess.start, duration:sess.duration});
      const disable=full && !isTodayMove;
      const label = full? (isTodayMove? ' — over capacity, allowed today':' — full') : ' — '+peak+'/'+cap+' after move';
      return '<option value="'+p.id+'"'+(p.id===f.location?' selected':'')+(disable?' disabled':'')+'>'+p.name+label+'</option>';
    }).join('')
    + (onlineChoices.length? ('<optgroup label="Online">'+onlineChoices.map(function(instr){
        const val='online:'+instr.id;
        const peak=instructorCombinedPeak(instr.id, dateKey, {start:sess.start, duration:sess.duration}, sess.id);
        const instrCap=combinedCapFor(instr.id);
        const full=peak>instrCap;
        return '<option value="'+val+'"'+(val===f.location?' selected':'')+(full?' disabled':'')+'>Online — '+instr.name+(full?' — full':' — '+peak+'/'+instrCap+' after move')+'</option>';
      }).join('')+'</optgroup>') : '')
  +'</select>';
  html+='<div style="display:flex;gap:8px;margin-top:14px;justify-content:flex-end">'
    +'<button class="btn ghost" onclick="closeMoveForm()">Cancel</button>'
    +'<button class="btn primary" '+(!f.location?'disabled':'')+' onclick="confirmMovePod()">'+(currentLabel?'Move':'Assign')+'</button>'
  +'</div>';
  html+='</div></div>';
  return html;
}

function setExitTime(sessionId, v){
  const sess=findSession(sessionId);
  sess.actualEnd=Number(v);
  dbWrite('updating exit time', function(){ return supabaseClient.from('sessions').update({actual_end_min:sess.actualEnd}).eq('id', sess.id); });
  toast(findStudent(sess.studentId).name+'\'s exit time updated to '+minToLabel(sess.actualEnd)+'.');
}
// Corrects the check-in time recorded for an already-checked-in student (5.23) — lives in the
// "Checked in today" table right next to exit time, which was already editable there; check-in
// time wasn't, so a mistaken arrival time (or front desk simply checking someone in late after
// they'd actually arrived on time) had no way to be fixed after the fact. Also refreshes
// checkInOffset against the session's scheduled start, since that's what the "(capped)" flag
// elsewhere (the Pod roster note, the attendance log) reads to know if the 15-min late-grace rule
// kicked in — leaving it stale after a manual correction would show the wrong badge.
function setActualStart(sessionId, v){
  const sess=findSession(sessionId);
  sess.actualStart=Number(v);
  sess.checkInOffset=sess.actualStart-sess.start;
  dbWrite('updating check-in time', function(){ return supabaseClient.from('sessions').update({actual_start_min:sess.actualStart, check_in_offset:sess.checkInOffset}).eq('id', sess.id); });
  toast(findStudent(sess.studentId).name+'\'s check-in time updated to '+minToLabel(sess.actualStart)+'.');
}

// Today's checked-in students still present (not yet checked out) — shared by the "Checked in
// today" panel and the check-out picker so the two always agree on who's still around.
function checkedInTodayStillPresent(){
  const todayKey=toKey(simNow());
  return sessions.filter(function(s){ return s.status==='attended' && toKey(s.date)===todayKey && s.actualEnd!=null && !s.checkedOut; });
}

// Explicit "Check out" action (5.24) — separate from just editing the exit-time estimate above,
// this actually records that a student has left and drops them off the live "Checked in today"
// roster. Lives as one button at the top of that panel (not per-row) since front desk is usually
// checking out whoever's leaving right now, not scrolling to find a specific row; the time picker
// defaults to whatever's closest to the actual current clock — not the scheduled/estimated exit —
// since "in case we signed them out late accidentally" is exactly the case where the estimate
// isn't what actually happened. sessionId is optional — omit it to default to whoever's been
// waiting longest (soonest exit time first), or pass one to preselect a specific student.
// Scopes "who can be checked out right now" to the current viewer — front desk sees and can act on
// everyone checked in centre-wide, but an instructor only ever sees (and can check out) students
// currently checked in at their own Pod(s) or their own Online group today (Sept 2026, per Allie:
// "can we do it so the instructors can check out the kids on their pod as well as front staff").
// Mirrors the exact same identity lookup renderInstructor() itself already uses.
function checkedInPresentForCurrentViewer(){
  if(state.role==='instructor'){
    const instrId = supabaseClient? (currentUser && currentUser.instructorId) : state.instructorLoggedIn;
    return instrId? checkedInAtInstructorPodToday(instrId) : [];
  }
  return checkedInTodayStillPresent();
}
function openCheckOut(sessionId){
  const present=checkedInPresentForCurrentViewer();
  if(present.length===0) return;
  const sess=sessionId? findSession(sessionId) : present.slice().sort(function(a,b){ return a.actualEnd-b.actualEnd; })[0];
  state.checkOut={sessionId:sess.id, exitTime:nearestOption(EXIT_TIME_OPTIONS, nowMinutesOfDay())};
  render();
}
function closeCheckOut(){ state.checkOut=null; render(); }
function setCheckOutSession(sessionId){ state.checkOut.sessionId=sessionId; render(); }
function setCheckOutExit(v){ state.checkOut.exitTime=Number(v); render(); }
function confirmCheckOut(){
  const sess=findSession(state.checkOut.sessionId);
  sess.actualEnd=state.checkOut.exitTime;
  sess.checkedOut=true;
  dbWrite('checking out', function(){ return supabaseClient.from('sessions').update({actual_end_min:sess.actualEnd, checked_out:true}).eq('id', sess.id); });
  toast(findStudent(sess.studentId).name+' checked out at '+minToLabel(sess.actualEnd)+'.');
  state.checkOut=null;
  render();
}

// Auto-checks-out anyone still checked in (and not yet checked out) once the centre's own closing
// time has actually arrived (Sept 2026, per Allie: "Automatically check out any kids past 7pm") —
// front desk (or an instructor) can simply forget the last check-out of the day, leaving a session
// showing as still "in progress" indefinitely otherwise. Runs off the same periodic heartbeat that
// already re-checks promotions/plan changes as real time ticks forward (see afterLogin(), and the
// offline-mode bootstrap below) — there's no server-side cron here, so this only actually fires while
// at least one staff/instructor tab happens to be open past close, same limitation those other two
// already have. Scoped to TODAY only, same as the live "Checked in today" board itself — this
// doesn't reach back to clean up a forgotten check-out left over from a previous day, only catches
// one in real time as close actually arrives today. Records the exit as exactly closing time, not
// whatever moment the heartbeat happened to tick at — sessions are never bookable to run past
// CENTER_CLOSE in the first place (see possibleStarts()), so there's never a legitimate reason for
// anyone to still be "in progress" once it's past close.
function autoCheckOutPastClose(){
  if(nowMinutesOfDay()<CENTER_CLOSE) return 0;
  const overdue=checkedInTodayStillPresent();
  overdue.forEach(function(s){
    s.actualEnd=CENTER_CLOSE;
    s.checkedOut=true;
    dbWrite('auto-checking out at close', function(){ return supabaseClient.from('sessions').update({actual_end_min:s.actualEnd, checked_out:true}).eq('id', s.id); });
  });
  if(overdue.length){
    toast(overdue.length+' student'+(overdue.length===1?'':'s')+' automatically checked out at close ('+minToLabel(CENTER_CLOSE)+').');
  }
  return overdue.length;
}

/* ---------- Front-desk staff check-in/out + timesheet (Sept 2026, per Allie) ---------- */
function staffShiftsFor(staffId){
  return staffRosteredShifts.filter(function(s){ return s.staffId===staffId; });
}
// weekday -> {start,end} — only present for days they're actually rostered on.
function staffWeeklyPattern(staffId){
  const pattern={};
  staffShiftsFor(staffId).forEach(function(s){ pattern[s.weekday]={start:s.start, end:s.end}; });
  return pattern;
}
function staffRosteredOn(staffId, weekday){
  return staffShiftsFor(staffId).find(function(s){ return s.weekday===weekday; }) || null;
}
function staffAttendanceRecordsFor(staffId, dateKey){
  return staffAttendance.filter(function(a){ return a.staffId===staffId && toKey(a.date)===dateKey; })
    .sort(function(a,b){ return a.checkIn-b.checkIn; });
}
function staffOpenRecord(staffId, dateKey){
  return staffAttendance.find(function(a){ return a.staffId===staffId && toKey(a.date)===dateKey && a.checkOut==null; }) || null;
}
// Minutes worked for one record — still ticking (measured against now) while checked in, fixed once
// checked out. Null when there's no check-in at all.
function staffMinutesWorked(rec){
  if(!rec || rec.checkIn==null) return null;
  const end = rec.checkOut!=null? rec.checkOut : nowMinutesOfDay();
  return Math.max(0, end-rec.checkIn);
}
function staffHoursLabel(mins){ return mins==null? '—' : (mins/60).toFixed(1)+'h'; }
// Everything the front-desk check-in board needs for one staff member, today: their rostered shift
// (if any), every stint they've clocked today, whether they're currently on site, and how many
// minutes late their first check-in was against their rostered start (null if on time / not rostered
// / not checked in yet).
function staffStatusToday(staffId){
  const today=simNow();
  const todayKey=toKey(today);
  const weekday=WEEKDAY_KEYS[(today.getDay()+6)%7];
  const rostered=staffRosteredOn(staffId, weekday);
  const records=staffAttendanceRecordsFor(staffId, todayKey);
  const openRec=staffOpenRecord(staffId, todayKey);
  let lateMin=null;
  if(rostered && records.length && records[0].checkIn>rostered.start) lateMin=records[0].checkIn-rostered.start;
  let state;
  if(openRec) state='on-site';
  else if(records.length) state='checked-out';
  else if(!rostered) state='not-rostered';
  else state = nowMinutesOfDay()>rostered.start? 'late-not-in' : 'not-in-yet';
  return {rostered, records, openRec, lateMin, state};
}
function checkInStaff(staffId){
  const todayKey=toKey(simNow());
  if(staffOpenRecord(staffId, todayKey)){ toast(findStaffMember(staffId).name+' is already checked in today.'); render(); return; }
  const nowMin=nowMinutesOfDay();
  const newRec={id:newId()||('sattend'+(nextStaffAttendanceId++)), staffId:staffId, date:new Date(todayKey), checkIn:nowMin, checkOut:null};
  staffAttendance.push(newRec);
  dbWrite('checking in staff', function(){ return supabaseClient.from('staff_attendance').insert({id:newRec.id, staff_id:staffId, the_date:todayKey, check_in_min:nowMin}); });
  toast(findStaffMember(staffId).name+' checked in at '+minToLabel(nowMin)+'.');
  render();
}
function checkOutStaff(staffId){

// Same staff_attendance table as front-desk staff (see add_instructor_attendance.sql), just keyed
// by instructorId instead of staffId — never both on one row. Front desk still does the actual
// checking in/out; instructors never self-service it, same as staff. "Rostered today" reuses each
// instructor's OWN existing dated availability (instructorAvailabilityOn) — the same source their
// booking/coverage already relies on — rather than a second, separate roster of their own; that
// comparison is surfaced only here, on this front-desk board, never shown to the instructor
// themselves.
function instructorAttendanceRecordsFor(instructorId, dateKey){
  return staffAttendance.filter(function(a){ return a.instructorId===instructorId && toKey(a.date)===dateKey; })
    .sort(function(a,b){ return a.checkIn-b.checkIn; });
}
function instructorOpenRecord(instructorId, dateKey){

function instructorCheckinStatusToday(instructorId){
  const today=simNow();
  const todayKey=toKey(today);

  const records=instructorAttendanceRecordsFor(instructorId, todayKey);

// Whether it's already too late to request a make-up for today (5.7) — past the 10:00am
// same-day cutoff. Split out from openSlotsForCredit so the picker can explain a missing "today"
// rather than just silently starting the list at tomorrow.
function sameDayMakeUpCutoffPassed(){ return nowMinutesOfDay()>=MAKEUP_SAME_DAY_CUTOFF; }
// Sept 2026, per Allie: a parent trying to book a make-up saw "No open slots in the next two weeks
// for this program" while front desk was confident there was room. Two real gaps contributed (see
// the Availability Lookup fix above for the other one — this app never assumed there was only one
// cause): this function only ever considered a physical Pod, never Online, even though the app has
// let a student sit Online for months now (5.32+) and front desk can already put a one-off booking
// there by hand. A physical-Pod-only make-up search misses room that genuinely exists whenever every
// Pod is full/unstaffed at a given time but an on-shift instructor still has headroom under the
// combined Online ratio. This now checks Online too, exactly the same way a manual staff booking's
// location picker already does (see confirmBooking's isOnline branch) — physical Pods first (a
// parent already knows how a Pod session works), Online only as a fallback for a given date/time
// when no Pod fits.
function openSlotsForCredit(credit){
  // Parents choose a date + time only — never which Pod or instructor, and never a duration
  // (that's fixed to the student's usual session length). The system auto-assigns a specific
  // qualified, available, under-capacity Pod (or, failing that, an available Online instructor)
  // behind the scenes.
  const student=findStudent(credit.studentId);
  const duration=student.duration;
  const now=simNow();
  const todayKey=toKey(now);
  const sameDayCutoffPassed=sameDayMakeUpCutoffPassed();
  const opts=[];
  [0,1].forEach(function(weekOff){
    const monday=addDays(getMonday(now), weekOff*7);
    for(let i=0;i<5;i++){
      const date=addDays(monday,i);
      if(date < new Date(todayKey)) continue;
      if(isClosedDate(date)) continue; // centre's closed this day — never offer it as a make-up slot
      if(sameDayCutoffPassed && toKey(date)===todayKey) continue; // past 10am — today's no longer offered
      const weekday=WEEKDAY_KEYS[i];
      const dateKey=toKey(date);
      possibleStarts(duration).forEach(function(start){
        if(studentOverlapClash(student.id, dateKey, start, duration, null)) return;
        const podId=pickBestPod(weekday, dateKey, start, duration, student.year);
        if(podId){
          const cov=podCoverageDetail(podId, weekday, start, duration, date); // tolerant of a short unattended gap, same as pickBestPod just validated
          opts.push({date, start, duration, podId, online:false, instructorId:cov.primaryInstructorId});
          return;
        }
        // No physical Pod fits — try Online before giving up on this date/time entirely. Any
        // instructor genuinely on shift somewhere (instructorsOnShift) with combined headroom
        // (!instructorOnlineBlocked) can take one more Online student; first eligible wins, same
        // "predictable, no ranking" approach pickBestPod itself uses for Pods.
        const onlineInstr=instructorsOnShift(weekday, start, duration, date)
          .find(function(instr){ return !instructorOnlineBlocked(instr.id, dateKey, start, duration); });
        if(onlineInstr){
          opts.push({date, start, duration, podId:null, online:true, instructorId:onlineInstr.id});
        }
      });
    }
  });
  opts.sort(function(a,b){ return toKey(a.date)===toKey(b.date) ? a.start-b.start : new Date(a.date)-new Date(b.date); });
  return opts;
}

// `online` (added Sept 2026, see openSlotsForCredit) forces podId to real null and stamps the
// session as an Online booking — `podId` still arrives from the onclick as a string either way
// (HTML attributes are always strings), and for a null Pod that string is literally "null", not an
// actual null, so it's ignored outright whenever `online` is true rather than trusted.
function bookSlot(creditId, dateKey, start, duration, podId, instructorId, online){
  const credit=findCredit(creditId);
  const student=findStudent(credit.studentId);
  if(online && instructorOnlineBlocked(instructorId, dateKey, Number(start), Number(duration))){
    // Rare race — someone else filled the last Online seat between opening this picker and clicking
    // Book. Same courtesy as confirmBooking()'s own guard: refuse cleanly and let them try again
    // rather than silently overbooking.
    toast("That Online slot just filled up — refresh and pick another time.");
    return;
  }
  const sess={id:newId()||('sess'+(nextSessionId++)), studentId:student.id, podId: online? null : podId, instructorId, instructorId2:null, handoff:null, online:!!online, date:new Date(dateKey), start:Number(start), duration:Number(duration), status:'scheduled', bookedBy:'parent', creditId};
  sessions.push(sess);
  credit.status='redeemed';
  credit.redeemedSessionId=sess.id;
  // Chained as a step AFTER the session insert resolves, rather than fired as its own independent
  // request — credits.redeemed_session_id is a real foreign key to sessions(id), so the two used to
  // race: whichever reached Postgres second could fail outright if the other hadn't committed yet
  // (Sept 2026, same root cause as confirmBooking()'s own credit redemption and the earlier
  // saveNewStudent fix — just for the parent's self-service make-up flow this time).
  dbWrite('booking a make-up session and redeeming its credit', function(){ return supabaseClient.from('sessions').insert({
    id:sess.id, student_id:sess.studentId, pod_id:sess.podId, instructor_id:sess.instructorId, instructor_id_2:null, handoff_min:null, online:sess.online, the_date:toKey(sess.date),
    start_min:sess.start, duration:sess.duration, status:sess.status, booked_by:sess.bookedBy, credit_id:sess.creditId
  }).then(function(r){
    if(r.error) return r;
    return supabaseClient.from('credits').update({status:'redeemed', redeemed_session_id:sess.id}).eq('id', credit.id);
  }); });
  state.parentBookingCreditId=null;
  toast('Make-up booked for '+fmtShort(sess.date)+', '+rangeLabel(sess.start,sess.duration)+(online? ' — Online.' : '.'));
}

function cancelMakeUp(creditId){
  const credit=findCredit(creditId);
  const sess=findSession(credit.redeemedSessionId);
  sess.status='cancelled';
  dbWrite('cancelling a make-up session', function(){ return supabaseClient.from('sessions').update({status:'cancelled'}).eq('id', sess.id); });
  const now=simNow();
  if(new Date(toKey(now)) > new Date(toKey(credit.expiryDate))){
    credit.status='expired';
    credit.redeemedSessionId=null;
    dbWrite('expiring a make-up credit', function(){ return supabaseClient.from('credits').update({status:'expired', redeemed_session_id:null}).eq('id', credit.id); });
    toast('That credit\'s 3-month window (from the originally missed session) has already passed, so it could not be restored.');
  } else {
    credit.status='available';
    credit.redeemedSessionId=null;
    dbWrite('restoring a make-up credit', function(){ return supabaseClient.from('credits').update({status:'available', redeemed_session_id:null}).eq('id', credit.id); });
    toast('Make-up cancelled — the credit is available to rebook.');
  }
}

// Front-desk "Re-book" (Sept 2026, per Allie: give the Booked-credits section a way to change a
// still-pending make-up's date/time) — cancels the existing session via cancelMakeUp() (same credit-
// restoration/expiry logic either way) and, as long as that left the credit available rather than
// expired, immediately reopens the ordinary booking-for-credit form so staff pick the new date/time
// in one motion instead of two separate clicks.

  cancelMakeUp(creditId);

}

// Opens the ONE-OFF, single-date editor from a click on the date-based coverage grid (Sept 2026, per

// above: that one edits the ongoing weekly pattern (dated assignment history, applies every future

// Defaults to whatever's already in effect for this Pod/date (an existing override, or else the
// normal weekly pattern's own span/instructor) so opening the form and hitting Save with no changes
// is a no-op, not a surprise.
function openDayOverrideForm(podId, dateKey){
  const weekday=WEEKDAY_KEYS[(new Date(dateKey).getDay()+6)%7];
  const existing=dayOverrideFor(podId, dateKey);
  const blocks=podBlocksForDay(podId, weekday);
  const defStart = existing? existing.start : (blocks.length? blocks[0].start : CENTER_OPEN);
  const defEnd = existing? existing.end : (blocks.length? blocks[blocks.length-1].end : CENTER_CLOSE);
  let defInstructorId='';
  if(existing) defInstructorId = existing.instructorId||'';
  else { const b=blocks.find(function(bl){ return blockInstructorOn(bl, new Date(dateKey)); }); if(b) defInstructorId=blockInstructorOn(b, new Date(dateKey)); }
  state.dayOverrideForm={podId, dateKey, weekday, instructorId:defInstructorId, start:defStart, end:defEnd, error:''};

function setPodBlockTime(podId, weekday, blockId, field, value){
  const blocks=podBlocksForDay(podId, weekday);
  const block=blocks.find(function(b){ return b.id===blockId; });
  block[field]=Number(value);
  if(block.end<=block.start){
    if(field==='start') block.end=Math.min(CENTER_CLOSE, block.start+START_STEP);
    else block.start=Math.max(CENTER_OPEN, block.end-START_STEP);
  }
  const sorted=blocks.slice().sort(function(a,b){ return a.start-b.start; });
  for(let i=1;i<sorted.length;i++){
    if(sorted[i].start<sorted[i-1].end){
      state.podAssignForm.error='Shifts in the same Pod can\'t overlap each other.';
      render();
      return;
    }
  }
  state.podAssignForm.error='';
  dbWrite('updating shift block time', function(){ return supabaseClient.from('pod_shift_blocks').update({start_min:block.start, end_min:block.end}).eq('id', blockId); });
  regenerateAllRecurring();
  render();
}

  const f=state.podAssignForm;
  const draft=f.drafts[blockId];
  const block=podBlocksForDay(podId, weekday).find(function(b){ return b.id===blockId; });
  if(!draft || !draft.instructorId){ f.error='Choose an instructor.'; render(); return; }
  if(!draft.effectiveFrom){ f.error='Choose an effective date.'; render(); return; }
  const effDate=new Date(draft.effectiveFrom);
  const qualifying=qualifyingInstructorsForBlock(weekday, block, effDate);
  if(!qualifying.some(function(i){ return i.id===draft.instructorId; })){
    f.error=findInstructor(draft.instructorId).name+' isn\'t available for this shift on that date — pick from the list, or adjust their availability first.';
    render();
    return;
  }
  // an instructor can't cover two different Pods at an overlapping time, as of that date — this is
  // a PERMANENT weekly-schedule change, so no override is offered here; for a same-day-only fix, see
  // the quick coverage override on the live "who's here right now" board instead (Sept 2026, per
  // Allie: "I dont want it to be a permanent change, just a quick on the day change").
  for(const otherPodId in podSchedule){
    if(otherPodId===podId) continue;
    const clash=podBlocksForDay(otherPodId, weekday).find(function(ob){
      return ob.start<block.end && block.start<ob.end && blockInstructorOn(ob, effDate)===draft.instructorId;
    });
    if(clash){
      f.error=findInstructor(draft.instructorId).name+' is already assigned to '+findPod(otherPodId).name+' at that time from '+fmtShort(effDate)+'.';
      render();
      return;
    }
  }
  block.assignments.push({instructorId:draft.instructorId, effectiveFrom:effDate});
  dbWrite('assigning instructor to shift', function(){ return supabaseClient.from('pod_shift_assignments').insert({
    block_id:blockId, instructor_id:draft.instructorId, effective_from:draft.effectiveFrom
  }); });
  delete f.drafts[blockId];
  regenerateAllRecurring();
  toast(findInstructor(draft.instructorId).name+' assigned to '+findPod(podId).name+'’s '+weekday+' '+rangeLabel(block.start,block.end-block.start)+' shift, starting '+fmtShort(effDate)+'.');
  render();
}
function removeAssignment(podId, weekday, blockId, effectiveFromKey){
  const block=podBlocksForDay(podId, weekday).find(function(b){ return b.id===blockId; });
  block.assignments=block.assignments.filter(function(a){ return toKey(a.effectiveFrom)!==effectiveFromKey; });
  dbWrite('removing shift assignment', function(){ return supabaseClient.from('pod_shift_assignments').delete()
    .eq('block_id', blockId).eq('effective_from', effectiveFromKey); });
  regenerateAllRecurring();
  render();
}

/* ---------- availability lookup (front-desk sales reference) ---------- */
// Open seats in a given window, summed across every Pod with an assigned instructor covering that
// window — the number front desk can quote straight to a parent on a call. Every instructor can
// teach any year (5.3), so unlike an earlier version of this tool, a seat counts here regardless of
// the student's year — "best suited for" only ever affects which Pod auto-assignment prefers
// (5.8), never whether front desk can quote a family a seat. Also reports how many Pods are
// staffed at all in that window, so "0 seats, nobody's on" reads differently from "0 seats, fully
// booked." (The `year` parameter is accepted but no longer filters — kept for callers that still
// pass one.)
// A session with no Pod on file (podId null, not online) still takes up a real seat in the room at
// whatever time it's booked — usually because every Pod was already full when it was made and front
// desk squeezed the student in anyway, or a Pod was cleared by hand afterward. It isn't tied to any
// one specific Pod, so there's no single Pod's own count to charge it against — but openSeatsAt()
// ignoring it entirely let the Availability lookup quote a seat that doesn't actually exist (Sept
// 2026, per Allie: "unassigned kids must count towards availability"). This mirrors peakInWindow but
// scoped to every unassigned session across the whole centre, for openSeatsAt() to subtract off the
// aggregate total, wherever those seats really are.
function unassignedPeakInWindow(dateKey, winStart, winEnd){
  const list = sessions.filter(function(s){
    return !s.podId && !s.online && toKey(s.date)===dateKey && s.status!=='cancelled'
      && s.start<winEnd && winStart<s.start+s.duration;
  }).map(function(s){ return {start:Math.max(s.start,winStart), end:Math.min(s.start+s.duration,winEnd)}; });
  return peakConcurrencyOf(list);
}
function openSeatsAt(dateKey, weekday, blockStart, year, blockLen){
  let seats=0, staffed=0;
  const blockEnd=blockStart+blockLen;
  const date=new Date(dateKey);
  pods.forEach(function(pod){
    const cov=podCoverageBoundary(pod.id, weekday, blockStart, blockLen, date);
    if(!cov.instructorId) return;
    const winStart=blockStart, winEnd=Math.min(blockEnd, cov.boundary);
    if(winEnd<=winStart) return;
    staffed++;
    const peak=peakInWindow(pod.id, dateKey, winStart, winEnd);
    seats += Math.max(0, podCapacity(pod.id)-peak);
  });
  seats = Math.max(0, seats - unassignedPeakInWindow(dateKey, blockStart, blockEnd));
  return {seats, staffed};
}
// Combined (physical + online) peak headcount instructor X is minding, restricted to a window —
// the Online counterpart to peakInWindow (used for Pods).
function instructorCombinedPeakInWindow(instructorId, dateKey, winStart, winEnd){
  const list = instructorPhysicalSessionsForDay(instructorId, dateKey).concat(instructorOnlineSessionsForDay(instructorId, dateKey))
    .filter(function(s){ return s.start<winEnd && winStart<s.start+s.duration; })
    .map(function(s){ return {start:Math.max(s.start,winStart), end:Math.min(s.start+s.duration,winEnd)}; });
  return peakConcurrencyOf(list);
}
// Online seats available at a window, aggregated across every instructor on shift then — the
// Online counterpart to openSeatsAt(), used by the availability lookup to show Online as its own
// row rather than folding it into the Pod counts above.
function onlineSeatsAt(dateKey, weekday, blockStart, blockLen){
  const date=new Date(dateKey);
  let seats=0;
  instructorsOnShift(weekday, blockStart, blockLen, date).forEach(function(instr){
    const peak=instructorCombinedPeakInWindow(instr.id, dateKey, blockStart, blockStart+blockLen);
    seats += Math.max(0, combinedCapFor(instr.id)-peak);
  });
  return seats;
}
// Sept 2026, per Allie: "I want the availability lookup to be an overview of regularly scheduled
// sessions - not be so week-by-week" — front desk used to flip between "This week"/"Next week" and
// see different seat counts for the exact same weekday/time, since a one-off booking, a hold, or a
// closure landing in one particular week could make that week's real numbers look better or worse
// than the standing pattern actually is. There's now exactly one reference date per weekday — the
// next real occurrence of it, skipping a closed day — so the grid always answers "what does a normal
// Monday at 3pm look like", not "what does the Monday two Tuesdays from now happen to look like".
function nextRegularOccurrence(weekday, fromDate){
  let d=nextDateForWeekday(fromDate||simNow(), weekday);
  while(closedDayFor(d)){ d=addDays(d,7); }
  return d;
}
// "Pod seating — permanent changes" picks its own weekday independently of whatever date the
// day-by-day schedule (now on the Staff tab) happens to be showing (Sept 2026, per Allie: "I need
// the option to select whether it's Monday, Tuesday, Wednesday, Thursday, or Friday"). Picking
// today's own weekday resolves to today itself via nextRegularOccurrence (nextDateForWeekday is a
// no-op when the target weekday is already today), so the live checked-in view still works exactly
// as before for that one case — every other weekday shows its next real, non-closed occurrence.
function setPodSeatingWeekday(weekday){ state.podSeatingWeekday=weekday; render(); }
// Same shape as peakInWindow, but returns which students are actually occupying the window instead
// of just the peak count — used only to work out whose seat a "opening soon" slot belongs to, never
// for capacity math itself (openSeatsAt/peakInWindow, above, are untouched).
function occupantsInWindow(podId, dateKey, winStart, winEnd){
  return sessionsForDay(podId, dateKey)
    .filter(function(s){ return s.start<winEnd && winStart<s.start+s.duration; })
    .map(function(s){ return s.studentId; });
}
// Does this student have a dated schedule change, already on file and taking effect within the next
// 14 days, that actually removes them from this exact weekday/window — a real "finishing up" (a
// stop, or a move to a different day/time) rather than a temporary hold (holds don't touch
// student.planChanges at all, so they're correctly invisible here; a hold freeing a seat is a
// temporary blip, not the standing pattern changing). Returns the change's effective date, or null.
function upcomingSlotDeparture(studentId, weekday, blockStart, blockLen){
  const student=findStudent(studentId);
  if(!student) return null;
  const nowKey=toKey(simNow()), horizonKey=toKey(addDays(simNow(),14));
  const upcoming=(student.planChanges||[])
    .filter(function(pc){ const k=toKey(pc.effectiveFrom); return k>nowKey && k<=horizonKey; })
    .sort(function(a,b){ return toKey(a.effectiveFrom).localeCompare(toKey(b.effectiveFrom)); });
  for(let i=0;i<upcoming.length;i++){
    const pc=upcoming[i];
    const newRecurring=pc.stopped? [] : (pc.recurring||[]);
    const stillHasSlot=newRecurring.some(function(r){ return r.weekday===weekday && r.start<blockStart+blockLen && blockStart<r.start+student.duration; });
    if(!stillHasSlot) return pc.effectiveFrom;
  }
  return null;
}
// "There are no waitlists on that time slot" (Allie's own wording) — a plain day+time match, same
// granularity the waitlist itself is matched on elsewhere (waitlistOpenSeat/pickBestPodWithClaims
// don't pin a Pod either); if anyone's already queued for it, the first real opening is already
// spoken for, so it's not something to advertise to a brand-new inquiry.
function weekdaySlotHasWaitlist(weekday, start){
  return waitlist.some(function(w){ return w.status==='waiting' && w.weekday===weekday && w.start===start; });
}
// For a currently-full weekday/time slot: is anyone occupying it due to leave within 14 days, with
// nobody already waitlisted for it? Walks the same staffed-Pods loop as openSeatsAt so it only ever
// looks at Pods that actually count toward that cell's number. Returns {count, date} (date = the
// earliest departure) or null.
function regularSlotOpeningSoon(dateKey, weekday, blockStart, blockLen){
  if(weekdaySlotHasWaitlist(weekday, blockStart)) return null;
  const date=new Date(dateKey);
  const blockEnd=blockStart+blockLen;
  const studentIds=[];
  pods.forEach(function(pod){
    const cov=podCoverageBoundary(pod.id, weekday, blockStart, blockLen, date);
    if(!cov.instructorId) return;
    const winEnd=Math.min(blockEnd, cov.boundary);
    if(winEnd<=blockStart) return;
    occupantsInWindow(pod.id, dateKey, blockStart, winEnd).forEach(function(sid){
      if(studentIds.indexOf(sid)===-1) studentIds.push(sid);
    });
  });
  const departures=studentIds.map(function(sid){ return upcomingSlotDeparture(sid, weekday, blockStart, blockLen); }).filter(Boolean);
  if(departures.length===0) return null;
  departures.sort(function(a,b){ return toKey(a).localeCompare(toKey(b)); });
  return {count:departures.length, date:departures[0]};
}
// Sept 2026, per Allie's report of a parent seeing "no open slots" for a make-up while front desk
// was confident there was room: the Lookup grid always checked a fixed 90-minute window
// (AVAIL_MIN_SESSION_LEN) no matter how long the family's actual sessions run, while the real
// make-up-booking check (openSlotsForCredit) always used that student's real duration. A 90-minute
// read can show "open" for a start time that a real 120-minute session wouldn't actually fit into
// (the shift ends, or someone else's session starts, partway through the extra 30 minutes) — so
// front desk saw green where the parent's own duration-aware check correctly saw none. Letting
// front desk match the grid to the specific family's length closes that gap.
function setAvailSessionLen(len){
  state.availSessionLen=Number(len);
  if(state.collapsedSections && state.collapsedSections.availability){ state.collapsedSections.availability=false; }
  render();
}

/* ---------- waitlist for full day/time slots (5.17) ---------- */
// The soonest upcoming date that falls on a given weekday, from a given date (inclusive) — used to
// pick one concrete, checkable occurrence for a weekday+time waitlist entry.
function nextDateForWeekday(fromDate, weekday){
  let d=new Date(fromDate);
  while(WEEKDAY_KEYS[(d.getDay()+6)%7]!==weekday){ d=addDays(d,1); }
  return d;
}
// Same peak-headcount calculation as peakConcurrency, but can also account for seats already
// virtually claimed by other waitlist entries in the same first-in-first-served pass (see
// waitlistClaimsBefore) — so two families waiting for the same Pod/date don't both get told the
// same single opening is theirs.
function peakConcurrencyWithClaims(podId, dateKey, extra, claims){
  const raw = sessionsForDay(podId, dateKey).map(function(s){ return {start:s.start, end:s.start+s.duration}; });
  (claims||[]).forEach(function(c){
    if(c.podId===podId && c.dateKey===dateKey) raw.push({start:c.start, end:c.start+c.duration});
  });
  if(extra) raw.push({start:extra.start, end:extra.start+extra.duration});
  return peakConcurrencyOf(raw); // same handover forgiveness as peakConcurrency (STUDENT_OVERLAP_TOLERANCE_MIN)
}
// Same tolerated one-seat/15-minute capacity pinch as podCapacityBlocked, but also accounting for
// other waitlist entries ahead of this one in the queue (see peakConcurrencyWithClaims).
function podCapacityBlockedWithClaims(podId, dateKey, extra, claims){
  const raw = sessionsForDay(podId, dateKey).map(function(s){ return {start:s.start, end:s.start+s.duration}; });
  (claims||[]).forEach(function(c){
    if(c.podId===podId && c.dateKey===dateKey) raw.push({start:c.start, end:c.start+c.duration});
  });
  if(extra) raw.push({start:extra.start, end:extra.start+extra.duration});
  return capacityOverflowViolation(raw, podCapacity(podId));
}
// Same "first staffed, under-capacity Pod wins, no age consideration" logic as pickBestPod (Sept
// 2026) — kept as a separate function only because it also has to account for other waitlist
// entries ahead of this one in the queue that would already claim a seat (`claims`, via
// peakConcurrencyWithClaims) before this entry ever gets to see it. Kept in sync with pickBestPod
// deliberately; if that logic changes again, this needs the same change.
function pickBestPodWithClaims(weekday, dateKey, start, duration, year, claims){
  const date=new Date(dateKey);
  for(let i=0;i<pods.length;i++){
    const podId=pods[i].id;
    const cov=podCoverageDetail(podId, weekday, start, duration, date);
    if(!cov.primaryInstructorId || !cov.ok) continue;
    if(podCapacityBlockedWithClaims(podId, dateKey, {start, duration}, claims)) continue;
    return podId;
  }
  return null;
}
// First-in-first-served (5.17): every waiting entry strictly older (by dateAdded) than this one
// gets to "claim" its seat first. Walks the queue oldest-first, and for each entry ahead of this
// one that currently resolves to a real Pod, reserves that Pod/date/time so a later entry can't
// also be told the exact same opening is theirs.
function waitlistClaimsBefore(entry){
  const claims=[];
  const waiting=waitlist.filter(function(w){ return w.status==='waiting'; })
    .sort(function(a,b){ return new Date(a.dateAdded)-new Date(b.dateAdded); });
  for(let i=0;i<waiting.length;i++){
    const w=waiting[i];
    if(entry && w.id===entry.id) break; // reached this entry's own place in the queue
    const year = w.studentId? findStudent(w.studentId).year : w.year;
    const dateKey = toKey(nextDateForWeekday(simNow(), w.weekday));
    const podId = pickBestPodWithClaims(w.weekday, dateKey, w.start, w.duration, year, claims);
    if(podId) claims.push({podId, dateKey, start:w.start, duration:w.duration, year:year});
  }
  return claims;
}
// Is there actually a seat for this entry right now, once everyone who's been waiting longer for
// an overlapping slot has first claim on whatever's open? Reuses the same coverage/qualification/
// capacity check standing bookings rely on (5.8), against the soonest upcoming occurrence of the
// entry's weekday. An existing student's CURRENT year is used (so a promotion, 5.9, is reflected
// automatically); a new enquiry uses whatever year was logged at the time they were added.
function waitlistOpenSeat(entry){
  const year = entry.studentId? findStudent(entry.studentId).year : entry.year;
  const date = nextDateForWeekday(simNow(), entry.weekday);
  const claims = waitlistClaimsBefore(entry);
  const podId = pickBestPodWithClaims(entry.weekday, toKey(date), entry.start, entry.duration, year, claims);
  return podId? {podId, date} : null;
}
// For the panel only: would this entry have a seat if the queue were ignored? Used to tell "someone
// who's been waiting longer has first claim on this one" apart from "nothing is open here at all."
function waitlistWouldFitIgnoringQueue(entry){
  const year = entry.studentId? findStudent(entry.studentId).year : entry.year;
  const dateKey = toKey(nextDateForWeekday(simNow(), entry.weekday));
  return !!pickBestPodWithClaims(entry.weekday, dateKey, entry.start, entry.duration, year, []);
}
function openWaitlistForm(weekday, start){
  state.waitlistForm={mode:'existing', studentId:'', name:'', year:1, weekday: weekday||'Mon', start: start!=null? start : AVAIL_BLOCKS[0], duration:60, note:'', error:'', swapWeekday:'', swapStart:null};
  render();
}
function closeWaitlistForm(){ state.waitlistForm=null; render(); }
function setWaitlistMode(mode){
  state.waitlistForm.mode=mode;
  // A "new enquiry" has no current session to give up — there's nothing to swap (Sept 2026, per
  // Allie: swap pairing only applies when there's an existing student/session on the other end of it).
  if(mode==='new'){ state.waitlistForm.swapWeekday=''; state.waitlistForm.swapStart=null; }
  state.waitlistForm.error='';
  render();
}
function setWaitlistField(field, value){
  const f=state.waitlistForm;
  f[field] = (field==='start'||field==='duration'||field==='year'||field==='swapStart')? Number(value): value;
  if(field==='studentId' && value){
    const st=findStudent(value);
    f.duration=st.duration; // match their usual length
    // Picking a different student resets which of THEIR current sessions is being swapped out —
    // defaults to their first standing slot if they have one, otherwise there's nothing to swap.
    const firstSlot=(st.recurring && st.recurring.length)? st.recurring[0] : null;
    f.swapWeekday=firstSlot? firstSlot.weekday : '';
    f.swapStart=firstSlot? firstSlot.start : null;
  }
  f.error='';
  render();
}
// A single dropdown value (the index into the chosen student's recurring array) sets both
// swapWeekday and swapStart together in one go, so the pairing is always internally consistent
// rather than risking a mismatched weekday/start from two separate selects (Sept 2026, per Allie:
// "swap (current day) for (desired day)... we need to be aware of which").
function setWaitlistSwapSlot(idx){
  const f=state.waitlistForm;
  const student=f.studentId? findStudent(f.studentId) : null;
  const slot=student && student.recurring? student.recurring[Number(idx)] : null;
  f.swapWeekday=slot? slot.weekday : '';
  f.swapStart=slot? slot.start : null;
  f.error='';
  render();
}
function saveWaitlistForm(){
  const f=state.waitlistForm;
  if(f.mode==='existing' && !f.studentId){ f.error='Choose a student.'; render(); return; }
  if(f.mode==='new' && !f.name.trim()){ f.error='Enter a name.'; render(); return; }
  // Every existing-student waitlist join must say which of their current sessions it would replace
  // (Sept 2026, per Allie: "I need each request to be visible... swap (current day) for (desired
  // day)... always required") — skipped only for a student with no standing sessions at all to give
  // up (e.g. mid-enrolment setup), since there's genuinely nothing to pair against there.
  if(f.mode==='existing'){
    const swapStudent=findStudent(f.studentId);
    if(swapStudent.recurring && swapStudent.recurring.length && !f.swapWeekday){
      f.error='Choose which of their current sessions this would replace.'; render(); return;
    }
  }
  const entry={
    id:newId()||('wl'+(nextWaitlistId++)),
    studentId: f.mode==='existing'? f.studentId : null,
    name: f.mode==='existing'? findStudent(f.studentId).name : f.name.trim(),
    year: f.mode==='existing'? findStudent(f.studentId).year : f.year,
    weekday:f.weekday, start:f.start, duration:f.duration,
    swapWeekday: f.mode==='existing'? (f.swapWeekday||null) : null,
    swapStart: f.mode==='existing'? (f.swapStart!=null? f.swapStart : null) : null,
    note:f.note, dateAdded:new Date(simNow()), notified:false, status:'waiting',
  };
  waitlist.push(entry);
  dbWrite('adding to waitlist', function(){ return supabaseClient.from('waitlist_entries').insert({
    id:entry.id, student_id:entry.studentId, name:entry.name, year:entry.year, weekday:entry.weekday,
    start_min:entry.start, duration:entry.duration, swap_weekday:entry.swapWeekday, swap_start_min:entry.swapStart,
    note:entry.note, status:'waiting', notified:false,
    date_added:entry.dateAdded.toISOString()
  }); });
  toast(entry.name+' added to the waitlist for '+f.weekday+' '+rangeLabel(f.start,f.duration)+'.');
  state.waitlistForm=null;
  render();
}
function removeWaitlistEntry(id){
  const w=waitlist.find(function(x){ return x.id===id; });
  if(w) w.status='removed';
  dbWrite('removing from waitlist', function(){ return supabaseClient.from('waitlist_entries').update({status:'removed'}).eq('id', id); });
  render();
}
// Front desk has decided to reach out now that a seat exists — records that the family was
// contacted, but deliberately doesn't book anything itself: the actual booking (5.1) or new
// enrollment (5.6) is a separate, already-built flow, so this never duplicates that logic.
function notifyWaitlistEntry(id){
  const w=waitlist.find(function(x){ return x.id===id; });
  if(!w) return;
  const seat=waitlistOpenSeat(w);
  if(!seat){ toast('No open seat right now for that slot.'); return; }
  w.notified=true;
  dbWrite('marking waitlist entry notified', function(){ return supabaseClient.from('waitlist_entries').update({notified:true}).eq('id', id); });
  toast('Contacted '+w.name+' — a seat is open '+w.weekday+' '+fmtShort(seat.date)+' '+rangeLabel(w.start,w.duration)+'. Remove them from the waitlist once booked.');
  render();
}
// Front desk actually applying the swap once a seat has opened, rather than just notifying and then
// having to separately go make the change some other way (Sept 2026, per Allie: "in the Waitlist
// section, I need an additional button to execute the change"). Reuses applyTimeChange() — the exact
// same mechanism a parent's own permanent day/time change request goes through — so the schedule
// change itself works identically either way; this just triggers it straight from the waitlist row.
// Only meaningful for an existing student with a specific slot they're giving up (swapWeekday/
// swapStart); a "new enquiry" entry (no studentId) has no existing schedule to swap out of, so this
// points front desk at the New Student flow instead rather than guessing at one.
function fulfillWaitlistEntry(id){
  const w=waitlist.find(function(x){ return x.id===id; });
  if(!w || w.status!=='waiting') return;
  const seat=waitlistOpenSeat(w);
  if(!seat){ toast('That slot isn\'t open anymore — refresh and try again.'); render(); return; }
  if(!w.studentId){
    toast('This is a new enquiry, not an existing student — enrol '+w.name+' through "+ New student" instead, then remove this waitlist entry.');
    render();
    return;
  }
  const student=findStudent(w.studentId);
  const fromLabel = w.swapWeekday? w.swapWeekday+' '+minToLabel(w.swapStart) : 'their current schedule';
  if(!confirm('Move '+student.name+' from '+fromLabel+' to '+w.weekday+' '+minToLabel(w.start)+' now?')) return;
  // Swap the one slot they're giving up for the new one, keeping every other standing session of
  // theirs exactly as-is — same "current day -> desired day" pairing the swap UI has shown all along.
  let newRecurring;
  if(w.swapWeekday && w.swapStart!=null){
    let replaced=false;
    newRecurring=(student.recurring||[]).map(function(r){
      if(!replaced && r.weekday===w.swapWeekday && r.start===w.swapStart){ replaced=true; return {weekday:w.weekday, start:w.start}; }
      return r;
    });
    if(!replaced) newRecurring=newRecurring.concat([{weekday:w.weekday, start:w.start}]); // their old slot was already gone somehow — add the new one rather than silently dropping the request
  } else {
    newRecurring=(student.recurring||[]).concat([{weekday:w.weekday, start:w.start}]); // no specific slot was being given up (e.g. an extra session) — just add the new one
  }
  applyTimeChange(student, simNow(), newRecurring, 'Waitlist match', false);
  removeWaitlistEntry(id); // the family has their slot now — no longer waiting
}

// -- Parent self-service (Sept 2026, per Allie: "parents can place themselves on a waitlist, not
// just a manual process") — the same waitlist array/schema front desk already uses, just entered
// from the parent's own view and always scoped to one of their own children (no "new enquiry" mode
// — a parent only ever manages their own kids here, unlike front desk logging demand for a
// prospective family). Reuses removeWaitlistEntry() itself for actually leaving, so both sides stay
// in perfect sync — a parent leaving the waitlist looks identical to front desk removing them.
function currentParentRecord(){
  const parentId = supabaseClient ? (currentUser && currentUser.parentId) : state.parentLoggedIn;
  return parents.find(function(p){ return p.id===parentId; }) || null;
}

/* ---------- enrollment: creating parent/student profiles ---------- */
function bookedThisWeek(studentId){
  const monday=getMonday(simNow());
  const days=[0,1,2,3,4].map(function(i){ return toKey(addDays(monday,i)); });
  return sessions.filter(function(s){ return s.studentId===studentId && s.status!=='cancelled' && days.includes(toKey(s.date)); }).length;
}

// Each recurring row carries its own preferredPodId (''  = auto-assign) — a Preferred Pod is set up
// per session, not once for the whole student (Sept 2026, per Allie: "the preferred pods need to be
// set up per session, not overall"). Was previously a single field on the form applying to every
// session alike; see saveNewStudent()'s comment on how that now maps onto the standing-pin model.
function defaultRecurring(count, duration){
  const starts=possibleStarts(duration);
  const days=['Mon','Wed','Fri'];
  const out=[];
  for(let i=0;i<count;i++) out.push({weekday:days[i%days.length], start:starts[0], preferredPodId:''});
  return out;
}

function saveNewStudent(){
  const f=state.newStudentForm;
  if(!f.studentName.trim()){ f.error='Enter the student\'s name.'; render(); return; }
  if(!f.year){ f.error='Choose a school year.'; render(); return; }
  if(!f.startDate){ f.error='Choose a start date.'; render(); return; }
  if(toKey(new Date(f.startDate))<toKey(simNow())){ f.error='Start date can\'t be in the past.'; render(); return; }
  let parentId=null;
  // Set only when creating a brand-new parent alongside this student — its actual remote insert is
  // deferred and chained as the FIRST step of the student's own dbWrite below (see there for why:
  // students.parent_id is a real foreign key to parents(id), and firing these as two independent,
  // unordered requests risked the student's insert reaching Postgres before the parent's had
  // committed, failing on that foreign key — Sept 2026, root cause of "when adding a student i'm
  // getting an error code" / "it still says change is visible here but may not have saved").
  let newParentInsert=null;
  if(f.parentMode==='existing'){
    if(!f.parentId){ f.error='Choose a parent, or switch to “New parent”.'; render(); return; }
    parentId=f.parentId;
  } else {
    if(!f.parentName.trim() || !f.parentEmail.trim()){ f.error='Enter the parent\'s name and email.'; render(); return; }
    const existingParent=parents.find(function(p){ return p.email.toLowerCase()===f.parentEmail.trim().toLowerCase(); });
    if(existingParent){
      f.error='A parent with that email already exists — pick “Existing parent” instead.';
      render(); return;
    }
    const newParent={id:newId()||('p'+(nextParentId++)), name:f.parentName.trim(), email:f.parentEmail.trim(), studentIds:[]};
    parents.push(newParent);
    newParentInsert=function(){ return supabaseClient.from('parents').insert({id:newParent.id, name:newParent.name, email:newParent.email}); };
    parentId=newParent.id;
  }
  const newStudent={id:newId()||('s'+(nextStudentId++)), name:f.studentName.trim(), year:Number(f.year), baseYear:Number(f.year), yearBaseline:schoolYearIndex(simNow()), duration:Number(f.duration), sessionsPerWeek:Number(f.sessionsPerWeek), parentId, startDate:new Date(f.startDate), recurring:f.recurring.map(function(r){ return {weekday:r.weekday, start:r.start}; }), holds:[]};
  // A Preferred Pod chosen at enrollment (5.30, per Allie) isn't a separate field/column — it's just
  // one of the student's very first standing Pod pins, written the same way "Change Pod"
  // (openStudentPodForm/saveStudentPodAssignment) writes any other one, effective from day one. That
  // means studentAssignedPodOn() picks it up automatically everywhere a pin already mattered
  // (recurring pre-booking below, check-in's auto-suggest for an unassigned session, and the booking
  // modal's own suggestBookingPod()) with no extra plumbing, and a later "Change Pod" naturally
  // supersedes it — it'll always have a later effectiveFrom, and studentAssignedPodOn() already
  // resolves ties that way. No fallback if a preferred Pod turns out to be unstaffed or full for its
  // slot (same "front desk's own explicit call" rule pickBestPod applies to every pin) — that
  // occurrence is simply left unassigned, visible in the Schedule tab like any other coverage gap.
  //
  // Revised Sept 2026, per Allie: "the preferred pods need to be set up per session, not overall" —
  // each recurring row now carries its own preferredPodId, so this writes one weekday-scoped pin per
  // row that has one chosen, instead of a single pin applying to every session alike (weekday:null).
  // studentAssignedPodOn() already resolves pins per weekday (it's the same mechanism the day-specific
  // "Change Pod" pin uses), so no changes were needed there. If two rows land on the same weekday
  // (a student with two sessions the same day), only one pin can apply to that whole weekday — the
  // later entry in this array wins, same tie-break studentAssignedPodOn() always uses.
  const preferredPodAssignments=f.recurring
    .filter(function(r){ return r.preferredPodId; })
    .map(function(r){ return {podId:r.preferredPodId, effectiveFrom:new Date(toKey(simNow())), weekday:r.weekday}; });
  if(preferredPodAssignments.length) newStudent.podAssignments=preferredPodAssignments;
  students.push(newStudent);
  // Every remote write below is chained into ONE ordered sequence — parent (if new) -> student ->
  // recurring slots -> pod assignments -> the recurring sessions generateRecurringSessions() creates
  // further down — rather than each firing as its own independent, unordered request. Several of
  // these reference the row before them as a real foreign key (parent_id, student_id), so an
  // out-of-order arrival at Postgres previously meant an otherwise-successful enrollment could still
  // fail here with a foreign-key violation (Sept 2026 fix — see newParentInsert/deferredSessions
  // above). Purely a remote-persistence-ordering fix: every local/optimistic update below (pushing to
  // `students`, generating sessions into `sessions`, the toast) still happens immediately, same as always.
  const deferredSessions=[];
  dbWrite('enrolling a new student', function(){
    const afterParent = newParentInsert? newParentInsert() : Promise.resolve({error:null});
    return afterParent.then(function(r){
      if(r && r.error) return r;
      return supabaseClient.from('students').insert({
        id:newStudent.id, parent_id:newStudent.parentId, name:newStudent.name, year:newStudent.year, base_year:newStudent.baseYear,
        year_baseline:newStudent.yearBaseline, duration:newStudent.duration, sessions_per_week:newStudent.sessionsPerWeek,
        start_date:toKey(newStudent.startDate)
      });
    }).then(function(r){
      if(r.error || !newStudent.recurring.length) return r;
      return supabaseClient.from('student_recurring_slots').insert(newStudent.recurring.map(function(rec){ return {student_id:newStudent.id, weekday:rec.weekday, start_min:rec.start}; }));
    }).then(function(r){
      if(r.error || !newStudent.podAssignments || !newStudent.podAssignments.length) return r;
      return supabaseClient.from('student_pod_assignments').insert(newStudent.podAssignments.map(function(a){
        return {student_id:newStudent.id, pod_id:a.podId, effective_from:toKey(a.effectiveFrom), weekday:a.weekday};
      }));
    }).then(function(r){
      if(r.error || !deferredSessions.length) return r;
      return supabaseClient.from('sessions').insert(deferredSessions.map(function(s){ return {
        id:s.id, student_id:s.studentId, pod_id:s.podId, online:s.online, instructor_id:s.instructorId,
        instructor_id_2:s.instructorId2, handoff_min:s.handoff,
        the_date:toKey(s.date), start_min:s.start, duration:s.duration, status:s.status,
        booked_by:s.bookedBy, credit_id:s.creditId, is_recurring:true
      }; }));
    });
  });
  const parent=parents.find(function(p){ return p.id===parentId; });
  parent.studentIds.push(newStudent.id);
  const made=generateRecurringSessions(newStudent, HORIZON_WEEKS, deferredSessions);
  const uncovered=slotsWithoutCoverage(newStudent.recurring, newStudent.duration, newStudent.year);
  if(uncovered.length){
    toast(newStudent.name+' enrolled, but no Pod '+newStudent.name+' qualifies for (by age) is currently staffed for '+describeUncoveredSlots(uncovered)+' — 0 session(s) could be pre-booked for that time yet. Assign coverage on the Schedule tab, then reopen '+newStudent.name+'\'s regular schedule and save it again.', 9000);
  } else if(preferredPodAssignments.length && made===0){
    // Some Pod generically covers every chosen slot (uncovered came back empty) — so the reason
    // nothing got pre-booked is specifically that a Preferred Pod picked above doesn't have room
    // (or coverage) at its slot, and a pin never falls back to a different Pod on its own (same
    // rule as "Change Pod" — see the comment above where podAssignments gets set). Worth calling
    // out by name here, since "0 pre-booked" alone would otherwise look like a plain coverage gap.
    const pinnedNames=preferredPodAssignments.map(function(a){ return findPod(a.podId).name; }).filter(function(n,i,arr){ return arr.indexOf(n)===i; });
    toast(newStudent.name+' enrolled, but the Preferred Pod'+(pinnedNames.length>1?'s':'')+' chosen ('+pinnedNames.join(', ')+') don\'t have room (or coverage) at '+describeUncoveredSlots(newStudent.recurring)+' — 0 session(s) pre-booked. Pick different Preferred Pods via "Change Pod", or leave sessions on auto-assign.', 9000);
  } else {
    const startingToday = toKey(newStudent.startDate)===toKey(simNow());
    toast(newStudent.name+' enrolled'+(startingToday? '' : ' — starting '+fmtShort(newStudent.startDate))+' — '+f.sessionsPerWeek+'x/week, '+f.duration+' min, with '+parent.name+'. '+made+' standing session(s) pre-booked.');
  }
  state.newStudentForm=null;
  render();
}

// (their day/time pattern) and openPlanChangeForm (a dated frequency/stop change): this is just
// fixing a typo'd name, correcting their school year, or moving them under a different parent
// record, none of which need the effective-dated regeneration machinery those other two forms carry.
// A student has no email of their own — that's their parent's — so there's nothing email-shaped to
// edit here; "reassign parent" covers the other half of "who this student belongs to".
function openEditStudentForm(studentId){
  const student=findStudent(studentId);
  state.editStudentForm={studentId, name:student.name, year:student.year, parentId:student.parentId, error:''};

function closeEditStudentForm(){ state.editStudentForm=null; render(); }
function setEditStudentField(field, value){ state.editStudentForm[field]=value; state.editStudentForm.error=''; render(); }
function saveEditStudent(){
  const f=state.editStudentForm;
  const student=findStudent(f.studentId);
  if(!f.name.trim()){ f.error='Enter the student\'s name.'; render(); return; }
  if(!f.year){ f.error='Choose a school year.'; render(); return; }
  if(!f.parentId){ f.error='Choose a parent.'; render(); return; }
  student.name=f.name.trim();
  // A plain student.year=... would get silently clobbered the next time applyPromotions() runs
  // (advancing the clock, or any real day rollover) — that recomputes year fresh from baseYear/
  // yearBaseline every time, exactly the way saveNewStudent() sets them at enrollment. Re-pinning
  // both here to "this corrected year, as of today" makes the edit stick and promotes correctly
  // forward from it, instead of reverting to whatever the old (wrong) year would have promoted to.
  student.year=Number(f.year);
  student.baseYear=Number(f.year);
  student.yearBaseline=schoolYearIndex(simNow());
  const parentChanged = f.parentId!==student.parentId;
  if(parentChanged){
    const oldParent=findParent(student.parentId);
    if(oldParent) oldParent.studentIds=(oldParent.studentIds||[]).filter(function(id){ return id!==student.id; });
    const newParent=findParent(f.parentId);
    newParent.studentIds=newParent.studentIds||[];
    if(newParent.studentIds.indexOf(student.id)===-1) newParent.studentIds.push(student.id);
    student.parentId=f.parentId;
  }
  dbWrite('editing student details', function(){ return supabaseClient.from('students').update({
    name:student.name, year:student.year, base_year:student.baseYear, year_baseline:student.yearBaseline, parent_id:student.parentId
  }).eq('id', student.id); });
  toast(student.name+'\'s details updated'+(parentChanged? ' — now under '+findParent(student.parentId).name : '')+'.');
  state.editStudentForm=null;
  render();
}

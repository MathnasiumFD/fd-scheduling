/* ---------- pod scheduling & capacity ---------- */
// Sessions booked into a Pod that day (any status but cancelled) — capacity belongs to the Pod
// as a whole, not to whichever instructor happens to be covering it at a given moment.
function sessionsForDay(podId, dateKey){
  return sessions.filter(s=> s.podId===podId && toKey(s.date)===dateKey && s.status!=='cancelled');
}
// Sessions a given INSTRUCTOR is personally involved in that day, across any Pod — used for their
// own "my schedule" view, not for capacity math.
function sessionsInvolvingInstructor(instructorId, dateKey){
  return sessions.filter(s=> (s.instructorId===instructorId || s.instructorId2===instructorId) && toKey(s.date)===dateKey && s.status!=='cancelled');
}

// A student's attendance HISTORY — every past session on file for them, most recent first,
// showing exactly which Pod they sat in and which instructor(s) covered it (Sept 2026, per Allie:
// "I want student history to only show past sessions, not upcoming" — then, after a pass that kept
// an already-resolved FUTURE session like a cancellation visible, "no, don't show them as
// cancelled, just don't show them at all"). Anything dated strictly before today is history,
// regardless of status. A session dated exactly today counts as history too, but only once it's
// been resolved one way or another (attended/no-show/excused/cancelled) — a same-day session
// front desk just marked excused, say, needs to show up here right away, not tomorrow. Anything
// dated today or later that's still plain 'scheduled' is genuinely upcoming and stays hidden, and
// any FUTURE-dated session is hidden outright no matter its status — resolving it early doesn't
// earn it a spot in "history" before its date has actually arrived.
// Front-desk only (5.5): instructors only ever see today's checked-in roster at their own Pod
// (5.13), and parents never see Pod/instructor detail at all (5.7) — this is the one place the
// full where-and-with-whom history lives, and it's deliberately not exposed anywhere else.
function studentAttendanceLog(studentId){
  const todayKey=toKey(simNow());
  return sessions.filter(function(s){
    if(s.studentId!==studentId) return false;
    const sessKey=toKey(s.date);
    return sessKey<todayKey || (sessKey===todayKey && s.status!=='scheduled');
  })
    .slice()
    .sort(function(a,b){ return b.date-a.date || b.start-a.start; });
}

// How much time a student has actually spent with each instructor (Sept 2026, per Allie: "I also
// want the history to keep track of what times a student spends with particular instructors").
// Built from the same history studentAttendanceLog() shows — only counts sessions actually
// ATTENDED; a no-show, excused absence, or cancellation means no time was spent with anyone,
// however it was staffed. A handoff session (instructorId2 set) splits its duration at the handoff
// point, crediting each instructor only the portion they actually covered — so the two instructors'
// totals for that one session always add back up to its full length. Sorted most-time-first.
function instructorTimeSummary(studentId){
  const totals={}; // instructorId -> {minutes, sessions}
  const credit=function(instrId, minutes){
    if(!instrId || minutes<=0) return;
    if(!totals[instrId]) totals[instrId]={minutes:0, sessions:0};
    totals[instrId].minutes+=minutes;
    totals[instrId].sessions+=1;
  };
  studentAttendanceLog(studentId).forEach(function(s){
    if(s.status!=='attended') return;
    if(s.instructorId2){
      const handoff = s.handoff!=null? s.handoff : s.start+Math.round(s.duration/2);
      credit(s.instructorId, handoff-s.start);
      credit(s.instructorId2, (s.start+s.duration)-handoff);
    } else {
      credit(s.instructorId, s.duration);
    }
  });
  return Object.keys(totals).map(function(id){
    const instr=findInstructor(id);
    return {instructorId:id, name:instr? instr.name : 'Former instructor', minutes:totals[id].minutes, sessions:totals[id].sessions};
  }).sort(function(a,b){ return b.minutes-a.minutes; });
}

// A brief handover between an outgoing and incoming student at a Pod's capacity boundary — e.g.
// one cohort wrapping up at 5:00 while the next cohort's early arrivals trickle in from 4:50 — is
// normal, not a real double-booking. STUDENT_OVERLAP_TOLERANCE_MIN forgives up to this many
// minutes of overlap between two students' sessions for capacity/headcount purposes only: a
// student whose session starts within this many minutes of another (different) session ending in
// the same Pod doesn't need their own seat for that short overlap — they're folded into the
// outgoing student's seat rather than counted as a second occupant. An overlap longer than this
// still counts in full, exactly as before.
var STUDENT_OVERLAP_TOLERANCE_MIN = 15;
// Nudges each interval's effective start forward, past any short (<=tolerance) overlap with an
// earlier-starting interval's end, before computing peak concurrency. Sorting by start first means
// each interval is only ever nudged relative to intervals that were already "in the room" before
// it arrived — matching the real handover direction (later arrival defers to the almost-finished
// earlier one), not the other way around. Ends are never adjusted, only starts. `toleranceMin`
// defaults to STUDENT_OVERLAP_TOLERANCE_MIN (Pod-seat handover forgiveness); suggestedShiftsForWeekday
// below passes INSTRUCTOR_OVERLOAD_TOLERANCE_MIN instead, for the same shape of forgiveness applied
// to the 1:8 staffing ratio rather than Pod seats.
function tolerantOccupancyIntervals(list, toleranceMin){
  const tol = toleranceMin==null? STUDENT_OVERLAP_TOLERANCE_MIN : toleranceMin;
  const sorted=list.slice().sort(function(a,b){ return a.start-b.start; });
  const adjusted=[];
  sorted.forEach(function(iv){
    let start=iv.start;
    adjusted.forEach(function(prev){
      if(prev.end>start && prev.end-start<=tol){
        start=Math.max(start, Math.min(iv.end, prev.end));
      }
    });
    adjusted.push({start:start, end:iv.end});
  });
  return adjusted;
}
// Peak simultaneous headcount in a Pod on a day — the real capacity question, since sessions of
// different lengths starting at different times can overlap partially. Pass `extra`
// ({start,duration}) to see what the peak WOULD be if that session were added. A short handover
// overlap (see STUDENT_OVERLAP_TOLERANCE_MIN) doesn't count both students as occupying a seat.
function peakConcurrency(podId, dateKey, extra){
  const raw = sessionsForDay(podId, dateKey).map(function(s){ return {start:s.start, end:s.start+s.duration}; });
  if(extra) raw.push({start:extra.start, end:extra.start+extra.duration});
  return peakConcurrencyOf(raw);
}
function peakConcurrencyOf(raw){
  if(raw.length===0) return 0;
  const list=tolerantOccupancyIntervals(raw);
  const events=[];
  list.forEach(iv=>{ events.push([iv.start,1]); events.push([iv.end,-1]); });
  events.sort((a,b)=> a[0]-b[0] || a[1]-b[1]); // an ending session frees its seat before a same-instant start fills it
  let cur=0, peak=0;
  events.forEach(function(e){ cur+=e[1]; if(cur>peak) peak=cur; });
  return peak;
}
// A Pod running one seat over its stated capacity for just a few minutes — the tail of one
// session overlapping the start of another beyond what STUDENT_OVERLAP_TOLERANCE_MIN alone
// forgives — is a pinch front desk can live with, not a real double-booking. This allows exactly
// that: up to POD_CAPACITY_OVERFLOW_SEATS extra seats at once, but only for stretches no longer
// than POD_CAPACITY_OVERFLOW_TOLERANCE_MIN. Going over by more seats than that, or staying over
// by the tolerated seat count for longer than that, is still a real capacity violation.
var POD_CAPACITY_OVERFLOW_SEATS = 1;
var POD_CAPACITY_OVERFLOW_TOLERANCE_MIN = 15;
function capacityOverflowViolation(raw, cap){
  if(raw.length===0) return false;
  const list=tolerantOccupancyIntervals(raw);
  const events=[];
  list.forEach(function(iv){ events.push([iv.start,1]); events.push([iv.end,-1]); });
  events.sort(function(a,b){ return a[0]-b[0] || a[1]-b[1]; });
  let cur=0, overSince=null;
  for(let i=0;i<events.length;i++){
    cur+=events[i][1];
    if(cur>cap+POD_CAPACITY_OVERFLOW_SEATS) return true; // more extra seats than ever tolerated
    if(cur>cap){
      if(overSince==null) overSince=events[i][0];
    } else if(overSince!=null){
      if(events[i][0]-overSince>POD_CAPACITY_OVERFLOW_TOLERANCE_MIN) return true;
      overSince=null;
    }
  }
  return false;
}
// The actual capacity gate every booking/move/auto-assign path should use — true if adding
// `extra` would violate capacity beyond the tolerated overflow above. Prefer this over comparing
// peakConcurrency to podCapacity directly, since a raw comparison doesn't know about the
// tolerated one-seat/15-minute pinch.
function podCapacityBlocked(podId, dateKey, extra){
  const raw = sessionsForDay(podId, dateKey).map(function(s){ return {start:s.start, end:s.start+s.duration}; });
  if(extra) raw.push({start:extra.start, end:extra.start+extra.duration});
  return capacityOverflowViolation(raw, podCapacity(podId));
}

/* ---------- online sessions (combined 1:9 ratio) ---------- */
// An instructor's own physical (non-online) sessions that day — the same headcount that already
// counts toward whichever Pod(s) they're covering, just keyed by instructor instead of Pod.
function instructorPhysicalSessionsForDay(instructorId, dateKey){
  return sessions.filter(function(s){
    return (s.instructorId===instructorId || s.instructorId2===instructorId) && toKey(s.date)===dateKey && s.status!=='cancelled' && !s.online;
  });
}
// An instructor's own Online-group sessions that day. Online sessions are never split across a
// handoff (instructorId2/handoff stay null) — one instructor mans a given online student the whole
// session, same as every other online student sitting in their group at that moment.
function instructorOnlineSessionsForDay(instructorId, dateKey){
  return sessions.filter(function(s){
    return s.instructorId===instructorId && toKey(s.date)===dateKey && s.status!=='cancelled' && !!s.online;
  });
}
// Peak simultaneous COMBINED (physical + online) headcount instructor X is personally minding at
// once — the number that must stay <= ONLINE_COMBINED_CAP. `extra` ({start,duration}) tests a
// hypothetical addition before committing it, same pattern as peakConcurrency/podCapacityBlocked.
// `excludeSessionId` drops one session from the baseline first — needed when re-checking a session
// that's ALREADY counted under this instructor (e.g. moving their own already-physical session of
// theirs onto their own Online group), so it isn't counted once for real and again via `extra`.
function instructorCombinedPeak(instructorId, dateKey, extra, excludeSessionId){
  const raw = instructorPhysicalSessionsForDay(instructorId, dateKey)
    .concat(instructorOnlineSessionsForDay(instructorId, dateKey))
    .filter(function(s){ return s.id!==excludeSessionId; })
    .map(function(s){ return {start:s.start, end:s.start+s.duration}; });
  if(extra) raw.push({start:extra.start, end:extra.start+extra.duration});
  return peakConcurrencyOf(raw);
}
// Would adding one more online student to instructor X at this window push their COMBINED headcount
// over the ratio? This is the one thing that can ever refuse an online assignment — online has no
// Pod, so there's no separate capacity check the way a physical booking has.
function instructorOnlineBlocked(instructorId, dateKey, start, duration, excludeSessionId){
  return instructorCombinedPeak(instructorId, dateKey, {start:start, duration:duration}, excludeSessionId) > combinedCapFor(instructorId);
}
// Which instructors are actually on shift (covering some Pod, fully, per the same
// UNATTENDED_TOLERANCE_MIN-tolerant rule as everywhere else) over this exact window — the only pool
// eligible to also mind an Online group, since online is never staffed by a dedicated online-only
// instructor. Checks every Pod's coverage for the window and dedupes; a handoff mid-window
// contributes both the outgoing and incoming instructor, since either could reasonably take an
// online student for their own portion of the coverage.
function instructorsOnShift(weekday, start, duration, date){
  const ids=[];
  pods.forEach(function(pod){
    const cov=podCoverageDetail(pod.id, weekday, start, duration, date);
    if(!cov.ok) return;
    if(cov.primaryInstructorId && ids.indexOf(cov.primaryInstructorId)===-1) ids.push(cov.primaryInstructorId);
    if(cov.secondaryInstructorId && ids.indexOf(cov.secondaryInstructorId)===-1) ids.push(cov.secondaryInstructorId);
  });
  return ids.map(findInstructor).filter(Boolean);
}
// Peak concurrency restricted to a specific window (e.g. one hour) — used by the availability lookup.
function peakInWindow(podId, dateKey, winStart, winEnd){
  const list = sessionsForDay(podId, dateKey)
    .filter(function(s){ return s.start<winEnd && winStart<s.start+s.duration; })
    .map(function(s){ return {start:Math.max(s.start,winStart), end:Math.min(s.start+s.duration,winEnd)}; });
  if(list.length===0) return 0;
  const events=[];
  list.forEach(function(iv){ events.push([iv.start,1]); events.push([iv.end,-1]); });
  events.sort(function(a,b){ return a[0]-b[0] || a[1]-b[1]; });
  let cur=0, peak=0;
  events.forEach(function(e){ cur+=e[1]; if(cur>peak) peak=cur; });
  return peak;
}

// How many currently-scheduled students overlapping this window in this Pod are the same school
// year — used to prefer grouping same-year students together when the system auto-assigns a Pod.
function sameYearCount(podId, dateKey, start, duration, year){
  return sessions.filter(function(s){
    if(s.podId!==podId || toKey(s.date)!==dateKey || s.status==='cancelled') return false;
    if(!(s.start<start+duration && start<s.start+s.duration)) return false;
    const st=findStudent(s.studentId);
    return !!st && st.year===year; // a session whose student no longer exists just doesn't count
  }).length;
}

// What an instructor is available for on a specific calendar date — resolved from their history
// of ongoing changes (each effective from a given date, until superseded by a later one for that
// same weekday) and one-off changes (a single specific date, which always takes priority over the
// ongoing pattern for that one date). Returns {start,end}, or null if not available that day.
function instructorAvailabilityOn(instructorId, date){
  const instr=findInstructor(instructorId);
  const dateKey=toKey(date);
  const oneOff=instr.oneOffs.find(function(o){ return toKey(o.date)===dateKey; });
  if(oneOff) return oneOff.off? null : {start:oneOff.start, end:oneOff.end};
  const weekday=WEEKDAY_KEYS[(date.getDay()+6)%7];
  const candidates=instr.availRules.filter(function(r){ return r.weekday===weekday && toKey(r.effectiveFrom)<=dateKey; });
  if(candidates.length===0) return null;
  candidates.sort(function(a,b){ return toKey(a.effectiveFrom).localeCompare(toKey(b.effectiveFrom)); });
  const active=candidates[candidates.length-1];
  return active.off? null : {start:active.start, end:active.end};
}
// The rule currently in effect for a weekday, as of "today" — used to summarize an instructor's
// standing pattern and to softly cross-check a Pod assignment against their own declared hours.
function instructorCurrentWeeklyPattern(instructorId){
  const now=simNow();
  const monday=getMonday(now);
  const out={};
  WEEKDAY_KEYS.forEach(function(day, i){ out[day]=instructorAvailabilityOn(instructorId, addDays(monday,i)); });
  return out;
}

// Which block (if any) in this Pod's weekly schedule covers a given moment, and who's actually
// covering it on the given date (per that block's dated assignment history).
function podBlockAt(podId, weekday, minute, date){
  const block=podBlocksForDay(podId, weekday).find(function(b){ return b.start<=minute && minute<b.end; });
  if(!block) return null;
  return {start:block.start, end:block.end, instructorId:blockInstructorOn(block, date)};
}
// How far (in absolute minutes) a Pod's schedule covers a session starting at `start` on `date`,
// before either the covering block ends or the session ends — whichever comes first. Returns
// {boundary, instructorId}; instructorId is null if nothing is assigned to the Pod at `start` at
// all, or the block exists but nobody's assignment history reaches back to this date.
function podCoverageBoundary(podId, weekday, start, duration, date){
  const end=start+duration;
  const block=podBlockAt(podId, weekday, start, date);
  if(!block) return {boundary:start, instructorId:null};
  return {boundary:Math.min(end, block.end), instructorId:block.instructorId};
}

// Full instructor coverage for a window in a Pod — including a handoff partway through if one
// block's assignment runs out before the session ends. Shared by staff booking and by moving an
// already-seated student to a different Pod, so both pick up whoever actually covers the new Pod.
function resolvePodCoverage(podId, weekday, start, duration, date){
  const end=start+duration;
  const seg1=podCoverageBoundary(podId, weekday, start, duration, date);
  if(!seg1.instructorId) return {instructorId:null, instructorId2:null, handoff:null};
  if(seg1.boundary>=end) return {instructorId:seg1.instructorId, instructorId2:null, handoff:null};
  const seg2=podCoverageBoundary(podId, weekday, seg1.boundary, end-seg1.boundary, date);
  return {instructorId:seg1.instructorId, instructorId2:seg2.instructorId||null, handoff:seg2.instructorId? seg1.boundary : null};
}

// A child can sit at a Pod up to this many minutes before an instructor arrives, after one wraps
// up, or between two assigned shifts, without the Pod counting as "uncovered" — anywhere in the
// app that decides whether a Pod is staffed for a session (booking, auto-assignment, re-seat by
// age, and the enrollment "no coverage" warnings) uses the same tolerance, so they never disagree
// with each other. A Pod with no instructor anywhere near the window, or a gap bigger than this,
// still isn't covered.
var UNATTENDED_TOLERANCE_MIN = 15;

// Walks every real (assigned) block overlapping [start, start+duration) on this Pod/weekday/date,
// in order, and returns the full picture: how many minutes of the window nobody is actually there
// (gapMinutes — 0 if fully covered, possibly by more than one instructor stitched together with no
// hole), which instructor covers the largest share (primaryInstructorId — the one that should get
// recorded as the session's own instructor, and whose "suited for" preference is checked), and, if
// a second, different instructor immediately continues right where the first leaves off with no
// gap between them, that instructor and the exact handoff minute (a genuine handoff — a different
// concept from an unattended gap, and not subject to the tolerance above since nobody actually goes
// unstaffed in that case).
function podCoverageDetail(podId, weekday, start, duration, date){
  const end=start+duration;
  // A one-off single-day override (Sept 2026, see podDayOverrides above) replaces the normal weekly
  // block computation entirely for this exact date — whether or not a real weekly block even exists
  // here — and every consumer of podCoverageDetail (search, booking, session generation/reassignment,
  // the coverage grid's own display) picks it up automatically by going through this one function.
  const dayOv=dayOverrideFor(podId, toKey(date));
  if(dayOv){
    if(!dayOv.instructorId) return {gapMinutes:duration, ok:false, primaryInstructorId:null, secondaryInstructorId:null, handoffAt:null};
    const covStart=Math.max(dayOv.start,start), covEnd=Math.min(dayOv.end,end);
    const covered=Math.max(0, covEnd-covStart);
    return {gapMinutes:duration-covered, ok:(duration-covered)<=UNATTENDED_TOLERANCE_MIN, primaryInstructorId: covered>0? dayOv.instructorId : null, secondaryInstructorId:null, handoffAt:null};
  }
  const segs=podBlocksForDay(podId, weekday)
    .map(function(b){ return {start:Math.max(b.start,start), end:Math.min(b.end,end), instructorId:blockInstructorOn(b, date)}; })
    .filter(function(s){ return s.instructorId && s.end>s.start; })
    .sort(function(a,b){ return a.start-b.start; });
  let cursor=start, gapMinutes=0;
  let primaryInstructorId=null, primaryLen=-1;
  segs.forEach(function(s){
    if(s.start>cursor) gapMinutes+=s.start-cursor;
    cursor=Math.max(cursor, s.end);
    const len=s.end-s.start;
    if(len>primaryLen){ primaryLen=len; primaryInstructorId=s.instructorId; }
  });
  if(cursor<end) gapMinutes+=end-cursor;
  // A genuine back-to-back handoff: the first real segment doesn't reach the end, but a DIFFERENT
  // instructor's segment picks up at exactly that boundary with no gap at all.
  let secondaryInstructorId=null, handoffAt=null;
  if(segs.length>=2){
    for(let i=0;i<segs.length-1;i++){
      if(segs[i].end<end && segs[i+1].start===segs[i].end && segs[i+1].instructorId!==segs[i].instructorId){
        primaryInstructorId=segs[i].instructorId; secondaryInstructorId=segs[i+1].instructorId; handoffAt=segs[i+1].start;
        break;
      }
    }
  }
  return {gapMinutes:gapMinutes, ok:gapMinutes<=UNATTENDED_TOLERANCE_MIN, primaryInstructorId:primaryInstructorId, secondaryInstructorId:secondaryInstructorId, handoffAt:handoffAt};
}

// Moves an already-booked/seated session to a different Pod — front desk can do this for any
// student, and an instructor can do it for a student currently checked in at their own Pod.
// Re-resolves instructor coverage for the new Pod at the same day/time; blocked if the target
// Pod is already at capacity for that window.
function movePodSession(sessionId, newPodId){
  const sess=findSession(sessionId);
  if(!sess) return {ok:false, error:'Session not found.'};
  if(sess.podId===newPodId) return {ok:true};
  const newPod=findPod(newPodId);
  const dateKey=toKey(sess.date);
  const weekday=WEEKDAY_KEYS[(sess.date.getDay()+6)%7];
  const student=findStudent(sess.studentId);
  const cap=podCapacity(newPodId);
  // The 1:8 ratio is only enforced when moving a session dated in the future — locking in a seat
  // that isn't a physical reality yet. Once it's actually the day of the session, front desk is
  // looking at the real room, not a projection, and needs to be able to seat a student wherever
  // makes sense right then without the system refusing on their behalf (Sept 2026, per Allie: "on
  // the day students can be moved to other pods, disregarding pod fullness"). A future-dated move
  // still needs the check — this only relaxes same-day, real-time adjustments.
  const isToday=dateKey===toKey(simNow());
  if(!isToday && podCapacityBlocked(newPodId, dateKey, {start:sess.start, duration:sess.duration})){
    return {ok:false, error:newPod.name+' is already full at that time ('+cap+'/'+cap+') — pick another Pod.'};
  }
  const oldPod=findPod(sess.podId);
  const cov=podCoverageDetail(newPodId, weekday, sess.start, sess.duration, sess.date); // tolerant of a short unattended gap, same as everywhere else (UNATTENDED_TOLERANCE_MIN)
  sess.podId=newPodId;
  sess.instructorId=cov.primaryInstructorId;
  sess.instructorId2=cov.secondaryInstructorId;
  sess.handoff=cov.handoffAt;
  sess.online=false; // moving into a physical Pod always leaves any prior Online assignment behind
  dbWrite('moving a session to a different Pod', function(){ return supabaseClient.from('sessions').update({
    pod_id:sess.podId, instructor_id:sess.instructorId, instructor_id_2:sess.instructorId2, handoff_min:sess.handoff, online:false
  }).eq('id', sess.id); });
  return {ok:true, oldPod:oldPod, newPod:newPod};
}

// Online equivalent of movePodSession() — puts an already-booked session onto an instructor's
// Online group instead of a physical Pod. No coverage/handoff to resolve (the instructor is already
// on shift running a Pod; online just piggybacks on that) — the only thing that can say no is the
// combined 1:9 ratio (instructorOnlineBlocked). Used by every "location" picker (Schedule list row,
// check-in modal, move modal) whenever "Online — [instructor]" is chosen for an existing session.
function setSessionOnline(sessionId, instructorId){
  const sess=findSession(sessionId);
  if(!sess) return {ok:false, error:'Session not found.'};
  if(sess.online && sess.instructorId===instructorId) return {ok:true};
  const instr=findInstructor(instructorId);
  const dateKey=toKey(sess.date);
  if(instructorOnlineBlocked(instructorId, dateKey, sess.start, sess.duration, sess.id)){
    const peak=instructorCombinedPeak(instructorId, dateKey, {start:sess.start, duration:sess.duration}, sess.id);
    return {ok:false, error:'Blocked — this would put '+instr.name+"'s Online group over the combined ratio ("+peak+'/'+combinedCapFor(instructorId)+').'};
  }
  const oldPod=sess.podId? findPod(sess.podId) : null;
  const wasOnline=sess.online;
  sess.podId=null; sess.instructorId=instructorId; sess.instructorId2=null; sess.handoff=null; sess.online=true;
  dbWrite('moving a session online', function(){ return supabaseClient.from('sessions').update({
    pod_id:null, instructor_id:sess.instructorId, instructor_id_2:null, handoff_min:null, online:true
  }).eq('id', sess.id); });
  return {ok:true, oldPod:oldPod, wasOnline:wasOnline, instr:instr};
}

// The single onchange handler every Pod/Online <select> wires to (see locationOptionsHtml) — routes
// to the physical-Pod path or the Online path depending on which the value encodes.
function setSessionLocation(sessionId, value){
  if(String(value).indexOf('online:')===0){
    const sess=findSession(sessionId);
    const student=findStudent(sess.studentId);
    const result=setSessionOnline(sessionId, value.slice(7));
    if(!result.ok){ toast(result.error); render(); return; }
    toast(result.oldPod? (student.name+' moved from '+result.oldPod.name+' to Online — '+result.instr.name+'.')
      : result.wasOnline? (student.name+' moved to Online — '+result.instr.name+'.')
      : (student.name+' assigned to Online — '+result.instr.name+'.'));
    render();
  } else {
    setSessionPod(sessionId, value);
  }
}

function studentOverlapClash(studentId, dateKey, start, duration, excludeSessionId){
  const end=start+duration;
  return sessions.some(function(s){
    return s.studentId===studentId && s.status!=='cancelled' && s.id!==excludeSessionId
      && toKey(s.date)===dateKey && s.start<end && start<s.start+s.duration;
  });
}

function possibleStarts(duration){
  const arr=[];
  for(let t=CENTER_OPEN; t+duration<=CENTER_CLOSE; t+=START_STEP) arr.push(t);
  return arr;
}

// Whether a covering instructor's "best suited for" range (5.3) includes a given year — a
// preference used for Pod ranking, never a hard requirement: every instructor can actually teach
// any year (5.3), so this only ever nudges which Pod gets picked, and is never a reason a booking
// or auto-assignment gets blocked.
function instructorSuitedFor(instr, year){ return year>=instr.yearMin && year<=instr.yearMax; }

// Age-based Pod seating (5.21/5.21c/MAX_YEAR_GAP_IN_POD) — REMOVED ENTIRELY per Allie (Sept 2026):
// the only requirement for booking a session into a Pod is now capacity (the 1:8 ratio) plus
// actual instructor coverage. There's no minimum year per Pod, no cap on how far apart two
// students sharing a Pod can be in age, and no "senior tiers first" preference — front desk (or
// auto-assignment) can put any student in any staffed, under-capacity Pod, no warning and no
// override checkbox. podEligibleForYear is kept as an always-true stub purely so any code that
// still calls it (there shouldn't be much left) doesn't need to change too.
function podEligibleForYear(podId, year){
  return true;
}

// Auto-assignment used wherever the system (not staff directly) needs to pick a Pod: parent
// make-up booking and standing-schedule pre-booking. The only requirements are the same two that
// gate any booking: the Pod must actually be staffed for the full window (a single instructor —
// auto-assignment never arranges a handoff; that's a staff judgment call, see 5.1/5.8), and it
// must have room (the 1:8 ratio). No age consideration at all (Sept 2026) — this simply returns
// the first staffed, under-capacity Pod, in the Pods list's own order, so which Pod fills first is
// predictable rather than picked by any ranking. Within a tie there's nothing further to break —
// first eligible wins.
// Picks an available, under-capacity Pod for a standing/auto-generated session. If `preferredPodId`
// is given (a student's pinned standing Pod — see studentAssignedPodOn()), only that Pod is
// considered — a pin is front desk's own explicit call, feasible-or-not there's no falling back to
// a different Pod behind the family's back; infeasible just means this occurrence is skipped, same
// as any other gap (5.8).
function pickBestPod(weekday, dateKey, start, duration, year, preferredPodId){
  const date=new Date(dateKey);
  if(preferredPodId){
    const pod=findPod(preferredPodId);
    if(!pod) return null;
    const cov=podCoverageDetail(pod.id, weekday, start, duration, date);
    if(!cov.primaryInstructorId || !cov.ok) return null; // no instructor nearby, or more than the tolerated unattended gap
    if(podCapacityBlocked(pod.id, dateKey, {start, duration})) return null;
    return pod.id;
  }
  for(let i=0;i<pods.length;i++){
    const podId=pods[i].id;
    const cov=podCoverageDetail(podId, weekday, start, duration, date);
    if(!cov.primaryInstructorId || !cov.ok) continue; // no instructor nearby, or more than the tolerated unattended gap
    if(podCapacityBlocked(podId, dateKey, {start, duration})) continue;
    return podId;
  }
  return null;
}

// Diagnostic used right after enrolling a student or saving their regular schedule (5.10): a
// selected day/time can be entered just fine but never actually get seated anywhere if no Pod has
// an instructor covering it yet (pickBestPod above returns null and generateRecurringSessions still
// creates the occurrence, just unassigned — visible in the Schedule tab's "Unassigned" section, but
// easy to miss right after enrolling with zero feedback in the moment). This checks each selected
// slot against every Pod's CURRENT
// coverage (today's roster — a reasonable proxy for a weekly-recurring pattern), applying the same
// minimum-year eligibility pickBestPod itself now enforces (5.21c) — a Pod that's staffed but below
// this student's required minimum doesn't count as "covered" here either, since pickBestPod would
// never actually use it. Returns the slots where nothing this student actually qualifies for is
// assigned anywhere, so the toast can name them and point to the fix (Schedule tab -> Assign)
// instead of silently pre-booking 0 sessions.
function slotsWithoutCoverage(slots, duration, year){
  const date=simNow();
  return (slots||[]).filter(function(slot){
    return !pods.some(function(pod){
      if(!podEligibleForYear(pod.id, year)) return false;
      return podCoverageDetail(pod.id, slot.weekday, slot.start, duration, date).ok;
    });
  });
}
function describeUncoveredSlots(slots){
  return slots.map(function(r){ return r.weekday+' '+minToLabel(r.start); }).join(', ');
}

// Same "today's roster as a reasonable proxy for a weekly-recurring pattern" approach as
// slotsWithoutCoverage() above, but as a plain yes/no for one single day/time — used by the parent's
// own schedule-change-request form to show live feedback next to whichever new day/time they've
// picked (Sept 2026, per Allie: "it needs to show the current scheduled days and times, and allow
// for a parent to select when they would like to come in instead"), and to decide whether a "Join
// waitlist" button belongs there instead (see joinWaitlistFromTimeChangeRequest()).
function standingSlotHasAvailability(weekday, start, duration, year){
  // Must check capacity against THIS weekday's own next real occurrence, not always today
  // (Sept 2026, per Allie: "when selecting new day its showing full availability, when that's not
  // the case"). podCapacityBlocked (called inside pickBestPod) looks up actual booked `sessions` on
  // one specific calendar date — passing today's date while asking about, say, a Friday slot meant
  // checking today's own (usually near-empty, unless today happens to be Friday) session list
  // instead of the real Friday occurrence's real headcount, so every weekday except today
  // effectively always came back "available" regardless of how full it actually was. Instructor
  // coverage itself is a pure weekday+time pattern and never depended on the specific date, so this
  // only ever affected the capacity half of the check.
  const occurrence=nextRegularOccurrence(weekday, simNow());
  return !!pickBestPod(weekday, toKey(occurrence), start, duration, year);
}

function creditDisplayStatus(c){
  const now=simNow();
  if(c.status==='redeemed'){
    const sess=findSession(c.redeemedSessionId);
    if(sess && sess.status==='cancelled'){ return 'cancelled-int'; }
    if(sess && new Date(toKey(sess.date)) < new Date(toKey(now)) ){ return 'completed'; }
    return 'booked';
  }
  if(c.status==='expired') return 'expired';
  if(new Date(toKey(c.expiryDate)) < new Date(toKey(now))) return 'expired';
  if(daysUntil(now,c.expiryDate) <= CREDIT_EXPIRY_NOTICE_DAYS) return 'soon';
  return 'available';
}

function toast(msg, ms){ state.toast=msg; render(); setTimeout(function(){ state.toast=null; render(); }, ms||3400); }

/* ---------- standing weekly schedule (pre-booking) ---------- */
// Front-desk-only "hold": the student keeps their standing recurring pattern (it isn't touched),
// but no session gets generated — or an already-generated one gets cancelled — for any date that
// falls inside a hold's date range. Because capacity is always computed from actual `sessions`
// records, a held date simply has one fewer occupant, which is exactly what makes that Pod slot
// available for a one-off booking during the hold.
function isStudentOnHold(studentId, date){
  const student=findStudent(studentId);
  const dateKey=toKey(date);
  return (student.holds||[]).some(function(h){ return toKey(h.start)<=dateKey && dateKey<=toKey(h.end); });
}
// The soonest hold that hasn't fully ended yet (current or upcoming) — used for the Students panel badge.
function currentOrUpcomingHold(studentId){
  const now=simNow();
  const student=findStudent(studentId);
  return (student.holds||[]).filter(function(h){ return toKey(h.end)>=toKey(now); })
    .sort(function(a,b){ return toKey(a.start).localeCompare(toKey(b.start)); })[0] || null;
}

/* ---------- Inactive students/parents ---------- */
// A student is "inactive" once their enrolment has actually stopped (stoppedFrom set by
// applyPlanChanges() promoting a "stop" plan change) — separate from a hold, which is temporary
// and keeps the standing plan intact. A parent has no separate active/inactive flag of its own —
// it's simply inactive when every one of its children is. Deliberately a dead end from the app's
// own UI (Sept 2026, per Allie: "when deactivating a student/parent, delete them entirely") — once
// stopped, they drop off every list (there's no "Inactive Students/Parents" panel to browse and no
// duplicate-detection/reactivate flow when re-enrolling someone with the same name or email), but
// their historical sessions, credits, and attendance are untouched in the database. Re-enrolling
// the same real person later just creates a fresh, independent record.
function isStudentInactive(student){ return !!(student && student.stoppedFrom); }
function isParentInactive(parent){
  const kids=(parent.studentIds||[]).map(findStudent).filter(Boolean);
  return kids.length>0 && kids.every(isStudentInactive);
}

// A student's enrollment plan (sessions/week + standing days) is normally just the current
// student.recurring/sessionsPerWeek fields — kept up to date by applyPlanChanges() below. But
// front desk can also schedule a plan change ("stop attending" or "change to Nx/week") to take
// effect from a future date, without disturbing the plan between now and then. student.planChanges
// holds those not-yet-effective changes; this resolves which plan governs a specific date.
function studentPlanOn(studentId, date){
  const student=findStudent(studentId);
  const dateKey=toKey(date);
  const pending=(student.planChanges||[]).filter(function(pc){ return toKey(pc.effectiveFrom)<=dateKey; });
  if(pending.length===0) return {sessionsPerWeek:student.sessionsPerWeek, recurring:student.recurring, stopped:false};
  pending.sort(function(a,b){ return toKey(a.effectiveFrom).localeCompare(toKey(b.effectiveFrom)); });
  const active=pending[pending.length-1];
  return {sessionsPerWeek: active.stopped?0:active.sessionsPerWeek, recurring: active.stopped?[]:active.recurring, stopped:!!active.stopped};
}
// Promotes any scheduled plan change whose effective date has arrived into the student's actual
// current plan (student.recurring/sessionsPerWeek), so ordinary display code always just reads
// "today's plan" directly. Mirrors applyPromotions() — run on every clock tick.
function applyPlanChanges(){
  let appliedCount=0;
  students.forEach(function(student){
    const due=(student.planChanges||[]).filter(function(pc){ return toKey(pc.effectiveFrom)<=toKey(simNow()); });
    if(due.length===0) return;
    due.sort(function(a,b){ return toKey(a.effectiveFrom).localeCompare(toKey(b.effectiveFrom)); });
    const latest=due[due.length-1];
    student.sessionsPerWeek = latest.stopped? 0 : latest.sessionsPerWeek;
    student.recurring = latest.stopped? [] : latest.recurring;
    student.stoppedFrom = latest.stopped? latest.effectiveFrom : null;
    student.planChanges = (student.planChanges||[]).filter(function(pc){ return toKey(pc.effectiveFrom) > toKey(simNow()); });
    appliedCount++;
  });
  return appliedCount;
}
function currentOrUpcomingPlanChange(studentId){
  const student=findStudent(studentId);
  return (student.planChanges||[]).slice().sort(function(a,b){ return toKey(a.effectiveFrom).localeCompare(toKey(b.effectiveFrom)); })[0] || null;
}

// Every active student whose enrolment officially starts today (student.startDate, set at
// enrollment — see openNewStudentForm/saveNewStudent) — drives both the Today-tab "First day"
// warning (renderFirstDayPanel) and the instructor-side "First day!" tag on their session (Sept
// 2026, per Allie: "i need it to let me set start date... it come up as a warning on the top of
// today tab... first day during their first session when sitting with an instructor"). A student
// enrolled with no start date on file at all (legacy data from before this feature) never matches —
// nothing to warn about.
function isStudentStartingToday(student){
  return !!(student && student.startDate && toKey(student.startDate)===toKey(simNow()));
}
function studentsStartingToday(){
  return students.filter(function(s){ return !isStudentInactive(s) && isStudentStartingToday(s); })
    .sort(function(a,b){ return a.name.localeCompare(b.name); });
}

/* ---------- plan changes: stop or change frequency from a future date (5.16b) ---------- */
function openPlanChangeForm(studentId){
  const student=findStudent(studentId);
  state.planChangeForm={
    studentId, mode:'stop', effectiveFrom:toKey(simNow()),
    sessionsPerWeek: student.sessionsPerWeek,
    recurring: (student.recurring||[]).map(function(r){ return {weekday:r.weekday, start:r.start}; }),
    // Untouched snapshot of the row-for-row CURRENT pattern, purely for display (see
    // renderRecurringPickers' originals param) — recurring above is the editable copy and gets
    // overwritten in place as rows change, so without this there'd be nothing left showing what a
    // row used to be once you'd already changed it (Sept 2026, per Allie: "it needs to state his
    // currently scheduled sessions... particularly necessary for students who might only need to
    // move one session, not both").
    originalRecurring: (student.recurring||[]).map(function(r){ return {weekday:r.weekday, start:r.start}; }),
    error:''
  };
  render();
}
function closePlanChangeForm(){ state.planChangeForm=null; render(); }
function setPlanChangeMode(mode){ state.planChangeForm.mode=mode; state.planChangeForm.error=''; render(); }
function setPlanChangeField(field, value){ state.planChangeForm[field]=value; state.planChangeForm.error=''; render(); }
function setPlanChangeSessionsPerWeek(v){
  const f=state.planChangeForm;
  const student=findStudent(f.studentId);
  f.sessionsPerWeek=Number(v);
  const starts=possibleStarts(student.duration);
  while(f.recurring.length<f.sessionsPerWeek) f.recurring.push({weekday:'Mon', start:starts[0]});
  f.recurring=f.recurring.slice(0,f.sessionsPerWeek);
  f.error='';
  render();
}
function setPlanChangeRecurringSlot(idx, field, value){
  state.planChangeForm.recurring[idx][field] = field==='start'? Number(value) : value;
  render();
}
function savePlanChange(){
  const f=state.planChangeForm;
  const student=findStudent(f.studentId);
  if(!f.effectiveFrom){ f.error='Choose an effective date.'; render(); return; }
  if(toKey(new Date(f.effectiveFrom))<toKey(simNow())){ f.error='Effective date must be today or in the future.'; render(); return; }
  const stopped = f.mode==='stop';
  if(!stopped && f.recurring.length===0){ f.error='Add at least one standing day/time.'; render(); return; }
  const change={
    id:newId()||('pc'+(nextPlanChangeId++)),
    effectiveFrom:new Date(f.effectiveFrom), stopped,
    sessionsPerWeek: stopped? 0 : Number(f.sessionsPerWeek),
    recurring: stopped? [] : f.recurring.map(function(r){ return {weekday:r.weekday, start:r.start}; }),
  };
  // One pending change per effective date — re-saving the same date replaces it, same convention
  // as the standing Pod pin (saveStudentPodAssignment) uses for its own dated history.
  student.planChanges = (student.planChanges||[]).filter(function(pc){ return toKey(pc.effectiveFrom)!==f.effectiveFrom; });
  student.planChanges.push(change);

  // Clear out already-generated future occurrences from the effective date forward — same as a
  // standing Pod pin (saveStudentPodAssignment) — so a "stop" or a frequency change actually takes
  // hold for every upcoming session, not just ones not yet generated. Restores any linked make-up
  // credit first, same as any other cancellation (5.11).
  //
  // Stopping outright (per Allie, Sept 2026) REMOVES every upcoming STANDING session entirely —
  // it was only ever an auto-generated placeholder, and deleting it frees up its Pod seat right
  // away instead of leaving 'cancelled' clutter behind. A one-off/make-up session is a specific
  // booking someone actually arranged, so even when the enrolment stops it's still soft-cancelled
  // (kept, marked 'cancelled') rather than deleted — same as cancelling any other single session.
  // A frequency/day-time change (not a full stop) is different again: only standing sessions are
  // touched at all, and even those are just soft-cancelled, since regenerateAllRecurring()
  // immediately replaces them with the new pattern — a one-off/staff-placed session is untouched.
  let movedCount=0;
  const deleteIds=[];
  sessions.forEach(function(s){
    if(s.studentId!==student.id || s.status!=='scheduled') return;
    if(toKey(s.date) < f.effectiveFrom) return;
    if(!stopped && !s.recurring) return;
    movedCount++;
    if(stopped && s.recurring){
      deleteIds.push(s.id);
      dbWrite('deleting a standing session for an ended enrolment', function(){ return supabaseClient.from('sessions').delete().eq('id', s.id); });
    } else {
      s.status='cancelled';
      dbWrite('cancelling a session for a plan change', function(){ return supabaseClient.from('sessions').update({status:'cancelled'}).eq('id', s.id); });
    }
    if(s.creditId){
      const cr=findCredit(s.creditId);
      if(cr && cr.status==='redeemed' && toKey(cr.expiryDate)>=toKey(simNow())){
        cr.status='available'; cr.redeemedSessionId=null;
        dbWrite('restoring a make-up credit', function(){ return supabaseClient.from('credits').update({status:'available', redeemed_session_id:null}).eq('id', cr.id); });
      }
    }
  });
  if(deleteIds.length) sessions=sessions.filter(function(s){ return deleteIds.indexOf(s.id)===-1; });

  dbWrite('scheduling a plan change', function(){
    // Deleting any existing row for this exact date first (cascades its own recurring rows) keeps
    // this idempotent on re-save, same as the local array replace above.
    return supabaseClient.from('student_plan_changes').delete().eq('student_id', student.id).eq('effective_from', f.effectiveFrom).then(function(){
      return supabaseClient.from('student_plan_changes').insert({
        id:change.id, student_id:student.id, effective_from:f.effectiveFrom, stopped:stopped, sessions_per_week:change.sessionsPerWeek
      });
    }).then(function(r){
      if(r.error || stopped || !change.recurring.length) return r;
      return supabaseClient.from('student_plan_change_recurring').insert(change.recurring.map(function(rec){
        return {plan_change_id:change.id, weekday:rec.weekday, start_min:rec.start};
      }));
    });
  });
  regenerateAllRecurring();
  toast(student.name+(stopped
    ? ' scheduled to stop attending from '+fmtShort(new Date(f.effectiveFrom))+'.'
    : '’s schedule changing to '+change.sessionsPerWeek+'x/week from '+fmtShort(new Date(f.effectiveFrom))+'.')
    +(movedCount? (stopped
      ? ' '+movedCount+' upcoming session'+(movedCount===1?'':'s')+' cleared (standing ones removed, any one-off bookings kept as cancelled).'
      : ' '+movedCount+' upcoming standing session'+(movedCount===1?'':'s')+' regenerated to match.') : ''));
  state.planChangeForm=null;
  render();
}
function cancelPlanChange(studentId, effectiveFromKey){
  const student=findStudent(studentId);
  student.planChanges=(student.planChanges||[]).filter(function(pc){ return toKey(pc.effectiveFrom)!==effectiveFromKey; });
  dbWrite('cancelling a scheduled plan change', function(){ return supabaseClient.from('student_plan_changes').delete()
    .eq('student_id', studentId).eq('effective_from', effectiveFromKey); });
  const made=regenerateAllRecurring();
  toast('Scheduled plan change removed'+(made>0? ' — '+made+' standing session(s) re-booked.' : '.'));
  render();
}

// Same underlying mechanism as savePlanChange()'s "stop attending" mode, just invoked from
// approving a parent's cancel-enrolment request rather than from front desk's own form.
function applyStopEnrollment(student, effectiveFrom, note){
  const effKey=toKey(effectiveFrom);
  const change={id:newId()||('pc'+(nextPlanChangeId++)), effectiveFrom:effectiveFrom, stopped:true, sessionsPerWeek:0, recurring:[]};
  student.planChanges=(student.planChanges||[]).filter(function(pc){ return toKey(pc.effectiveFrom)!==effKey; });
  student.planChanges.push(change);
  // Stopping enrolment outright REMOVES every upcoming STANDING session from that date forward —
  // deleted outright, not left as a 'cancelled' row, since it was only ever an auto-generated
  // placeholder and the whole point is to free up its Pod seat immediately (per Allie, Sept 2026).
  // A one-off/make-up session is different: it's a specific booking someone actually arranged, so
  // it's still soft-cancelled (kept, marked 'cancelled') rather than deleted — same as cancelling
  // any other single session. A linked make-up credit is restored first either way.
  let deletedCount=0;
  const deleteIds=[];
  sessions.forEach(function(s){
    if(s.studentId!==student.id || s.status!=='scheduled') return;
    if(toKey(s.date) < effKey) return;
    deletedCount++;
    if(s.recurring){
      deleteIds.push(s.id);
      dbWrite('deleting a standing session for an ended enrolment', function(){ return supabaseClient.from('sessions').delete().eq('id', s.id); });
    } else {
      s.status='cancelled';
      dbWrite('cancelling a one-off session for an ended enrolment', function(){ return supabaseClient.from('sessions').update({status:'cancelled'}).eq('id', s.id); });
    }
    if(s.creditId){
      const cr=findCredit(s.creditId);
      if(cr && cr.status==='redeemed' && toKey(cr.expiryDate)>=toKey(simNow())){
        cr.status='available'; cr.redeemedSessionId=null;
        dbWrite('restoring a make-up credit', function(){ return supabaseClient.from('credits').update({status:'available', redeemed_session_id:null}).eq('id', cr.id); });
      }
    }
  });
  sessions=sessions.filter(function(s){ return deleteIds.indexOf(s.id)===-1; });
  dbWrite('scheduling enrolment end', function(){
    return supabaseClient.from('student_plan_changes').delete().eq('student_id', student.id).eq('effective_from', effKey).then(function(){
      return supabaseClient.from('student_plan_changes').insert({id:change.id, student_id:student.id, effective_from:effKey, stopped:true, sessions_per_week:0});
    });
  });
  regenerateAllRecurring();
  toast(student.name+' scheduled to stop attending from '+fmtShort(effectiveFrom)+(deletedCount? ' — '+deletedCount+' upcoming session(s) cleared (standing ones removed, any one-off bookings kept as cancelled).' : '.')+(note? ' Parent\'s note: '+note : ''));
  return change;
}

// Same underlying mechanism as savePlanChange()'s "change frequency/day/time" mode (frequency
// stays whatever it already was — a time-change request only ever touches which day(s)/time(s)).
// Two callers: front desk approving an old (pre-Sept-2026) pending request via
// approveEnrollmentRequest(), and — since Sept 2026, per Allie: "as a parent, they should be able to
// change days and times permanently... without front desk permission" — a parent's own
// submitTimeChangeRequest() applying it directly and immediately, no approval step at all. `selfService`
// only changes the toast wording (a parent shouldn't see their own note quoted back at them
// third-person, the way front desk does when reviewing someone else's).
function applyTimeChange(student, effectiveFrom, recurring, note, selfService){
  const effKey=toKey(effectiveFrom);
  const change={id:newId()||('pc'+(nextPlanChangeId++)), effectiveFrom:effectiveFrom, stopped:false, sessionsPerWeek:recurring.length, recurring:recurring};
  student.planChanges=(student.planChanges||[]).filter(function(pc){ return toKey(pc.effectiveFrom)!==effKey; });
  student.planChanges.push(change);
  let movedCount=0;
  sessions.forEach(function(s){
    if(s.studentId!==student.id || !s.recurring || s.status!=='scheduled') return;
    if(toKey(s.date) < effKey) return;
    s.status='cancelled';
    movedCount++;
    dbWrite('cancelling a session for a schedule change', function(){ return supabaseClient.from('sessions').update({status:'cancelled'}).eq('id', s.id); });
    if(s.creditId){
      const cr=findCredit(s.creditId);
      if(cr && cr.status==='redeemed' && toKey(cr.expiryDate)>=toKey(simNow())){
        cr.status='available'; cr.redeemedSessionId=null;
        dbWrite('restoring a make-up credit', function(){ return supabaseClient.from('credits').update({status:'available', redeemed_session_id:null}).eq('id', cr.id); });
      }
    }
  });
  dbWrite('scheduling a time change', function(){
    return supabaseClient.from('student_plan_changes').delete().eq('student_id', student.id).eq('effective_from', effKey).then(function(){
      return supabaseClient.from('student_plan_changes').insert({id:change.id, student_id:student.id, effective_from:effKey, stopped:false, sessions_per_week:change.sessionsPerWeek});
    }).then(function(r){
      if(r.error || !change.recurring.length) return r;
      return supabaseClient.from('student_plan_change_recurring').insert(change.recurring.map(function(rec){
        return {plan_change_id:change.id, weekday:rec.weekday, start_min:rec.start};
      }));
    });
  });
  regenerateAllRecurring();
  const movedNote = movedCount? ' — '+movedCount+' upcoming standing session'+(movedCount===1?'':'s')+' regenerated to match.' : '.';
  if(selfService){
    toast(student.name+'\'s new schedule is '+recurringSummary({recurring:recurring})+' from '+fmtShort(effectiveFrom)+movedNote);
  } else {
    toast(student.name+'\'s schedule changing to '+recurringSummary({recurring:recurring})+' from '+fmtShort(effectiveFrom)+movedNote+(note? ' Parent\'s note: '+note : ''));
  }
  return change;
}

function approveEnrollmentRequest(id){
  const req=enrollmentRequests.find(function(r){ return r.id===id; });
  if(!req) return;
  const student=findStudent(req.studentId);
  // grantMakeupCredits is just "this came through the parent-request pipeline, so late-notice
  // credit logic applies where relevant" — applyHold() itself now checks each session's OWN
  // billing month for sufficient notice rather than one blanket check against the hold's start
  // date, so a hold spanning into a month that by now has plenty of notice correctly gets a plain
  // cancellation (no credit) for those later sessions even though the hold as a whole started late
  // (Sept 2026, per Allie: "any sessions that fall in the period of sufficient notice should just
  // be automatically cancelled").
  if(req.type==='hold'){ applyHold(student, req.start, req.end, req.note, true); }
  else if(req.type==='time_change'){ applyTimeChange(student, req.effectiveFrom, req.requestedRecurring||[], req.note); }
  else { applyStopEnrollment(student, req.effectiveFrom, req.note); }
  req.status='approved';
  dbWrite('approving an enrolment request', function(){ return supabaseClient.from('enrollment_requests').update({status:'approved'}).eq('id', req.id); });
  render();
}
function declineEnrollmentRequest(id){
  const req=enrollmentRequests.find(function(r){ return r.id===id; });
  if(!req) return;
  req.status='declined';
  dbWrite('declining an enrolment request', function(){ return supabaseClient.from('enrollment_requests').update({status:'declined'}).eq('id', req.id); });
  toast('Request declined.');
  render();
}

  }); });

    : 'Cancellation request sent to front desk.', late?7000:4000);

function openTimeChangeRequestForm(studentId){
  const student=findStudent(studentId);
  const hasCurrent=!!(student.recurring && student.recurring.length);
  // A student with no regular schedule on file yet — a brand-new join, or one whose standing
  // schedule was fully cancelled — gets to pick their own day(s)/time(s) from scratch instead of a
  // dead-end "contact us" message (Sept 2026, per Allie: "if no regular day/time on file then the
  // parent gets to select what best works for them"). Seeds one blank pickable slot per session per
  // week, each defaulted to a different weekday (so a 2x/week family doesn't see two identical
  // rows) and to the first genuinely open time for that day, when there is one — same open-times-
  // only picker as changing an existing slot (renderTimeChangeRecurringPickers), just with nothing
  // to frame as "current".
  const startsForDuration=possibleStarts(student.duration);
  const blankRecurring=hasCurrent? [] : Array.from({length: student.sessionsPerWeek||1}, function(_, idx){
    const weekday=WEEKDAY_KEYS[idx % WEEKDAY_KEYS.length];
    const openStart=startsForDuration.find(function(t){ return standingSlotHasAvailability(weekday, t, student.duration, student.year); });
    return {weekday:weekday, start: openStart!=null? openStart : startsForDuration[0]};
  });
  // currentRecurring is a frozen snapshot of the schedule as it stands today, kept alongside the
  // editable `recurring` (which starts as a copy of the same thing, but changes as the parent picks
  // a new day/time) — so the modal can always show "here's what you have now" even after they've
  // started picking something different (Sept 2026, per Allie: "it needs to show the current
  // scheduled days and times, and allow for a parent to select when they would like to come in
  // instead").
  state.timeChangeRequestForm={
    studentId, effectiveFrom:toKey(earliestMonthNoticeDate()),
    currentRecurring: (student.recurring||[]).map(function(r){ return {weekday:r.weekday, start:r.start}; }),
    recurring: hasCurrent? (student.recurring||[]).map(function(r){ return {weekday:r.weekday, start:r.start}; }) : blankRecurring,
    // Which of the child's current regular slots the parent is changing right now (Sept 2026, per
    // Allie: "Select the day you wish to cancel" — a dropdown listing the 1 or 2 days the child
    // attends, so a parent picks ONE to change at a time rather than every row being editable at
    // once). Defaults to the first (only) slot; a 2-slot child can switch which one the picker below
    // targets via setTimeChangeSelectedSlot(). null when there's no CURRENT regular schedule to pick
    // from — that dropdown wouldn't make sense with nothing to "cancel", so every blank row above
    // shows its own picker at once instead (see renderTimeChangeRequestModal).
    selectedSlotIdx: hasCurrent? 0 : null,
    note:'', error:''
  };
  render();
}

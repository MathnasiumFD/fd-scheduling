// Everything a parent should be told is changing about a child's schedule (5.20) — any front-desk-
// scheduled hold, plan change (stop / frequency change), or standing Pod move that hasn't taken
// effect yet. Purely informational on the parent side; they can't edit any of it themselves, only
// front desk can (5.4/5.9c/5.16b). An already-active hold is included too (still worth surfacing),
// but a Pod pin already in effect is not — only ones still ahead count as a "change".
function upcomingChangesForStudent(studentId){
  const out=[];
  const hold=currentOrUpcomingHold(studentId);
  if(hold) out.push({type:'hold', hold:hold});
  const planChange=currentOrUpcomingPlanChange(studentId);
  if(planChange) out.push({type:'plan', planChange:planChange});
  currentOrUpcomingPodAssignments(studentId)
    .filter(function(a){ return toKey(a.effectiveFrom) > toKey(simNow()); })
    .forEach(function(a){ out.push({type:'pod', podAssignment:a}); });
  return out;
}
function describeUpcomingChange(change){
  // effectiveFrom/date fields on these records may be a Date or a plain "YYYY-MM-DD" string
  // depending on how they were created (form saves always store a Date; a couple of these record
  // shapes — like planChanges, still without a dedicated save form — aren't fully pinned down yet).
  // new Date(x) accepts either, so wrap everything here rather than assume one or the other.
  if(change.type==='hold'){
    const h=change.hold;
    const active = toKey(h.start)<=toKey(simNow());
    return active
      ? '⏸️ Currently on hold through '+fmtShort(new Date(h.end))+(h.note? ' ('+h.note+')' : '')+' — sessions resume automatically after.'
      : '⏸️ Scheduled hold '+fmtShort(new Date(h.start))+'–'+fmtShort(new Date(h.end))+(h.note? ' ('+h.note+')' : '')+'.';
  }
  if(change.type==='plan'){
    const pc=change.planChange;
    return pc.stopped
      ? '📋 Scheduled to stop attending from '+fmtShort(new Date(pc.effectiveFrom))+'.'
      : '📋 Schedule changing to '+recurringSummary({recurring:pc.recurring})+' from '+fmtShort(new Date(pc.effectiveFrom))+'.';
  }
  if(change.type==='pod'){
    const a=change.podAssignment;
    return a.podId
      ? '↪️ Moving to '+findPod(a.podId).name+' from '+fmtShort(new Date(a.effectiveFrom))+'.'
      : '↪️ Returning to an auto-assigned Pod from '+fmtShort(new Date(a.effectiveFrom))+'.';
  }
  return '';
}

// A student's pinned standing Pod, if front desk has set one — resolved the same dated-history way
// as an instructor's own availability or a Pod shift's assignment: whichever entry has the latest
// effectiveFrom on or before the date wins. A null podId entry explicitly means "back to
// auto-assign" from that date forward; no entries at all (the normal case) means auto-assign has
// always applied — pickBestPod() picks freely among qualified, available, under-capacity Pods.
//
// A pin can optionally be scoped to a single weekday (a.weekday) — this is how a student who
// genuinely sits in a different Pod on different days (e.g. Pod 6 Monday, Pod 2 Tuesday) is
// represented, without one day's placement fighting the other's. A weekday-scoped pin always wins
// over an every-day pin (a.weekday null/unset) covering the same date, regardless of which was set
// more recently — it's the more specific instruction. Within the same specificity, whichever has
// the latest effectiveFrom on or before this date wins, same as before.
// The single standing pin currently in effect for this student on this date, whatever kind it is
// (a Pod, an Online instructor, or none at all — auto-assign) — shared by studentAssignedPodOn()
// and studentAssignedOnlineInstructorOn() below so both always agree on which entry is "latest",
// rather than risking two separately-written resolution passes drifting apart.
function latestStudentPodAssignment(studentId, date){
  const student=findStudent(studentId);
  const dateKey=toKey(date);
  const weekday=WEEKDAY_KEYS[(new Date(date).getDay()+6)%7];
  const applicable=(student.podAssignments||[]).filter(function(a){
    return toKey(a.effectiveFrom)<=dateKey && (!a.weekday || a.weekday===weekday);
  });
  if(applicable.length===0) return null;
  const daySpecific=applicable.filter(function(a){ return !!a.weekday; });
  const pool = daySpecific.length? daySpecific : applicable;
  pool.sort(function(a,b){ return toKey(a.effectiveFrom).localeCompare(toKey(b.effectiveFrom)); });
  return pool[pool.length-1];
}
function studentAssignedPodOn(studentId, date){
  const a=latestStudentPodAssignment(studentId, date);
  return a? a.podId : null;
}
// Online counterpart of studentAssignedPodOn() — null unless the currently-effective pin is
// specifically an Online one (5.32, per Allie: "moving forward how do i set them their assigned
// pod" / "i dont see the option to schedule them online" — the standing pin needed to support
// Online, not just physical Pods). Mutually exclusive with studentAssignedPodOn() by construction:
// whichever pin is latest, only one of the two ever comes back non-null for it.
function studentAssignedOnlineInstructorOn(studentId, date){
  const a=latestStudentPodAssignment(studentId, date);
  return a && a.online? a.instructorId : null;
}
function currentOrUpcomingPodAssignments(studentId){
  const student=findStudent(studentId);
  return (student.podAssignments||[]).slice().sort(function(a,b){ return toKey(a.effectiveFrom).localeCompare(toKey(b.effectiveFrom)); });
}

/* ---------- standing Pod pin (moving forward) ---------- */
function openStudentPodForm(studentId){
  // `location` uses the same encoded convention as every other Pod/Online picker in the app (see
  // sessionLocationValue): '' = auto-assign, a Pod's own id = that Pod, 'online:<instructorId>' =
  // that instructor's Online group.
  state.studentPodForm={studentId, location:'', effectiveFrom:toKey(simNow()), weekday:'', error:''};
  render();
}
function closeStudentPodForm(){ state.studentPodForm=null; render(); }
function setStudentPodField(field, value){
  state.studentPodForm[field]=value;
  state.studentPodForm.error='';
  render();
}
function saveStudentPodAssignment(){
  const f=state.studentPodForm;
  if(!f.effectiveFrom){ f.error='Choose an effective date.'; render(); return; }
  const weekday=f.weekday||null; // '' (or unset) means "every day"
  const student=findStudent(f.studentId);
  const isOnline=String(f.location).indexOf('online:')===0;
  const podId=isOnline? null : (f.location||null);
  const instructorId=isOnline? f.location.slice(7) : null;
  // Identity for "replacing" a prior pin is now (effectiveFrom, weekday) together, not just
  // effectiveFrom alone — a Monday pin and a Tuesday pin sharing the same effective date are two
  // separate, coexisting entries, not a conflict.
  student.podAssignments=(student.podAssignments||[]).filter(function(a){
    return !(toKey(a.effectiveFrom)===f.effectiveFrom && (a.weekday||null)===weekday);
  });
  student.podAssignments.push({podId:podId, online:isOnline, instructorId:instructorId, effectiveFrom:new Date(f.effectiveFrom), weekday:weekday});
  dbWrite('pinning standing Pod', function(){
    let q=supabaseClient.from('student_pod_assignments').delete().eq('student_id', student.id).eq('effective_from', f.effectiveFrom);
    q = weekday? q.eq('weekday', weekday) : q.is('weekday', null);
    return q.then(function(){
      return supabaseClient.from('student_pod_assignments').insert({student_id:student.id, pod_id:podId, online:isOnline, instructor_id:instructorId, effective_from:f.effectiveFrom, weekday:weekday});
    });
  });

  // Cancel already-generated future standing occurrences from the effective date forward, so the
  // new pin actually takes hold for every upcoming standing session — not just ones not yet
  // generated — restoring any linked make-up credit first, same as any other cancellation (5.11).
  // One-off/staff-placed sessions are left alone; only the auto-generated standing ones regenerate.
  // A weekday-scoped pin only touches sessions on that one weekday — every other day this student
  // attends is left completely alone, which is the whole point of scoping it.
  let movedCount=0;
  sessions.forEach(function(s){
    if(s.studentId!==student.id || !s.recurring || s.status!=='scheduled') return;
    if(toKey(s.date) < f.effectiveFrom) return;
    if(weekday && WEEKDAY_KEYS[(new Date(s.date).getDay()+6)%7]!==weekday) return;
    s.status='cancelled';
    movedCount++;
    dbWrite('cancelling a session for a Pod move', function(){ return supabaseClient.from('sessions').update({status:'cancelled'}).eq('id', s.id); });
    if(s.creditId){
      const cr=findCredit(s.creditId);
      if(cr && cr.status==='redeemed' && toKey(cr.expiryDate)>=toKey(simNow())){
        cr.status='available'; cr.redeemedSessionId=null;
        dbWrite('restoring a make-up credit', function(){ return supabaseClient.from('credits').update({status:'available', redeemed_session_id:null}).eq('id', cr.id); });
      }
    }
  });
  regenerateAllRecurring();
  const podName = isOnline? ('Online — '+findInstructor(instructorId).name) : (podId? findPod(podId).name : 'auto-assign');
  const dayLabel=weekday? ' on '+weekday+'s' : '';
  toast(student.name+' moves to '+podName+dayLabel+' from '+fmtShort(new Date(f.effectiveFrom))+(movedCount? ' — '+movedCount+' upcoming standing session'+(movedCount===1?'':'s')+' regenerated to match' : '')+'.');
  state.studentPodForm=null;
  render();
}
function removeStudentPodAssignment(studentId, effectiveFromKey, weekday){
  const student=findStudent(studentId);
  const wd=weekday||null;
  student.podAssignments=(student.podAssignments||[]).filter(function(a){
    return !(toKey(a.effectiveFrom)===effectiveFromKey && (a.weekday||null)===wd);
  });
  dbWrite('removing standing Pod pin', function(){
    let q=supabaseClient.from('student_pod_assignments').delete().eq('student_id', studentId).eq('effective_from', effectiveFromKey);
    q = wd? q.eq('weekday', wd) : q.is('weekday', null);
    return q;
  });
  regenerateAllRecurring();
  render();
}

// Resolves where one standing occurrence should land: an Online pin (if one applies and is
// currently feasible — the instructor is on shift and under the combined ratio at this exact
// day/time), else a Pod pin or auto-assign via pickBestPod (existing behavior, unchanged). An
// Online pin that's infeasible right now leaves the occurrence unassigned rather than silently
// falling back to a physical Pod — the same "pinned, no fallback" rule pickBestPod's own
// preferredPodId already follows (5.8/5.32).
function resolveStandingLocation(studentId, weekday, dateKey, date, start, duration, year){
  const onlineInstructorId=studentAssignedOnlineInstructorOn(studentId, date);
  if(onlineInstructorId){
    const onShift=instructorsOnShift(weekday, start, duration, date).some(function(i){ return i.id===onlineInstructorId; });
    const blocked=!onShift || instructorOnlineBlocked(onlineInstructorId, dateKey, start, duration, null);
    return blocked? {podId:null, online:false, instructorId:null} : {podId:null, online:true, instructorId:onlineInstructorId};
  }
  const pinnedPodId=studentAssignedPodOn(studentId, date); // front desk's standing Pod pin, if any (else auto-assign)
  const podId=pickBestPod(weekday, dateKey, start, duration, year, pinnedPodId);
  return {podId:podId||null, online:false, instructorId:null};
}
// deferredSessions is optional — when the caller passes an array, a newly-created occurrence's
// remote insert is pushed onto it instead of being fired immediately here (its LOCAL session object
// is still created and pushed onto `sessions` either way, so the UI updates exactly as before). Used
// by saveNewStudent() specifically: this function normally runs safely because the student it's
// generating for already exists in Supabase, but for a BRAND NEW student, firing these session
// inserts immediately races the student's own not-yet-committed insert — sessions.student_id is a
// real foreign key, so whichever request reaches Postgres first can make the other fail (Sept 2026,
// root cause of "when adding a student i'm getting an error code" / "...may not have saved").
// Deferring lets the caller insert them only once the student row is confirmed to exist.
function generateRecurringSessions(student, weeksAhead, deferredSessions){
  const startMonday=getMonday(simNow());
  let created=0;
  for(let w=0; w<weeksAhead; w++){
    const monday=addDays(startMonday, w*7);
    WEEKDAY_KEYS.forEach(function(weekday, dayIdx){
      const date=addDays(monday, dayIdx);
      if(date < new Date(toKey(simNow()))) return; // never backfill the past
      if(isClosedDate(date)) return; // centre's closed this day — never pre-book a regular session onto it
      const dateKey=toKey(date);
      if(isStudentOnHold(student.id, date)) return; // on hold — leave this occurrence unbooked
      const plan=studentPlanOn(student.id, date); // respects any scheduled stop/frequency change
      const slot=(plan.recurring||[]).find(function(r){ return r.weekday===weekday; });
      if(!slot) return; // this weekday isn't part of whichever plan governs this date
      const dup=sessions.find(function(s){ return s.studentId===student.id && toKey(s.date)===dateKey && s.start===slot.start && s.status!=='cancelled'; });
      if(dup){
        // Already exists — normally nothing to do. The one exception: a previously-unassigned
        // occurrence (see below) is always worth trying again, since regenerateAllRecurring() runs
        // on almost every write in this app — a pin changing, a new instructor being assigned, a
        // Pod freeing up — so it's the natural place for an unassigned session to self-heal the
        // moment something actually opens up, rather than sitting unassigned until someone happens
        // to notice and fix it by hand.
        if(dup.podId==null && !dup.online){
          const loc=resolveStandingLocation(student.id, weekday, dateKey, date, slot.start, student.duration, student.year);
          if(loc.podId || loc.online){
            if(loc.online){
              dup.podId=null; dup.online=true; dup.instructorId=loc.instructorId; dup.instructorId2=null; dup.handoff=null;
              dbWrite('filling a previously-unassigned standing session (Online)', function(){ return supabaseClient.from('sessions').update({
                pod_id:null, online:true, instructor_id:dup.instructorId, instructor_id_2:null, handoff_min:null
              }).eq('id', dup.id); });
            } else {
              const cov=podCoverageDetail(loc.podId, weekday, slot.start, student.duration, date);
              dup.podId=loc.podId; dup.instructorId=cov.primaryInstructorId; dup.instructorId2=cov.secondaryInstructorId; dup.handoff=cov.handoffAt;
              dbWrite('filling a previously-unassigned standing session', function(){ return supabaseClient.from('sessions').update({
                pod_id:dup.podId, instructor_id:dup.instructorId, instructor_id_2:dup.instructorId2, handoff_min:dup.handoff
              }).eq('id', dup.id); });
            }
            created++;
          }
        }
        return;
      }
      if(studentOverlapClash(student.id, dateKey, slot.start, student.duration, null)) return;
      const loc=resolveStandingLocation(student.id, weekday, dateKey, date, slot.start, student.duration, student.year);
      // No eligible Pod/Online instructor is staffed/available for this exact day+time (or nothing
      // was pinned and no Pod anywhere is staffed). This USED to mean the occurrence was simply
      // never created — a student's regular class could silently vanish for a day with nothing
      // anywhere to show it. Instead, still create the session, just with no Pod/instructor —
      // visible on the Schedule tab's "Unassigned" section so front desk can see and fix it
      // directly (assign a Pod once one opens up), rather than it disappearing unnoticed.
      const cov=loc.podId? podCoverageDetail(loc.podId, weekday, slot.start, student.duration, date) : {primaryInstructorId: loc.online? loc.instructorId : null, secondaryInstructorId:null, handoffAt:null}; // tolerant of a short unattended gap (UNATTENDED_TOLERANCE_MIN), same as pickBestPod just validated
      const recSess={id:newId()||('sess'+(nextSessionId++)), studentId:student.id, podId:loc.podId||null, online:!!loc.online, instructorId:cov.primaryInstructorId, instructorId2:cov.secondaryInstructorId, handoff:cov.handoffAt, date, start:slot.start, duration:student.duration, status:'scheduled', bookedBy:'staff', creditId:null, recurring:true};
      sessions.push(recSess);
      if(deferredSessions){
        deferredSessions.push(recSess);
      } else {
        dbWrite('pre-booking a standing session', function(){ return supabaseClient.from('sessions').insert({
          id:recSess.id, student_id:recSess.studentId, pod_id:recSess.podId, online:recSess.online, instructor_id:recSess.instructorId,
          instructor_id_2:recSess.instructorId2, handoff_min:recSess.handoff,
          the_date:toKey(recSess.date), start_min:recSess.start, duration:recSess.duration, status:recSess.status,
          booked_by:recSess.bookedBy, credit_id:recSess.creditId, is_recurring:true
        }); });
      }
      created++;
    });
  }
  return created;
}
function regenerateAllRecurring(){
  let total=0;
  students.forEach(function(s){ total+=generateRecurringSessions(s, HORIZON_WEEKS); });
  return total;
}
function recurringSummary(student){
  if(!student.recurring || student.recurring.length===0) return 'Not set';
  return student.recurring.map(function(r){ return r.weekday+' '+minToLabel(r.start); }).join(', ');
}

/* ---------- automatic school-year promotion ---------- */
function applyPromotions(){
  const idx=schoolYearIndex(simNow());
  let promoted=0;
  students.forEach(function(s){
    const target=Math.min(YEAR_CAP, s.baseYear + Math.max(0, idx - s.yearBaseline));
    if(s.year!==target){ s.year=target; promoted++; }
  });
  return promoted;
}

/* ---------- actions ---------- */
function setRole(r){ state.role=r; state.booking=null; state.parentBookingCreditId=null; render(); }

function advanceClock(days){
  state.offsetDays += days;
  const promoted=applyPromotions();
  applyPlanChanges();
  regenerateAllRecurring();
  if(promoted>0) toast(promoted+' student'+(promoted===1?'':'s')+' promoted to their next school year.');
  else render();
}
function resetClock(){ state.offsetDays=0; applyPromotions(); applyPlanChanges(); render(); }

// podId is optional now (Sept 2026) — the Schedule tab's "+ Book a session" button is no longer
// attached to a specific Pod's card (pod cards were replaced by one flat student list, see
// renderStaff()), so it opens with no Pod chosen yet; suggestBookingPod() below fills one in
// automatically once a student and time are picked, same "pre-filled, editable" pattern as
// everywhere else. Passing a podId directly still works for any caller that already knows which
// Pod it wants.
function openBooking(podId, dateKey){
  const d = new Date(dateKey);
  if(d < new Date(toKey(simNow()))) return; // can't book into the past
  const closure=closedDayFor(d);
  if(closure){ toast("The centre's marked closed that day (\""+closure.label+"\") — nothing can be booked onto it."); return; }
  const dur=90;
  state.booking={dateKey};
  // locationManual: true when a caller opened this with a specific Pod already in mind (e.g. the
  // old per-pod entry point, or any future explicit caller) — suggestBookingPod() must never stomp
  // on that as the student/time/duration are filled in, same as it never stomps on a manual pick
  // made via setBookingLocation() below. `location` is the same encoded value as everywhere else a
  // Pod/Online picker appears (see sessionLocationValue) — a Pod's own id, '' for unassigned, or
  // 'online:<instructorId>' for an Online group; pickBestPod (auto-suggest) only ever proposes a
  // physical Pod, never Online — that's always a deliberate manual pick.
  state.bookingForm={studentId:'', duration:dur, start:possibleStarts(dur)[0], location:podId||'', overrideOk:false, locationManual:!!podId, checkInNow:false};
  render();
}
function closeBooking(){ state.booking=null; render(); }

// Manually assigning a make-up session (Sept 2026, per Allie: "I need a button to manually assign
// make-up sessions") — opens the exact same booking modal front desk already uses for any other
// session, just pre-loaded for this credit's own student and tagged with the credit so confirming it
// redeems the credit instead of leaving it available. Unlike the parent's own self-service make-up
// picker (startBookMakeUp/openSlotsForCredit — a constrained list limited to the next 2 weeks, an
// auto-picked Pod, and no choice of date beyond that list), this gives front desk the full ordinary
// booking form: any date, any Pod or Online, editable length — for whenever a parent calls in and
// asks staff to just sort it out directly, rather than doing it themselves online.
function openBookingForCredit(creditId){
  const credit=findCredit(creditId);
  if(!credit || credit.status!=='available') return; // guards direct calls; the button itself only ever shows for an available credit
  const student=findStudent(credit.studentId);
  // Defaults to the nearest non-closed day from today (usually just today) — rolls forward day by
  // day rather than leaving staff to land on a day the centre's marked closed and have to change it
  // immediately; they can still pick any other date from the field below.
  let d=simNow();
  for(let i=0;i<14 && closedDayFor(d);i++){ d=addDays(d,1); }
  const dateKey=toKey(d);
  const dur=student.duration;
  state.booking={dateKey, creditId};
  state.bookingForm={studentId:student.id, duration:dur, start:possibleStarts(dur)[0], location:'', overrideOk:false, locationManual:false, checkInNow:false};
  suggestBookingPod();
  render();
}
// The booking modal's date field — only ever shown for a credit-based booking (see
// renderBookingModal); an ordinary booking's date comes from wherever it was opened (a specific
// day's "+ Book a session" button) and isn't editable in-modal at all.
function setBookingDate(v){
  if(new Date(v) < new Date(toKey(simNow()))){ toast("Can't book into the past."); return; }
  const closure=closedDayFor(new Date(v));
  if(closure){ toast("The centre's marked closed that day (\""+closure.label+"\") — pick a different date."); return; }
  state.booking.dateKey=v;
  state.bookingForm.overrideOk=false;
  suggestBookingPod();
  render();
}
// "They're here right now" — offered only for a same-day booking (see renderBookingModal): checks
// the student in immediately after confirmBooking() creates the session, instead of leaving front
// desk to find them in the Schedule list and click Check in separately a moment later. Exactly the
// walk-in case Allie described: a student whose usual day is different shows up unexpectedly today.
function setBookingCheckInNow(v){ state.bookingForm.checkInNow=!!v; render(); }

// Re-suggests a Pod via pickBestPod() (first staffed, under-capacity Pod — no age consideration,
// Sept 2026) whenever the student, start time, or duration changes — mirrors the "pre-filled,
// editable" default used for check-in/check-out times. Never runs once a location has been chosen
// manually — either via setBookingLocation() below, or by opening the form with an explicit Pod
// already in mind (locationManual, set in openBooking()). Passes the student's own standing Pod pin
// (their Preferred Pod from enrollment, or any later "Change Pod" — studentAssignedPodOn() resolves
// either) as pickBestPod's preferredPodId, so a fresh manual booking defaults to it too — this used
// to only happen for check-in's own auto-suggest and standing pre-booking, leaving a plain manual
// booking to ignore the pin entirely (5.30 fix).
function suggestBookingPod(){
  const f=state.bookingForm;
  if(f.locationManual) return;
  if(!f.studentId || f.start==null){ f.location=''; return; }
  const student=findStudent(f.studentId);
  const date=new Date(state.booking.dateKey);
  const weekday=WEEKDAY_KEYS[(date.getDay()+6)%7];
  // An Online pin (see studentAssignedOnlineInstructorOn) is checked first — same "hard pin, no
  // fallback" rule as a Pod pin: if it's pinned to Online but that instructor isn't actually
  // available right now, this suggests nothing at all rather than falling back to hunting for a
  // physical Pod instead (5.32).
  const onlineInstructorId=studentAssignedOnlineInstructorOn(student.id, date);
  if(onlineInstructorId){
    const eligible=instructorsOnShift(weekday, f.start, f.duration, date).some(function(i){ return i.id===onlineInstructorId; })
      && !instructorOnlineBlocked(onlineInstructorId, state.booking.dateKey, f.start, f.duration, null);
    f.location = eligible? ('online:'+onlineInstructorId) : '';
    return;
  }
  f.location = pickBestPod(weekday, state.booking.dateKey, f.start, f.duration, student.year, studentAssignedPodOn(student.id, date)) || '';
}

function setBookingStudent(sid){
  state.bookingForm.studentId=sid;

    state.bookingForm.duration=dur;

// Manual override (freely — no capacity/age blocking on the picker itself, Sept 2026) of the

function toggleOverride(){ state.bookingForm.overrideOk=!state.bookingForm.overrideOk; render(); }

// Applies the "they're here right now" quick check-in to a session that confirmBooking() just
// created, returning a note to tack onto the usual booking toast. Only ever invoked for a same-day
// booking (see the checkInNow guard in confirmBooking()) — arrival defaults to the same "nearest
// 5-minute mark, capped 3 minutes ahead" smart default the Check-in modal itself uses.
function checkInNewBookingNow(sess){
  const arrival=nearestOption(checkInArrivalOptions(sess), nowMinutesOfDay());
  const exitTime=autoExitTime(sess, arrival-sess.start);
  applyCheckIn(sess, arrival, exitTime);
  return ' Checked in immediately — running '+minToLabel(sess.actualStart)+'–'+minToLabel(sess.actualEnd)+'.';
}
// Marks the credit a booking was made against as redeemed, once the session it's tied to actually
// exists (mirrors what bookSlot() already does for the parent's own self-service flow) — a no-op
// when this booking wasn't for a credit at all (the ordinary case).
function redeemCreditForBooking(creditId, sessionId){
  if(!creditId) return;
  const credit=findCredit(creditId);
  if(!credit) return;
  credit.status='redeemed';
  credit.redeemedSessionId=sessionId;
  dbWrite('redeeming a make-up credit', function(){ return supabaseClient.from('credits').update({status:'redeemed', redeemed_session_id:sessionId}).eq('id', credit.id); });
}
function confirmBooking(){
  const b=state.booking; const f=state.bookingForm;
  if(!f.studentId || f.start==null) return;
  const dateKey=b.dateKey, date=new Date(dateKey);
  const student=findStudent(f.studentId);
  const isOnline = String(f.location).indexOf('online:')===0;
  const onlineInstructorId = isOnline? f.location.slice(7) : null;
  const pod = (!isOnline && f.location)? findPod(f.location) : null;
  const weekday=WEEKDAY_KEYS[(date.getDay()+6)%7];
  const end=f.start+f.duration;
  const checkInNow = !!f.checkInNow && dateKey===toKey(simNow());
  const creditId=b.creditId||null;

  if(studentOverlapClash(student.id, dateKey, f.start, f.duration, null)){
    toast('Blocked — '+student.name+' already has an overlapping session that day.');
    return;
  }

  // Online — no Pod, no coverage/handoff to resolve (the instructor's already on shift running a
  // Pod); the combined 1:9 ratio is the only thing that can say no.
  if(isOnline){
    const instr=findInstructor(onlineInstructorId);
    if(instructorOnlineBlocked(onlineInstructorId, dateKey, f.start, f.duration)){
      const peak=instructorCombinedPeak(onlineInstructorId, dateKey, {start:f.start, duration:f.duration});
      toast('Blocked — this would put '+instr.name+"'s Online group over the combined ratio ("+peak+'/'+ONLINE_COMBINED_CAP+').');
      return;
    }
    const newSess={id:newId()||('sess'+(nextSessionId++)), studentId:student.id, podId:null, instructorId:onlineInstructorId, instructorId2:null, handoff:null, online:true, date, start:f.start, duration:f.duration, status:'scheduled', bookedBy:'staff', creditId};
    sessions.push(newSess);
    dbWrite('booking an online session', function(){ return supabaseClient.from('sessions').insert({
      id:newSess.id, student_id:newSess.studentId, pod_id:null, instructor_id:newSess.instructorId, instructor_id_2:null, handoff_min:null, online:true,
      the_date:toKey(newSess.date), start_min:newSess.start, duration:newSess.duration, status:newSess.status, booked_by:newSess.bookedBy, credit_id:newSess.creditId
    }); });
    redeemCreditForBooking(creditId, newSess.id);
    let msg=(creditId? 'Make-up booked — ' : '')+student.name+' booked into Online — '+instr.name+', '+fmtShort(date)+' '+rangeLabel(f.start,f.duration)+'.';
    if(checkInNow) msg+=checkInNewBookingNow(newSess);
    toast(msg);
    state.booking=null;
    render();
    return;
  }

  // No Pod chosen at all — book it unassigned, same as any other slot nothing was staffed for
  // (5.10). Front desk can pick a Pod for it any time from the Schedule list.
  if(!pod){
    const newSess={id:newId()||('sess'+(nextSessionId++)), studentId:student.id, podId:null, instructorId:null, instructorId2:null, handoff:null, date, start:f.start, duration:f.duration, status:'scheduled', bookedBy:'staff', creditId};
    sessions.push(newSess);
    dbWrite('booking an unassigned session', function(){ return supabaseClient.from('sessions').insert({
      id:newSess.id, student_id:newSess.studentId, pod_id:null, instructor_id:null, instructor_id_2:null, handoff_min:null,
      the_date:toKey(newSess.date), start_min:newSess.start, duration:newSess.duration, status:newSess.status, booked_by:newSess.bookedBy, credit_id:newSess.creditId
    }); });
    redeemCreditForBooking(creditId, newSess.id);
    let msg=(creditId? 'Make-up booked — ' : '')+student.name+' booked '+fmtShort(date)+' '+rangeLabel(f.start,f.duration)+' — no Pod chosen, pick one any time from the Schedule list.';
    if(checkInNow) msg+=checkInNewBookingNow(newSess);
    toast(msg);
    state.booking=null;
    render();
    return;
  }

  // The only thing that can require an override for STAFFING is actual coverage: no instructor
  // anywhere near the window, or a real gap bigger than the tolerated 15 minutes unattended
  // (UNATTENDED_TOLERANCE_MIN). Capacity (the 1:8 ratio) used to be checked separately below and
  // was never override-able at all — but front desk already has a same-day capacity bypass for
  // MOVING an already-booked session (movePodSession, per Allie: "on the day students can be moved
  // to other pods, disregarding pod fullness"), and the only way to reach that for a brand-new
  // booking was the roundabout trick of booking it unassigned first, then moving it — something only
  // Allie herself was doing (Sept 2026, per Allie: "I also need all front staff to have the ability
  // to overbook a pod on the day, not just me"). So the exact same rule now applies directly here
  // too: a future-dated booking is still hard-capped at capacity, no override; a same-day booking can
  // go over, since front desk is looking at the real room, not a projection.
  const cov=podCoverageDetail(pod.id, weekday, f.start, f.duration, date);
  const totallyUnassigned = !cov.primaryInstructorId;
  const needsOverride = !cov.ok;

  if(needsOverride && !f.overrideOk) return; // needs explicit override checkbox

  const cap=podCapacity(pod.id);
  const isToday=dateKey===toKey(simNow());
  const wouldBePeak = peakConcurrency(pod.id, dateKey, {start:f.start, duration:f.duration});
  const overCapacityToday = isToday && wouldBePeak>cap;
  if(!isToday && podCapacityBlocked(pod.id, dateKey, {start:f.start, duration:f.duration})){
    toast('Blocked — this would put '+pod.name+' over capacity ('+wouldBePeak+'/'+cap+').');
    return;
  }

  const newSess={id:newId()||('sess'+(nextSessionId++)), studentId:student.id, podId:pod.id, instructorId: cov.primaryInstructorId, instructorId2: cov.secondaryInstructorId, handoff: cov.handoffAt, date, start:f.start, duration:f.duration, status:'scheduled', bookedBy:'staff', creditId};
  sessions.push(newSess);
  dbWrite('booking a session', function(){ return supabaseClient.from('sessions').insert({
    id:newSess.id, student_id:newSess.studentId, pod_id:newSess.podId, instructor_id:newSess.instructorId,
    instructor_id_2:newSess.instructorId2, handoff_min:newSess.handoff, the_date:toKey(newSess.date),
    start_min:newSess.start, duration:newSess.duration, status:newSess.status, booked_by:newSess.bookedBy, credit_id:newSess.creditId
  }); });
  redeemCreditForBooking(creditId, newSess.id);
  const handoffNote = cov.secondaryInstructorId? (' with a handoff to '+findInstructor(cov.secondaryInstructorId).name+' at '+minToLabel(cov.handoffAt)) : '';
  const withNote = cov.primaryInstructorId? (' with '+findInstructor(cov.primaryInstructorId).name) : '';
  const gapNote = (cov.gapMinutes>0 && cov.ok)? (' ('+cov.gapMinutes+' min unattended — within the '+UNATTENDED_TOLERANCE_MIN+'-min tolerance)') : '';
  const capacityNote = overCapacityToday? (' — over capacity ('+wouldBePeak+'/'+cap+'), allowed since it\'s today') : '';
  let msg=(creditId? 'Make-up booked — ' : '')+student.name+' booked into '+pod.name+withNote+', '+fmtShort(date)+' '+rangeLabel(f.start,f.duration)+handoffNote+gapNote+capacityNote+'.';
  if(checkInNow) msg+=checkInNewBookingNow(newSess);
  toast(msg);
  state.booking=null;
  render();
}

// A student who simply doesn't turn up is two very different situations to front desk (Sept 2026,
// per Allie: "I need to differentiate... the student not coming and having notified us thus getting
// a makeup credit, or the student just not showing up"). 'no-show' is the plain, un-notified case —
// no make-up credit, since nothing was arranged in advance. 'excused' is a family who called/messaged
// ahead of time to say they can't make it — treated exactly like any other advance-notice absence
// (a parent's own self-cancel, a centre closure): a make-up credit is issued, same 90-day rule.
function markStatus(sessionId, status){
  const sess=findSession(sessionId);
  sess.status=status;
  dbWrite('updating attendance', function(){ return supabaseClient.from('sessions').update({status}).eq('id', sess.id); });
  if(status==='excused'){
    const issued=sess.date;
    const expiry=addMonths(issued,3);
    const c={id:newId()||('c'+(nextCreditId++)), studentId:sess.studentId, issuedDate:issued, expiryDate:expiry, status:'available', redeemedSessionId:null, warningSent:false, source:'excused-absence', note:''};
    credits.push(c);
    dbWrite('issuing a make-up credit', function(){ return supabaseClient.from('credits').insert({
      id:c.id, student_id:c.studentId, issued_date:toKey(c.issuedDate), expiry_date:toKey(c.expiryDate),
      status:c.status, redeemed_session_id:c.redeemedSessionId, warning_sent:c.warningSent, source:c.source, note:c.note
    }); });
    toast(findStudent(sess.studentId).name+' marked excused (notified in advance) — a make-up credit was issued, expires '+fmtShort(expiry)+'.');
  } else if(status==='no-show'){
    toast(findStudent(sess.studentId).name+' marked as a no-show — no make-up credit issued, since nothing was arranged in advance.');
  } else {
    render();
  }
}

// Parent self-service cancellation (5.7-style rule, revised Sept 2026 per Allie): a parent can
// always cancel an individual upcoming session themselves — cancelling with notice (any day
// before today, or same-day but before the 10:00am cutoff) frees the slot and automatically
// issues a make-up credit, exactly like a front-desk no-show would, dated from the missed session
// and expiring 3 months later. Cancelling a same-day session AFTER the cutoff still goes through
// (it was previously refused outright here, which just meant a family had to phone in instead) —
// it just doesn't come with a make-up credit, since that's the same cutoff already used for
// booking make-ups (5.7). Both the confirm dialog and the resulting toast say so explicitly, so
// nobody cancels expecting a credit that isn't coming.
function parentCancelSession(sessionId){
  const sess=findSession(sessionId);
  if(!sess || sess.status!=='scheduled') return;
  const now=simNow();
  const pastCutoff = toKey(sess.date)===toKey(now) && sameDayMakeUpCutoffPassed();
  const student=findStudent(sess.studentId);
  const issued=sess.date, expiry=addMonths(issued,3);
  const confirmMsg = 'Cancel '+student.name+'\'s session?\n'+fmtLong(sess.date)+' at '+minToLabel(sess.start)+'\n\nThis will cancel this session only. '+student.name+'\'s regular session time will remain unchanged. '
    + (pastCutoff
      ? 'It\'s after the 10:00am same-day cutoff, so this cancellation will NOT come with a make-up credit.'
      : 'You\'ll get a make-up credit valid until '+fmtShort(expiry)+'.');
  if(!confirm(confirmMsg)) return;
  sess.status='cancelled';
  dbWrite('cancelling session (parent'+(pastCutoff?', after same-day cutoff — no make-up':', with notice')+')', function(){ return supabaseClient.from('sessions').update({status:'cancelled'}).eq('id', sess.id); });
  if(pastCutoff){
    toast('Session cancelled — no make-up credit was issued since it\'s after the 10:00am same-day cutoff. Call the centre if you\'d like to discuss options.', 6000);
    return;
  }
  const c={id:newId()||('c'+(nextCreditId++)), studentId:sess.studentId, issuedDate:issued, expiryDate:expiry, status:'available', redeemedSessionId:null, warningSent:false, source:'parent-cancel', note:''};
  credits.push(c);
  dbWrite('issuing a make-up credit', function(){ return supabaseClient.from('credits').insert({
    id:c.id, student_id:c.studentId, issued_date:toKey(c.issuedDate), expiry_date:toKey(c.expiryDate),
    status:c.status, redeemed_session_id:c.redeemedSessionId, warning_sent:c.warningSent, source:c.source, note:c.note
  }); });
  toast('Session cancelled — a make-up credit was added, valid until '+fmtShort(expiry)+'.');
}
function toggleViewAllSessions(sid){
  state.parentViewAllSessions = state.parentViewAllSessions || {};
  state.parentViewAllSessions[sid] = !state.parentViewAllSessions[sid];
  render();
}

// A student can be checked in for right now, or backdated earlier (catching up on one missed
// earlier in the shift), but not meaningfully into the future (5.29, per Allie) — so for a session
// dated TODAY, the latest selectable arrival is (effectively) the actual current clock; for one
// dated before today, "the future" isn't a meaningful idea (the whole day is already over), so the
// full center-hours range stays open, same as ever.
//
// "Effectively", because flooring strictly to the real clock (the original 5.29 behaviour) meant a
// student walking in at 3:58 always got rounded DOWN to 3:55 even though 4:00 — only two minutes
// away — was the genuinely closer 5-minute mark on the picker's own grid. Revised Sept 2026 per
// Allie: "round to the nearest 5 minutes, even if it's ahead of time, but never more than 3 minutes
// into the future." Rounding whole minutes to the nearest multiple of EXIT_STEP can only ever land
// up to 2 minutes ahead of the real clock, so the +3 ceiling below is a safety margin rather than
// something normal rounding will actually hit.
function checkInMaxArrival(sess){
  if(toKey(sess.date)!==toKey(simNow())) return CENTER_CLOSE;
  const now=nowMinutesOfDay();
  const nearestFive=Math.round(now/EXIT_STEP)*EXIT_STEP;
  return Math.min(nearestFive, now+3);
}
// The arrival dropdown's actual option list — CHECKIN_TIME_OPTIONS trimmed to whatever's not in the
// future per checkInMaxArrival() above. Falls back to just the center's opening time in the (very
// unlikely) case check-in is happening before the center has even opened for the day, so the list
// is never empty.
function checkInArrivalOptions(sess){
  const cap=checkInMaxArrival(sess);
  const options=CHECKIN_TIME_OPTIONS.filter(function(t){ return t<=cap; });
  return options.length? options : [CHECKIN_TIME_OPTIONS[0]];
}
// Defaults the arrival dropdown to whichever CHECKIN_TIME_OPTIONS value is closest to the real
// current clock (5.24, revised 5.27 to use an absolute time rather than an offset from this
// session's own scheduled start — see the comment on CHECKIN_TIME_OPTIONS above for why) — front
// desk is checking someone in AS they arrive, so "on time" is a poor default the moment that's not
// true; this saves having to manually correct it on every late (or early) check-in. Still fully
// overridable, down to any earlier time, but never a later one (5.29).
// Quick check-in/out student search (Sept 2026, per Allie: "a search-bar that suggests the closest
// matched student name, upon selecting it, it once again gives the option to change check in or
// check out time, as well as the pod they'll be sitting at") — matches only against today's own
// roster, and only the two states a quick action actually applies to: still to arrive (routes to
// Check-in, which already has its own Pod picker), or already here and not yet checked out (routes
// to Check-out). No-show/excused/cancelled/already-checked-out sessions are excluded — nothing left
// to do for those from this box.
function checkInSearchCandidates(query){
  const q=String(query||'').trim().toLowerCase();
  if(!q) return [];
  const todayKey=toKey(simNow());
  return sessions.filter(function(s){
    if(toKey(s.date)!==todayKey) return false;
    if(s.status==='attended' && s.checkedOut) return false;
    if(s.status!=='attended' && s.status!=='scheduled') return false;
    const student=findStudent(s.studentId);
    return student && student.name.toLowerCase().indexOf(q)!==-1;
  }).map(function(s){
    return {sess:s, name:findStudent(s.studentId).name};
  }).sort(function(a,b){
    const an=a.name.toLowerCase(), bn=b.name.toLowerCase();
    const aStarts=an.indexOf(q)===0, bStarts=bn.indexOf(q)===0;
    if(aStarts!==bStarts) return aStarts? -1 : 1;
    return a.name.localeCompare(b.name, undefined, {sensitivity:'base'});
  }).slice(0,8);
}
function setCheckInSearchQuery(v){ state.checkInSearchQuery=v; render(); }
// Picking a suggestion goes straight to whichever modal actually applies right now — Check-in
// (Pod + arrival time) if they haven't arrived yet, Check-out (exit time) if they're already here —
// instead of making front desk scroll the Schedule list or Pod seating section to find that same row.
function selectCheckInSearchResult(sessionId){
  const sess=findSession(sessionId);
  state.checkInSearchQuery='';
  if(!sess){ render(); return; }
  if(sess.status==='attended' && !sess.checkedOut){ openCheckOut(sessionId); }
  else { openCheckIn(sessionId); }
}
function renderCheckInSearchPanel(){
  const q=state.checkInSearchQuery||'';
  const results=checkInSearchCandidates(q);
  let html='<div class="card" style="margin-bottom:12px">';
  html+='<input type="text" placeholder="Check a student in or out — start typing their name…" value="'+q.replace(/"/g,'&quot;')+'" oninput="setCheckInSearchQuery(this.value)" style="margin-bottom:0"/>';
  if(q.trim()){
    if(results.length){
      html+='<div style="margin-top:8px;display:flex;flex-direction:column;gap:4px">'
        +results.map(function(r){
          const s=r.sess;
          const alreadyHere=s.status==='attended' && !s.checkedOut;
          const pod=findPod(s.podId);
          const where = s.online? ('Online'+(findInstructor(s.instructorId)? ' — '+findInstructor(s.instructorId).name : '')) : (pod? pod.name : 'Unassigned');
          const actionBadge = alreadyHere? '<span class="badge soon">Check out</span>' : '<span class="badge available">Check in</span>';
          return '<button class="btn sm ghost" style="text-align:left;justify-content:flex-start;width:100%" onclick="selectCheckInSearchResult(\''+s.id+'\')">'
            +'<b>'+r.name+'</b> · '+rangeLabel(s.start,s.duration)+' · '+where+' &nbsp; '+actionBadge
          +'</button>';
        }).join('')
        +'</div>';
    } else {
      html+='<div class="empty-note" style="margin-top:8px;padding-bottom:0">No match among today\'s students still to arrive or already checked in.</div>';
    }
  }
  html+='</div>';
  return html;
}

function openCheckIn(sessionId){
  const sess=findSession(sessionId);
  // Belt-and-suspenders alongside the row-action button already being hidden for a future date
  // (renderStaff() only shows "Check in" when toKey(sess.date)<=toKey(now)) — this is the actual
  // gate, so check-in can never be triggered for a session that hasn't happened yet no matter how
  // it's reached.
  if(toKey(sess.date)>toKey(simNow())){
    toast("Can't check in "+findStudent(sess.studentId).name+" yet — that session is on "+fmtShort(sess.date)+', a future date.');
    return;
  }
  const arrival=nearestOption(checkInArrivalOptions(sess), nowMinutesOfDay());
  // If the student walks in with nowhere chosen yet (booked as Unassigned, or auto-assignment never
  // found one), suggest somewhere right away — same "pre-filled, editable" pattern used everywhere
  // else — so front desk isn't forced to check in first and go hunt them down in the Schedule list
  // afterward just to pick a Pod. Silent (no toast) since nothing has been confirmed yet; the Pod
  // field below is still freely editable before Confirm. Checks `!sess.online` too (not just
  // `!sess.podId`) — an already-online session (booked or pinned that way) also has a null podId,
  // and must NOT get silently reassigned onto a physical Pod here (5.32 fix).
  if(!sess.podId && !sess.online){
    const student=findStudent(sess.studentId);
    const weekday=WEEKDAY_KEYS[(sess.date.getDay()+6)%7];
    const onlineInstructorId=studentAssignedOnlineInstructorOn(student.id, sess.date);
    if(onlineInstructorId){
      const eligible=instructorsOnShift(weekday, sess.start, sess.duration, sess.date).some(function(i){ return i.id===onlineInstructorId; })
        && !instructorOnlineBlocked(onlineInstructorId, toKey(sess.date), sess.start, sess.duration, sess.id);
      if(eligible) setSessionOnline(sessionId, onlineInstructorId);
    } else {
      const suggested=pickBestPod(weekday, toKey(sess.date), sess.start, sess.duration, student.year, studentAssignedPodOn(student.id, sess.date));
      if(suggested) movePodSession(sessionId, suggested);
    }
  }
  state.checkIn={sessionId, arrival, exitTime:autoExitTime(sess, arrival-sess.start)};
  render();
}
function closeCheckIn(){ state.checkIn=null; render(); }
function setCheckInArrival(v){
  const sess=findSession(state.checkIn.sessionId);
  // Re-clamped against checkInArrivalOptions() rather than trusted as-is — belt-and-suspenders
  // against a value that was valid when the dropdown rendered but no longer is (the clock ticked
  // forward past it while the modal sat open); nearestOption() is a no-op whenever v is still one
  // of the allowed options, which is every ordinary click.
  state.checkIn.arrival=nearestOption(checkInArrivalOptions(sess), Number(v));
  state.checkIn.exitTime=autoExitTime(sess, state.checkIn.arrival-sess.start);
  render();
}
function setCheckInExit(v){ state.checkIn.exitTime=Number(v); render(); }

// The actual check-in write, factored out of confirmCheckIn() so the "they're here right now" quick
// option on a same-day booking (confirmBooking(), below) can apply the exact same effect — status,
// actual start/end, checkInOffset, and the parent notification — without duplicating it (Sept 2026,
// per Allie: "i need an option to add a student on a day when they show up unexpectedly").
function applyCheckIn(sess, arrival, exitTime){
  const offset=arrival-sess.start;
  sess.checkInOffset=offset;
  sess.actualStart=arrival;
  sess.actualEnd=exitTime;
  sess.status='attended';
  dbWrite('checking in', function(){ return supabaseClient.from('sessions').update({
    check_in_offset:sess.checkInOffset, actual_start_min:sess.actualStart, actual_end_min:sess.actualEnd, status:sess.status
  }).eq('id', sess.id); });
  notifyParentOfCheckIn(sess.id, sess.actualStart, sess.actualEnd);
  return offset;
}
function confirmCheckIn(){
  const sess=findSession(state.checkIn.sessionId);
  if(toKey(sess.date)>toKey(simNow())){
    toast("Can't check in "+findStudent(sess.studentId).name+" yet — that session is on "+fmtShort(sess.date)+', a future date.');
    state.checkIn=null;
    render();
    return;
  }
  // Same belt-and-suspenders re-clamp as setCheckInArrival() — guards the rare case where the
  // modal was left open long enough that the arrival it was last set to is now later than "right
  // now" (only possible for a session dated today; checkInMaxArrival() never restricts a past date).
  state.checkIn.arrival=nearestOption(checkInArrivalOptions(sess), state.checkIn.arrival);
  const autoEnd=autoExitTime(sess, state.checkIn.arrival-sess.start);
  applyCheckIn(sess, state.checkIn.arrival, state.checkIn.exitTime);
  const adjusted = sess.actualEnd!==autoEnd;
  state.checkIn=null;
  if(adjusted){
    toast(findStudent(sess.studentId).name+' checked in — exit time set to '+minToLabel(sess.actualEnd)+' (usually would\'ve been '+minToLabel(autoEnd)+').');
  } else {
    toast(findStudent(sess.studentId).name+' checked in — running '+minToLabel(sess.actualStart)+'–'+minToLabel(sess.actualEnd)+'.');
  }
  render();
}

// Reverts an accidental check-in — front desk checked in the wrong student, or the right student
// against the wrong session. Puts the session back to exactly 'scheduled' and clears every
// check-in-specific field, so it's as if the check-in never happened: it drops back into the
// "still to arrive" half of its Pod's roster (see rosterTableHtml), ready to be checked in again,
// correctly, from scratch. Doesn't touch credits — check-in/out never consumes or issues one, so
// there's nothing to reverse there. Works regardless of whether the session's already been checked
// OUT too (undoing should still be possible if the mistake is only noticed after the fact).
function undoCheckIn(sessionId){
  const sess=findSession(sessionId);
  if(!sess || sess.status!=='attended') return;
  const student=findStudent(sess.studentId);
  if(!confirm('Undo '+student.name+'\'s check-in?\n\nThis puts the session back to "scheduled", as if it never happened — use this if the wrong student was checked in by mistake.')) return;
  sess.status='scheduled';
  sess.actualStart=null;
  sess.actualEnd=null;
  sess.checkInOffset=null;
  sess.checkedOut=false;
  dbWrite('undoing a check-in', function(){ return supabaseClient.from('sessions').update({
    status:'scheduled', actual_start_min:null, actual_end_min:null, check_in_offset:null, checked_out:false
  }).eq('id', sess.id); });
  toast(student.name+"'s check-in was undone.");
  render();
}

}

function renderMoveModal(){
  const f=state.moveForm;
  if(!f) return '';
  const sess=findSession(f.sessionId);
  if(!sess) return '';
  const student=findStudent(sess.studentId);
  const currentPod=findPod(sess.podId);
  const currentOnlineInstr=sess.online? findInstructor(sess.instructorId) : null;
  const currentLabel = currentPod? currentPod.name : (currentOnlineInstr? 'Online — '+currentOnlineInstr.name : null);
  const dateKey=toKey(sess.date);
  const weekday=WEEKDAY_KEYS[(sess.date.getDay()+6)%7];
  let html='<div class="overlay" onclick="if(event.target===this) closeMoveForm()"><div class="modal">';
  html+='<h3>'+(currentLabel? 'Move '+student.name+' to a different Pod' : 'Assign '+student.name+' to a Pod')+'</h3>';

  const onlineChoices=instructorsOnShift(weekday, sess.start, sess.duration, sess.date).filter(function(instr){ return !(sess.online && instr.id===sess.instructorId); });
  // Same-day moves are allowed to exceed the 1:8 ratio (see movePodSession()) — this dropdown only
  // disables/marks a Pod "full" when the move would actually be refused, i.e. for a future date.
  const isTodayMove=dateKey===toKey(simNow());
  html+='<label>Move to</label><select onchange="setMoveFormLocation(this.value)"><option value="">Choose…</option>'
    +pods.filter(function(p){ return p.id!==sess.podId; }).map(function(p){
      const peak=peakConcurrency(p.id, dateKey, {start:sess.start, duration:sess.duration});
      const cap=podCapacity(p.id);
      const full=podCapacityBlocked(p.id, dateKey, {start:sess.start, duration:sess.duration});
      const disable=full && !isTodayMove;
      const label = full? (isTodayMove? ' — over capacity, allowed today':' — full') : ' — '+peak+'/'+cap+' after move';
      return '<option value="'+p.id+'"'+(p.id===f.location?' selected':'')+(disable?' disabled':'')+'>'+p.name+label+'</option>';
    }).join('')
    + (onlineChoices.length? ('<optgroup label="Online">'+onlineChoices.map(function(instr){
        const val='online:'+instr.id;
        const peak=instructorCombinedPeak(instr.id, dateKey, {start:sess.start, duration:sess.duration}, sess.id);
        const full=peak>ONLINE_COMBINED_CAP;
        return '<option value="'+val+'"'+(val===f.location?' selected':'')+(full?' disabled':'')+'>Online — '+instr.name+(full?' — full':' — '+peak+'/'+ONLINE_COMBINED_CAP+' after move')+'</option>';
      }).join('')+'</optgroup>') : '')
  +'</select>';
  html+='<div style="display:flex;gap:8px;margin-top:14px;justify-content:flex-end">'
    +'<button class="btn ghost" onclick="closeMoveForm()">Cancel</button>'
    +'<button class="btn primary" '+(!f.location?'disabled':'')+' onclick="confirmMovePod()">'+(currentLabel?'Move':'Assign')+'</button>'
  +'</div>';
  html+='</div></div>';
  return html;
}

function setExitTime(sessionId, v){

  toast(findStudent(sess.studentId).name+'\'s exit time updated to '+minToLabel(sess.actualEnd)+'.');
}
// Corrects the check-in time recorded for an already-checked-in student (5.23) — lives in the
// "Checked in today" table right next to exit time, which was already editable there; check-in
// time wasn't, so a mistaken arrival time (or front desk simply checking someone in late after
// they'd actually arrived on time) had no way to be fixed after the fact. Also refreshes
// checkInOffset against the session's scheduled start, since that's what the "(capped)" flag
// elsewhere (the Pod roster note, the attendance log) reads to know if the 15-min late-grace rule
// kicked in — leaving it stale after a manual correction would show the wrong badge.
function setActualStart(sessionId, v){
  const sess=findSession(sessionId);
  sess.actualStart=Number(v);
  sess.checkInOffset=sess.actualStart-sess.start;
  dbWrite('updating check-in time', function(){ return supabaseClient.from('sessions').update({actual_start_min:sess.actualStart, check_in_offset:sess.checkInOffset}).eq('id', sess.id); });
  toast(findStudent(sess.studentId).name+'\'s check-in time updated to '+minToLabel(sess.actualStart)+'.');
}

// Today's checked-in students still present (not yet checked out) — shared by the "Checked in
// today" panel and the check-out picker so the two always agree on who's still around.
function checkedInTodayStillPresent(){
  const todayKey=toKey(simNow());
  return sessions.filter(function(s){ return s.status==='attended' && toKey(s.date)===todayKey && s.actualEnd!=null && !s.checkedOut; });
}

// Explicit "Check out" action (5.24) — separate from just editing the exit-time estimate above,
// this actually records that a student has left and drops them off the live "Checked in today"
// roster. Lives as one button at the top of that panel (not per-row) since front desk is usually
// checking out whoever's leaving right now, not scrolling to find a specific row; the time picker
// defaults to whatever's closest to the actual current clock — not the scheduled/estimated exit —
// since "in case we signed them out late accidentally" is exactly the case where the estimate
// isn't what actually happened. sessionId is optional — omit it to default to whoever's been
// waiting longest (soonest exit time first), or pass one to preselect a specific student.
// Scopes "who can be checked out right now" to the current viewer — front desk sees and can act on
// everyone checked in centre-wide, but an instructor only ever sees (and can check out) students
// currently checked in at their own Pod(s) or their own Online group today (Sept 2026, per Allie:
// "can we do it so the instructors can check out the kids on their pod as well as front staff").
// Mirrors the exact same identity lookup renderInstructor() itself already uses.
function checkedInPresentForCurrentViewer(){
  if(state.role==='instructor'){
    const instrId = supabaseClient? (currentUser && currentUser.instructorId) : state.instructorLoggedIn;
    return instrId? checkedInAtInstructorPodToday(instrId) : [];
  }
  return checkedInTodayStillPresent();
}
function openCheckOut(sessionId){
  const present=checkedInPresentForCurrentViewer();
  if(present.length===0) return;
  const sess=sessionId? findSession(sessionId) : present.slice().sort(function(a,b){ return a.actualEnd-b.actualEnd; })[0];
  state.checkOut={sessionId:sess.id, exitTime:nearestOption(EXIT_TIME_OPTIONS, nowMinutesOfDay())};
  render();
}
function closeCheckOut(){ state.checkOut=null; render(); }
function setCheckOutSession(sessionId){ state.checkOut.sessionId=sessionId; render(); }
function setCheckOutExit(v){ state.checkOut.exitTime=Number(v); render(); }

  sess.checkedOut=true;

  toast(findStudent(sess.studentId).name+' checked out at '+minToLabel(sess.actualEnd)+'.');

}

function startBookMakeUp(creditId){ state.parentBookingCreditId=creditId; render(); }

// Whether it's already too late to request a make-up for today (5.7) — past the 10:00am
// same-day cutoff. Split out from openSlotsForCredit so the picker can explain a missing "today"
// rather than just silently starting the list at tomorrow.
function sameDayMakeUpCutoffPassed(){ return nowMinutesOfDay()>=MAKEUP_SAME_DAY_CUTOFF; }
function openSlotsForCredit(credit){
  // Parents choose a date + time only — never which Pod or instructor, and never a duration
  // (that's fixed to the student's usual session length). The system auto-assigns a specific
  // qualified, available, under-capacity Pod behind the scenes (see pickBestPod).
  const student=findStudent(credit.studentId);
  const duration=student.duration;
  const now=simNow();
  const todayKey=toKey(now);
  const sameDayCutoffPassed=sameDayMakeUpCutoffPassed();
  const opts=[];
  [0,1].forEach(function(weekOff){
    const monday=addDays(getMonday(now), weekOff*7);
    for(let i=0;i<5;i++){
      const date=addDays(monday,i);
      if(date < new Date(todayKey)) continue;
      if(isClosedDate(date)) continue; // centre's closed this day — never offer it as a make-up slot
      if(sameDayCutoffPassed && toKey(date)===todayKey) continue; // past 10am — today's no longer offered
      const weekday=WEEKDAY_KEYS[i];
      const dateKey=toKey(date);
      possibleStarts(duration).forEach(function(start){
        if(studentOverlapClash(student.id, dateKey, start, duration, null)) return;
        const podId=pickBestPod(weekday, dateKey, start, duration, student.year);
        if(podId){
          const cov=podCoverageDetail(podId, weekday, start, duration, date); // tolerant of a short unattended gap, same as pickBestPod just validated
          opts.push({date, start, duration, podId, instructorId:cov.primaryInstructorId});
        }
      });
    }
  });
  opts.sort(function(a,b){ return toKey(a.date)===toKey(b.date) ? a.start-b.start : new Date(a.date)-new Date(b.date); });
  return opts;
}

function bookSlot(creditId, dateKey, start, duration, podId, instructorId){
  const credit=findCredit(creditId);
  const student=findStudent(credit.studentId);
  const sess={id:newId()||('sess'+(nextSessionId++)), studentId:student.id, podId, instructorId, date:new Date(dateKey), start:Number(start), duration:Number(duration), status:'scheduled', bookedBy:'parent', creditId};
  sessions.push(sess);
  dbWrite('booking a make-up session', function(){ return supabaseClient.from('sessions').insert({
    id:sess.id, student_id:sess.studentId, pod_id:sess.podId, instructor_id:sess.instructorId, the_date:toKey(sess.date),
    start_min:sess.start, duration:sess.duration, status:sess.status, booked_by:sess.bookedBy, credit_id:sess.creditId
  }); });
  credit.status='redeemed';
  credit.redeemedSessionId=sess.id;
  dbWrite('redeeming a make-up credit', function(){ return supabaseClient.from('credits').update({status:'redeemed', redeemed_session_id:sess.id}).eq('id', credit.id); });
  state.parentBookingCreditId=null;
  toast('Make-up booked for '+fmtShort(sess.date)+', '+rangeLabel(sess.start,sess.duration)+'.');
}

function cancelMakeUp(creditId){
  const credit=findCredit(creditId);
  const sess=findSession(credit.redeemedSessionId);

/* ---------- availability lookup (front-desk sales reference) ---------- */
// Open seats in a given window, summed across every Pod with an assigned instructor covering that
// window — the number front desk can quote straight to a parent on a call. Every instructor can
// teach any year (5.3), so unlike an earlier version of this tool, a seat counts here regardless of
// the student's year — "best suited for" only ever affects which Pod auto-assignment prefers
// (5.8), never whether front desk can quote a family a seat. Also reports how many Pods are
// staffed at all in that window, so "0 seats, nobody's on" reads differently from "0 seats, fully
// booked." (The `year` parameter is accepted but no longer filters — kept for callers that still
// pass one.)
function openSeatsAt(dateKey, weekday, blockStart, year, blockLen){
  let seats=0, staffed=0;
  const blockEnd=blockStart+blockLen;
  const date=new Date(dateKey);
  pods.forEach(function(pod){
    const cov=podCoverageBoundary(pod.id, weekday, blockStart, blockLen, date);
    if(!cov.instructorId) return;
    const winStart=blockStart, winEnd=Math.min(blockEnd, cov.boundary);
    if(winEnd<=winStart) return;
    staffed++;
    const peak=peakInWindow(pod.id, dateKey, winStart, winEnd);
    seats += Math.max(0, podCapacity(pod.id)-peak);
  });
  return {seats, staffed};
}
// Combined (physical + online) peak headcount instructor X is minding, restricted to a window —
// the Online counterpart to peakInWindow (used for Pods).
function instructorCombinedPeakInWindow(instructorId, dateKey, winStart, winEnd){
  const list = instructorPhysicalSessionsForDay(instructorId, dateKey).concat(instructorOnlineSessionsForDay(instructorId, dateKey))
    .filter(function(s){ return s.start<winEnd && winStart<s.start+s.duration; })
    .map(function(s){ return {start:Math.max(s.start,winStart), end:Math.min(s.start+s.duration,winEnd)}; });
  return peakConcurrencyOf(list);
}
// Online seats available at a window, aggregated across every instructor on shift then — the
// Online counterpart to openSeatsAt(), used by the availability lookup to show Online as its own
// row rather than folding it into the Pod counts above.
function onlineSeatsAt(dateKey, weekday, blockStart, blockLen){
  const date=new Date(dateKey);
  let seats=0;
  instructorsOnShift(weekday, blockStart, blockLen, date).forEach(function(instr){
    const peak=instructorCombinedPeakInWindow(instr.id, dateKey, blockStart, blockStart+blockLen);
    seats += Math.max(0, ONLINE_COMBINED_CAP-peak);
  });
  return seats;
}
// Same collapse-guard as setWeek() above, for the Availability lookup section's own toggle.
function setAvailWeek(w){
  state.availWeekOffset=w;
  if(state.collapsedSections && state.collapsedSections.availability){ state.collapsedSections.availability=false; }
  render();
}

/* ---------- waitlist for full day/time slots (5.17) ---------- */
// The soonest upcoming date that falls on a given weekday, from a given date (inclusive) — used to
// pick one concrete, checkable occurrence for a weekday+time waitlist entry.
function nextDateForWeekday(fromDate, weekday){
  let d=new Date(fromDate);
  while(WEEKDAY_KEYS[(d.getDay()+6)%7]!==weekday){ d=addDays(d,1); }
  return d;
}
// Same peak-headcount calculation as peakConcurrency, but can also account for seats already
// virtually claimed by other waitlist entries in the same first-in-first-served pass (see
// waitlistClaimsBefore) — so two families waiting for the same Pod/date don't both get told the
// same single opening is theirs.
function peakConcurrencyWithClaims(podId, dateKey, extra, claims){
  const raw = sessionsForDay(podId, dateKey).map(function(s){ return {start:s.start, end:s.start+s.duration}; });
  (claims||[]).forEach(function(c){
    if(c.podId===podId && c.dateKey===dateKey) raw.push({start:c.start, end:c.start+c.duration});
  });
  if(extra) raw.push({start:extra.start, end:extra.start+extra.duration});
  return peakConcurrencyOf(raw); // same handover forgiveness as peakConcurrency (STUDENT_OVERLAP_TOLERANCE_MIN)
}
// Same tolerated one-seat/15-minute capacity pinch as podCapacityBlocked, but also accounting for
// other waitlist entries ahead of this one in the queue (see peakConcurrencyWithClaims).
function podCapacityBlockedWithClaims(podId, dateKey, extra, claims){
  const raw = sessionsForDay(podId, dateKey).map(function(s){ return {start:s.start, end:s.start+s.duration}; });
  (claims||[]).forEach(function(c){
    if(c.podId===podId && c.dateKey===dateKey) raw.push({start:c.start, end:c.start+c.duration});
  });
  if(extra) raw.push({start:extra.start, end:extra.start+extra.duration});
  return capacityOverflowViolation(raw, podCapacity(podId));
}
// Same "first staffed, under-capacity Pod wins, no age consideration" logic as pickBestPod (Sept
// 2026) — kept as a separate function only because it also has to account for other waitlist
// entries ahead of this one in the queue that would already claim a seat (`claims`, via
// peakConcurrencyWithClaims) before this entry ever gets to see it. Kept in sync with pickBestPod
// deliberately; if that logic changes again, this needs the same change.
function pickBestPodWithClaims(weekday, dateKey, start, duration, year, claims){
  const date=new Date(dateKey);
  for(let i=0;i<pods.length;i++){
    const podId=pods[i].id;
    const cov=podCoverageDetail(podId, weekday, start, duration, date);
    if(!cov.primaryInstructorId || !cov.ok) continue;
    if(podCapacityBlockedWithClaims(podId, dateKey, {start, duration}, claims)) continue;
    return podId;
  }
  return null;
}
// First-in-first-served (5.17): every waiting entry strictly older (by dateAdded) than this one
// gets to "claim" its seat first. Walks the queue oldest-first, and for each entry ahead of this
// one that currently resolves to a real Pod, reserves that Pod/date/time so a later entry can't
// also be told the exact same opening is theirs.
function waitlistClaimsBefore(entry){
  const claims=[];
  const waiting=waitlist.filter(function(w){ return w.status==='waiting'; })
    .sort(function(a,b){ return new Date(a.dateAdded)-new Date(b.dateAdded); });
  for(let i=0;i<waiting.length;i++){
    const w=waiting[i];
    if(entry && w.id===entry.id) break; // reached this entry's own place in the queue
    const year = w.studentId? findStudent(w.studentId).year : w.year;
    const dateKey = toKey(nextDateForWeekday(simNow(), w.weekday));
    const podId = pickBestPodWithClaims(w.weekday, dateKey, w.start, w.duration, year, claims);
    if(podId) claims.push({podId, dateKey, start:w.start, duration:w.duration, year:year});
  }
  return claims;
}
// Is there actually a seat for this entry right now, once everyone who's been waiting longer for
// an overlapping slot has first claim on whatever's open? Reuses the same coverage/qualification/
// capacity check standing bookings rely on (5.8), against the soonest upcoming occurrence of the
// entry's weekday. An existing student's CURRENT year is used (so a promotion, 5.9, is reflected
// automatically); a new enquiry uses whatever year was logged at the time they were added.
function waitlistOpenSeat(entry){
  const year = entry.studentId? findStudent(entry.studentId).year : entry.year;
  const date = nextDateForWeekday(simNow(), entry.weekday);
  const claims = waitlistClaimsBefore(entry);
  const podId = pickBestPodWithClaims(entry.weekday, toKey(date), entry.start, entry.duration, year, claims);
  return podId? {podId, date} : null;
}
// For the panel only: would this entry have a seat if the queue were ignored? Used to tell "someone
// who's been waiting longer has first claim on this one" apart from "nothing is open here at all."
function waitlistWouldFitIgnoringQueue(entry){
  const year = entry.studentId? findStudent(entry.studentId).year : entry.year;
  const dateKey = toKey(nextDateForWeekday(simNow(), entry.weekday));
  return !!pickBestPodWithClaims(entry.weekday, dateKey, entry.start, entry.duration, year, []);
}

/* ---------- enrollment: creating parent/student profiles ---------- */
function bookedThisWeek(studentId){
  const monday=getMonday(simNow());
  const days=[0,1,2,3,4].map(function(i){ return toKey(addDays(monday,i)); });
  return sessions.filter(function(s){ return s.studentId===studentId && s.status!=='cancelled' && days.includes(toKey(s.date)); }).length;
}

// Each recurring row carries its own preferredPodId (''  = auto-assign) — a Preferred Pod is set up
// per session, not once for the whole student (Sept 2026, per Allie: "the preferred pods need to be
// set up per session, not overall"). Was previously a single field on the form applying to every
// session alike; see saveNewStudent()'s comment on how that now maps onto the standing-pin model.
function defaultRecurring(count, duration){
  const starts=possibleStarts(duration);
  const days=['Mon','Wed','Fri'];
  const out=[];
  for(let i=0;i<count;i++) out.push({weekday:days[i%days.length], start:starts[0], preferredPodId:''});
  return out;
}

function saveNewStudent(){
  const f=state.newStudentForm;
  if(!f.studentName.trim()){ f.error='Enter the student\'s name.'; render(); return; }
  if(f.matchedInactiveId && !f.confirmNewAnyway){
    f.error='An inactive student named "'+f.studentName.trim()+'" already exists — reactivate them above, or tick "enroll as a new, separate student anyway" if this is a different person.';
    render(); return;
  }
  if(!f.year){ f.error='Choose a school year.'; render(); return; }
  let parentId=null;
  // Set only when creating a brand-new parent alongside this student — its actual remote insert is
  // deferred and chained as the FIRST step of the student's own dbWrite below (see there for why:
  // students.parent_id is a real foreign key to parents(id), and firing these as two independent,
  // unordered requests risked the student's insert reaching Postgres before the parent's had
  // committed, failing on that foreign key — Sept 2026, root cause of "when adding a student i'm
  // getting an error code" / "it still says change is visible here but may not have saved").
  let newParentInsert=null;
  if(f.parentMode==='existing'){
    if(!f.parentId){ f.error='Choose a parent, or switch to “New parent”.'; render(); return; }
    parentId=f.parentId;
  } else {
    if(!f.parentName.trim() || !f.parentEmail.trim()){ f.error='Enter the parent\'s name and email.'; render(); return; }
    const existingParent=parents.find(function(p){ return p.email.toLowerCase()===f.parentEmail.trim().toLowerCase(); });
    if(existingParent){
      if(isParentInactive(existingParent)){
        const kids=inactiveChildrenOf(existingParent);
        f.error='A parent with that email already exists but is inactive (all their children have stopped). Reactivate one instead of creating a duplicate: '
          +kids.map(function(k){ return '<button class="btn sm" style="margin:2px 4px 0 0" onclick="closeNewStudentForm();openReactivateStudentForm(\''+k.id+'\')">Reactivate '+k.name+'</button>'; }).join('');
      } else {
        f.error='A parent with that email already exists — pick “Existing parent” instead.';
      }
      render(); return;
    }
    const newParent={id:newId()||('p'+(nextParentId++)), name:f.parentName.trim(), email:f.parentEmail.trim(), studentIds:[]};
    parents.push(newParent);
    newParentInsert=function(){ return supabaseClient.from('parents').insert({id:newParent.id, name:newParent.name, email:newParent.email}); };
    parentId=newParent.id;
  }
  const newStudent={id:newId()||('s'+(nextStudentId++)), name:f.studentName.trim(), year:Number(f.year), baseYear:Number(f.year), yearBaseline:schoolYearIndex(simNow()), duration:Number(f.duration), sessionsPerWeek:Number(f.sessionsPerWeek), parentId, recurring:f.recurring.map(function(r){ return {weekday:r.weekday, start:r.start}; }), holds:[]};
  // A Preferred Pod chosen at enrollment (5.30, per Allie) isn't a separate field/column — it's just
  // one of the student's very first standing Pod pins, written the same way "Change Pod"
  // (openStudentPodForm/saveStudentPodAssignment) writes any other one, effective from day one. That
  // means studentAssignedPodOn() picks it up automatically everywhere a pin already mattered
  // (recurring pre-booking below, check-in's auto-suggest for an unassigned session, and the booking
  // modal's own suggestBookingPod()) with no extra plumbing, and a later "Change Pod" naturally
  // supersedes it — it'll always have a later effectiveFrom, and studentAssignedPodOn() already
  // resolves ties that way. No fallback if a preferred Pod turns out to be unstaffed or full for its
  // slot (same "front desk's own explicit call" rule pickBestPod applies to every pin) — that
  // occurrence is simply left unassigned, visible in the Schedule tab like any other coverage gap.
  //
  // Revised Sept 2026, per Allie: "the preferred pods need to be set up per session, not overall" —
  // each recurring row now carries its own preferredPodId, so this writes one weekday-scoped pin per
  // row that has one chosen, instead of a single pin applying to every session alike (weekday:null).
  // studentAssignedPodOn() already resolves pins per weekday (it's the same mechanism the day-specific
  // "Change Pod" pin uses), so no changes were needed there. If two rows land on the same weekday
  // (a student with two sessions the same day), only one pin can apply to that whole weekday — the
  // later entry in this array wins, same tie-break studentAssignedPodOn() always uses.
  const preferredPodAssignments=f.recurring
    .filter(function(r){ return r.preferredPodId; })
    .map(function(r){ return {podId:r.preferredPodId, effectiveFrom:new Date(toKey(simNow())), weekday:r.weekday}; });
  if(preferredPodAssignments.length) newStudent.podAssignments=preferredPodAssignments;
  students.push(newStudent);
  // Every remote write below is chained into ONE ordered sequence — parent (if new) -> student ->
  // recurring slots -> pod assignments -> the recurring sessions generateRecurringSessions() creates
  // further down — rather than each firing as its own independent, unordered request. Several of
  // these reference the row before them as a real foreign key (parent_id, student_id), so an
  // out-of-order arrival at Postgres previously meant an otherwise-successful enrollment could still
  // fail here with a foreign-key violation (Sept 2026 fix — see newParentInsert/deferredSessions
  // above). Purely a remote-persistence-ordering fix: every local/optimistic update below (pushing to
  // `students`, generating sessions into `sessions`, the toast) still happens immediately, same as always.
  const deferredSessions=[];
  dbWrite('enrolling a new student', function(){
    const afterParent = newParentInsert? newParentInsert() : Promise.resolve({error:null});
    return afterParent.then(function(r){
      if(r && r.error) return r;
      return supabaseClient.from('students').insert({
        id:newStudent.id, parent_id:newStudent.parentId, name:newStudent.name, year:newStudent.year, base_year:newStudent.baseYear,
        year_baseline:newStudent.yearBaseline, duration:newStudent.duration, sessions_per_week:newStudent.sessionsPerWeek
      });
    }).then(function(r){
      if(r.error || !newStudent.recurring.length) return r;
      return supabaseClient.from('student_recurring_slots').insert(newStudent.recurring.map(function(rec){ return {student_id:newStudent.id, weekday:rec.weekday, start_min:rec.start}; }));
    }).then(function(r){
      if(r.error || !newStudent.podAssignments || !newStudent.podAssignments.length) return r;
      return supabaseClient.from('student_pod_assignments').insert(newStudent.podAssignments.map(function(a){
        return {student_id:newStudent.id, pod_id:a.podId, effective_from:toKey(a.effectiveFrom), weekday:a.weekday};
      }));
    }).then(function(r){
      if(r.error || !deferredSessions.length) return r;
      return supabaseClient.from('sessions').insert(deferredSessions.map(function(s){ return {
        id:s.id, student_id:s.studentId, pod_id:s.podId, online:s.online, instructor_id:s.instructorId,
        instructor_id_2:s.instructorId2, handoff_min:s.handoff,
        the_date:toKey(s.date), start_min:s.start, duration:s.duration, status:s.status,
        booked_by:s.bookedBy, credit_id:s.creditId, is_recurring:true
      }; }));
    });
  });
  const parent=parents.find(function(p){ return p.id===parentId; });
  parent.studentIds.push(newStudent.id);
  const made=generateRecurringSessions(newStudent, HORIZON_WEEKS, deferredSessions);
  const uncovered=slotsWithoutCoverage(newStudent.recurring, newStudent.duration, newStudent.year);
  if(uncovered.length){
    toast(newStudent.name+' enrolled, but no Pod '+newStudent.name+' qualifies for (by age) is currently staffed for '+describeUncoveredSlots(uncovered)+' — 0 session(s) could be pre-booked for that time yet. Assign coverage on the Schedule tab, then reopen '+newStudent.name+'\'s regular schedule and save it again.', 9000);
  } else if(preferredPodAssignments.length && made===0){
    // Some Pod generically covers every chosen slot (uncovered came back empty) — so the reason
    // nothing got pre-booked is specifically that a Preferred Pod picked above doesn't have room
    // (or coverage) at its slot, and a pin never falls back to a different Pod on its own (same
    // rule as "Change Pod" — see the comment above where podAssignments gets set). Worth calling
    // out by name here, since "0 pre-booked" alone would otherwise look like a plain coverage gap.
    const pinnedNames=preferredPodAssignments.map(function(a){ return findPod(a.podId).name; }).filter(function(n,i,arr){ return arr.indexOf(n)===i; });
    toast(newStudent.name+' enrolled, but the Preferred Pod'+(pinnedNames.length>1?'s':'')+' chosen ('+pinnedNames.join(', ')+') don\'t have room (or coverage) at '+describeUncoveredSlots(newStudent.recurring)+' — 0 session(s) pre-booked. Pick different Preferred Pods via "Change Pod", or leave sessions on auto-assign.', 9000);
  } else {
    toast(newStudent.name+' enrolled — '+f.sessionsPerWeek+'x/week, '+f.duration+' min, with '+parent.name+'. '+made+' standing session(s) pre-booked.');
  }
  state.newStudentForm=null;
  render();
}

function saveEditStudent(){

  // yearBaseline every time, exactly the way saveNewStudent() sets them at enrollment. Re-pinning
  // both here to "this corrected year, as of today" makes the edit stick and promotes correctly
  // forward from it, instead of reverting to whatever the old (wrong) year would have promoted to.
  student.year=Number(f.year);

function generateRecurringSessions(student, weeksAhead){
  const startMonday=getMonday(simNow());
  let created=0;
  for(let w=0; w<weeksAhead; w++){
    const monday=addDays(startMonday, w*7);
    WEEKDAY_KEYS.forEach(function(weekday, dayIdx){
      const date=addDays(monday, dayIdx);
      if(date < new Date(toKey(simNow()))) return; // never backfill the past
      if(isClosedDate(date)) return; // centre's closed this day — never pre-book a regular session onto it
      const dateKey=toKey(date);
      if(isStudentOnHold(student.id, date)) return; // on hold — leave this occurrence unbooked
      const plan=studentPlanOn(student.id, date); // respects any scheduled stop/frequency change
      const slot=(plan.recurring||[]).find(function(r){ return r.weekday===weekday; });
      if(!slot) return; // this weekday isn't part of whichever plan governs this date
      const dup=sessions.some(function(s){ return s.studentId===student.id && toKey(s.date)===dateKey && s.start===slot.start && s.status!=='cancelled'; });
      if(dup) return;
      if(studentOverlapClash(student.id, dateKey, slot.start, student.duration, null)) return;
      const pinnedPodId=studentAssignedPodOn(student.id, date); // front desk's standing Pod pin, if any (else auto-assign)
      const podId=pickBestPod(weekday, dateKey, slot.start, student.duration, student.year, pinnedPodId);
      if(!podId) return;
      const cov=podCoverageDetail(podId, weekday, slot.start, student.duration, date); // tolerant of a short unattended gap (UNATTENDED_TOLERANCE_MIN), same as pickBestPod just validated
      const recSess={id:newId()||('sess'+(nextSessionId++)), studentId:student.id, podId, instructorId:cov.primaryInstructorId, instructorId2:cov.secondaryInstructorId, handoff:cov.handoffAt, date, start:slot.start, duration:student.duration, status:'scheduled', bookedBy:'staff', creditId:null, recurring:true};
      sessions.push(recSess);
      dbWrite('pre-booking a standing session', function(){ return supabaseClient.from('sessions').insert({
        id:recSess.id, student_id:recSess.studentId, pod_id:recSess.podId, instructor_id:recSess.instructorId,
        instructor_id_2:recSess.instructorId2, handoff_min:recSess.handoff,
        the_date:toKey(recSess.date), start_min:recSess.start, duration:recSess.duration, status:recSess.status,
        booked_by:recSess.bookedBy, credit_id:recSess.creditId, is_recurring:true
      }); });
      created++;
    });
  }
  return created;
}
function regenerateAllRecurring(){
  let total=0;
  students.forEach(function(s){ total+=generateRecurringSessions(s, HORIZON_WEEKS); });
  return total;
}
function recurringSummary(student){
  if(!student.recurring || student.recurring.length===0) return 'Not set';
  return student.recurring.map(function(r){ return r.weekday+' '+minToLabel(r.start); }).join(', ');
}

}

function confirmBooking(){
  const b=state.booking; const f=state.bookingForm;
  if(!f.studentId || f.start==null) return;
  const dateKey=b.dateKey, date=new Date(dateKey);
  const student=findStudent(f.studentId);
  const pod=findPod(b.podId);
  const weekday=WEEKDAY_KEYS[(date.getDay()+6)%7];
  const end=f.start+f.duration;

  // The age-floor rule (5.21c) is a hard gate for auto-assignment (pickBestPod/reseatByAge), but a
  // manual booking never went through either of those — closing that gap here too, so a student
  // can't quietly end up below a Pod's minimum just because staff picked the Pod directly. A
  // standing Pod pin for this exact Pod is the sanctioned way to make a deliberate exception (e.g.
  // keeping siblings together) — set one first via "Assign to Pod" if that's what this is.
  if(!podEligibleForYear(pod.id, student.year) && studentAssignedPodOn(student.id, date)!==pod.id){
    toast('Blocked — '+student.name+' ('+yearLabel(student.year)+') doesn\'t meet '+pod.name+'\'s '+yearLabel(POD_MIN_YEAR[pod.id])+'+ minimum. If this is a deliberate exception, set a standing Pod pin for '+student.name+' first (front desk → Assign to Pod).');
    return;
  }

  if(studentOverlapClash(student.id, dateKey, f.start, f.duration, null)){
    toast('Blocked — '+student.name+' already has an overlapping session that day.');
    return;
  }

  // Which years an instructor is "best suited" for (5.3) is a preference, not a requirement — every
  // instructor can actually teach any year — so it never factors into whether an override is
  // needed. An override is only ever about actual staffing: no instructor anywhere near the window,
  // or a real gap bigger than the tolerated 15 minutes unattended (UNATTENDED_TOLERANCE_MIN).
  const cov=podCoverageDetail(pod.id, weekday, f.start, f.duration, date);
  const totallyUnassigned = !cov.primaryInstructorId;
  const needsOverride = !cov.ok; // covers both "nobody at all" and "gap bigger than the tolerance"

  if(needsOverride && !f.overrideOk) return; // needs explicit override checkbox

  const cap=podCapacity(pod.id);
  const wouldBePeak = peakConcurrency(pod.id, dateKey, {start:f.start, duration:f.duration});
  if(wouldBePeak > cap){
    toast('Blocked — this would put '+pod.name+' over capacity ('+wouldBePeak+'/'+cap+').');
    return;
  }

  const newSess={id:newId()||('sess'+(nextSessionId++)), studentId:student.id, podId:pod.id, instructorId: cov.primaryInstructorId, instructorId2: cov.secondaryInstructorId, handoff: cov.handoffAt, date, start:f.start, duration:f.duration, status:'scheduled', bookedBy:'staff', creditId:null};
  sessions.push(newSess);
  dbWrite('booking a session', function(){ return supabaseClient.from('sessions').insert({
    id:newSess.id, student_id:newSess.studentId, pod_id:newSess.podId, instructor_id:newSess.instructorId,
    instructor_id_2:newSess.instructorId2, handoff_min:newSess.handoff, the_date:toKey(newSess.date),
    start_min:newSess.start, duration:newSess.duration, status:newSess.status, booked_by:newSess.bookedBy, credit_id:newSess.creditId
  }); });
  const handoffNote = cov.secondaryInstructorId? (' with a handoff to '+findInstructor(cov.secondaryInstructorId).name+' at '+minToLabel(cov.handoffAt)) : '';
  const withNote = cov.primaryInstructorId? (' with '+findInstructor(cov.primaryInstructorId).name) : '';
  const gapNote = (cov.gapMinutes>0 && cov.ok)? (' ('+cov.gapMinutes+' min unattended — within the '+UNATTENDED_TOLERANCE_MIN+'-min tolerance)') : '';
  toast(student.name+' booked into '+pod.name+withNote+', '+fmtShort(date)+' '+rangeLabel(f.start,f.duration)+handoffNote+gapNote+'.');
  state.booking=null;
  render();
}

// Parent self-service cancellation (5.7-style rule): cancelling with notice — any day before today,
// or same-day but before the 10:00am cutoff — frees the slot and automatically issues a make-up
// credit, exactly like a front-desk no-show would, dated from the missed session and expiring 3
// months later. Cancelling a same-day session after the cutoff isn't offered here at all — that's
// the same cutoff already used for booking make-ups (5.7), so front desk can still record it as a
// genuine no-show if the family doesn't call ahead.
function parentCancelSession(sessionId){
  const sess=findSession(sessionId);
  if(!sess || sess.status!=='scheduled') return;
  const now=simNow();
  if(toKey(sess.date)===toKey(now) && sameDayMakeUpCutoffPassed()){
    toast("It's past 10:00am, so today's session can no longer be cancelled here — please call the centre directly.");
    return;
  }
  const student=findStudent(sess.studentId);
  const issued=sess.date, expiry=addMonths(issued,3);
  if(!confirm('Cancel '+student.name+'\'s session?\n'+fmtLong(sess.date)+' at '+minToLabel(sess.start)+'\n\nThis will cancel this session only. '+student.name+'\'s regular session time will remain unchanged. You\'ll get a make-up credit valid until '+fmtShort(expiry)+'.')) return;
  sess.status='cancelled';
  dbWrite('cancelling session (parent, with notice)', function(){ return supabaseClient.from('sessions').update({status:'cancelled'}).eq('id', sess.id); });
  const c={id:newId()||('c'+(nextCreditId++)), studentId:sess.studentId, issuedDate:issued, expiryDate:expiry, status:'available', redeemedSessionId:null, warningSent:false, source:'parent-cancel', note:''};
  credits.push(c);
  dbWrite('issuing a make-up credit', function(){ return supabaseClient.from('credits').insert({
    id:c.id, student_id:c.studentId, issued_date:toKey(c.issuedDate), expiry_date:toKey(c.expiryDate),
    status:c.status, redeemed_session_id:c.redeemedSessionId, warning_sent:c.warningSent, source:c.source, note:c.note
  }); });
  toast('Session cancelled — a make-up credit was added, valid until '+fmtShort(expiry)+'.');
}

// Whether it's already too late to request a make-up for today (5.7) — past the 10:00am
// same-day cutoff. Split out from openSlotsForCredit so the picker can explain a missing "today"
// rather than just silently starting the list at tomorrow.
function sameDayMakeUpCutoffPassed(){ return nowMinutesOfDay()>=MAKEUP_SAME_DAY_CUTOFF; }
function openSlotsForCredit(credit){
  // Parents choose a date + time only — never which Pod or instructor, and never a duration
  // (that's fixed to the student's usual session length). The system auto-assigns a specific
  // qualified, available, under-capacity Pod behind the scenes (see pickBestPod).
  const student=findStudent(credit.studentId);
  const duration=student.duration;
  const now=simNow();
  const todayKey=toKey(now);
  const sameDayCutoffPassed=sameDayMakeUpCutoffPassed();
  const opts=[];
  [0,1].forEach(function(weekOff){
    const monday=addDays(getMonday(now), weekOff*7);
    for(let i=0;i<5;i++){
      const date=addDays(monday,i);
      if(date < new Date(todayKey)) continue;
      if(isClosedDate(date)) continue; // centre's closed this day — never offer it as a make-up slot
      if(sameDayCutoffPassed && toKey(date)===todayKey) continue; // past 10am — today's no longer offered
      const weekday=WEEKDAY_KEYS[i];
      const dateKey=toKey(date);
      possibleStarts(duration).forEach(function(start){
        if(studentOverlapClash(student.id, dateKey, start, duration, null)) return;
        const podId=pickBestPod(weekday, dateKey, start, duration, student.year);
        if(podId){
          const cov=podCoverageDetail(podId, weekday, start, duration, date); // tolerant of a short unattended gap, same as pickBestPod just validated
          opts.push({date, start, duration, podId, instructorId:cov.primaryInstructorId});
        }
      });
    }
  });
  opts.sort(function(a,b){ return toKey(a.date)===toKey(b.date) ? a.start-b.start : new Date(a.date)-new Date(b.date); });
  return opts;
}

/* ---------- availability lookup (front-desk sales reference) ---------- */
// Open seats in a given window, summed across every Pod with an assigned instructor covering that
// window — the number front desk can quote straight to a parent on a call. Every instructor can
// teach any year (5.3), so unlike an earlier version of this tool, a seat counts here regardless of
// the student's year — "best suited for" only ever affects which Pod auto-assignment prefers
// (5.8), never whether front desk can quote a family a seat. Also reports how many Pods are
// staffed at all in that window, so "0 seats, nobody's on" reads differently from "0 seats, fully
// booked." (The `year` parameter is accepted but no longer filters — kept for callers that still
// pass one.)
function openSeatsAt(dateKey, weekday, blockStart, year, blockLen){
  let seats=0, staffed=0;
  const blockEnd=blockStart+blockLen;
  const date=new Date(dateKey);
  pods.forEach(function(pod){
    const cov=podCoverageBoundary(pod.id, weekday, blockStart, blockLen, date);
    if(!cov.instructorId) return;
    const winStart=blockStart, winEnd=Math.min(blockEnd, cov.boundary);
    if(winEnd<=winStart) return;
    staffed++;
    const peak=peakInWindow(pod.id, dateKey, winStart, winEnd);
    seats += Math.max(0, podCapacity(pod.id)-peak);
  });
  return {seats, staffed};
}
function setAvailWeek(w){ state.availWeekOffset=w; render(); }

/* ---------- waitlist for full day/time slots (5.17) ---------- */
// The soonest upcoming date that falls on a given weekday, from a given date (inclusive) — used to
// pick one concrete, checkable occurrence for a weekday+time waitlist entry.
function nextDateForWeekday(fromDate, weekday){
  let d=new Date(fromDate);
  while(WEEKDAY_KEYS[(d.getDay()+6)%7]!==weekday){ d=addDays(d,1); }
  return d;
}
// Same peak-headcount calculation as peakConcurrency, but can also account for seats already
// virtually claimed by other waitlist entries in the same first-in-first-served pass (see
// waitlistClaimsBefore) — so two families waiting for the same Pod/date don't both get told the
// same single opening is theirs.
function peakConcurrencyWithClaims(podId, dateKey, extra, claims){
  const list = sessionsForDay(podId, dateKey).map(function(s){ return {start:s.start, end:s.start+s.duration}; });
  (claims||[]).forEach(function(c){
    if(c.podId===podId && c.dateKey===dateKey) list.push({start:c.start, end:c.start+c.duration});
  });
  if(extra) list.push({start:extra.start, end:extra.start+extra.duration});
  if(list.length===0) return 0;
  const events=[];
  list.forEach(function(iv){ events.push([iv.start,1]); events.push([iv.end,-1]); });
  events.sort(function(a,b){ return a[0]-b[0] || a[1]-b[1]; });
  let cur=0, peak=0;
  events.forEach(function(e){ cur+=e[1]; if(cur>peak) peak=cur; });
  return peak;
}
// Same minimum-year-eligibility, tier-first logic as pickBestPod (5.21c) — kept as a separate
// function only because it also has to account for other waitlist entries ahead of this one in
// the queue that would already claim a seat (`claims`, via peakConcurrencyWithClaims) before this
// entry ever gets to see it. Kept in sync with pickBestPod deliberately; if that ranking changes
// again, this needs the same change.
function pickBestPodWithClaims(weekday, dateKey, start, duration, year, claims){
  const date=new Date(dateKey);
  for(let t=0; t<POD_TIERS.length; t++){
    const tierPods=POD_TIERS[t].filter(function(podId){ return podEligibleForYear(podId, year); });
    if(tierPods.length===0) continue;
    let best=null, bestSuited=-1, bestSameYear=-1, bestOccupancy=-1;
    tierPods.forEach(function(podId){
      const cov=podCoverageDetail(podId, weekday, start, duration, date);
      if(!cov.primaryInstructorId || !cov.ok) return;
      const instr=findInstructor(cov.primaryInstructorId);
      const cap=podCapacity(podId);
      const wouldBePeak=peakConcurrencyWithClaims(podId, dateKey, {start, duration}, claims);
      if(wouldBePeak>cap) return;
      const suited=instructorSuitedFor(instr, year)? 1 : 0;
      const sameYear=sameYearCount(podId, dateKey, start, duration, year);
      if(suited>bestSuited || (suited===bestSuited && (sameYear>bestSameYear || (sameYear===bestSameYear && wouldBePeak>bestOccupancy)))){
        best=podId; bestSuited=suited; bestSameYear=sameYear; bestOccupancy=wouldBePeak;
      }
    });
    if(best) return best;
  }
  return null;
}
// First-in-first-served (5.17): every waiting entry strictly older (by dateAdded) than this one
// gets to "claim" its seat first. Walks the queue oldest-first, and for each entry ahead of this
// one that currently resolves to a real Pod, reserves that Pod/date/time so a later entry can't
// also be told the exact same opening is theirs.
function waitlistClaimsBefore(entry){
  const claims=[];
  const waiting=waitlist.filter(function(w){ return w.status==='waiting'; })
    .sort(function(a,b){ return new Date(a.dateAdded)-new Date(b.dateAdded); });
  for(let i=0;i<waiting.length;i++){
    const w=waiting[i];
    if(entry && w.id===entry.id) break; // reached this entry's own place in the queue
    const year = w.studentId? findStudent(w.studentId).year : w.year;
    const dateKey = toKey(nextDateForWeekday(simNow(), w.weekday));
    const podId = pickBestPodWithClaims(w.weekday, dateKey, w.start, w.duration, year, claims);
    if(podId) claims.push({podId, dateKey, start:w.start, duration:w.duration});
  }
  return claims;
}
// Is there actually a seat for this entry right now, once everyone who's been waiting longer for
// an overlapping slot has first claim on whatever's open? Reuses the same coverage/qualification/
// capacity check standing bookings rely on (5.8), against the soonest upcoming occurrence of the
// entry's weekday. An existing student's CURRENT year is used (so a promotion, 5.9, is reflected
// automatically); a new enquiry uses whatever year was logged at the time they were added.
function waitlistOpenSeat(entry){
  const year = entry.studentId? findStudent(entry.studentId).year : entry.year;
  const date = nextDateForWeekday(simNow(), entry.weekday);
  const claims = waitlistClaimsBefore(entry);
  const podId = pickBestPodWithClaims(entry.weekday, toKey(date), entry.start, entry.duration, year, claims);
  return podId? {podId, date} : null;
}
// For the panel only: would this entry have a seat if the queue were ignored? Used to tell "someone
// who's been waiting longer has first claim on this one" apart from "nothing is open here at all."
function waitlistWouldFitIgnoringQueue(entry){
  const year = entry.studentId? findStudent(entry.studentId).year : entry.year;
  const dateKey = toKey(nextDateForWeekday(simNow(), entry.weekday));
  return !!pickBestPodWithClaims(entry.weekday, dateKey, entry.start, entry.duration, year, []);
}

function setNSFSessionsPerWeek(v){

// Shared by front desk placing a hold directly (saveHold) and front desk approving a parent's
// hold request (approveEnrollmentRequest) — same effect either way, just a different entry point.
function applyHold(student, start, end, note){
  const hold={id:newId()||('hold'+(nextSessionId++)), start:start, end:end, note:(note||'').trim()};
  student.holds=student.holds||[];
  student.holds.push(hold);
  dbWrite('placing a hold', function(){ return supabaseClient.from('student_holds').insert({
    id:hold.id, student_id:student.id, start_date:toKey(hold.start), end_date:toKey(hold.end), note:hold.note
  }); });
  // Free up any of this student's own already-booked sessions that fall inside the hold window —
  // standing or one-off alike — so those Pod slots immediately show as available. A session paid
  // for with a make-up credit gets its credit restored (unless already past its own expiry),
  // same as any other cancelled make-up.
  let cancelledCount=0;
  sessions.forEach(function(s){
    if(s.studentId!==student.id || s.status!=='scheduled') return;
    const dk=toKey(s.date);
    if(dk<toKey(hold.start) || dk>toKey(hold.end)) return;
    s.status='cancelled';
    cancelledCount++;
    dbWrite('cancelling a session for a hold', function(){ return supabaseClient.from('sessions').update({status:'cancelled'}).eq('id', s.id); });
    if(s.creditId){
      const credit=findCredit(s.creditId);
      if(credit && toKey(simNow())<=toKey(credit.expiryDate)){
        credit.status='available'; credit.redeemedSessionId=null;
        dbWrite('restoring a make-up credit', function(){ return supabaseClient.from('credits').update({status:'available', redeemed_session_id:null}).eq('id', credit.id); });
      }
    }
  });
  toast(student.name+' placed on hold '+fmtShort(hold.start)+'–'+fmtShort(hold.end)+(cancelledCount>0? ' — '+cancelledCount+' session(s) freed up for one-off bookings.' : '.'));
  return hold;
}
function saveHold(){
  const f=state.holdForm;
  const student=findStudent(f.studentId);
  if(!f.start || !f.end){ f.error='Choose a start and end date.'; render(); return; }
  if(f.end<f.start){ f.error='End date must be on or after the start date.'; render(); return; }

  state.holdForm=null;
  render();
}

  const student=findStudent(studentId);

/* ---------- render: shell ---------- */
// Every state change re-renders by rebuilding the whole #app innerHTML from scratch (no virtual
// DOM/diffing) — simple and reliable, but naively doing that on every keystroke would tear down
// and recreate the very <input> the person is typing into, kicking focus out and forcing them to
// click back in before every single character. To avoid that: note which field (and cursor
// position) was focused, rebuild the HTML as usual, then find the same field in the new markup —
// by its position among the other text fields in the same modal, since these forms don't carry
// individual ids — and restore focus/cursor there. A plain click, dropdown change, or button press
// has nothing focused that this applies to, so it's a no-op the rest of the time.
function render(){
  const app=document.getElementById('app');
  const active = (typeof document!=='undefined') ? document.activeElement : null;
  // Only text/search/tel/password/textarea reliably support reading/setting a cursor position in
  // every browser — email/number/date inputs throw or silently misbehave on selectionStart in
  // several browsers (observed: cursor resets to 0 on every keystroke, so each new character gets
  // inserted at the very front instead of where it was typed — e.g. typing "send" comes out
  // "dnes"). Those types still get their focus restored below, just not a cursor position.
  const focusableTypes=['text','email','password','number','search','tel','date'];
  const selectableTypes=['text','search','tel','password'];
  const isTextField = active && (active.tagName==='TEXTAREA' || (active.tagName==='INPUT' && focusableTypes.indexOf(active.type)>=0));
  const canSelect = active && (active.tagName==='TEXTAREA' || (active.tagName==='INPUT' && selectableTypes.indexOf(active.type)>=0));
  let restore=null;
  if(isTextField && app.contains(active)){
    const scope = (active.closest && active.closest('.modal')) || app;
    const fields = Array.prototype.slice.call(scope.querySelectorAll('input, textarea'));
    const idx = fields.indexOf(active);
    if(idx>=0){
      restore={ inModal: scope!==app, idx:idx, start:null, end:null };
      if(canSelect){
        try{ restore.start=active.selectionStart; restore.end=active.selectionEnd; }catch(e){}
      }
    }
  }
  app.innerHTML = renderTop() + renderTabs() + renderRole() + (state.toast? '<div class="toast">'+state.toast+'</div>':'') + renderFooter();
  if(restore){
    const scope = restore.inModal ? app.querySelector('.modal') : app;
    const el = scope && scope.querySelectorAll('input, textarea')[restore.idx];
    if(el){
      el.focus();
      if(restore.start!=null && restore.end!=null && typeof el.setSelectionRange==='function'){
        try{ el.setSelectionRange(restore.start, restore.end); }catch(e){}
      }
    }
  }
}

/* ---------- STAFF ---------- */
function podCoverageSummary(podId, weekday, date){
  const blocks=podBlocksForDay(podId, weekday);
  if(blocks.length===0) return 'Unassigned';
  return blocks.map(function(b){
    const instrId=blockInstructorOn(b, date);
    return (instrId? findInstructor(instrId).name : 'Unassigned')+' '+rangeLabel(b.start,b.end-b.start);
  }).join(' → ');
}

// At-a-glance "who's covering what" — every Pod down the side, Mon-Fri across the top, for
// whichever week the Schedule tab is currently showing (This week / Next week toggle). Reuses the
// exact same podCoverageSummary() the day-by-day pod cards below already show one pod/day at a
// time, just laid out so the whole week's coverage (or any gaps in it) is visible without clicking
// through every day. A cell with no instructor assigned at all is called out in red, since that's
// exactly the situation that leaves a regular-schedule slot unable to pre-book (see 5.10 fix).
function renderCoverageGrid(weekDates){
  let html='<div style="overflow-x:auto"><table style="margin-bottom:12px"><tr><th>Pod</th>'
    + weekDates.map(function(d){
        const wd=WEEKDAY_KEYS[(d.getDay()+6)%7];
        return '<th>'+wd+'<br><span class="small muted" style="font-weight:400">'+d.toLocaleDateString('en-AU',{month:'short',day:'numeric'})+'</span></th>';
      }).join('')
    + '</tr>';
  pods.forEach(function(pod){
    html+='<tr><td><b>'+pod.name+'</b></td>';
    weekDates.forEach(function(d){
      const wd=WEEKDAY_KEYS[(d.getDay()+6)%7];
      const summary=podCoverageSummary(pod.id, wd, d);
      const gap=summary==='Unassigned' || summary.indexOf('Unassigned')>=0;
      html+='<td'+(gap?' style="color:var(--danger)"':'')+'>'+summary+'</td>';
    });
    html+='</tr>';
  });
  html+='</table></div>';
  return html;
}

// Collapse state for front-desk sections lives on `state` (so it survives the full-page
// re-render every action triggers) but isn't persisted anywhere beyond the current browser tab —
// each section just remembers whether it's open or closed for the rest of this visit.
function sectionCollapsed(id){ return !!(state.collapsedSections && state.collapsedSections[id]); }
function toggleSection(id){
  state.collapsedSections = state.collapsedSections || {};
  state.collapsedSections[id] = !state.collapsedSections[id];

}
// Builds the opening "<div class='card'><div class='card-head'><h2>...</h2>" markup shared by
// every front-desk section, with the collapse toggle wired onto the title itself (not the whole
// header row) so any action buttons placed in extraHeaderHtml stay independently clickable.
function sectionOpen(id, title, extraHeaderHtml){
  return '<div class="card'+(sectionCollapsed(id)?' collapsed':'')+'">'
    +'<div class="card-head"><h2 class="sec-toggle" onclick="toggleSection(\''+id+'\')"><span class="chev">▾</span>'+title+'</h2>'
    +(extraHeaderHtml||'')+'</div>';

function renderStaff(){

  let dayKey=state.selectedDayKey;
  if(!dayKey || !weekDates.some(function(d){ return toKey(d)===dayKey; })){
    const todayInWeek=weekDates.find(function(d){ return sameDay(d,now); });
    dayKey = todayInWeek? toKey(todayInWeek) : toKey(weekDates[0]);
  }
  const selectedDate=new Date(dayKey);
  const weekday=WEEKDAY_KEYS[(selectedDate.getDay()+6)%7];
  const isPast = selectedDate < new Date(toKey(now));
  const closure=closedDayFor(selectedDate);

  let html=renderCoverageRequestsPanel();

  html+=renderCheckedInPanel();
  html+=renderAvailabilityLookup();
  html+=renderWaitlistPanel();
  html+=renderClosedDaysPanel();

      '<div style="display:flex;gap:6px">'
        +'<button class="btn sm'+(state.weekOffset===0?' primary':'')+'" onclick="setWeek(0)">This week</button>'
        +'<button class="btn sm'+(state.weekOffset===1?' primary':'')+'" onclick="setWeek(1)">Next week</button>'
        +'<button class="btn sm ghost" onclick="runReseatByAge()" title="Move already-booked students (who don\'t have a manual Pod pin) into whichever Pod best fits their age">Re-seat by age</button>'
        +(state.reseatGapReport && state.reseatGapReport.length? '<button class="btn sm ghost" onclick="openReseatGapReport()" title="See which day/time slots account for the students Re-seat by age couldn\'t move">View gap report ('+state.reseatGapReport.reduce(function(sum,g){ return sum+g.count; },0)+')</button>':'')
      +'</div>');
  html+='<p>Up to 6 group Pods, plus a Singles pod for 1:1 work. Assign an instructor to each Pod for the day (they can hand off to another instructor partway through); students are then booked into the Pod, not directly to a person. Regular weekly bookings pre-fill this calendar automatically from each student\'s set schedule (see Students below). A Pod with an instructor covering all but '+UNATTENDED_TOLERANCE_MIN+' minutes or less of a session (arriving a little late, wrapping up a little early, or a short gap between two shifts) still counts as covered — beyond that, it needs an explicit override to book anyway. A minimum year per Pod is enforced everywhere a Pod gets chosen — booking, auto-assignment, and moving a student — Singles Year 9+, Pod 6 Year 7+, Pod 4/5 Year 5+, Pod 3 Year 3+, Pod 1/2 Pre-K+ — always preferring the most senior Pod a student qualifies for; a student below a Pod\'s minimum can never be seated there, even as a last resort (a standing Pod pin is the only sanctioned exception). “Re-seat by age” takes every non-pinned upcoming student out of their Pod at once and re-seats everyone from scratch, oldest first, so an older student\'s claim on a senior Pod is never blocked by a younger student who simply hasn\'t been reprocessed yet.</p>';
  html+=renderCoverageGrid(weekDates);
  html+='<div class="daypicker">'+weekDates.map(function(d){
    const k=toKey(d);
    return '<button class="daybtn'+(k===dayKey?' active':'')+'" onclick="selectDay(\''+k+'\')">'+WEEKDAY_KEYS[(d.getDay()+6)%7]+'<span class="d2">'+d.toLocaleDateString('en-AU',{month:'short',day:'numeric'})+'</span></button>';
  }).join('')+'</div>';

  if(closure){ html+='<div class="banner danger">Centre closed this day — "'+closure.label+'". Nothing can be booked here; anything already scheduled was cancelled and credited when this closure was added.</div>'; }

    html+='<div class="card-head"><div><h3>'+pod.name+'</h3><span class="small muted">'+coverage+'</span></div>'

        +'<button class="btn sm ghost" onclick="openPodAssignForm(\''+pod.id+'\',\''+weekday+'\')">Assign</button>'

      +'</div></div>';
    if(roster.length===0){ html+='<div class="empty-note">Nothing booked yet.</div>'; }
    roster.forEach(function(sess){
      const student=findStudent(sess.studentId);
      const actualNote = sess.actualStart!=null? ' · checked in '+minToLabel(sess.actualStart)+', ran to '+minToLabel(sess.actualEnd)+(sess.checkInOffset>LATE_GRACE_MIN? ' (capped)':'') : '';
      let handoffNote='';
      if(sess.instructorId2){
        handoffNote = ' · '+findInstructor(sess.instructorId).name+' until '+minToLabel(sess.handoff)+', then '+findInstructor(sess.instructorId2).name;
      } else if(sess.instructorId){
        handoffNote = ' · with '+findInstructor(sess.instructorId).name;
      }
      html+='<div class="sess-chip status-'+sess.status+(sess.instructorId2?' handoff':'')+'">'
        +'<div><span class="time">'+rangeLabel(sess.start,sess.duration)+'</span> · <b>'+student.name+'</b> <span class="small muted">'+yearLabel(student.year)+' · '+sess.status+(sess.bookedBy==='parent'?' · 👪 parent':'')+(sess.recurring?' · regular':'')+handoffNote+actualNote+'</span></div>';
      let actions='';
      if(sess.status==='scheduled' && toKey(sess.date)<=toKey(now)){
        actions+='<button class="btn sm success" onclick="openCheckIn(\''+sess.id+'\')">✓ Check in</button>'
          +'<button class="btn sm danger" onclick="markStatus(\''+sess.id+'\',\'no-show\')">No-show</button>';
      } else if(sess.status==='scheduled'){
        actions+='<button class="btn sm ghost" onclick="markStatus(\''+sess.id+'\',\'cancelled\')">Cancel</button>';
      }
      if(sess.status==='scheduled' || sess.status==='attended'){
        actions+='<button class="btn sm ghost" onclick="openMoveForm(\''+sess.id+'\')">Move pod</button>';
      }
      if(actions) html+='<div class="actions">'+actions+'</div>';
      html+='</div>';
    });
    html+='</div>';
  });

  html+='</div>'; // closes the Schedule card opened by sectionOpen('schedule', ...) above — the pod
                   // cards just rendered are the last thing that belongs inside it. This was
                   // previously left unclosed (harmless before the collapsible-sections feature,
                   // since it just meant later cards were technically-invalid nested children
                   // rather than siblings) — now that collapsing hides a card's direct children,
                   // that missing tag was making "Schedule" swallow everything after it.

  html+=renderBookingModal();
  html+=renderReseatGapModal();
  html+=renderPodAssignModal();
  html+=renderCheckInModal();
  html+=renderMoveModal();
  html+=renderWaitlistModal();
  html+=renderClosedDayModal();
  html+=renderStudentsPanel();
  html+=renderInstructorsPanel();
  html+=renderParentsPanel();
  html+=renderCreditsReport();
  return html;
}

// One-off manual trigger for the age-based re-seat batch job (5.21) — front desk runs this
// whenever they want existing bookings brought in line with the age-band rule (e.g. right after
// turning the feature on, or after a run of enrollments/cancellations has left things lopsided).
// It's deliberately not automatic on every page load or booking change — moving already-seated
// kids around is disruptive enough that it should only happen when someone asks for it.
function runReseatByAge(){
  const result=reseatByAge();
  // Always spells out the full breakdown, not just "moved N" — a report of "this isn't doing
  // anything" is usually actually one of: everyone's pinned, everyone's already best-seated, or
  // there's nothing upcoming to look at at all. Surfacing the numbers directly here is a lot
  // faster to debug from than guessing.
  let msg='Checked '+result.totalUpcoming+' upcoming session(s). ';
  if(result.totalUpcoming===0){
    msg='No upcoming sessions to re-seat at all.';
  } else if(result.pinned===result.totalUpcoming){
    msg+='All '+result.pinned+' of them have an explicit Pod pin, so none are eligible for this rule — remove a pin (Students → that student → Pod) if you want it auto-managed by age instead.';
  } else {
    msg+=result.pinned+' pinned (skipped), '+result.alreadyBest+' already in their best-fitting Pod, '
      +result.moved+' moved to a better Pod'
      +(result.skipped>0? ', '+result.skipped+' couldn\'t move (no eligible Pod is staffed for them at that exact day/time)':'')+'.';
    // At small counts, naming names inline is the fastest path to fixing it. At real scale — a
    // centre whose Pod staffing doesn't cover the age tiers yet can easily see hundreds of
    // skips — a flat name list is unreadable, so past a threshold we point at the grouped
    // day/time report (state.reseatGapReport) instead, which is what actually tells you where to
    // add coverage.
    if(result.skippedDetails && result.skippedDetails.length){
      state.reseatGapReport=summarizeReseatGaps(result.skippedDetails);
      if(result.skippedDetails.length<=8){
        const shown=result.skippedDetails.map(function(d){
          return d.studentName+' ('+d.weekday+' '+minToLabel(d.start)+', still in '+d.currentPod+')';
        }).join('; ');
        msg+=' Couldn\'t move: '+shown+'. Reschedule them to a time an eligible Pod is covered, or add coverage there.';
      } else {
        msg+=' '+result.skipped+' couldn\'t move — click "View gap report" below to see exactly which day/time slots need coverage added.';
      }
    } else {
      state.reseatGapReport=null;
    }
  }
  toast(msg, 12000);
  render();
}

function renderBookingModal(){
  if(!state.booking) return '';
  const b=state.booking, f=state.bookingForm;
  const pod=findPod(b.podId);
  const date=new Date(b.dateKey);
  const weekday=WEEKDAY_KEYS[(date.getDay()+6)%7];
  const student=f.studentId? findStudent(f.studentId): null;
  const starts=possibleStarts(f.duration);
  const end=f.start!=null? f.start+f.duration : null;

  let cov=null, instr1=null, suited1=true, totallyUnassigned=false, instr2=null, suited2=true;
  if(student && f.start!=null){
    cov=podCoverageDetail(pod.id, weekday, f.start, f.duration, date);
    totallyUnassigned = !cov.primaryInstructorId;
    instr1 = cov.primaryInstructorId? findInstructor(cov.primaryInstructorId) : null;
    suited1 = instr1? instructorSuitedFor(instr1, student.year) : true;
    instr2 = cov.secondaryInstructorId? findInstructor(cov.secondaryInstructorId) : null;
    suited2 = instr2? instructorSuitedFor(instr2, student.year) : true;
  }
  // "Best suited for" (5.3) is a preference, not a requirement — it never forces an override. An
  // override is only ever about actual staffing: nobody assigned anywhere near the window, or a
  // gap bigger than the tolerated 15 minutes unattended (UNATTENDED_TOLERANCE_MIN).
  const needsOverride = student && cov && !cov.ok;

  const cap=podCapacity(pod.id);
  const wouldBePeak = (student && f.start!=null)? peakConcurrency(pod.id, b.dateKey, {start:f.start, duration:f.duration}) : 0;
  const overCapacity = wouldBePeak>cap;

  let html='<div class="overlay" onclick="if(event.target===this) closeBooking()"><div class="modal">';
  html+='<h3>Book into '+pod.name+' — '+fmtShort(date)+'</h3>';
  html+='<label>Student</label><select onchange="setBookingStudent(this.value)">'
      +'<option value="">Choose a student…</option>'
      +students.map(function(s){ return '<option value="'+s.id+'"'+(s.id===f.studentId?' selected':'')+'>'+s.name+' ('+yearLabel(s.year)+')</option>'; }).join('')
      +'</select>';
  html+='<div class="row2"><div><label>Length</label><select onchange="setBookingDuration(this.value)">'
      +DURATIONS.map(function(d){ return '<option value="'+d+'"'+(d===f.duration?' selected':'')+'>'+d+' min</option>'; }).join('')
      +'</select></div>'
      +'<div><label>Start time</label><select onchange="setBookingStart(this.value)">'
      +starts.map(function(t){ return '<option value="'+t+'"'+(t===f.start?' selected':'')+'>'+minToLabel(t)+'</option>'; }).join('')
      +'</select></div></div>';

  if(student && isStudentOnHold(student.id, date)){
    html+='<div class="banner warn">⏸️ '+student.name+' is on hold for this date — booking them anyway is fine if they\'re actually coming in.</div>';
  }
  if(student && cov && cov.secondaryInstructorId){
    html+='<div class="banner accent">↔️ '+pod.name+' hands off partway through: '+instr1.name+' until '+minToLabel(cov.handoffAt)+', then '+instr2.name+' until '+minToLabel(end)+'. This will book automatically across the handoff.</div>';
  }
  if(student && cov && cov.ok && cov.gapMinutes>0){
    html+='<div class="banner info">ℹ️ '+cov.gapMinutes+' min of this session is unattended in '+pod.name+' — within the '+UNATTENDED_TOLERANCE_MIN+'-minute tolerance, so no override is needed.</div>';
  }
  if(student && needsOverride){
    const reason = totallyUnassigned
      ? 'nobody is assigned to '+pod.name+' anywhere near that time'
      : pod.name+' is unattended for '+cov.gapMinutes+' min of this session — more than the '+UNATTENDED_TOLERANCE_MIN+'-minute tolerance';
    html+='<div class="banner warn">⚠️ '+reason+'. You can still book it, but confirm below — to fix this properly, adjust the Pod\'s assignment.</div>';
    html+='<label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" '+(f.overrideOk?'checked':'')+' onchange="toggleOverride()" style="width:auto;margin:0"/> Book anyway</label>';
  }
  // Purely informational, never blocking: every instructor can teach any year (5.3), so a mismatch
  // with their usual best-suited range is just a heads-up, not something that needs an override.
  if(student && !totallyUnassigned && (!suited1 || (instr2 && !suited2))){
    const who = !suited1? instr1.name+' ('+yearLabel(instr1.yearMin)+'–'+yearLabel(instr1.yearMax)+')' : instr2.name+' ('+yearLabel(instr2.yearMin)+'–'+yearLabel(instr2.yearMax)+')';
    html+='<div class="banner info">ℹ️ '+yearLabel(student.year)+' isn\'t '+who+'\'s usual focus, but they can teach any year — this books normally, no override needed.</div>';
  }
  if(student && overCapacity){
    html+='<div class="banner danger">⛔ This would put '+pod.name+' over capacity ('+wouldBePeak+'/'+cap+') — not allowed, no override.</div>';
  }

  const confirmDisabled = !f.studentId || f.start==null || overCapacity || (needsOverride && !f.overrideOk);
  html+='<div style="display:flex;gap:8px;margin-top:14px;justify-content:flex-end">'
      +'<button class="btn ghost" onclick="closeBooking()">Cancel</button>'
      +'<button class="btn primary" '+(confirmDisabled?'disabled':'')+' onclick="confirmBooking()">Confirm booking</button>'
    +'</div>';
  html+='</div></div>';
  return html;
}

/* ---------- INSTRUCTOR ---------- */
// The instructor-facing view of their rostered shifts deliberately doesn't mention Pods at all —
// that's an internal front-desk scheduling detail. To an instructor this is just "when am I
// working," derived from whatever blocks front desk has assigned them to, across any Pod.
function instructorRosteredShifts(instructorId){
  const now=simNow();
  const out=[];
  pods.forEach(function(pod){
    WEEKDAY_KEYS.forEach(function(day){
      podBlocksForDay(pod.id, day).forEach(function(b){
        if(blockInstructorOn(b, now)===instructorId){
          out.push({day, start:b.start, end:b.end, upcoming:false, podId:pod.id, blockId:b.id});
        }
        const future=b.assignments.filter(function(a){ return toKey(a.effectiveFrom)>toKey(now); })
          .sort(function(a,c){ return toKey(a.effectiveFrom).localeCompare(toKey(c.effectiveFrom)); })[0];
        if(future && future.instructorId===instructorId){
          out.push({day, start:b.start, end:b.end, upcoming:true, from:future.effectiveFrom, podId:pod.id, blockId:b.id});
        }
      });
    });
  });
  return out;
}

// Which Pods this instructor actually covers TODAY (per each block's dated assignment history),
// and which students are checked in at any of those Pods right now — used for the instructor's
// own "My Pod today" roster, so they only ever see students physically at their Pod, and only once
// checked in (not the full day's bookings).
function instructorPodIdsToday(instructorId){
  const today=simNow();
  const todayWeekday=WEEKDAY_KEYS[(today.getDay()+6)%7];
  return pods.filter(function(p){
    return podBlocksForDay(p.id, todayWeekday).some(function(b){ return blockInstructorOn(b, today)===instructorId; });
  }).map(function(p){ return p.id; });
}
function checkedInAtInstructorPodToday(instructorId){
  const todayKey=toKey(simNow());
  const myPodIds=instructorPodIdsToday(instructorId);
  return sessions.filter(function(s){
    return s.status==='attended' && toKey(s.date)===todayKey && myPodIds.indexOf(s.podId)>-1;
  }).sort(function(a,b){ return a.start-b.start; });
}

/* ---------- shift coverage requests ---------- */
// An instructor flags one dated occurrence of their own shift as needing coverage (e.g. they're
// sick), front desk sees it and picks a qualified, available replacement for just that date — the
// swap lands in the block's oneOffCoverage list (blockInstructorOn resolves it automatically
// everywhere else: booking, coverage summaries, capacity checks), leaving the instructor's regular
// dated assignment (5.2/5.3) untouched for every other day.
function openCoverageRequestForm(instructorId, podId, weekday, blockId){
  const today=simNow();
  let d=new Date(today);
  while(WEEKDAY_KEYS[(d.getDay()+6)%7]!==weekday){ d=addDays(d,1); }
  state.coverageRequestForm={instructorId, podId, weekday, blockId, date:toKey(d), note:'', error:''};
  render();
}
function closeCoverageRequestForm(){ state.coverageRequestForm=null; render(); }
function setCoverageRequestField(field, value){
  state.coverageRequestForm[field]=value;
  state.coverageRequestForm.error='';
  render();
}
function submitCoverageRequest(){
  const f=state.coverageRequestForm;
  const d=new Date(f.date);
  if(!f.date || toKey(d)<toKey(simNow())){ f.error='Pick today or a future date.'; render(); return; }
  if(WEEKDAY_KEYS[(d.getDay()+6)%7]!==f.weekday){ f.error='That date isn\'t a '+f.weekday+'.'; render(); return; }
  const dup=coverageRequests.find(function(r){ return r.blockId===f.blockId && toKey(r.date)===f.date && r.status==='open'; });
  if(dup){ f.error='There\'s already an open coverage request for that date.'; render(); return; }
  const block=podBlocksForDay(f.podId, f.weekday).find(function(b){ return b.id===f.blockId; });
  // Every qualified, actually-free instructor gets an email the moment the request goes in — a
  // parallel heads-up alongside front desk's own "needs coverage" queue, not a replacement for
  // front desk making the actual assignment (fillCoverageRequest). This is a point-in-time
  // snapshot of who's free right now; it doesn't re-fire later if availability changes.
  const notify=block? availableSubsForCoverage(f.podId, f.weekday, block, d, f.instructorId) : [];
  // If literally nobody qualifies and is free right now, that's already the "nobody can cover this
  // shift" case (5.14) — alert the manager immediately rather than waiting for front desk to notice
  // the request sitting open, or to click "mark unstaffed" themselves days later.
  const managerNotified = notify.length===0;
  const notifiedIds = notify.map(function(i){ return i.id; });
  const req={id:newId()||('cov'+(nextCoverageId++)), podId:f.podId, weekday:f.weekday, blockId:f.blockId, date:d, requestedBy:f.instructorId, note:f.note, status:'open', filledBy:null, notifiedInstructorIds:notifiedIds, managerNotified};
  coverageRequests.push(req);
  dbWrite('submitting coverage request', function(){ return supabaseClient.from('coverage_requests').insert({
    id:req.id, pod_id:req.podId, block_id:req.blockId, weekday:req.weekday, the_date:toKey(req.date),
    requested_by:req.requestedBy, note:req.note, status:'open', filled_by:null, manager_notified:managerNotified
  }).then(function(r){
    if(r.error || !notifiedIds.length) return r;
    return supabaseClient.from('coverage_request_notified_instructors').insert(notifiedIds.map(function(iid){
      return {coverage_request_id:req.id, instructor_id:iid};
    }));
  }); });
  const notifyMsg = notify.length
    ? ' Emailed '+notify.length+' available instructor'+(notify.length===1?'':'s')+' ('+notify.map(function(i){ return i.name; }).join(', ')+').'
    : ' Nobody is currently available — emailed '+MANAGER_EMAIL+' so it doesn\'t sit unnoticed.';
  toast('Coverage requested for '+fmtShort(d)+' — front desk will pick it up.'+notifyMsg);
  state.coverageRequestForm=null;

}
function cancelCoverageRequest(id){
  const r=coverageRequests.find(function(x){ return x.id===id; });
  if(r) r.status='cancelled';
  dbWrite('cancelling coverage request', function(){ return supabaseClient.from('coverage_requests').update({status:'cancelled'}).eq('id', id); });
  render();
}
// Qualified (5.3) instructors who are also actually free that exact date — not already covering a
// different Pod at an overlapping time, whether via their regular assignment or another swap.
function availableSubsForCoverage(podId, weekday, block, date, excludeInstructorId){
  const qualifying=qualifyingInstructorsForBlock(weekday, block, date).filter(function(i){ return i.id!==excludeInstructorId; });
  return qualifying.filter(function(instr){
    for(const otherPodId in podSchedule){
      const clash=podBlocksForDay(otherPodId, weekday).some(function(ob){
        if(otherPodId===podId && ob.id===block.id) return false;
        return ob.start<block.end && block.start<ob.end && blockInstructorOn(ob, date)===instr.id;
      });
      if(clash) return false;
    }
    return true;
  });
}
// Every currently open coverage request, system-wide (5.19) — not just the ones this instructor
// personally raised. Tagged and sorted so shifts overlapping their own declared weekly availability
// (instructorCurrentWeeklyPattern) surface first — the ones they could plausibly help with — then
// everything else, oldest date first within each group. Visibility only: front desk still makes the
// actual assignment (5.9/5.10); an instructor can't claim one from here.
function openCoverageRequestsSortedForInstructor(instructorId){
  const open=coverageRequests.filter(function(r){ return r.status==='open'; });
  const pattern=instructorCurrentWeeklyPattern(instructorId);
  const tagged=open.map(function(r){
    const block=podBlocksForDay(r.podId, r.weekday).find(function(b){ return b.id===r.blockId; });
    const a=pattern[r.weekday];
    const withinOwnAvailability = !!(block && a && block.start>=a.start && block.end<=a.end);
    return {request:r, withinOwnAvailability:withinOwnAvailability};
  });
  tagged.sort(function(x,y){
    if(x.withinOwnAvailability!==y.withinOwnAvailability) return x.withinOwnAvailability? -1 : 1;
    return new Date(x.request.date)-new Date(y.request.date);
  });
  return tagged;
}
function fillCoverageRequest(requestId, instructorId){
  const req=coverageRequests.find(function(r){ return r.id===requestId; });
  const block=podBlocksForDay(req.podId, req.weekday).find(function(b){ return b.id===req.blockId; });
  const dateKey=toKey(req.date);
  block.oneOffCoverage=(block.oneOffCoverage||[]).filter(function(o){ return toKey(o.date)!==dateKey; });
  block.oneOffCoverage.push({date:new Date(req.date), instructorId});
  req.status='filled';
  req.filledBy=instructorId;
  dbWrite('filling coverage request', function(){
    return supabaseClient.from('coverage_requests').update({status:'filled', filled_by:instructorId}).eq('id', requestId).then(function(){
      return supabaseClient.from('pod_shift_one_off_coverage').delete().eq('block_id', block.id).eq('the_date', dateKey);
    }).then(function(){
      return supabaseClient.from('pod_shift_one_off_coverage').insert({block_id:block.id, the_date:dateKey, instructor_id:instructorId});
    });
  });
  regenerateAllRecurring();
  toast(findInstructor(instructorId).name+' is covering '+findPod(req.podId).name+'’s '+req.weekday+' shift on '+fmtShort(req.date)+'.');
  render();
}
// Lets front desk record a coverage arrangement made face-to-face in the centre — any instructor,
// not just the qualification-and-availability shortlist fillCoverageRequest() is normally called
// from. Front desk is trusted to have actually confirmed the arrangement; this just records it.
function assignCoverageManually(requestId, instructorId){
  if(!instructorId){ toast('Choose an instructor first.'); return; }
  const req=coverageRequests.find(function(r){ return r.id===requestId; });
  if(!req || req.status!=='open') return;
  const instr=findInstructor(instructorId);
  fillCoverageRequest(requestId, instructorId);
  toast(instr.name+' is covering '+findPod(req.podId).name+'’s '+req.weekday+' shift on '+fmtShort(req.date)+' (arranged directly).');
}
function markCoverageUncovered(requestId){
  const req=coverageRequests.find(function(r){ return r.id===requestId; });
  const block=podBlocksForDay(req.podId, req.weekday).find(function(b){ return b.id===req.blockId; });
  const dateKey=toKey(req.date);
  block.oneOffCoverage=(block.oneOffCoverage||[]).filter(function(o){ return toKey(o.date)!==dateKey; });
  block.oneOffCoverage.push({date:new Date(req.date), instructorId:null});
  req.status='filled';
  req.filledBy=null;
  // The manager is only emailed once per request — usually this already happened the moment it was
  // raised (submitCoverageRequest, when the shortlist came back empty). Cover the rarer case where
  // it wasn't: someone was available at request time but never actually took it, so front desk is
  // the one confirming, right now, that nobody can cover it.
  const alreadyNotified=!!req.managerNotified;
  req.managerNotified=true;
  dbWrite('marking shift unstaffed', function(){
    return supabaseClient.from('coverage_requests').update({status:'filled', filled_by:null, manager_notified:true}).eq('id', requestId).then(function(){
      return supabaseClient.from('pod_shift_one_off_coverage').delete().eq('block_id', block.id).eq('the_date', dateKey);
    }).then(function(){
      return supabaseClient.from('pod_shift_one_off_coverage').insert({block_id:block.id, the_date:dateKey, instructor_id:null});
    });
  });
  regenerateAllRecurring();
  toast(findPod(req.podId).name+' is marked unstaffed for '+fmtShort(req.date)+' — no replacement found.'+(alreadyNotified? '' : ' Emailed '+MANAGER_EMAIL+'.'));
  render();
}

    const pendingCancel=enrollmentRequests.some(function(r){ return r.studentId===sid && r.type==='cancel' && r.status==='open'; });
    html+='<div class="parent-header"><div class="avatar-circle">'+initials+'</div>'
      +'<div><h2>'+student.name+'</h2><div class="small muted">'+yearLabel(student.year)+' · '+student.sessionsPerWeek+'x/week · '+student.duration+'-min sessions</div>'
      +'<div class="small muted">Regular schedule: '+recurringSummary(student)+'</div></div>'
      +'<div style="margin-left:auto;display:flex;flex-direction:column;gap:4px;align-items:flex-end">'
        +(pendingHold? '<span class="small muted">Hold request pending</span>' : '<a href="#" class="small" onclick="openHoldRequestForm(\''+sid+'\');return false;">Request a hold</a>')
        +(pendingCancel? '<span class="small muted">Cancellation request pending</span>' : '<a href="#" class="small" onclick="openCancelRequestForm(\''+sid+'\');return false;">Request to cancel enrolment</a>')
      +'</div></div>';

    const changes=upcomingChangesForStudent(sid);
    if(changes.length>0){
      html+='<div class="banner info">'+changes.map(describeUpcomingChange).join('<br/>')+'</div>';
    }

    const allUpcoming=sessions.filter(function(s){ return s.studentId===sid && s.status==='scheduled' && toKey(s.date)>=toKey(simNow()); })
      .sort(function(a,b){ return toKey(a.date).localeCompare(toKey(b.date)) || a.start-b.start; });
    const viewAll=!!(state.parentViewAllSessions && state.parentViewAllSessions[sid]);
    const upcomingSessions=viewAll? allUpcoming : allUpcoming.slice(0,5);
    html+='<div class="section-label" style="display:flex;justify-content:space-between;align-items:center">'
      +'<span>Upcoming sessions</span>'
      +(allUpcoming.length>5? '<a href="#" onclick="toggleViewAllSessions(\''+sid+'\');return false;" class="small">'+(viewAll?'Show fewer':'View all ('+allUpcoming.length+')')+'</a>' : '')
    +'</div>';
    if(upcomingSessions.length===0){ html+='<div class="empty-note">No upcoming sessions scheduled.</div>'; }
    else{
      html+='<div class="session-list">'+upcomingSessions.map(function(s){
        const pod=findPod(s.podId);
        const instr=s.instructorId? findInstructor(s.instructorId) : null;
        const isMakeUp=credits.some(function(c){ return c.redeemedSessionId===s.id; });
        const typeBadge=s.recurring? '<span class="badge booked">Regular</span>' : (isMakeUp? '<span class="badge available">Make-Up</span>' : '<span class="badge soon">One-off</span>');
        return '<div class="session-row">'
          +'<div class="session-date-chip"><div class="sd-day">'+s.date.toLocaleDateString('en-AU',{weekday:'short'})+'</div><div class="sd-num">'+s.date.getDate()+'</div></div>'
          +'<div class="session-main"><b>'+rangeLabel(s.start,s.duration)+'</b><div class="small muted">'+(pod?pod.name:'—')+' · '+(instr?instr.name:'Unassigned')+'</div></div>'
          +typeBadge
          +'<button class="btn sm ghost" onclick="parentCancelSession(\''+s.id+'\')">Cancel</button>'
        +'</div>';
      }).join('')+'</div>';
    }

    html+='<div class="section-label">Make-up credits</div>';
    if(studentCredits.length===0){ html+='<div class="empty-note">No make-up credits on file.</div>'; }
    else{
      const availableCount=studentCredits.filter(function(c){ const s=creditDisplayStatus(c); return s==='available'||s==='soon'; }).length;
      const soonest=studentCredits.filter(function(c){ const s=creditDisplayStatus(c); return s==='available'||s==='soon'; })
        .sort(function(a,b){ return a.expiryDate-b.expiryDate; })[0];
      if(availableCount>0){
        html+='<div class="makeup-summary"><div><div class="makeup-count">'+availableCount+'</div><div class="makeup-count-label">available</div></div>'
          +(soonest? '<div><div class="small muted">Next expiry</div><b>'+fmtShort(soonest.expiryDate)+'</b><div class="small muted">'+daysUntil(simNow(),soonest.expiryDate)+' days remaining</div></div>' : '')
          +(soonest? '<button class="btn primary" style="margin-left:auto" onclick="startBookMakeUp(\''+soonest.id+'\')">Book a make-up</button>' : '')
        +'</div>';
      }
      studentCredits.forEach(function(c){ html+=renderParentCredit(c, student); });
    }
    html+='</div>';
  });
  html+=renderHoldRequestModal();
  html+=renderCancelRequestModal();
  return html;
}

function renderParentCredit(c, student){
  const st=creditDisplayStatus(c);
  const now=simNow();
  let html='<div class="credit-card st-'+st+'">';
  if(st==='available' || st==='soon'){
    html+='<div class="row"><div><b>Make-up credit available</b><div class="small muted">From missed session on '+fmtShort(c.issuedDate)+'</div></div>'
      + (st==='soon'? '<span class="badge soon">Expires '+fmtShort(c.expiryDate)+'</span>' : '<span class="badge available">Expires '+fmtShort(c.expiryDate)+'</span>') +'</div>';
    if(st==='soon') html+='<div class="banner warn">⏰ Only '+daysUntil(now,c.expiryDate)+' day(s) left to use this credit before it expires.</div>';
    if(state.parentBookingCreditId===c.id){ html+=renderSlotPicker(c); }
    else html+='<button class="btn primary sm" onclick="startBookMakeUp(\''+c.id+'\')">Book a make-up</button>';
  } else if(st==='booked'){
    const sess=findSession(c.redeemedSessionId);
    html+='<div class="row"><div><b>Make-up booked</b><div class="small muted">'+fmtShort(sess.date)+', '+rangeLabel(sess.start,sess.duration)+' with '+findInstructor(sess.instructorId).name+'</div></div><span class="badge booked">Booked</span></div>';
    html+='<button class="btn sm danger" onclick="cancelMakeUp(\''+c.id+'\')">Cancel this booking</button>';
  } else if(st==='completed'){
    const sess=findSession(c.redeemedSessionId);
    html+='<div class="row"><div><b>Make-up completed</b><div class="small muted">Attended '+fmtShort(sess.date)+'</div></div><span class="badge completed">Completed</span></div>';
  } else if(st==='expired'){
    html+='<div class="row"><div><b>Credit expired</b><div class="small muted">Missed session was '+fmtShort(c.issuedDate)+' — window closed '+fmtShort(c.expiryDate)+'</div></div><span class="badge expired">Expired</span></div>';
  }
  html+='</div>';
  return html;
}

function renderSlotPicker(credit){
  const opts=openSlotsForCredit(credit);
  let html='<div style="margin-top:10px"><div class="small muted" style="margin-bottom:6px">Open times only — you won\'t see who else is booked, or which instructor works which day.</div>';
  if(sameDayMakeUpCutoffPassed()) html+='<div class="small muted" style="margin-bottom:6px">It\'s past 10:00am, so today isn\'t offered for a make-up — the earliest option below is tomorrow.</div>';
  if(opts.length===0) html+='<div class="empty-note">No open slots in the next two weeks for this program.</div>';

    html+='<div class="slot-opt"><span>'+fmtShort(o.date)+' · '+rangeLabel(o.start,o.duration)+'</span>'
      +'<button class="btn sm primary" onclick="bookSlot(\''+credit.id+'\',\''+toKey(o.date)+'\','+o.start+','+o.duration+',\''+o.podId+'\',\''+o.instructorId+'\')">Book</button></div>';
  });
  html+='<button class="btn sm ghost" onclick="cancelBookMakeUp()">Back</button></div>';
  return html;
}

/* ============================================================
   LIVE MODE — login screen + loading real data from Supabase.
   Everything below only runs when supabaseClient exists (a real browser that successfully
   loaded the Supabase SDK). In the Node smoke-test sandbox, or if this file is ever opened
   somewhere offline, supabaseClient is null and the app falls straight through to the
   original demo bootstrap at the very bottom — nothing here can break that path.
   ============================================================ */

function showLoginScreen(errorMsg){
  const app=document.getElementById('app');
  app.innerHTML =
    '<div class="login-wrap"><div class="card login-card">'
    +'<div class="brand-logo"><img src="'+MATHNASIUM_LOGO+'" alt="Mathnasium"/></div>'
    +'<h2>Sign in</h2>'
    +(errorMsg? '<div class="banner danger">'+errorMsg+'</div>' : '')
    +'<label>Email</label><input id="loginEmail" type="email" autocomplete="username" />'
    +'<label>Password</label><input id="loginPassword" type="password" autocomplete="current-password" />'
    +'<button class="btn" onclick="doLogin()">Sign in</button>'
    +'<p style="text-align:center;margin-top:12px"><a href="#" onclick="showForgotPasswordScreen();return false;" class="small">Forgot password?</a></p>'
    +'</div></div>';
  const pw=document.getElementById('loginPassword');
  if(pw) pw.addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin(); });
}

function doLogin(){
  const email=(document.getElementById('loginEmail').value||'').trim();
  const password=document.getElementById('loginPassword').value||'';
  if(!email || !password){ showLoginScreen('Enter your email and password.'); return; }
  supabaseClient.auth.signInWithPassword({email, password}).then(function(res){
    if(res.error){ showLoginScreen(res.error.message); return; }
    afterLogin();
  });
}

function showForgotPasswordScreen(msg, isError){
  const app=document.getElementById('app');
  app.innerHTML =
    '<div class="login-wrap"><div class="card login-card">'
    +'<div class="brand-logo"><img src="'+MATHNASIUM_LOGO+'" alt="Mathnasium"/></div>'
    +'<h2>Reset your password</h2>'
    +'<p class="small muted">Enter the email your account was set up with — we\'ll send a link to reset your password.</p>'
    +(msg? '<div class="banner '+(isError?'danger':'info')+'">'+msg+'</div>' : '')
    +'<label>Email</label><input id="forgotEmail" type="email" autocomplete="username" />'
    +'<button class="btn" onclick="sendPasswordReset()">Send reset link</button>'
    +'<p style="text-align:center;margin-top:12px"><a href="#" onclick="showLoginScreen();return false;" class="small">Back to sign in</a></p>'
    +'</div></div>';
}
function sendPasswordReset(){
  const email=(document.getElementById('forgotEmail').value||'').trim();
  if(!email){ showForgotPasswordScreen('Enter your email address.', true); return; }
  supabaseClient.auth.resetPasswordForEmail(email, {redirectTo:SITE_URL}).then(function(){
    // Same confirmation whether or not that email is actually registered — never reveal which
    // emails have accounts.
    showForgotPasswordScreen('If that email has an account, a reset link is on its way.', false);
  });
}

// Reached via the link in either an invite email or a password-reset email — Supabase's SDK
// parses the token in the URL and establishes a session automatically; this just asks for (and
// sets) the actual new password before letting them into the app proper.
function showSetPasswordScreen(errorMsg){
  const app=document.getElementById('app');
  app.innerHTML =
    '<div class="login-wrap"><div class="card login-card">'
    +'<div class="brand-logo"><img src="'+MATHNASIUM_LOGO+'" alt="Mathnasium"/></div>'
    +'<h2>Set your password</h2>'
    +(errorMsg? '<div class="banner danger">'+errorMsg+'</div>' : '')
    +'<label>New password</label><input id="newPassword" type="password" autocomplete="new-password" />'
    +'<label>Confirm password</label><input id="newPassword2" type="password" autocomplete="new-password" />'
    +'<button class="btn" onclick="setNewPassword()">Set password</button>'
    +'</div></div>';
}
function setNewPassword(){
  const p1=document.getElementById('newPassword').value||'';
  const p2=document.getElementById('newPassword2').value||'';
  if(p1.length<6){ showSetPasswordScreen('Password must be at least 6 characters.'); return; }
  if(p1!==p2){ showSetPasswordScreen('Passwords don\'t match.'); return; }
  supabaseClient.auth.updateUser({password:p1}).then(function(res){
    if(res.error){ showSetPasswordScreen(res.error.message); return; }
    afterLogin();
  });
}

function logOut(){
  supabaseClient.auth.signOut().then(function(){ location.reload(); });
}

function afterLogin(){
  supabaseClient.auth.getUser().then(function(res){
    if(res.error || !res.data.user){ showLoginScreen('Session expired — sign in again.'); return; }
    const uid=res.data.user.id;
    supabaseClient.from('app_users').select('role,instructor_id,parent_id').eq('auth_user_id', uid).single().then(function(r){
      if(r.error || !r.data){ showLoginScreen("Your account isn't set up yet — ask front desk to add you."); return; }
      currentUser={role:r.data.role, instructorId:r.data.instructor_id, parentId:r.data.parent_id, email:res.data.user.email};
      loadAllData().then(function(){
        state.role=currentUser.role;
        applyPromotions();
        applyPlanChanges();
        regenerateAllRecurring();
        render();
        // Live mode has no demo-clock button to trigger applyPromotions()/applyPlanChanges() as
        // days actually pass — real time just ticks forward on its own. Re-checking both on the
        // same 30s heartbeat that already drives the checked-in "time left" countdown (see the
        // offline-mode comment below) means a scheduled promotion or plan change takes effect
        // within 30 seconds of its date arriving, not only the next time someone happens to
        // re-open the page.
        setInterval(function(){ applyPromotions(); applyPlanChanges(); render(); }, 30000);
      }).catch(function(err){
        console.error(err);
        showLoginScreen('Signed in, but loading your data failed — check your connection and reload.');
      });
    });
  });
}

// Fetches every table this logged-in user can see (Row Level Security already scopes each query
// to their role) and reshapes it into the exact in-memory structures the rest of the app already
// reads/writes — so every existing render/business-logic function keeps working completely
// unchanged, whether its data came from the demo arrays or from a real database.
function loadAllData(){
  const T=function(name, sel){ return supabaseClient.from(name).select(sel).then(function(r){ if(r.error) throw r.error; return r.data||[]; }); };
  return Promise.all([
    T('instructors','id,name,email,year_min,year_max,auth_user_id,active'),
    T('instructor_avail_rules','instructor_id,weekday,effective_from,off,start_min,end_min'),
    T('instructor_one_offs','instructor_id,the_date,off,start_min,end_min'),
    T('pods','id,name,capacity'),
    T('pod_shift_blocks','id,pod_id,weekday,start_min,end_min'),
    T('pod_shift_assignments','block_id,instructor_id,effective_from'),
    T('pod_shift_one_off_coverage','block_id,the_date,instructor_id'),
    T('students','id,parent_id,name,year,base_year,year_baseline,duration,sessions_per_week,notes'),
    T('student_recurring_slots','student_id,weekday,start_min'),
    T('student_holds','id,student_id,start_date,end_date,note'),
    T('student_pod_assignments','id,student_id,pod_id,effective_from'),
    T('student_plan_changes','id,student_id,effective_from,stopped,sessions_per_week'),
    T('student_plan_change_recurring','plan_change_id,weekday,start_min'),
    T('parents','id,name,email,auth_user_id'),
    T('sessions','id,student_id,pod_id,instructor_id,instructor_id_2,handoff_min,the_date,start_min,duration,status,actual_start_min,actual_end_min,check_in_offset,booked_by,is_recurring,credit_id'),
    T('credits','id,student_id,issued_date,expiry_date,status,redeemed_session_id,warning_sent,source,note'),
    T('coverage_requests','id,pod_id,block_id,weekday,the_date,requested_by,note,status,filled_by,manager_notified'),
    T('coverage_request_notified_instructors','coverage_request_id,instructor_id'),
    T('waitlist_entries','id,student_id,name,year,weekday,start_min,duration,note,status,notified,date_added'),
    T('closed_days','id,the_date,label,recurring'),
    T('enrollment_requests','id,student_id,type,start_date,end_date,effective_from,note,status,created_at'),
  ]).then(function(t){
    const [instrRows,availRows,oneOffRows,podRows,blockRows,assignRows,coverRows,studentRows,slotRows,holdRows,podAssignRows,planChangeRows,planChangeRecurRows,parentRows,sessionRows,creditRows,covReqRows,covNotifRows,waitlistRows,closedDayRows,enrollRequestRows]=t;

    instructors=instrRows.map(function(r){ return {
      id:r.id, name:r.name, email:r.email, yearMin:r.year_min, yearMax:r.year_max,
      authUserId:r.auth_user_id, active: r.active!==false,
      availRules: availRows.filter(function(a){ return a.instructor_id===r.id; }).map(function(a){
        return {weekday:a.weekday, effectiveFrom:new Date(a.effective_from), off:a.off, start:a.start_min, end:a.end_min};
      }),
      oneOffs: oneOffRows.filter(function(o){ return o.instructor_id===r.id; }).map(function(o){
        return {date:new Date(o.the_date), off:o.off, start:o.start_min, end:o.end_min};
      }),
    }; });

    pods=podRows.map(function(r){ return {id:r.id, name:r.name, capacity:r.capacity}; });

    podSchedule={};
    pods.forEach(function(p){ podSchedule[p.id]={}; });
    blockRows.forEach(function(b){
      const assignments=assignRows.filter(function(a){ return a.block_id===b.id; }).map(function(a){
        return {instructorId:a.instructor_id, effectiveFrom:new Date(a.effective_from)};
      });
      const oneOffCoverage=coverRows.filter(function(c){ return c.block_id===b.id; }).map(function(c){
        return {date:new Date(c.the_date), instructorId:c.instructor_id};
      });
      const block={id:b.id, start:b.start_min, end:b.end_min, assignments, oneOffCoverage};
      if(!podSchedule[b.pod_id]) podSchedule[b.pod_id]={};
      if(!podSchedule[b.pod_id][b.weekday]) podSchedule[b.pod_id][b.weekday]=[];
      podSchedule[b.pod_id][b.weekday].push(block);
    });

    students=studentRows.map(function(r){ return {
      id:r.id, parentId:r.parent_id, name:r.name, year:r.year, baseYear:r.base_year, yearBaseline:r.year_baseline,
      duration:r.duration, sessionsPerWeek:r.sessions_per_week,
      recurring: slotRows.filter(function(s){ return s.student_id===r.id; }).map(function(s){ return {weekday:s.weekday, start:s.start_min}; }),
      holds: holdRows.filter(function(h){ return h.student_id===r.id; }).map(function(h){ return {id:h.id, start:new Date(h.start_date), end:new Date(h.end_date), note:h.note||''}; }),
      podAssignments: podAssignRows.filter(function(a){ return a.student_id===r.id; }).map(function(a){ return {podId:a.pod_id, effectiveFrom:new Date(a.effective_from)}; }),
      planChanges: planChangeRows.filter(function(pc){ return pc.student_id===r.id; }).map(function(pc){ return {
        id:pc.id, effectiveFrom:new Date(pc.effective_from), stopped:pc.stopped, sessionsPerWeek:pc.sessions_per_week,
        recurring: planChangeRecurRows.filter(function(rec){ return rec.plan_change_id===pc.id; }).map(function(rec){ return {weekday:rec.weekday, start:rec.start_min}; }),
      }; }),
    }; });

    parents=parentRows.map(function(r){ return {
      id:r.id, name:r.name, email:r.email, authUserId:r.auth_user_id,
      studentIds: students.filter(function(s){ return s.parentId===r.id; }).map(function(s){ return s.id; }),
    }; });

    sessions=sessionRows.map(function(r){ return {
      id:r.id, studentId:r.student_id, podId:r.pod_id, instructorId:r.instructor_id, instructorId2:r.instructor_id_2,
      handoff:r.handoff_min, date:new Date(r.the_date), start:r.start_min, duration:r.duration, status:r.status,
      actualStart:r.actual_start_min, actualEnd:r.actual_end_min, checkInOffset:r.check_in_offset,
      bookedBy:r.booked_by, recurring:r.is_recurring, creditId:r.credit_id,
    }; });

    credits=creditRows.map(function(r){ return {
      id:r.id, studentId:r.student_id, issuedDate:new Date(r.issued_date), expiryDate:new Date(r.expiry_date),
      status:r.status, redeemedSessionId:r.redeemed_session_id, warningSent:r.warning_sent, source:r.source, note:r.note||'',
    }; });

    coverageRequests=covReqRows.map(function(r){ return {
      id:r.id, podId:r.pod_id, blockId:r.block_id, weekday:r.weekday, date:new Date(r.the_date), requestedBy:r.requested_by,
      note:r.note||'', status:r.status, filledBy:r.filled_by, managerNotified:r.manager_notified,
      notifiedInstructorIds: covNotifRows.filter(function(n){ return n.coverage_request_id===r.id; }).map(function(n){ return n.instructor_id; }),
    }; });

    waitlist=waitlistRows.map(function(r){ return {
      id:r.id, studentId:r.student_id, name:r.name, year:r.year, weekday:r.weekday, start:r.start_min, duration:r.duration,
      note:r.note||'', dateAdded:new Date(r.date_added), notified:r.notified, status:r.status,
    }; });

    closedDays=closedDayRows.map(function(r){ return {
      id:r.id, date:new Date(r.the_date), label:r.label, recurring:r.recurring,
    }; });

    enrollmentRequests=enrollRequestRows.map(function(r){ return {
      id:r.id, studentId:r.student_id, type:r.type,
      start: r.start_date? new Date(r.start_date) : null,
      end: r.end_date? new Date(r.end_date) : null,
      effectiveFrom: r.effective_from? new Date(r.effective_from) : null,
      note:r.note||'', status:r.status, createdAt:new Date(r.created_at),
    }; });
  });
}

if(supabaseClient){
  // Driven off onAuthStateChange rather than a one-off getSession() call, since the SDK sometimes
  // fires an early "no session yet" event before it's actually finished parsing the invite/recovery
  // token out of the URL — a direct getSession() (or treating that first event as final) can catch
  // that premature moment and show the plain login screen, permanently ignoring the correct
  // "you're actually signed in via this link" event that arrives a beat later. So instead: a
  // "no session" result is treated as provisional (shows login, but keeps listening) while a real
  // signed-in result is treated as final and always wins, whenever it arrives.
  var routedToApp = false; // true once we've acted on an actual session — later events can't undo it
  supabaseClient.auth.onAuthStateChange(function(event, session){
    // PASSWORD_RECOVERY is supposedly Supabase's dedicated event for this, but it isn't firing
    // reliably for this project's link format — so both invite and recovery links are now decided
    // purely from the link's own type (captured synchronously from the URL at the very top of this
    // script, and independently confirmed correct), on whichever session-bearing event fires first.
    if(session && (event==='SIGNED_IN' || event==='INITIAL_SESSION' || event==='PASSWORD_RECOVERY') && !routedToApp){
      routedToApp=true;
      // An invite or password-reset link lands here with a session already established (Supabase's
      // SDK parses the token from the URL on its own) — but they still need to actually choose a
      // password before going any further, so this takes priority over the normal "already signed
      // in, skip straight to the app" path.
      if(AUTH_REDIRECT_TYPE==='invite' || AUTH_REDIRECT_TYPE==='recovery'){ showSetPasswordScreen(); } else { afterLogin(); }
      return;
    }
    if(!session && event==='INITIAL_SESSION' && !routedToApp){
      showLoginScreen(); // provisional — a following SIGNED_IN with a real session still overrides this
    }
  });
} else {
  // Offline / test-harness fallback — exactly the original demo bootstrap, untouched.
  students.forEach(function(s){ s.baseYear=s.year; s.yearBaseline=schoolYearIndex(BASE); s.holds=s.holds||[]; });
  regenerateAllRecurring();
  render();
  // Keeps the checked-in "time left" countdown ticking against the real clock without anyone
  // touching the page — a plain re-render every 30s is plenty of resolution for a minutes-level
  // countdown, and cheap enough for a page this size.
  setInterval(render, 30000);
}
</script>

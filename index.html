  html+='</div></div>';
  return html;
}

// A Pod's day can naturally turn over into more than one distinct wave of students — mostly one
// group arriving together, then leaving and being replaced by a different group later on (Sept 2026,
// per Allie: "sometimes pods experience a second seating... on the first seating its 7 kids, and then
// on the second its 6"). Grouped by each session's own start time rather than by staffing block,
// since a real seating turnover is about when the KIDS actually arrive, not how coverage happens to
// be split for the day — a Pod staffed by one instructor straight through can still turn over twice.
// A Pod with everyone on a single start time (the ordinary case) has nothing worth calling out, so
// this only returns something once there's a genuine second (or third...) wave.
function podSeatingsBreakdown(roster){
  const byStart={};
  roster.forEach(function(s){ (byStart[s.start]=byStart[s.start]||[]).push(s); });
  const starts=Object.keys(byStart).map(Number).sort(function(a,b){ return a-b; });
  if(starts.length<2) return null;
  const ORDINALS=['1st','2nd','3rd','4th','5th','6th','7th','8th'];
  return starts.map(function(start, idx){
    return {label:(ORDINALS[idx]||(idx+1)+'th')+' seating', time:minToLabel(start), count:byStart[start].length};
  });
}
function renderPodSummaryStrip(dayKey, weekday){
  const now=simNow();
  const selectedDate=new Date(dayKey);
  const dayList=scheduleListForDay(dayKey);
  const checkedInByPod=checkedInNamesByPod(dayKey);
  let html='<div style="display:flex;flex-direction:column;gap:12px;margin-bottom:12px">';
  pods.forEach(function(pod){
    const cap=podCapacity(pod.id);
    const coverage=podCoverageSummary(pod.id, weekday, selectedDate);
    const checkedIn=checkedInByPod[pod.id]||[];
    // The badge counts who's actually sitting there (live today, the day's full record for any
    // other day — see checkedInNamesByPod()) rather than the day's busiest scheduled overlap, so it
    // climbs 1/8, 2/8, 3/8... as each student is checked in and assigned here, exactly the "seats
    // filling up" view front desk watches through the day (5.28, per Allie).
    const occupancy=checkedIn.length;
    const roster=dayList.filter(function(s){ return s.podId===pod.id && !s.online; });
    const seatings=podSeatingsBreakdown(roster);
    html+='<div class="card" style="margin:0"><div class="card-head" style="flex-wrap:wrap;row-gap:6px">'
      +'<h3 style="margin:0">'+pod.name+'</h3>'
      +'<span class="small muted">'+coverage+'</span>'
      +'<span class="badge '+(occupancy>=cap?'full':'available')+'">'+occupancy+'/'+cap+'</span>'
      +'<button class="btn sm ghost" style="margin-left:auto" onclick="openPodAssignForm(\''+pod.id+'\',\''+weekday+'\')">Assign</button>'
      +(seatings? '<span class="small muted" style="width:100%">'+seatings.map(function(sg){ return sg.label+' ('+sg.time+'): <b>'+sg.count+'</b> kid'+(sg.count===1?'':'s'); }).join(' · ')+'</span>' : '')
    +'</div>'
    +(roster.length? rosterTableHtml(roster, weekday, dayKey, now) : '<div class="empty-note">Nobody assigned here yet.</div>')
    +'</div>';
  });
  // Online cards — one per instructor currently minding an Online group today, shown separately
  // from the Pod cards above (Online is a separate concept, not just another Pod). Only instructors
  // with at least one online student booked today get a card; an on-shift instructor with nobody
  // online yet doesn't clutter this up.
  const onlineByInstructor={};
  dayList.forEach(function(s){ if(s.online){ (onlineByInstructor[s.instructorId]=onlineByInstructor[s.instructorId]||[]).push(s); } });
  Object.keys(onlineByInstructor).forEach(function(instrId){
    const instr=findInstructor(instrId);
    if(!instr) return;
    const occupancy=instructorOccupantCount(instrId, dayKey); // combined (physical + online) headcount actually sitting with this instructor — the number their own combined cap caps (combinedCapFor)
    const instrCap=combinedCapFor(instrId);
    html+='<div class="card online" style="margin:0"><div class="card-head" style="flex-wrap:wrap;row-gap:6px">'
      +'<h3 style="margin:0">Online — '+instr.name+'</h3>'
      +'<span class="badge '+(occupancy>=instrCap?'full':'available')+'">'+occupancy+'/'+instrCap+'</span>'
    +'</div>'
    +rosterTableHtml(onlineByInstructor[instrId], weekday, dayKey, now)
    +'</div>';
  });
  // Unassigned — anyone with no Pod and not online: a genuine gap front desk still needs to resolve,
  // called out as its own card rather than silently missing from every Pod's roster.
  const unassigned=dayList.filter(function(s){ return !s.podId && !s.online; });
  if(unassigned.length){
    html+='<div class="card" style="margin:0"><div class="card-head"><h3 style="margin:0;color:var(--danger)">Unassigned</h3></div>'
      +rosterTableHtml(unassigned, weekday, dayKey, now)
    +'</div>';
  }
  html+='</div>';
  return html;
}

// Every student expected on a given day, across every Pod (and Unassigned) at once — replaces the
// old per-Pod roster loop (Sept 2026). Originally sorted alphabetically by student name; changed
// Sept 2026 (per Allie: "can we arrange pod scheduling permanent changes to be by order of
// arrival, not alphabetical") to sort by arrival time instead — a student already checked in sorts
// by when they actually arrived (actualStart), everyone else by their scheduled start time, so the
// list reads top-to-bottom as "who's here/coming first". Student name is now only a tie-break for
// two sessions landing at the exact same time.
function scheduleListForDay(dayKey){
  return sessions.filter(function(s){ return toKey(s.date)===dayKey && s.status!=='cancelled'; })
    .slice()
    .sort(function(a,b){
      const aTime=(a.status==='attended' && a.actualStart!=null)? a.actualStart : a.start;
      const bTime=(b.status==='attended' && b.actualStart!=null)? b.actualStart : b.start;
      if(aTime!==bTime) return aTime-bTime;
      const an=findStudent(a.studentId), bn=findStudent(b.studentId);
      if(!an || !bn) return 0;
      return an.name.localeCompare(bn.name, undefined, {sensitivity:'base'});
    });
}

// The Schedule list's own Pod dropdown, onchange — picks freely (Sept 2026: no age or capacity
// blocking on the picker itself), but capacity is still the one thing that can actually refuse the
// change (movePodSession still checks it) since that's the one requirement left (the 1:8 ratio).
// An empty value unassigns outright, with no capacity/coverage math needed for that.
function setSessionPod(sessionId, podId){
  const sess=findSession(sessionId);
  if(!sess) return;
  const student=findStudent(sess.studentId);
  if(!podId){
    sess.podId=null; sess.instructorId=null; sess.instructorId2=null; sess.handoff=null; sess.online=false;
    dbWrite('unassigning a session\'s Pod', function(){ return supabaseClient.from('sessions').update({
      pod_id:null, instructor_id:null, instructor_id_2:null, handoff_min:null, online:false
    }).eq('id', sess.id); });
    toast(student.name+' set to Unassigned.');
    render();
    return;
  }
  const result=movePodSession(sessionId, podId);
  if(!result.ok){ toast(result.error); render(); return; }
  if(result.newPod){
    toast(result.oldPod? (student.name+' moved from '+result.oldPod.name+' to '+result.newPod.name+'.') : (student.name+' assigned to '+result.newPod.name+'.'));
  }
  render();
}

// The Pod seating section's own "Move to" picker (Sept 2026, per Allie: "I think maybe instead of
// having the pre-assigned pods as always visible, that is another section at the bottom default
// collapsed, where we can visually arrange students and any changes made to that section are
// permanent changes from that day onward") — unlike setSessionLocation/setSessionPod above (a
// one-off, this-session-only move), choosing a destination here is a PERMANENT standing change:
// this weekday, from the viewed day forward, using the exact same pin mechanism as the "Change Pod"
// feature (saveStudentPodAssignment) — just invoked directly instead of through its own modal.
// Confirmed sessionRowHtml/rosterTableHtml are only ever rendered inside renderPodSummaryStrip, so
// this is the only picker that needs this behavior; every other Pod/Online picker in the app
// (Schedule list row wasn't a thing anymore, check-in modal, the separate Move-pod modal) stays a
// one-off move via setSessionLocation/confirmMovePod, untouched.
function setPermanentSessionLocation(sessionId, weekday, dayKey, value){
  const sess=findSession(sessionId);
  if(!sess) return;
  const student=findStudent(sess.studentId);
  const isOnline=String(value).indexOf('online:')===0;
  const podId=isOnline? null : (value||null);
  const instructorId=isOnline? value.slice(7) : null;

  // Move the session actually being looked at right now, the same way the one-off pickers always
  // have (movePodSession/setSessionOnline directly, same as confirmMovePod uses) — capacity is still
  // enforced for a future-dated day exactly as before (movePodSession's own isToday check), only
  // relaxed for the day it's actually happening. If this fails, stop — no pin gets written for a
  // move that didn't actually happen.
  if(isOnline){
    const result=setSessionOnline(sessionId, instructorId);
    if(!result.ok){ toast(result.error); render(); return; }
  } else if(podId){
    const result=movePodSession(sessionId, podId);
    if(!result.ok){ toast(result.error); render(); return; }
  } else {
    sess.podId=null; sess.instructorId=null; sess.instructorId2=null; sess.handoff=null; sess.online=false;
    dbWrite('unassigning a session\'s Pod', function(){ return supabaseClient.from('sessions').update({
      pod_id:null, instructor_id:null, instructor_id_2:null, handoff_min:null, online:false
    }).eq('id', sess.id); });
  }

  // Then pin it as a standing change from this weekday forward — identity for "replacing" a prior
  // pin is (effectiveFrom, weekday) together, same convention saveStudentPodAssignment() uses.
  student.podAssignments=(student.podAssignments||[]).filter(function(a){
    return !(toKey(a.effectiveFrom)===dayKey && (a.weekday||null)===weekday);
  });
  student.podAssignments.push({podId:podId, online:isOnline, instructorId:instructorId, effectiveFrom:new Date(dayKey), weekday:weekday});
  dbWrite('pinning standing Pod from seating section', function(){
    return supabaseClient.from('student_pod_assignments').delete().eq('student_id', student.id).eq('effective_from', dayKey).eq('weekday', weekday)
      .then(function(){
        return supabaseClient.from('student_pod_assignments').insert({student_id:student.id, pod_id:podId, online:isOnline, instructor_id:instructorId, effective_from:dayKey, weekday:weekday});
      });
  });

  // Cancel + regenerate already-generated future standing occurrences on that one weekday from this
  // date forward, same as saveStudentPodAssignment() — otherwise only sessions not yet generated
  // would pick up the new pin. The session moved directly above is excluded (already handled, and
  // it may not even be `recurring`, e.g. a one-off staff-placed session).
  let movedCount=0;
  sessions.forEach(function(s){
    if(s.studentId!==student.id || !s.recurring || s.status!=='scheduled' || s.id===sessionId) return;
    if(toKey(s.date) < dayKey) return;
    if(WEEKDAY_KEYS[(new Date(s.date).getDay()+6)%7]!==weekday) return;
    s.status='cancelled';
    movedCount++;
    dbWrite('cancelling a session for a permanent Pod seating change', function(){ return supabaseClient.from('sessions').update({status:'cancelled'}).eq('id', s.id); });
    if(s.creditId){
      const cr=findCredit(s.creditId);
      if(cr && cr.status==='redeemed' && toKey(cr.expiryDate)>=toKey(simNow())){
        cr.status='available'; cr.redeemedSessionId=null;
        dbWrite('restoring a make-up credit', function(){ return supabaseClient.from('credits').update({status:'available', redeemed_session_id:null}).eq('id', cr.id); });
      }
    }
  });
  regenerateAllRecurring();

  const destLabel = isOnline? ('Online — '+findInstructor(instructorId).name) : (podId? findPod(podId).name : 'Unassigned');
  toast(student.name+' permanently moved to '+destLabel+' on '+weekday+'s, from '+fmtShort(new Date(dayKey))+' onward'+(movedCount? ' — '+movedCount+' upcoming standing session'+(movedCount===1?'':'s')+' regenerated to match' : '')+'.');
  render();
}

// Collapse state for front-desk sections lives on `state` (so it survives the full-page
// re-render every action triggers) but isn't persisted anywhere beyond the current browser tab —
// each section just remembers whether it's open or closed for the rest of this visit.
function sectionCollapsed(id){ return !!(state.collapsedSections && state.collapsedSections[id]); }
function toggleSection(id){
  state.collapsedSections = state.collapsedSections || {};
  state.collapsedSections[id] = !state.collapsedSections[id];
  render();
}
// Builds the opening "<div class='card'><div class='card-head'><h2>...</h2>" markup shared by
// every front-desk section, with the collapse toggle wired onto the title itself (not the whole
// header row) so any action buttons placed in extraHeaderHtml stay independently clickable.
function sectionOpen(id, title, extraHeaderHtml){
  return '<div class="card'+(sectionCollapsed(id)?' collapsed':'')+'">'
    +'<div class="card-head"><h2 class="sec-toggle" onclick="toggleSection(\''+id+'\')"><span class="chev">▾</span>'+title+'</h2>'
    +(extraHeaderHtml||'')+'</div>';
}

];

function renderStaff(){

  if(!dayKey || !weekDates.some(function(d){ return toKey(d)===dayKey; })){

    dayKey = todayInWeek? toKey(todayInWeek) : toKey(weekDates[0]);

  const selectedDate=new Date(dayKey);
  const weekday=WEEKDAY_KEYS[(selectedDate.getDay()+6)%7];
  const isPast = selectedDate < new Date(toKey(now));

          +(isPast || closure? '' : '<button class="btn sm primary" onclick="openBooking(null,\''+dayKey+'\')">+ Book a session</button>')

    // left with the planning tools (Availability lookup, the static rostered-shifts grid, Waitlist)

    html+=renderAvailabilityLookup();

    html+=sectionOpen('rosteredShifts','Regular rostered shifts')
      +'<p class="small muted">The standing weekly pattern, ignoring any one-off swap or single-day change — click a cell to make an ongoing change (same editor as the "Assign" button below), effective from whichever date you choose.</p>'
      +renderRosteredShiftsGrid()
      +'</div>';

    html+=sectionOpen('expectedHeadcount','Expected headcount',
        '<div style="display:flex;gap:6px;align-items:center">'
          +'<label class="small muted" style="margin:0">From</label>'
          +'<input type="date" class="small" value="'+(state.expectedHeadcountFromDate||toKey(now))+'" onchange="setExpectedHeadcountFromDate(this.value)" title="Preview the standing pattern as it\'ll look starting from this date"/>'
          +(state.expectedHeadcountFromDate? '<button class="btn sm" onclick="setExpectedHeadcountFromDate(null)">Today</button>' : '')
        +'</div>')
      +'<p class="small muted">How many kids are expected to physically be in the centre, in 15-min slots across the afternoon — the standing weekly pattern, same as Regular rostered shifts above. Online sessions aren\'t counted here.</p>'
      +renderExpectedHeadcountGrid()
      +'</div>';

    html+=sectionOpen('suggestedShifts','Suggested shift durations')
      +'<p class="small muted">How many instructors are needed to keep 1:8 covered across the whole centre, and for how long — not tied to any one Pod, since instructors move between Pods freely. Someone must be in the centre from 3pm regardless of bookings; after that, a student may wait up to 15 minutes for their instructor, an instructor may briefly run over the ratio by one kid for up to 10 minutes to help a departing kid pack up, every shift stays at least 2 hours, and a lull of an hour or less doesn\'t split a shift in two.</p>'
      +renderSuggestedShiftsGrid()
      +'</div>';

    html+=renderWaitlistPanel();

    // Pod seating now picks its own weekday (Sept 2026, per Allie: "I need the option to select
    // whether it's Monday, Tuesday, Wednesday, Thursday, or Friday... an overview of the regularly
    // attending kids so that I can set them to a pod and they always have a spot pre-assigned to
    // them") — independent of the day-by-day picker on the Today tab. Defaults to today's own weekday
    // (falling back to Monday on a weekend, when there's no "today" to show) so this opens on
    // something meaningful rather than blank. The picker itself lives in the section's HEADER, not
    // its collapsible body (Sept 2026, per Allie: "put them in the header" — Pod seating starts
    // collapsed by default, and a control buried in the collapsed body is invisible until you already
    // know to expand the section first; the header is exempt from the collapse-hide CSS, so the day
    // picker stays usable, and visible, whether the section is open or not).
    const seatingWeekday = state.podSeatingWeekday || (WEEKDAY_KEYS.indexOf(weekday)>=0? weekday : 'Mon');
    const seatingDate = nextRegularOccurrence(seatingWeekday);
    const seatingDateKey = toKey(seatingDate);
    const seatingDaypickerHtml = '<div class="daypicker" style="margin-bottom:0">'+WEEKDAY_KEYS.map(function(wd){
      return '<button class="daybtn'+(wd===seatingWeekday?' active':'')+'" onclick="setPodSeatingWeekday(\''+wd+'\')">'+wd+'<span class="d2">'+nextRegularOccurrence(wd).toLocaleDateString('en-AU',{month:'short',day:'numeric'})+'</span></button>';
    }).join('')+'</div>';
    html+=sectionOpen('podSeating','Pod seating — permanent changes', seatingDaypickerHtml)
      +'<p class="small muted">Move a student here and it sticks — every '+seatingWeekday+' from '+fmtShort(seatingDate)+' onward, not just '+fmtShort(seatingDate)+' itself. For a one-off swap just for a single session, use "Move pod" wherever that session appears instead. Every regularly-scheduled ("· regular") session below should end up with a Pod of its own here — the only kids who should ever show up Unassigned on a normal day are a make-up or an extra one-off session, not a standing one.</p>'
      +renderPodSummaryStrip(seatingDateKey, seatingWeekday)
      +'</div>';
  } else if(tab==='students'){
    html+=renderStudentsPanel();
  } else if(tab==='parents'){
    html+=renderParentsPanel();
  } else if(tab==='staff'){
    // The day-by-day coverage grid used to live here (Sept 2026 reorg); it's since moved on to the
    // Today tab (see the tab==='today' branch above) — this tab is just the instructor/front-desk-
    // staff roster now.
    html+=renderFrontStaffPanel();
    html+=renderInstructorsPanel();
  } else if(tab==='timesheet'){
    html+=renderStaffCheckInPanel();
    html+=renderStaffTimesheetPanel();
  } else if(tab==='credits'){
    html+=renderCreditsReport();
    html+=renderBookedCreditsPanel();
    html+=renderSettledCreditsPanel();
  } else if(tab==='holds'){
    html+=renderCurrentHoldsPanel();
    html+=renderPastHoldsPanel();
  } else if(tab==='summer'){
    html+=renderTermBreaksPanel();
  }

  // Modals always render regardless of which tab is active — every one of these is only ever
  // opened from an action on whichever tab is currently showing, and the full-screen overlay they
  // render as already blocks switching tabs underneath them while open, so there's no case where a
  // modal needs to survive a tab switch. Kept unconditional (rather than scoped per-tab) simply
  // because it's one line per modal instead of duplicating each render call into every tab branch
  // that could conceivably open it.
  html+=renderBookingModal();
  html+=renderPodAssignModal();
  html+=renderDayOverrideModal();
  html+=renderCheckInModal();
  html+=renderCheckOutModal();
  html+=renderMoveModal();
  html+=renderWaitlistModal();
  html+=renderClosedDayModal();

  return html;
}

function renderPodAssignModal(){
  const f=state.podAssignForm;
  if(!f) return '';
  const pod=findPod(f.podId);
  const now=simNow();
  const blocks=podBlocksForDay(f.podId, f.weekday);
  let html='<div class="overlay" onclick="if(event.target===this) closePodAssignForm()"><div class="modal">';
  html+='<h3>Assign '+pod.name+' — '+f.weekday+'</h3>';
  html+='<p>Who runs this Pod on '+f.weekday+'s, and when. Add another shift to hand the Pod off to a different instructor partway through the day — or line up a replacement for an existing shift starting from a future date, without disturbing who\'s covering it until then.</p>';
  if(f.error) html+='<div class="banner danger">'+f.error+'</div>';
  if(blocks.length===0){ html+='<div class="empty-note">Unassigned — nobody covers this Pod on '+f.weekday+'s.</div>'; }
  blocks.forEach(function(b){
    const draft=f.drafts[b.id] || {instructorId:'', effectiveFrom:toKey(now)};
    const currentId=blockInstructorOn(b, now);
    const upcoming=b.assignments.filter(function(a){ return toKey(a.effectiveFrom)>toKey(now); }).sort(function(a,b2){ return toKey(a.effectiveFrom).localeCompare(toKey(b2.effectiveFrom)); });
    const effDate=draft.effectiveFrom? new Date(draft.effectiveFrom) : now;
    const qualifying=qualifyingInstructorsForBlock(f.weekday, b, effDate);

    html+='<div class="pod-card" style="margin-bottom:10px">';
    html+='<div class="block-row">'
      +'<div><label>From</label><select onchange="setPodBlockTime(\''+f.podId+'\',\''+f.weekday+'\',\''+b.id+'\',\'start\',this.value)">'
        +TIME_OPTIONS.map(function(t){ return '<option value="'+t+'"'+(t===b.start?' selected':'')+'>'+minToLabel(t)+'</option>'; }).join('')
      +'</select></div>'
      +'<div><label>To</label><select onchange="setPodBlockTime(\''+f.podId+'\',\''+f.weekday+'\',\''+b.id+'\',\'end\',this.value)">'
        +TIME_OPTIONS.map(function(t){ return '<option value="'+t+'"'+(t===b.end?' selected':'')+'>'+minToLabel(t)+'</option>'; }).join('')
      +'</select></div>'
      +'<button class="btn sm ghost" onclick="removePodShiftBlock(\''+f.podId+'\',\''+f.weekday+'\',\''+b.id+'\')">Remove shift</button>'
    +'</div>';
    html+='<div class="small" style="margin-bottom:8px">Currently: <b>'+(currentId? findInstructor(currentId).name : 'Unassigned')+'</b></div>';
    if(upcoming.length>0){
      html+='<div class="small muted" style="margin-bottom:8px">Scheduled changes: '+upcoming.map(function(a){
        return findInstructor(a.instructorId).name+' from '+fmtShort(a.effectiveFrom)+' <a href="#" onclick="removeAssignment(\''+f.podId+'\',\''+f.weekday+'\',\''+b.id+'\',\''+toKey(a.effectiveFrom)+'\');return false;" style="color:var(--danger)">✕</a>';
      }).join(', ')+'</div>';
    }
    html+='<div class="row2" style="align-items:flex-end">';
    if(qualifying.length===0){
      html+='<div class="small muted">No instructor is currently available for this shift on that date — adjust availability first, or pick a different date.</div>';
    } else {
      html+='<div><label>Assign</label><select onchange="setAssignDraftField(\''+b.id+'\',\'instructorId\',this.value)">'
        +'<option value="">Choose…</option>'
        +qualifying.map(function(i){ return '<option value="'+i.id+'"'+(i.id===draft.instructorId?' selected':'')+'>'+i.name+'</option>'; }).join('')
      +'</select></div>'
      +'<div><label>From</label><input type="date" value="'+draft.effectiveFrom+'" onchange="setAssignDraftField(\''+b.id+'\',\'effectiveFrom\',this.value)"/></div>'
      +'<button class="btn sm primary" onclick="saveAssignmentChange(\''+f.podId+'\',\''+f.weekday+'\',\''+b.id+'\')">Save</button>';
    }
    html+='</div></div>';
  });
  html+='<button class="btn sm ghost" onclick="addPodShiftBlock(\''+f.podId+'\',\''+f.weekday+'\')">+ Add shift</button>';
  html+='<div style="display:flex;gap:8px;margin-top:14px;justify-content:flex-end">'
    +'<button class="btn primary" onclick="closePodAssignForm()">Done</button>'
  +'</div>';
  html+='</div></div>';
  return html;
}

function renderCoverageRequestsPanel(){
  const open=coverageRequests.filter(function(r){ return r.status==='open'; }).sort(function(a,b){ return new Date(a.date)-new Date(b.date); });
  if(open.length===0) return '';
  let html=sectionOpen('coverage','⚠️ Shifts needing coverage','<span class="small muted">'+open.length+'</span>');
  html+='<p>An instructor has flagged they can\'t work one of their shifts — every qualified, available instructor was emailed the moment it was raised. Pick a replacement for just that date — their regular assignment is untouched every other day. If it\'s already been sorted out face-to-face in the centre, use "Assign directly" to record whoever agreed to cover, even if they\'re not in the suggested list. If nobody at all is available, the manager is emailed automatically so it doesn\'t sit unnoticed.</p>';
  html+='<table><tr><th>Date</th><th>Pod / shift</th><th>Requested by</th><th>Emailed</th><th>Cover with</th><th>Assign directly</th></tr>';
  open.forEach(function(r){
    const pod=findPod(r.podId);
    const block=podBlocksForDay(r.podId, r.weekday).find(function(b){ return b.id===r.blockId; });
    const requester=findInstructor(r.requestedBy);
    const notified=(r.notifiedInstructorIds||[]).map(function(id){ const i=findInstructor(id); return i?i.name:null; }).filter(Boolean);
    const emailedCell = notified.length
      ? notified.join(', ')
      : (r.managerNotified? 'Nobody available — manager emailed' : 'Nobody was available yet');
    html+='<tr><td>'+fmtShort(r.date)+' <span class="small muted">('+r.weekday+')</span></td>'
      +'<td>'+pod.name+(block? ' '+rangeLabel(block.start,block.end-block.start) : '')+'</td>'
      +'<td class="small">'+requester.name+(r.note? ' <span class="muted">— '+r.note+'</span>' : '')+'</td>'
      +'<td class="small muted">'+emailedCell+'</td>';
    if(!block){ html+='<td class="small muted">Shift no longer exists</td><td class="small muted">—</td>'; }
    else{
      const subs=availableSubsForCoverage(r.podId, r.weekday, block, r.date, r.requestedBy);
      if(subs.length===0){
        html+='<td class="small muted">No qualified instructor is free that day. <a href="#" onclick="markCoverageUncovered(\''+r.id+'\');return false;">Mark unstaffed</a></td>';
      } else {
        html+='<td>'+subs.map(function(i){ return '<button class="btn sm primary" style="margin:2px" onclick="fillCoverageRequest(\''+r.id+'\',\''+i.id+'\')">'+i.name+'</button>'; }).join('')+'</td>';
      }
      const selId='manualCover_'+r.id;
      const options=instructors.filter(function(i){ return i.id!==r.requestedBy && i.active!==false; })
        .map(function(i){ return '<option value="'+i.id+'">'+i.name+'</option>'; }).join('');
      html+='<td><select id="'+selId+'" class="small"><option value="">Choose instructor…</option>'+options+'</select> '
        +'<button class="btn sm" style="margin-top:4px" onclick="assignCoverageManually(\''+r.id+'\', document.getElementById(\''+selId+'\').value)">Assign</button></td>';
    }
    html+='</tr>';
  });
  html+='</table></div>';
  return html;
}

function renderEnrollmentRequestsPanel(){
  const open=enrollmentRequests.filter(function(r){ return r.status==='open'; }).sort(function(a,b){ return a.createdAt-b.createdAt; });
  if(open.length===0) return '';

  html+='<p>Hold, schedule-change, and cancel-enrolment requests parents submitted from their own login — approving applies it immediately (same as placing a hold or changing a student\'s schedule yourself); declining just clears it from this list.</p>';
  html+='<table><tr><th>Student</th><th>Parent</th><th>Request</th><th>Note</th><th></th></tr>';
  open.forEach(function(r){
    const student=findStudent(r.studentId);
    const parent=parents.find(function(p){ return p.id===student.parentId; });
    // Parents can only ever submit a request (RLS blocks a parent from approving their own), so
    // this stays a human click either way — but for a time-change request, flagging up front that
    // every slot they picked is still open right now means front desk can hit Approve without
    // having to go check availability themselves first (Sept 2026, per Allie: "it should become
    // automatically approved, not require front desk 'ok' as long as there's availability" — this
    // is the closest safe equivalent, since only staff logins can actually write a schedule change).
    const readyToApprove = r.type==='time_change' && (r.requestedRecurring||[]).length>0
      && r.requestedRecurring.every(function(rec){ return standingSlotHasAvailability(rec.weekday, rec.start, student.duration, student.year); });
    const detail = r.type==='hold'
      ? 'Hold: '+fmtShort(r.start)+'–'+fmtShort(r.end)
      : r.type==='time_change'
      ? timeChangeSwapDetail(r)+' from '+fmtShort(r.effectiveFrom)+(readyToApprove? ' <span class="badge available">All times open — ready to approve</span>' : '')
      : '<span class="badge full">Cancel enrolment</span> from '+fmtShort(r.effectiveFrom);
    html+='<tr><td>'+student.name+'</td><td class="small">'+(parent?parent.name:'—')+'</td>'
      +'<td>'+detail+'</td>'
      +'<td class="small muted">'+(r.note||'—')+'</td>'
      +'<td><button class="btn sm primary" style="margin:2px" onclick="approveEnrollmentRequest(\''+r.id+'\')">Approve</button> <button class="btn sm ghost" style="margin:2px" onclick="declineEnrollmentRequest(\''+r.id+'\')">Decline</button></td></tr>';
  });
  html+='</table></div>';
  return html;
}

function renderCheckedInPanel(){
  const todays=checkedInTodayStillPresent().slice().sort(function(a,b){ return a.actualEnd-b.actualEnd; });
  let html=sectionOpen('checkedin','Checked in today',
    '<span class="small muted">'+todays.length+' student'+(todays.length===1?'':'s')+'</span>');
  // Relocated here, at the very top of the section (Sept 2026, per Allie: "move who's here right
  // now to the top of the checked in today section") — always today, since this panel only ever
  // concerns itself with today regardless of which day is picked in the Schedule section below.
  // Always rendered now, even before anyone's checked in (Sept 2026, per Allie: "show the pods,
  // (empty) but with the staff allocated to them even if there are no students check in") — the
  // board itself shows every staffed Pod's header and instructor name with "Open" seats in that
  // case, so front desk can see who's covering what before the first check-in of the day, rather
  // than the whole board being skipped until someone arrives.
  html+=renderLiveOccupancyBoard(toKey(simNow()));
  html+='<p>Exit time defaults to check-in time plus their usual session length (90 min for most, per each student\'s plan) — however late (or early) that check-in was. Both the checked-in time and exit time can be corrected here if needed — say a parent\'s pick-up plan changes, or the arrival time recorded at check-in was wrong. "Time left" counts down live against the actual clock, so it stays accurate even if you don\'t touch this page. Once a student actually leaves, use their own "Check out" button — it drops them off this list, defaulting to whichever preset time is closest to right now (adjust it if they were signed out earlier or later than that).</p>';
  if(todays.length===0){ html+='<div class="empty-note">Nobody checked in yet today.</div>'; }
  else{
    html+='<table><tr><th>Student</th><th>Pod</th><th>Checked in</th><th>Exit time</th><th>Time left</th><th></th></tr>';
    todays.forEach(function(s){
      const student=findStudent(s.studentId);
      const pod=findPod(s.podId);
      const instrLabel = s.instructorId2? (findInstructor(s.instructorId).name+' → '+findInstructor(s.instructorId2).name) : (s.instructorId? findInstructor(s.instructorId).name : '—');
      // Recomputed fresh from the session's own (persisted) checkInOffset every render, rather than
      // read off a separate stored "defaultEnd" field — that field was never written to Supabase
      // (only ever held in memory), so after any page reload it came back undefined and every row
      // showed "(usually NaN)" here, regardless of whether the exit time had actually been
      // adjusted. Deriving it from checkInOffset + autoExitTime() is always correct, always
      // available, and needs nothing extra saved.
      const defaultEnd = autoExitTime(s, s.checkInOffset||0);
      const adjusted = s.actualEnd!==defaultEnd;
      const cd=countdownInfo(s.actualEnd);
      html+='<tr><td>'+student.name+'</td><td class="small">'+(s.online?'Online':(pod?pod.name:'—'))+' · '+instrLabel+'</td>'
        +'<td><select onchange="setActualStart(\''+s.id+'\',this.value)">'
          +EXIT_TIME_OPTIONS.map(function(t){ return '<option value="'+t+'"'+(t===s.actualStart?' selected':'')+'>'+minToLabel(t)+'</option>'; }).join('')
        +'</select></td>'
        +'<td><select onchange="setExitTime(\''+s.id+'\',this.value)">'
          +EXIT_TIME_OPTIONS.map(function(t){ return '<option value="'+t+'"'+(t===s.actualEnd?' selected':'')+'>'+minToLabel(t)+'</option>'; }).join('')
        +'</select>'
        +(adjusted? ' <span class="small muted">(usually '+minToLabel(defaultEnd)+')</span>' : '')
        +'</td><td><span class="badge '+cd.cls+'">'+cd.label+'</span></td>'
        +'<td><button class="btn sm" onclick="openCheckOut(\''+s.id+'\')">Check out</button> '
        +'<button class="btn sm ghost" onclick="undoCheckIn(\''+s.id+'\')">Undo check-in</button></td></tr>';
    });
    html+='</table>';
  }
  html+=renderQuickCoverageModal();
  html+=renderQuickMoveModal();
  html+='</div>';
  return html;
}

function renderAvailabilityLookup(){
  const sessionLen=state.availSessionLen||AVAIL_MIN_SESSION_LEN;
  let html=sectionOpen('availability','Availability lookup',
    '<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">'
      +'<select class="btn sm" style="padding:5px 8px" onchange="setAvailSessionLen(this.value)" title="Check against a specific session length">'
        +DURATIONS.map(function(d){ return '<option value="'+d+'"'+(d===sessionLen?' selected':'')+'>'+d+' min</option>'; }).join('')
      +'</select>'
    +'</div>');
  // Sept 2026: this now checks whatever length is selected above, not a fixed 90 minutes — a parent
  // whose sessions actually run 120 minutes can have no real make-up slot in the next two weeks
  // (openSlotsForCredit checks their real duration) even on a half-hour where the OLD fixed 90-min
  // grid would have shown "open", since the extra 30 minutes past 90 might run into a shift ending
  // or someone else's session starting. Match the selector to the family you're helping.
  // Descriptive blurb removed per Allie ("no blurb") — the grid explains itself well enough via its
  // own "No staff"/"Full"/"N open" labels.
  // Sept 2026, per Allie: "an overview of regularly scheduled sessions - not so week-by-week" — each
  // weekday now has exactly one reference date (the next real occurrence of it, see
  // nextRegularOccurrence), not a This-week/Next-week toggle that could show two different numbers
  // for the same weekday depending which one you happened to click.
  html+='<div class="avail-grid" style="grid-template-columns:90px repeat('+AVAIL_BLOCKS.length+',1fr)">';
  html+='<div></div>'+AVAIL_BLOCKS.map(function(hb){ return '<div class="cal-head">'+minToLabel(hb)+'</div>'; }).join('');
  WEEKDAY_KEYS.forEach(function(weekday){
    const d=nextRegularOccurrence(weekday);
    const dateKey=toKey(d);
    html+='<div class="cal-row-label">'+weekday+' <span class="small muted" style="font-weight:400">'+d.toLocaleDateString('en-AU',{month:'short',day:'numeric'})+'</span></div>';
    AVAIL_BLOCKS.forEach(function(hb){
      const r=openSeatsAt(dateKey, weekday, hb, '', sessionLen);
      let cls='avail-cell', label, clickable=false;
      if(r.staffed===0){ cls+=' nostaff-cell'; label='No staff'; clickable=true; }
      else if(r.seats===0){
        // Sept 2026, per Allie: "if a child is finishing up within 2 weeks, and their slot will
        // become available... display 1 open from date" — a genuinely full slot stays "Full" and
        // clickable to the waitlist, same as ever; one about to free up because of a real, dated
        // schedule change (not a temporary hold — see upcomingSlotDeparture) gets its own look
        // instead, and isn't pushed toward the waitlist since it's about to just be bookable outright.
        const opening=regularSlotOpeningSoon(dateKey, weekday, hb, sessionLen);
        if(opening){ cls+=' opening-cell'; label=opening.count+' open from '+fmtShort(opening.date); }
        else { cls+=' full-cell'; label='Full'; clickable=true; }
      }
      else { cls+=' on'; label=r.seats+' open'; }
      if(clickable){
        html+='<div class="'+cls+'" style="cursor:pointer" title="Add someone to the waitlist for '+weekday+' '+minToLabel(hb)+'" onclick="openWaitlistForm(\''+weekday+'\','+hb+')">'+label+'</div>';
      } else {
        html+='<div class="'+cls+'">'+label+'</div>';
      }
    });
    // Online is its own distinct row per day — never merged into the Pod row above — reporting the
    // aggregate seats available across every instructor on shift for that window (see onlineSeatsAt).
    html+='<div class="cal-row-label small muted">↳ Online</div>';

// Also un-collapses the Schedule section if it's currently collapsed — collapsing hides
// everything in the card except its header (see .card.collapsed CSS), which includes the day
// picker and pod cards these buttons are meant to update. Without this, clicking "Next week"
// while the section happens to be collapsed changes state.weekOffset correctly but produces no
// visible change at all, which looks exactly like the button doing nothing.
function setWeek(w){
  state.weekOffset=w; state.selectedDayKey=null;
  if(state.collapsedSections && state.collapsedSections.schedule){ state.collapsedSections.schedule=false; }
  render();
}

function selectDay(k){ state.selectedDayKey=k; render(); }

// Jumps the Schedule section straight to any date — including one long past — rather than only
// ever reaching "this week" or "next week" one click at a time (5.28, per Allie: front desk wants
// to pull up how a past day was actually seated, for training/adjustment purposes). Works by
// landing on that date's own week (so the existing Mon-Fri day picker and every day-driven render —
// the Pod summary strip, the schedule list with its actual check-in/out times — just work exactly
// as they already do for "this week"/"next week", no separate history view needed). A weekend date
// has no matching day-picker button, so it silently falls back to that week's Monday, same as any
// other selectedDayKey that doesn't land in the visible week.
function jumpToDate(dateStr){
  if(!dateStr) return;
  const target=new Date(dateStr);
  const mondayOfTarget=getMonday(target);
  const mondayOfThisWeek=getMonday(simNow());
  state.weekOffset=Math.round((mondayOfTarget-mondayOfThisWeek)/(7*86400000));
  state.selectedDayKey=toKey(target);
  if(state.collapsedSections && state.collapsedSections.schedule){ state.collapsedSections.schedule=false; }
  render();
}

// Builds each Pod's <option> label for any dropdown that lets front desk choose a Pod directly —
// this booking modal and the flat Schedule list's per-student picker (renderScheduleList) both use
// it, so "which Pod is this, who's covering it, how full is it" always reads identically wherever
// a Pod gets picked. No option is ever disabled here (Sept 2026 — pick freely, no age or capacity
// blocking on the picker itself); capacity is still enforced when the pick is actually confirmed.
function podOptionLabel(pod, weekday, dateKey, start, duration){
  const cov=podCoverageDetail(pod.id, weekday, start, duration, new Date(dateKey));
  const who=cov.primaryInstructorId? findInstructor(cov.primaryInstructorId).name : 'Unassigned';
  const peak=peakConcurrency(pod.id, dateKey, {start, duration});
  const cap=podCapacity(pod.id);
  return pod.name+' — '+who+' — '+peak+'/'+cap;
}

// Same idea as podOptionLabel, for an "Online — [instructor]" choice: shows that instructor's
// COMBINED (physical + online) headcount against the higher online ratio, so front desk can see at
// a glance whether picking them still leaves room. excludeSessionId (see instructorCombinedPeak)
// keeps an already-online session's own current slot from double-counting against itself.
function onlineOptionLabel(instr, dateKey, start, duration, excludeSessionId){
  const peak=instructorCombinedPeak(instr.id, dateKey, {start:start, duration:duration}, excludeSessionId);
  return 'Online — '+instr.name+' — '+peak+'/'+combinedCapFor(instr.id);
}
// A session's current location, encoded as one value for a single Pod/Online <select>: a Pod's own
// id, '' for unassigned, or 'online:<instructorId>' for an Online group — see setSessionLocation().
function sessionLocationValue(sess){ return sess.online? ('online:'+sess.instructorId) : (sess.podId||''); }
// The shared "which Pod, or which Online group" <option> list — every picker that lets front desk
// choose a session's location (the flat Schedule list's row picker, the check-in modal, the booking
// modal) renders from this, so all three always offer the exact same choices in the exact same
// format. Online is deliberately its own <optgroup> — a distinct concept in the picker, not just
// another Pod-shaped row — and only ever lists instructors actually on shift right now (see
// instructorsOnShift()); nothing is ever disabled here (same "pick freely, capacity enforced on
// confirm" convention pods already use), except where the caller wants otherwise (see renderMoveModal,
// which does still disable a full choice).
function locationOptionsHtml(weekday, dateKey, start, duration, selectedValue, excludeSessionId){
  let html=pods.map(function(p){
    return '<option value="'+p.id+'"'+(selectedValue===p.id?' selected':'')+'>'+podOptionLabel(p, weekday, dateKey, start, duration)+'</option>';
  }).join('');
  const onlineInstrs=instructorsOnShift(weekday, start, duration, new Date(dateKey));
  if(onlineInstrs.length){
    html+='<optgroup label="Online">'+onlineInstrs.map(function(instr){
      const val='online:'+instr.id;
      return '<option value="'+val+'"'+(selectedValue===val?' selected':'')+'>'+onlineOptionLabel(instr, dateKey, start, duration, excludeSessionId)+'</option>';
    }).join('')+'</optgroup>';
  }
  return html;
}

function renderBookingModal(){
  if(!state.booking) return '';
  const b=state.booking, f=state.bookingForm;
  const isOnline = String(f.location).indexOf('online:')===0;
  const onlineInstr = isOnline? findInstructor(f.location.slice(7)) : null;
  const pod = (!isOnline && f.location)? findPod(f.location) : null;
  const date=new Date(b.dateKey);
  const weekday=WEEKDAY_KEYS[(date.getDay()+6)%7];
  const student=f.studentId? findStudent(f.studentId): null;
  const starts=possibleStarts(f.duration);
  const end=f.start!=null? f.start+f.duration : null;

  const onlinePeak = (student && f.start!=null && onlineInstr)? instructorCombinedPeak(onlineInstr.id, b.dateKey, {start:f.start, duration:f.duration}) : 0;
  const onlineOverCapacity = (student && f.start!=null && onlineInstr) && onlinePeak>combinedCapFor(onlineInstr.id);

  let cov=null, instr1=null, suited1=true, totallyUnassigned=false, instr2=null, suited2=true;
  if(student && f.start!=null && pod){
    cov=podCoverageDetail(pod.id, weekday, f.start, f.duration, date);
    totallyUnassigned = !cov.primaryInstructorId;
    instr1 = cov.primaryInstructorId? findInstructor(cov.primaryInstructorId) : null;
    suited1 = instr1? instructorSuitedFor(instr1, student.year) : true;
    instr2 = cov.secondaryInstructorId? findInstructor(cov.secondaryInstructorId) : null;
    suited2 = instr2? instructorSuitedFor(instr2, student.year) : true;
  }
  // "Best suited for" (5.3) is a preference, not a requirement — it never forces an override. The
  // only thing that still can (Sept 2026 — age/year rules removed entirely) is actual staffing:
  // nobody assigned anywhere near the window, or a gap bigger than the tolerated 15 minutes
  // unattended (UNATTENDED_TOLERANCE_MIN). No Pod chosen at all needs no override either — that
  // just books it unassigned, same as any other uncovered slot.
  const needsOverride = student && pod && cov && !cov.ok;

  const cap=pod? podCapacity(pod.id) : 0;
  const wouldBePeak = (student && f.start!=null && pod)? peakConcurrency(pod.id, b.dateKey, {start:f.start, duration:f.duration}) : 0;
  const isTodayBooking = b.dateKey===toKey(simNow());
  // Same-day capacity bypass (5.34, per Allie: "I also need all front staff to have the ability to
  // overbook a pod on the day, not just me") — a future-dated booking is still hard-capped, no
  // override possible; today's real room can be overbooked directly here, same rule movePodSession
  // already applies to moving an existing session.
  const overCapacity = (student && f.start!=null && pod) && !isTodayBooking && podCapacityBlocked(pod.id, b.dateKey, {start:f.start, duration:f.duration});
  const overCapacityButAllowedToday = (student && f.start!=null && pod) && isTodayBooking && wouldBePeak>cap;

  const credit=b.creditId? findCredit(b.creditId) : null;

  let html='<div class="overlay" onclick="if(event.target===this) closeBooking()"><div class="modal">';
  html+='<h3>'+(credit? 'Book a make-up session' : ('Book a session — '+fmtShort(date)))+'</h3>';
  if(credit){
    // Manually assigning a make-up (Sept 2026, per Allie: "I need a button to manually assign
    // make-up sessions") — the student is fixed to whoever the credit belongs to (a credit can't be
    // reassigned to someone else here), and the date becomes an editable field instead of being
    // fixed by wherever the modal was opened from, since this wasn't opened from any one day's
    // Schedule view.
    html+='<div class="banner info">📌 Booking a make-up for <b>'+student.name+'</b> — using their credit for the session missed '+fmtShort(credit.issuedDate)+' (expires '+fmtShort(credit.expiryDate)+').</div>';
    html+='<label>Date</label><input type="date" value="'+b.dateKey+'" min="'+toKey(simNow())+'" max="'+toKey(addDays(simNow(),365))+'" onchange="setBookingDate(this.value)"/>';
  } else {
    html+='<label>Student</label><select onchange="setBookingStudent(this.value)">'
        +'<option value="">Choose a student…</option>'

        +students.slice().sort(function(a,b){ return a.name.localeCompare(b.name, undefined, {sensitivity:'base'}); })

      +'</select></div></div>';
  html+='<label>Pod</label><select onchange="setBookingLocation(this.value)">'

      +'</select>';

  if(student && isStudentOnHold(student.id, date)){
    html+='<div class="banner warn">⏸️ '+student.name+' is on hold for this date — booking them anyway is fine if they\'re actually coming in.</div>';
  }
  if(student && pod && cov && cov.secondaryInstructorId){
    html+='<div class="banner accent">↔️ '+pod.name+' hands off partway through: '+instr1.name+' until '+minToLabel(cov.handoffAt)+', then '+instr2.name+' until '+minToLabel(end)+'. This will book automatically across the handoff.</div>';
  }
  if(student && pod && cov && cov.ok && cov.gapMinutes>0){
    html+='<div class="banner info">ℹ️ '+cov.gapMinutes+' min of this session is unattended in '+pod.name+' — within the '+UNATTENDED_TOLERANCE_MIN+'-minute tolerance, so no override is needed.</div>';
  }
  if(student && pod && needsOverride){
    const coverageReason = !cov.ok
      ? (totallyUnassigned
        ? 'nobody is assigned to '+pod.name+' anywhere near that time'
        : pod.name+' is unattended for '+cov.gapMinutes+' min of this session — more than the '+UNATTENDED_TOLERANCE_MIN+'-minute tolerance')
      : null;
    const reasons=[];
    if(coverageReason) reasons.push(coverageReason);
    html+='<div class="banner warn">⚠️ '+reasons.join('; and ')+'. You can still book it, but confirm below — to fix this properly, adjust the Pod\'s assignment.</div>';
    html+='<label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" '+(f.overrideOk?'checked':'')+' onchange="toggleOverride()" style="width:auto;margin:0"/> Book anyway</label>';
  }
  // Purely informational, never blocking: every instructor can teach any year (5.3), so a mismatch
  // with their usual best-suited range is just a heads-up, not something that needs an override.
  if(student && pod && !totallyUnassigned && (!suited1 || (instr2 && !suited2))){
    const who = !suited1? instr1.name+' ('+yearLabel(instr1.yearMin)+'–'+yearLabel(instr1.yearMax)+')' : instr2.name+' ('+yearLabel(instr2.yearMin)+'–'+yearLabel(instr2.yearMax)+')';
    html+='<div class="banner info">ℹ️ '+yearLabel(student.year)+' isn\'t '+who+'\'s usual focus, but they can teach any year — this books normally, no override needed.</div>';
  }
  if(student && pod && overCapacity){
    html+='<div class="banner danger">⛔ This would put '+pod.name+' over capacity ('+wouldBePeak+'/'+cap+') — not allowed for a future date, no override.</div>';
  }
  if(student && pod && overCapacityButAllowedToday){
    html+='<div class="banner warn">⚠️ This puts '+pod.name+' over capacity ('+wouldBePeak+'/'+cap+') — allowed since it\'s today; you\'re looking at the real room, not a projection.</div>';
  }
  if(student && onlineInstr && onlineOverCapacity){
    html+='<div class="banner danger">⛔ This would put '+onlineInstr.name+"'s Online group over the combined ratio ("+onlinePeak+'/'+combinedCapFor(onlineInstr.id)+') — not allowed, no override.</div>';
  }
  if(student && !pod && !isOnline){
    html+='<div class="banner info">ℹ️ No Pod chosen — this books '+student.name+' in, unassigned. Pick a Pod for them any time from the Schedule list.</div>';
  }
  // Walk-in convenience (Sept 2026, per Allie: "i need an option to add a student on a day when they
  // show up unexpectedly" — a student whose usual day is different turns up today). Only offered for
  // a same-day booking; a same-day booking made in ADVANCE of an actual arrival (lining up a make-up
  // before the student is actually due in) leaves this unticked.
  if(isTodayBooking){
    html+='<label style="display:flex;align-items:center;gap:6px;cursor:pointer;margin-top:8px"><input type="checkbox" '+(f.checkInNow?'checked':'')+' onchange="setBookingCheckInNow(this.checked)" style="width:auto;margin:0"/> They\'re here right now — check '+(student?student.name:'them')+' in immediately</label>';
    html+='<p class="small muted" style="margin:2px 0 0">Skips finding them in the Schedule list and clicking Check in separately — uses the same closest-to-now arrival time the Check-in screen itself defaults to.</p>';
  }

  const confirmDisabled = !f.studentId || f.start==null || overCapacity || onlineOverCapacity || (needsOverride && !f.overrideOk);
  html+='<div style="display:flex;gap:8px;margin-top:14px;justify-content:flex-end">'
      +'<button class="btn ghost" onclick="closeBooking()">Cancel</button>'
      +'<button class="btn primary" '+(confirmDisabled?'disabled':'')+' onclick="confirmBooking()">Confirm booking</button>'
    +'</div>';
  html+='</div></div>';
  return html;
}

// New instructor setup (5.18): who's covering the roster + what they told us their starting hours
// are. "Best suited for" is shown as a preference-only tag here too — see the comment on
// openNewInstructorForm for why it can never gate a booking or assignment.
function renderInstructorsPanel(){
  let html=sectionOpen('instructors','Instructors',
    '<button class="btn sm primary" onclick="openNewInstructorForm()">+ Add instructor</button>');
  html+='<table><tr><th>Instructor</th><th>Email</th><th>Best suited for</th><th>Availability <span class="small muted" style="font-weight:400">(self-reported)</span></th><th>Rostered shifts <span class="small muted" style="font-weight:400">(you set these)</span></th><th>Login</th><th></th></tr>';
  instructors.slice().sort(function(a,b){ return a.name.localeCompare(b.name); }).forEach(function(instr){
    // Two genuinely separate concepts, shown side by side so front desk never has to guess which
    // one they're looking at: "Availability" is what the instructor says they COULD work (availRules,
    // editable by the instructor themselves, or by front desk via "Adjust availability" below) —
    // it's a declaration, not a commitment. "Rostered shifts" is what front desk has actually
    // assigned them to cover (instructorRosteredShifts(), set via each Pod's "Assign" button in the
    // Schedule section) — that's the real, live staffing record students and other instructors rely
    // on. An instructor can be available Mon-Fri and rostered on only two of those days, or (if a
    // shift was arranged outside their stated hours) rostered on a day they haven't marked available
    // at all — though in practice qualifyingInstructorsForBlock() only offers already-available
    // instructors when assigning a shift, so the two normally line up (Sept 2026).
    const pattern=instructorCurrentWeeklyPattern(instr.id);
    const days=WEEKDAY_KEYS.filter(function(d){ return pattern[d]; });
    const availSummary = days.length? days.map(function(d){ return d+' '+minToLabel(pattern[d].start)+'–'+minToLabel(pattern[d].end); }).join(', ') : 'None on file';
    const shifts=instructorRosteredShifts(instr.id).filter(function(a){ return !a.upcoming; });
    const shiftSummary = shifts.length
      ? shifts.sort(function(a,b){ return WEEKDAY_KEYS.indexOf(a.day)-WEEKDAY_KEYS.indexOf(b.day) || a.start-b.start; })
          .map(function(a){ return a.day+' '+minToLabel(a.start)+'–'+minToLabel(a.end)+' ('+findPod(a.podId).name+')'; }).join(', ')
      : 'Not rostered';
    const inactive = instr.active===false;
    const loginCell = !supabaseClient? '<span class="small muted">—</span>'
      : instr.authUserId==='pending'? '<span class="badge soon">Invited</span>'
      : instr.authUserId? '<span class="badge available">Active</span>'
      : '<button class="btn sm ghost" onclick="inviteLogin(\''+instr.email+'\',\'instructor\',\''+instr.id+'\',\''+instr.name.replace(/'/g,"\\'")+'\')">Invite login</button>';
    html+='<tr'+(inactive?' style="opacity:.55"':'')+'><td>'+instr.name+(inactive?' <span class="small muted">(inactive)</span>':'')+'</td><td class="small">'+instr.email+'</td><td>'+yearLabel(instr.yearMin)+'–'+yearLabel(instr.yearMax)+'</td><td class="small">'+availSummary+'</td><td class="small">'+shiftSummary+'</td>'
      +'<td>'+loginCell+'</td>'
      +'<td><button class="btn sm ghost" onclick="openEditInstructorForm(\''+instr.id+'\')">Edit details</button> <button class="btn sm ghost" onclick="openStaffAvailManager(\''+instr.id+'\')">Adjust availability</button> '
      +(inactive
        ? '<button class="btn sm ghost" onclick="reactivateInstructor(\''+instr.id+'\')">Reactivate</button>'
        : '<button class="btn sm ghost" onclick="deactivateInstructor(\''+instr.id+'\')">Deactivate</button>')
      +'</td></tr>';
  });
  html+='</table></div>';
  html+=renderNewInstructorModal();
  html+=renderEditInstructorModal();
  html+=renderStaffAvailManagerModal();
  return html;
}

  const f=state.newParentForm;

  toast(newParent.name+' added — now add their first child below.');

/* ---------- Named front-desk staff (5.22) ---------- */
function defaultStaffShiftForm(staffId){
  const shifts={};
  const pattern=staffId? staffWeeklyPattern(staffId) : {};
  WEEKDAY_KEYS.forEach(function(day){
    const existing=pattern[day];
    shifts[day]=existing? {off:false, start:existing.start, end:existing.end} : {off:true, start:900, end:1140};
  });
  return shifts;
}
function openNewStaffForm(){
  state.newStaffForm={ name:'', email:'', inviteNow:true, shifts:defaultStaffShiftForm(null), error:'' };
  render();
}
function closeNewStaffForm(){ state.newStaffForm=null; render(); }
function setNewStaffField(field, value){ state.newStaffForm[field]=value; state.newStaffForm.error=''; render(); }
function setNewStaffShift(weekday, field, value){
  const a=state.newStaffForm.shifts[weekday];
  a[field] = field==='off'? value : Number(value);
  if(a.end<=a.start){
    if(field==='start') a.end=Math.min(CENTER_CLOSE, a.start+START_STEP);
    else a.start=Math.max(CENTER_OPEN, a.end-START_STEP);
  }
  state.newStaffForm.error='';
  render();
}
// Turns a {Mon:{off,start,end}, ...} form object into the flat staffRosteredShifts rows
// (staffShiftsFor()'s shape) for the working days only — no row at all means "off" that day.
function shiftFormToRows(shiftForm){
  return WEEKDAY_KEYS.filter(function(day){ return !shiftForm[day].off; })
    .map(function(day){ return {weekday:day, start:shiftForm[day].start, end:shiftForm[day].end}; });
}
function saveNewStaff(){
  const f=state.newStaffForm;
  if(!f.name.trim()){ f.error='Enter their name.'; render(); return; }
  if(!f.email.trim()){ f.error='Enter an email address.'; render(); return; }
  if(staffMembers.some(function(s){ return s.email.toLowerCase()===f.email.trim().toLowerCase(); })){
    f.error='A staff member with that email already exists.'; render(); return;
  }
  const newStaff={id:newId()||('staff'+(nextStaffMemberId++)), name:f.name.trim(), email:f.email.trim(), authUserId:null};
  staffMembers.push(newStaff);
  const rows=shiftFormToRows(f.shifts);
  rows.forEach(function(r){ staffRosteredShifts.push({id:newId()||('sshift'+(nextStaffShiftId++)), staffId:newStaff.id, weekday:r.weekday, start:r.start, end:r.end}); });
  dbWrite('adding a new staff member', function(){ return supabaseClient.from('staff_members').insert({id:newStaff.id, name:newStaff.name, email:newStaff.email}).then(function(r){
    if(r.error || !rows.length) return r;
    return supabaseClient.from('staff_rostered_shifts').insert(rows.map(function(row){ return {staff_id:newStaff.id, weekday:row.weekday, start_min:row.start, end_min:row.end}; }));
  }); });
  const workingDays=rows.map(function(r){ return r.weekday; });
  toast(newStaff.name+' added to front desk staff'+(workingDays.length? ' — rostered '+workingDays.join(', ') : '')+'.');
  state.newStaffForm=null;
  render();
  if(f.inviteNow) inviteLogin(newStaff.email, 'staff', newStaff.id, newStaff.name);
}

  if(!f.name.trim()){ f.error='Enter their name.'; render(); return; }
  if(!f.email.trim()){ f.error='Enter an email address.'; render(); return; }
  const clash=staffMembers.find(function(s){ return s.id!==staff.id && s.email.toLowerCase()===f.email.trim().toLowerCase(); });
  if(clash){ f.error='Another staff member already uses that email.'; render(); return; }
  staff.name=f.name.trim();
  staff.email=f.email.trim();
  const rows=shiftFormToRows(f.shifts);
  staffRosteredShifts=staffRosteredShifts.filter(function(s){ return s.staffId!==staff.id; });
  rows.forEach(function(r){ staffRosteredShifts.push({id:newId()||('sshift'+(nextStaffShiftId++)), staffId:staff.id, weekday:r.weekday, start:r.start, end:r.end}); });
  dbWrite('editing staff member details', function(){ return supabaseClient.from('staff_members').update({name:staff.name, email:staff.email}).eq('id', staff.id).then(function(r){
    if(r.error) return r;
    return supabaseClient.from('staff_rostered_shifts').delete().eq('staff_id', staff.id);
  }).then(function(r){
    if(!r || r.error || !rows.length) return r;
    return supabaseClient.from('staff_rostered_shifts').insert(rows.map(function(row){ return {staff_id:staff.id, weekday:row.weekday, start_min:row.start, end_min:row.end}; }));
  }); });
  toast(staff.name+'\'s details updated.');
  state.editStaffForm=null;
  render();
}

var STAFF_TIMESHEET_LOOKBACK_DAYS=14;

// instructors to be on the list", then "can we have a timesheet tab also?" — this now has its own
// top-level tab rather than living as a collapsed sub-section of Staff, so work history is one

// Person options for the Timesheet filter dropdown — front desk staff first, then instructors,
// each alphabetised within their own group, each tagged with a 'staff:'/'instructor:' prefix so
// the value alone says which table to filter against.
function timesheetPersonOptions(){
  return staffMembers.slice().sort(function(a,b){ return a.name.localeCompare(b.name); })
    .map(function(s){ return {value:'staff:'+s.id, label:s.name}; })
    .concat(instructors.slice().sort(function(a,b){ return a.name.localeCompare(b.name); })
      .map(function(i){ return {value:'instructor:'+i.id, label:i.name+' (Instructor)'}; }));
}
function setTimesheetFilterPerson(value){ state.timesheetFilter.personKey=value; render(); }
function setTimesheetFilterDate(value){ state.timesheetFilter.date=value; render(); }
function clearTimesheetFilters(){ state.timesheetFilter={personKey:'', date:''}; render(); }
// Timesheet history (Sept 2026, per Allie: "I want the timesheet to allow me to look at any day,
// but I need to select the day, or the staff, or both") — a specific date jumps straight to that
// one day regardless of how long ago it was, overriding the default lookback window entirely; a
// person narrows to just their own records within whichever date scope is active; the two combine
// freely, and either (or neither) can be set on its own.
function renderStaffTimesheetPanel(){
  const days=STAFF_TIMESHEET_LOOKBACK_DAYS;
  let html=sectionOpen('staffTimesheet','Timesheet');
  const filter=state.timesheetFilter;
  const peopleOptions=timesheetPersonOptions();
  const hasFilters = !!filter.personKey || !!filter.date;
  html+='<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px">'
    +'<div><label>Person</label><select onchange="setTimesheetFilterPerson(this.value)">'
      +'<option value=""'+(filter.personKey?'':' selected')+'>Everyone</option>'
      +peopleOptions.map(function(o){ return '<option value="'+o.value+'"'+(filter.personKey===o.value?' selected':'')+'>'+o.label+'</option>'; }).join('')
    +'</select></div>'
    +'<div><label>Day</label><input type="date" value="'+filter.date+'" max="'+toKey(simNow())+'" onchange="setTimesheetFilterDate(this.value)"/></div>'
    +(hasFilters? '<button class="btn sm ghost" onclick="clearTimesheetFilters()">Clear filters</button>' : '')
  +'</div>';

  let pool=staffAttendance;
  if(filter.date){
    pool=pool.filter(function(a){ return toKey(a.date)===filter.date; });
  } else {
    const cutoffKey=toKey(addDays(simNow(), -days));
    pool=pool.filter(function(a){ return toKey(a.date)>=cutoffKey; });
  }
  let filteredPersonLabel='';
  if(filter.personKey){
    const sep=filter.personKey.indexOf(':');
    const kind=filter.personKey.slice(0,sep), id=filter.personKey.slice(sep+1);
    pool=pool.filter(function(a){ return kind==='instructor'? a.instructorId===id : a.staffId===id; });
    const match=peopleOptions.find(function(o){ return o.value===filter.personKey; });
    filteredPersonLabel = match? match.label : '';
  }
  const recent=pool.slice().sort(function(a,b){ return new Date(b.date)-new Date(a.date) || b.checkIn-a.checkIn; });

  const scopeLabel = filter.date? ('on '+fmtShort(new Date(filter.date))) : ('over the last '+days+' days');
  const whoLabel = filteredPersonLabel? ('for '+filteredPersonLabel) : 'for front desk staff and instructors';
  html+='<p class="small muted">Every check-in/check-out '+scopeLabel+' '+whoLabel+'.</p>';

  if(recent.length===0){
    html+='<div class="empty-note">No attendance recorded'+(hasFilters? ' matching these filters.' : ' yet.')+'</div>';
  } else {
    html+='<table><tr><th>Date</th><th>Name</th><th>Check-in</th><th>Check-out</th><th>Hours</th><th>Vs roster</th></tr>'
      +recent.map(function(r){
        const isInstr=r.instructorId!=null;
        const person = isInstr? findInstructor(r.instructorId) : findStaffMember(r.staffId);
        const weekday=WEEKDAY_KEYS[(new Date(r.date).getDay()+6)%7];
        const rostered = isInstr? instructorAvailabilityOn(r.instructorId, r.date) : staffRosteredOn(r.staffId, weekday);
        let vsRoster='<span class="small muted">Not rostered</span>';
        if(rostered){
          vsRoster = r.checkIn>rostered.start? '<span class="badge full">'+(r.checkIn-rostered.start)+'m late</span>' : '<span class="badge available">On time</span>';
        }
        const roleTag = isInstr? ' <span class="small muted">(Instructor)</span>' : '';
        return '<tr><td>'+fmtShort(r.date)+'</td><td>'+(person? person.name : '—')+roleTag+'</td><td>'+minToLabel(r.checkIn)+'</td>'
          +'<td>'+(r.checkOut!=null? minToLabel(r.checkOut) : '<span class="small muted">Still on site</span>')+'</td>'
          +'<td>'+staffHoursLabel(staffMinutesWorked(r))+'</td><td>'+vsRoster+'</td></tr>';
      }).join('')
      +'</table>';
  }
  html+='</div>';
  return html;
}

// screen and no reminder of which was which, it was easy to lose track of which day was actually
// meant to change and which was supposed to stay put). Only the two callers editing an EXISTING
// student's schedule (renderRecurringModal, renderPlanChangeModal) pass this; enrollment has no
// "currently" to show. originals[idx] missing (the row is new, beyond what they already had) reads
// as "New session" rather than a currently-blank line.
function renderRecurringPickers(slots, starts, setter, podSetter, originals){
  let html='';
  slots.forEach(function(s, idx){
    if(originals){
      const orig=originals[idx];
      html+='<div class="small muted" style="margin-bottom:2px">'+(orig? 'Currently: '+orig.weekday+' '+minToLabel(orig.start) : 'New session')+'</div>';
    }
    html+='<div class="row2 recurring-row"><div><label>Day '+(idx+1)+'</label><select onchange="'+setter+'('+idx+',\'weekday\',this.value)">'
        +WEEKDAY_KEYS.map(function(d){ return '<option value="'+d+'"'+(d===s.weekday?' selected':'')+'>'+d+'</option>'; }).join('')
      +'</select></div>'
      +'<div><label>Time</label><select onchange="'+setter+'('+idx+',\'start\',this.value)">'
        +starts.map(function(t){ return '<option value="'+t+'"'+(t===s.start?' selected':'')+'>'+minToLabel(t)+'</option>'; }).join('')
      +'</select></div></div>';
    if(podSetter){
      html+='<div style="margin:-6px 0 12px"><label>Preferred Pod for this session</label><select onchange="'+podSetter+'('+idx+',\'preferredPodId\',this.value)"><option value=""'+(!s.preferredPodId?' selected':'')+'>No preference (auto-assign)</option>'
        +pods.map(function(p){ return '<option value="'+p.id+'"'+(p.id===s.preferredPodId?' selected':'')+'>'+p.name+'</option>'; }).join('')
      +'</select></div>';
    }
  });
  return html;
}

// Parent-facing schedule-change-request picker (Sept 2026, per Allie: "Only available session
// times will be shown") — unlike renderRecurringPickers (used by front desk, who need to see and
// set up any time regardless of current live capacity), this one filters the Time dropdown itself
// down to whatever standingSlotHasAvailability() currently says is open for that weekday. The
// slot's own already-picked time is always kept in the list even if it's since gone full, so
// changing the Day dropdown never silently strands the Time dropdown on a now-invalid value — the
// per-row "Full right now" + join-waitlist affordance below the picker (in
// renderTimeChangeRequestModal) covers that case instead.
// Each row states the change in plain "from X to Y" terms (Sept 2026, per Allie: "when booking a
// permanent change to schedule ... I want it to state the child's regular attendance so it says
// change from x day to y day") rather than leaving the parent to infer it from a bare day/time
// picker. currentSlots is the frozen snapshot (f.currentRecurring) paired 1:1 by index with the
// editable slots being picked here — see openTimeChangeRequestForm().
function renderTimeChangeRecurringPickers(slots, currentSlots, duration, year, onlyIdx){
  const allStarts=possibleStarts(duration);
  let html='';
  slots.forEach(function(s, idx){
    // Restricted to the one slot picked from the "Select the day you wish to cancel" dropdown above
    // (Sept 2026, per Allie) — a 2-slot child only sees one New day/New time picker at a time, not
    // both rows editable simultaneously. onlyIdx is null/undefined for a caller that still wants
    // every row (none currently does, but the parameter stays optional rather than required).
    if(onlyIdx!=null && idx!==onlyIdx) return;
    const openStarts=allStarts.filter(function(t){ return standingSlotHasAvailability(s.weekday, t, duration, year); });
    const starts = openStarts.indexOf(s.start)>=0 ? openStarts : openStarts.concat([s.start]).sort(function(a,b){ return a-b; });
    const current=currentSlots && currentSlots[idx];
    html+='<div class="recurring-row-group" style="margin-bottom:10px">';
    if(current) html+='<div class="small muted" style="margin-bottom:4px">Change <b>'+current.weekday+' '+minToLabel(current.start)+'</b> to:</div>';
    // No "current" to frame as a change (a brand-new pick with nothing on file yet, see
    // openTimeChangeRequestForm) — just label which session this is when there's more than one,
    // so a 2x/week family can tell the two blank rows apart.
    else if(slots.length>1) html+='<div class="small muted" style="margin-bottom:4px">Session '+(idx+1)+':</div>';
    html+='<div class="row2 recurring-row"><div><label>New day</label><select onchange="setTimeChangeRecurringSlot('+idx+',\'weekday\',this.value)">'
        +WEEKDAY_KEYS.map(function(d){ return '<option value="'+d+'"'+(d===s.weekday?' selected':'')+'>'+d+'</option>'; }).join('')
      +'</select></div>'
      +'<div><label>New time</label><select onchange="setTimeChangeRecurringSlot('+idx+',\'start\',this.value)">'
        +(starts.length? starts.map(function(t){ return '<option value="'+t+'"'+(t===s.start?' selected':'')+'>'+minToLabel(t)+(openStarts.indexOf(t)>=0?'':' (full)')+'</option>'; }).join('')
          : '<option value="'+s.start+'">No open times this day right now</option>')
      +'</select></div></div></div>';
  });
  return html;
}

// Shared row-builder for both the active and the settled make-up-credits tables below — identical
// column layout either way, only which credits get fed in differs (Sept 2026, per Allie: "can we
// split makeup credits into two sections, so that when they are booked or expired, they go to a
// different section" — booked/completed/expired credits pile up over time and were drowning out the
// still-actionable ones in a single flat table sorted only by expiry date).
function creditReportRowHtml(c){
  const st=creditDisplayStatus(c);
  const student=findStudent(c.studentId);
  const badge={available:'<span class="badge available">Available</span>',soon:'<span class="badge soon">Expiring soon</span>',expired:'<span class="badge expired">Expired</span>',booked:'<span class="badge booked">Booked</span>',completed:'<span class="badge completed">Completed</span>'}[st] || st;
  let detail='—';
  if(c.redeemedSessionId){
    const sess=findSession(c.redeemedSessionId);
    if(sess) detail=fmtShort(sess.date)+' '+rangeLabel(sess.start,sess.duration)+' · '+(findPod(sess.podId)?findPod(sess.podId).name+' · ':'')+(sess.instructorId? findInstructor(sess.instructorId).name : '—');
  }
  const sourceLabel = c.source==='manual'? 'Manual'+(c.note? ' <span class="small muted">— '+c.note+'</span>' : '')
    : c.source==='excused-absence'? 'Excused absence'
    : c.source==='parent-cancel'? 'Parent cancel'
    : c.source==='closure'? 'Centre closure'
    : 'No-show';
  const removable = c.source==='manual' && c.status==='available';
  // Manually assigning a make-up (Sept 2026, per Allie: "I need a button to manually assign
  // make-up sessions") — offered for any available credit, not just manually-added ones, since a
  // parent might call in about ANY kind of make-up (a no-show credit, an excused absence, etc.)
  // and ask front desk to just book it for them rather than doing it themselves online.
  const bookable = c.status==='available';
  // Re-book (Sept 2026, per Allie: give the Booked section its own "still pending" place with a way
  // to change the date/time) — only for a make-up that's booked but hasn't happened yet; one that's
  // already completed is history, not something to move.
  const rebookable = st==='booked';
  return '<tr><td>'+student.name+'</td><td>'+fmtShort(c.issuedDate)+'</td><td>'+fmtShort(c.expiryDate)+'</td><td>'+badge+'</td><td class="small">'+sourceLabel+'</td><td class="small">'+detail+'</td>'
    +'<td>'+(bookable? '<button class="btn sm primary" onclick="openBookingForCredit(\''+c.id+'\')">Book</button> ' : '')+(rebookable? '<button class="btn sm ghost" onclick="rebookMakeUp(\''+c.id+'\')">Re-book</button> ' : '')+(removable? '<button class="btn sm ghost" onclick="removeCredit(\''+c.id+'\')">Remove</button>' : '')+'</td></tr>';
}
// Still actionable — available now, or expiring soon (both cases front desk might need to chase a
// family to actually use before it lapses). Everything else (already booked into a make-up session,
// that make-up completed, or lapsed unused) has nothing left to DO here, so it moves to one of the
// two sections below instead of cluttering this one.
function activeCredits(){
  return credits.filter(function(c){ const st=creditDisplayStatus(c); return st==='available' || st==='soon'; });
}
// Booked but still pending — a make-up session exists and hasn't happened yet. Kept separate from
// completed/expired (Sept 2026, per Allie: "one section for booked and another for
// completed/expired") because a still-pending booking is the one settled state front desk might
// still need to act on — e.g. re-book it to a different date/time — where completed/expired ones
// are pure history.
function bookedCredits(){
  return credits.filter(function(c){ return creditDisplayStatus(c)==='booked'; });
}
function settledCredits(){
  return credits.filter(function(c){ const st=creditDisplayStatus(c); return st!=='available' && st!=='soon' && st!=='booked'; });
}
function renderCreditsReport(){
  const list=activeCredits().sort(function(a,b){ return a.expiryDate-b.expiryDate; });
  let html=sectionOpen('credits','Make-up credits ('+list.length+')','<button class="btn sm primary" onclick="openAddCreditForm(\'\')">+ Add credit</button>');
  html+='<p>Issued automatically for an excused absence (notified in advance), a parent self-cancel, or a centre closure — never for a plain no-show, which gets no credit — or added by hand for a make-up owed from before this system (e.g. carried over from the old manual log), or any other credit front desk needs to grant directly. All expire automatically 3 months after the date entered — no manual cleanup. Once a credit is booked into a make-up it moves to the "Booked" section below; once that make-up happens (or the credit expires unused) it moves on again to "Completed & expired".</p>';
  if(list.length===0){ html+='<div class="empty-note">No make-up credits currently need action.</div>'; }
  else{
    html+='<table><tr><th>Student</th><th>Issued (missed session)</th><th>Expires</th><th>Status</th><th>Source</th><th>Details</th><th></th></tr>';
    list.forEach(function(c){ html+=creditReportRowHtml(c); });
    html+='</table>';

  html+='</div>';
  html+=renderAddCreditModal();
  return html;
}

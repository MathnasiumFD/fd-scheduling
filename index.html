    const newParent=findParent(f.parentId);
    newParent.studentIds=newParent.studentIds||[];
    if(newParent.studentIds.indexOf(student.id)===-1) newParent.studentIds.push(student.id);
    student.parentId=f.parentId;
  }
  dbWrite('editing student details', function(){ return supabaseClient.from('students').update({
    name:student.name, year:student.year, base_year:student.baseYear, year_baseline:student.yearBaseline, parent_id:student.parentId
  }).eq('id', student.id); });
  toast(student.name+'\'s details updated'+(parentChanged? ' — now under '+findParent(student.parentId).name : '')+'.');
  state.editStudentForm=null;
  render();
}

function openRecurringForm(studentId){
  const student=findStudent(studentId);
  const starts=possibleStarts(student.duration);
  let slots = (student.recurring||[]).map(function(r){ return {weekday:r.weekday, start:r.start}; });
  while(slots.length<student.sessionsPerWeek) slots.push({weekday:'Mon', start:starts[0]});
  slots=slots.slice(0,student.sessionsPerWeek);
  state.recurringForm={studentId, slots};
  render();
}
function closeRecurringForm(){ state.recurringForm=null; render(); }
function setRecurringSlot(idx, field, value){
  state.recurringForm.slots[idx][field] = field==='start'? Number(value) : value;
  render();
}
function saveRecurringForm(){
  const f=state.recurringForm;
  const student=findStudent(f.studentId);
  student.recurring = f.slots.map(function(s){ return {weekday:s.weekday, start:s.start}; });

  // Persist the edited pattern to student_recurring_slots — the table loadAllData() actually
  // rebuilds student.recurring from on every page load. This form used to only ever change
  // student.recurring in memory, so the edit looked saved but would quietly revert to whatever was
  // last written here the next time anyone reloaded the app (found alongside the ghost-session bug
  // just above, Sept 2026) — delete-then-insert, same convention saveNewStudent() uses at signup.
  dbWrite('saving an edited regular schedule', function(){
    return supabaseClient.from('student_recurring_slots').delete().eq('student_id', student.id).then(function(){
      if(!student.recurring.length) return;
      return supabaseClient.from('student_recurring_slots').insert(student.recurring.map(function(rec){
        return {student_id:student.id, weekday:rec.weekday, start_min:rec.start};
      }));
    });
  });

  // Clear out every upcoming STANDING occurrence generated under the OLD pattern before rebuilding
  // from the new one. Found Sept 2026: editing a student's regular schedule here overwrote
  // student.recurring and generated fresh sessions for the new pattern, but never touched sessions
  // already generated under the old one — they just sat there indefinitely as live "scheduled"
  // bookings alongside the new ones (a student edited from Mon/Fri 4pm to Mon 3pm/Wed 4:45pm still
  // had real Mon/Fri 4pm sessions weeks into the future). Mirrors the exact clear-then-regenerate
  // approach applyTimeChange()/savePlanChange() already use for the "Stop / change plan" form; only
  // recurring:true placeholders are touched, so a one-off/make-up booking is never disturbed, and a
  // credit already redeemed against a cleared session is restored, same as any other cancellation.
  let clearedCount=0;
  sessions.forEach(function(s){
    if(s.studentId!==student.id || !s.recurring || s.status!=='scheduled') return;
    if(toKey(s.date) < toKey(simNow())) return;
    s.status='cancelled';
    clearedCount++;
    dbWrite('cancelling a session for an edited regular schedule', function(){ return supabaseClient.from('sessions').update({status:'cancelled'}).eq('id', s.id); });
    if(s.creditId){
      const cr=findCredit(s.creditId);
      if(cr && cr.status==='redeemed' && toKey(cr.expiryDate)>=toKey(simNow())){
        cr.status='available'; cr.redeemedSessionId=null;
        dbWrite('restoring a make-up credit', function(){ return supabaseClient.from('credits').update({status:'available', redeemed_session_id:null}).eq('id', cr.id); });
      }
    }
  });

  const made=generateRecurringSessions(student, HORIZON_WEEKS);
  const uncovered=slotsWithoutCoverage(student.recurring, student.duration, student.year);
  if(uncovered.length){
    toast(student.name+'’s regular schedule saved, but no Pod '+student.name+' qualifies for (by age) is currently staffed for '+describeUncoveredSlots(uncovered)+' — those session(s) couldn\'t be pre-booked yet. Assign coverage on the Schedule tab, then reopen this schedule and save it again.', 9000);
  } else {
    toast(student.name+'’s regular schedule saved — '+made+' upcoming session(s) pre-booked.'+(clearedCount? ' '+clearedCount+' old-schedule session(s) cleared.' : ''));
  }
  state.recurringForm=null;
  render();
}

/* ---------- reactivating an inactive (stopped) student (5.26) ---------- */
// Deletes every already-applied "stop" plan-change row for a student, locally and in Supabase.
// Necessary (not just cosmetic) because stoppedFrom is re-derived from this history on every page
// load via applyPlanChanges() — merely clearing student.stoppedFrom in memory wouldn't survive a
// reload; the underlying stop record would just get re-promoted and stop them right back out.
function clearStoppedPlanChanges(student){
  const hadStopLocally=(student.planChanges||[]).some(function(pc){ return pc.stopped; });
  student.planChanges=(student.planChanges||[]).filter(function(pc){ return !pc.stopped; });
  // Always issue the delete, not just when a stopped entry is still visible locally:
  // applyPlanChanges() only filters a promoted stop out of the in-memory planChanges array once its
  // effective date arrives — it never deletes the underlying student_plan_changes row in Supabase.
  // Since stoppedFrom (what makes a student "inactive" at all) is set precisely by that promotion,
  // by the time someone reactivates, the stopped row has almost always already dropped out of
  // student.planChanges — this unconditional delete is what actually clears it, or the student
  // would revert to stopped again on the very next page load.
  dbWrite('clearing a stopped-enrolment record', function(){ return supabaseClient.from('student_plan_changes').delete().eq('student_id', student.id).eq('stopped', true); });
  return hadStopLocally;
}
// prefill (optional) carries over whatever plan details front desk already typed into the "Add
// student" form before realizing this was actually an inactive student coming back — see
// reactivateFromNewStudentForm() — so they don't have to re-enter the same day/time/duration twice.
function openReactivateStudentForm(studentId, prefill){
  const student=findStudent(studentId);
  const dur=(prefill&&prefill.duration) || student.duration || 90;
  const spw=(prefill&&prefill.sessionsPerWeek) || 2;
  const starts=possibleStarts(dur);
  const recurring=(prefill&&prefill.recurring&&prefill.recurring.length)
    ? prefill.recurring.map(function(r){ return {weekday:r.weekday, start:r.start}; })
    : defaultRecurring(spw,dur);
  state.reactivateForm={ studentId, duration:dur, sessionsPerWeek:spw, recurring, error:'' };
  render();
}
function closeReactivateStudentForm(){ state.reactivateForm=null; render(); }
function setReactivateSessionsPerWeek(v){
  const f=state.reactivateForm;
  f.sessionsPerWeek=Number(v);
  const starts=possibleStarts(f.duration);
  while(f.recurring.length<f.sessionsPerWeek) f.recurring.push({weekday:'Mon', start:starts[0]});
  f.recurring=f.recurring.slice(0,f.sessionsPerWeek);
  f.error='';
  render();
}
function setReactivateDuration(v){
  const f=state.reactivateForm;
  f.duration=Number(v);
  const starts=possibleStarts(f.duration);
  f.recurring.forEach(function(r){ if(!starts.includes(r.start)) r.start=starts[0]; });
  f.error='';
  render();
}
function setReactivateRecurring(idx, field, value){
  state.reactivateForm.recurring[idx][field] = field==='start'? Number(value) : value;
  render();
}
function confirmReactivateStudent(){
  const f=state.reactivateForm;
  const student=findStudent(f.studentId);
  if(f.recurring.length===0){ f.error='Add at least one standing day/time.'; render(); return; }
  clearStoppedPlanChanges(student);
  student.stoppedFrom=null;
  student.duration=Number(f.duration);
  student.sessionsPerWeek=Number(f.sessionsPerWeek);
  student.recurring=f.recurring.map(function(r){ return {weekday:r.weekday, start:r.start}; });
  dbWrite('reactivating a student', function(){
    return supabaseClient.from('students').update({duration:student.duration, sessions_per_week:student.sessionsPerWeek}).eq('id', student.id).then(function(){
      return supabaseClient.from('student_recurring_slots').delete().eq('student_id', student.id);
    }).then(function(){
      if(!student.recurring.length) return;
      return supabaseClient.from('student_recurring_slots').insert(student.recurring.map(function(rec){
        return {student_id:student.id, weekday:rec.weekday, start_min:rec.start};
      }));
    });
  });
  const made=generateRecurringSessions(student, HORIZON_WEEKS);
  toast(student.name+' reactivated — '+f.sessionsPerWeek+'x/week, '+f.duration+' min. '+made+' standing session(s) pre-booked.');
  state.reactivateForm=null;
  render();
}

/* ---------- student holds (front desk only) ---------- */
function openHoldForm(studentId){
  state.holdForm={studentId, start:toKey(simNow()), end:toKey(addDays(simNow(),7)), note:'', error:''};
  render();
}
function closeHoldForm(){ state.holdForm=null; render(); }
function setHoldField(field, value){ state.holdForm[field]=value; state.holdForm.error=''; render(); }
// Shared by front desk placing a hold directly (saveHold) and front desk approving a parent's
// hold request (approveEnrollmentRequest) — same effect either way, just a different entry point.
function applyHold(student, start, end, note){
  const hold={id:newId()||('hold'+(nextSessionId++)), start:start, end:end, note:(note||'').trim()};
  student.holds=student.holds||[];
  student.holds.push(hold);
  dbWrite('placing a hold', function(){ return supabaseClient.from('student_holds').insert({
    id:hold.id, student_id:student.id, start_date:toKey(hold.start), end_date:toKey(hold.end), note:hold.note
  }); });
  // Free up any of this student's own already-booked sessions that fall inside the hold window —
  // standing or one-off alike — so those Pod slots immediately show as available. A session paid
  // for with a make-up credit gets its credit restored (unless already past its own expiry),
  // same as any other cancelled make-up.
  let cancelledCount=0;
  sessions.forEach(function(s){
    if(s.studentId!==student.id || s.status!=='scheduled') return;
    const dk=toKey(s.date);
    if(dk<toKey(hold.start) || dk>toKey(hold.end)) return;
    s.status='cancelled';
    cancelledCount++;
    dbWrite('cancelling a session for a hold', function(){ return supabaseClient.from('sessions').update({status:'cancelled'}).eq('id', s.id); });
    if(s.creditId){
      const credit=findCredit(s.creditId);
      if(credit && toKey(simNow())<=toKey(credit.expiryDate)){
        credit.status='available'; credit.redeemedSessionId=null;
        dbWrite('restoring a make-up credit', function(){ return supabaseClient.from('credits').update({status:'available', redeemed_session_id:null}).eq('id', credit.id); });
      }
    }
  });
  toast(student.name+' placed on hold '+fmtShort(hold.start)+'–'+fmtShort(hold.end)+(cancelledCount>0? ' — '+cancelledCount+' session(s) freed up for one-off bookings.' : '.'));
  return hold;
}
function saveHold(){
  const f=state.holdForm;
  const student=findStudent(f.studentId);
  if(!f.start || !f.end){ f.error='Choose a start and end date.'; render(); return; }
  if(f.end<f.start){ f.error='End date must be on or after the start date.'; render(); return; }
  applyHold(student, new Date(f.start), new Date(f.end), f.note);
  state.holdForm=null;
  render();
}
function removeHold(studentId, holdId){
  const student=findStudent(studentId);
  student.holds=(student.holds||[]).filter(function(h){ return h.id!==holdId; });
  dbWrite('removing a hold', function(){ return supabaseClient.from('student_holds').delete().eq('id', holdId); });
  const made=regenerateAllRecurring();
  toast('Hold removed'+(made>0? ' — '+made+' standing session(s) re-booked.' : '.'));
  render();
}

/* ---------- render: shell ---------- */
// Every state change re-renders by rebuilding the whole #app innerHTML from scratch (no virtual
// DOM/diffing) — simple and reliable, but naively doing that on every keystroke would tear down
// and recreate the very <input> the person is typing into, kicking focus out and forcing them to
// click back in before every single character. To avoid that: note which field (and cursor
// position) was focused, rebuild the HTML as usual, then find the same field in the new markup —
// by its position among the other text fields in the same modal, since these forms don't carry
// individual ids — and restore focus/cursor there. A plain click, dropdown change, or button press
// has nothing focused that this applies to, so it's a no-op the rest of the time.
function render(){
  const app=document.getElementById('app');
  const active = (typeof document!=='undefined') ? document.activeElement : null;
  // Only text/search/tel/password/textarea reliably support reading/setting a cursor position in
  // every browser — email/number/date inputs throw or silently misbehave on selectionStart in
  // several browsers (observed: cursor resets to 0 on every keystroke, so each new character gets
  // inserted at the very front instead of where it was typed — e.g. typing "send" comes out
  // "dnes"). Those types still get their focus restored below, just not a cursor position.
  const focusableTypes=['text','email','password','number','search','tel','date'];
  const selectableTypes=['text','search','tel','password'];
  const isTextField = active && (active.tagName==='TEXTAREA' || (active.tagName==='INPUT' && focusableTypes.indexOf(active.type)>=0));
  const canSelect = active && (active.tagName==='TEXTAREA' || (active.tagName==='INPUT' && selectableTypes.indexOf(active.type)>=0));
  let restore=null;
  if(isTextField && app.contains(active)){
    const scope = (active.closest && active.closest('.modal')) || app;
    const fields = Array.prototype.slice.call(scope.querySelectorAll('input, textarea'));
    const idx = fields.indexOf(active);
    if(idx>=0){
      restore={ inModal: scope!==app, idx:idx, start:null, end:null };
      if(canSelect){
        try{ restore.start=active.selectionStart; restore.end=active.selectionEnd; }catch(e){}
      }
    }
  }
  app.innerHTML = renderTop() + renderTabs() + renderRole() + (state.toast? '<div class="toast">'+state.toast+'</div>':'') + renderFooter();
  if(restore){
    const scope = restore.inModal ? app.querySelector('.modal') : app;
    const el = scope && scope.querySelectorAll('input, textarea')[restore.idx];
    if(el){
      el.focus();
      if(restore.start!=null && restore.end!=null && typeof el.setSelectionRange==='function'){
        try{ el.setSelectionRange(restore.start, restore.end); }catch(e){}
      }
    }
  }
}

// The name shown in the "Welcome" greeting — an instructor's or parent's own record has a real
// name; a staff login has no individual name on file at all (by design — every front-desk account
// has full access and isn't tied to one specific person, see app_users), so their sign-in email is
// the closest thing to "who am I logged in as" for that role.
function currentUserDisplayName(){
  if(!currentUser) return '';
  if(currentUser.role==='instructor'){ const i=findInstructor(currentUser.instructorId); if(i) return i.name; }
  if(currentUser.role==='parent'){ const p=parents.find(function(x){ return x.id===currentUser.parentId; }); if(p) return p.name; }
  return currentUser.email || 'Front Desk';
}
function renderTop(){
  const now=simNow();
  const clockControls = currentUser
    ? '<div class="clock"><span>Welcome, <b>'+currentUserDisplayName()+'</b></span><span>Today: <b>'+fmtLong(now)+'</b></span></div>'
    : '<div class="clock">'
      +'<span>Simulated today: <b>'+fmtLong(now)+'</b></span>'
      +'<button class="btn sm" onclick="advanceClock(1)">+1 day</button>'
      +'<button class="btn sm" onclick="advanceClock(7)">+1 week</button>'
      +'<button class="btn sm" onclick="advanceClock(30)">+1 month</button>'
      +'<button class="btn sm" onclick="advanceClock(365)">+1 year</button>'
      +(state.offsetDays!==0? '<button class="btn sm ghost" onclick="resetClock()">Reset</button>':'')
    +'</div>';
  return '<div class="top">'
    +'<div><div class="brand-logo mathq-logo"><img src="'+MATHQ_LOGO+'" alt="MATHQ — Scheduling Hub"/></div></div>'
    +clockControls
  +'</div>';
}
function renderTabs(){
  const tabs=[['staff','🖥️ Front Desk'],['instructor','🧑‍🏫 Instructor'],['parent','👪 Parent']]
  if(currentUser){
    const label=(tabs.find(function(t){ return t[0]===currentUser.role; })||[null,currentUser.role])[1];
    return '<div class="tabs"><span class="tab active">'+label+'</span>'
      +'<button class="btn sm ghost" onclick="logOut()" style="margin-left:auto">Log out</button></div>';
  }
  return '<div class="tabs">'+tabs.map(function(t){
    return '<button class="tab'+(state.role===t[0]?' active':'')+'" onclick="setRole(\''+t[0]+'\')">'+t[1]+'</button>';
  }).join('')+'</div>';
}

function renderRole(){
  if(state.role==='staff') return renderStaff();
  if(state.role==='instructor') return renderInstructor();
  return renderParent();
}

/* ---------- STAFF ---------- */
function podCoverageSummary(podId, weekday, date){
  const blocks=podBlocksForDay(podId, weekday);
  if(blocks.length===0) return 'Unassigned';
  return blocks.map(function(b){
    const instrId=blockInstructorOn(b, date);
    return (instrId? findInstructor(instrId).name : 'Unassigned')+' '+rangeLabel(b.start,b.end-b.start);
  }).join(' → ');
}

// At-a-glance "who's covering what" — every Pod down the side, Mon-Fri across the top, for
// whichever week the Schedule tab is currently showing (This week / Next week toggle). Reuses the
// exact same podCoverageSummary() the day-by-day pod cards below already show one pod/day at a
// time, just laid out so the whole week's coverage (or any gaps in it) is visible without clicking
// through every day. A cell with no instructor assigned at all is called out in red, since that's
// exactly the situation that leaves a regular-schedule slot unable to pre-book (see 5.10 fix).
function renderCoverageGrid(weekDates){
  let html='<div style="overflow-x:auto"><table style="margin-bottom:12px"><tr><th>Pod</th>'
    + weekDates.map(function(d){
        const wd=WEEKDAY_KEYS[(d.getDay()+6)%7];
        return '<th>'+wd+'<br><span class="small muted" style="font-weight:400">'+d.toLocaleDateString('en-AU',{month:'short',day:'numeric'})+'</span></th>';
      }).join('')
    + '</tr>';
  pods.forEach(function(pod){
    html+='<tr><td><b>'+pod.name+'</b></td>';
    weekDates.forEach(function(d){
      const wd=WEEKDAY_KEYS[(d.getDay()+6)%7];
      const summary=podCoverageSummary(pod.id, wd, d);
      const gap=summary==='Unassigned' || summary.indexOf('Unassigned')>=0;
      html+='<td'+(gap?' style="color:var(--danger)"':'')+'>'+summary+'</td>';
    });
    html+='</tr>';
  });
  html+='</table></div>';
  return html;
}

// Per-Pod cards for the day the Schedule section is showing — capacity, who's covering it, and the
// actual seated roster, all together (brought back Sept 2026, per Allie: "we need to bring back
// the pod-based scheduling" — this had briefly been split into a compact badge/pill strip plus one
// separate flat student list; this restores the single per-Pod view, without changing any of the
// underlying actions). "Assign" on a card's header is about STAFFING the Pod (which instructor runs
// it) — a different concern from which students sit in it, which is each row's own "Move to"
// dropdown (locationOptionsHtml/setSessionLocation).
// Names of every student sitting at each Pod on the given day — for TODAY that means "checked in
// and not yet checked out" (a live, moment-to-moment roster: a name drops off the instant that
// student is checked out, freeing the seat), which is what drives the live 1/8, 2/8... occupancy
// badge in renderPodSummaryStrip() below (5.28). For any OTHER day — a day already past, whose
// checked-in students have long since been checked out — dropping the "not checked out" filter
// turns this into that day's actual historical seating record instead: everyone who ever attended
// there that day, kept for training/adjustment reference (Sept 2026, per Allie). A future day
// naturally comes back empty either way, since nobody's attended yet.
function checkedInNamesByPod(dayKey){
  const live = dayKey===toKey(simNow());
  const byPod={};
  sessions.forEach(function(s){
    if(s.status!=='attended' || !s.podId || toKey(s.date)!==dayKey) return;
    if(live && s.checkedOut) return;
    const student=findStudent(s.studentId);
    if(!student) return;
    (byPod[s.podId]=byPod[s.podId]||[]).push(student.name);
  });
  Object.keys(byPod).forEach(function(podId){ byPod[podId].sort(function(a,b){ return a.localeCompare(b, undefined, {sensitivity:'base'}); }); });
  return byPod;
}
// Same idea, keyed by instructor instead of Pod, for whoever's sitting in that instructor's Online
// group — the Online strip's own equivalent of checkedInNamesByPod, live-vs-historical the same way.
function checkedInNamesByOnlineInstructor(dayKey){
  const live = dayKey===toKey(simNow());
  const byInstr={};
  sessions.forEach(function(s){
    if(s.status!=='attended' || !s.online || toKey(s.date)!==dayKey) return;
    if(live && s.checkedOut) return;
    const student=findStudent(s.studentId);
    if(!student) return;
    (byInstr[s.instructorId]=byInstr[s.instructorId]||[]).push(student.name);
  });
  Object.keys(byInstr).forEach(function(id){ byInstr[id].sort(function(a,b){ return a.localeCompare(b, undefined, {sensitivity:'base'}); }); });
  return byInstr;
}
// The combined (physical + online) headcount an instructor is personally minding on a given day —
// the number the 1:9 ratio caps — mirroring checkedInNamesByPod()'s live-vs-historical rule: live
// (checked in, not yet checked out) for today, everyone who attended that day at all for any other
// day. Deliberately independent of instructorCombinedPeak() (below), which stays schedule/peak-based
// for booking-time capacity checks on a session that may not have happened yet — this is the
// "how many are actually sitting with this instructor right now" figure for the summary strip badge.
function instructorOccupantCount(instructorId, dayKey){
  const live = dayKey===toKey(simNow());
  return sessions.filter(function(s){
    if(s.status!=='attended' || toKey(s.date)!==dayKey) return false;
    if(live && s.checkedOut) return false;
    return s.instructorId===instructorId || s.instructorId2===instructorId;
  }).length;
}

// One row of the seating table — a single session, with its own "Move to" (Pod/Online) picker and
// check-in/no-show/cancel actions. Factored out so every card (each Pod, each Online instructor
// group, and Unassigned) renders rows identically — the exact same markup the old single flat list
// used per row, just grouped differently now.
function sessionRowHtml(sess, weekday, dayKey, now){
  const student=findStudent(sess.studentId);
  if(!student) return '';
  const actualNote = sess.actualStart!=null? ' · checked in '+minToLabel(sess.actualStart)+', ran to '+minToLabel(sess.actualEnd) : '';
  let handoffNote='';
  if(sess.instructorId2){
    handoffNote = ' · '+findInstructor(sess.instructorId).name+' until '+minToLabel(sess.handoff)+', then '+findInstructor(sess.instructorId2).name;
  } else if(sess.instructorId){
    handoffNote = ' · with '+findInstructor(sess.instructorId).name+(sess.online? ' (online)' : '');
  }
  let html='<tr><td><b>'+student.name+'</b></td><td>'+yearLabel(student.year)+'</td><td>'+rangeLabel(sess.start,sess.duration)+'</td>';
  // This "Move to" picker lives only in the Pod seating section (see renderPodSummaryStrip) — a
  // PERMANENT standing change from this weekday forward (setPermanentSessionLocation), not the
  // one-off single-session move every other Pod/Online picker in the app uses (setSessionLocation).
  html+='<td><select onchange="setPermanentSessionLocation(\''+sess.id+'\',\''+weekday+'\',\''+dayKey+'\',this.value)">'
    +'<option value=""'+(sessionLocationValue(sess)===''?' selected':'')+'>Unassigned</option>'
    +locationOptionsHtml(weekday, dayKey, sess.start, sess.duration, sessionLocationValue(sess), sess.id)
  +'</select></td>';
  html+='<td class="small muted">'+sess.status+(sess.bookedBy==='parent'?' · 👪 parent':'')+(sess.recurring?' · regular':'')+handoffNote+actualNote+'</td>';
  let actions='';
  if(sess.status==='scheduled' && toKey(sess.date)<=toKey(now)){
    actions+='<button class="btn sm success" onclick="openCheckIn(\''+sess.id+'\')">✓ Check in</button>'
      +'<button class="btn sm ghost" onclick="markStatus(\''+sess.id+'\',\'excused\')" title="They let us know in advance — issues a make-up credit">Excused</button>'
      +'<button class="btn sm danger" onclick="markStatus(\''+sess.id+'\',\'no-show\')" title="No word from them — no make-up credit">No-show</button>';
  } else if(sess.status==='scheduled'){
    actions+='<button class="btn sm ghost" onclick="markStatus(\''+sess.id+'\',\'cancelled\')">Cancel</button>';
  } else if(sess.status==='attended'){
    actions+='<button class="btn sm ghost" onclick="undoCheckIn(\''+sess.id+'\')">Undo check-in</button>';
  }
  html+='<td>'+actions+'</td></tr>';
  return html;
}
// Checked-in students first, then whoever's still to arrive — each half keeping the same
// alphabetical-by-name order scheduleListForDay() already sorted `rows` into (Sept 2026, per
// Allie: "split the ones that are checked in at the top, and the ones to come after at the
// bottom... alphabetically sorted per section"). A no-show is neither — it's grouped with "still
// to arrive" since it never actually checked in, same as a plain scheduled session.
function rosterTableHtml(rows, weekday, dayKey, now){
  const checkedIn=rows.filter(function(s){ return s.status==='attended'; });
  const upcoming=rows.filter(function(s){ return s.status!=='attended'; });
  let html='<table><tr><th>Student</th><th>Year</th><th>Time</th><th>Move to</th><th>Status</th><th></th></tr>';
  html+=checkedIn.map(function(sess){ return sessionRowHtml(sess, weekday, dayKey, now); }).join('');
  if(checkedIn.length && upcoming.length){
    html+='<tr><td colspan="6" class="small muted" style="text-align:center;padding:4px 0">— yet to arrive —</td></tr>';
  }
  html+=upcoming.map(function(sess){ return sessionRowHtml(sess, weekday, dayKey, now); }).join('');
  html+='</table>';
  return html;
}

// Live per-Pod (and Online) "who's here" board — literally just names and leave times, grouped by
// where they're actually sitting, updating automatically as students check in and out (a spot
// reopens the instant someone checks out, since they simply drop off the list) — Sept 2026, per
// Allie: "as the students get checked into a pod, we are able to see them in that pod... as they
// leave theres a spot again... i just need it to say the kids name and the time they leave".
// Deliberately much lighter than the full-day roster in renderPodSummaryStrip just below it (no
// year, no status, no move/action controls) — this is meant to be read at a glance, not worked
// from; corrections to a checked-in/exit time still happen on the "Checked in today" panel above.
// Same live-vs-historical rule as checkedInNamesByPod(): today shows who's still actually present
// (checked out students drop off immediately), any other day shows that whole day's attended record.
function liveOccupancyGroups(dayKey){
  const live = dayKey===toKey(simNow());
  const byPod={}, byOnlineInstr={};
  sessions.forEach(function(s){
    if(s.status!=='attended' || toKey(s.date)!==dayKey) return;
    if(live && s.checkedOut) return;
    const student=findStudent(s.studentId);
    if(!student) return;
    const entry={name:student.name, exit:s.actualEnd};
    if(s.online){ (byOnlineInstr[s.instructorId]=byOnlineInstr[s.instructorId]||[]).push(entry); }
    else if(s.podId){ (byPod[s.podId]=byPod[s.podId]||[]).push(entry); }
  });
  const sortEntries=function(list){
    return list.slice().sort(function(a,b){
      const ea = a.exit==null? Infinity : a.exit, eb = b.exit==null? Infinity : b.exit;
      return ea-eb || a.name.localeCompare(b.name, undefined, {sensitivity:'base'});
    });
  };
  // podId carried through (null for an Online group) so the renderer can look up that Pod's own
  // capacity for the seat-map/badge below — Online has a different capacity model entirely (the
  // combined 1:9 ratio, not a fixed 8 seats), so it deliberately gets neither.
  const groups=[];
  pods.forEach(function(pod){
    if(byPod[pod.id] && byPod[pod.id].length) groups.push({label:pod.name, podId:pod.id, entries:sortEntries(byPod[pod.id])});
  });
  Object.keys(byOnlineInstr).forEach(function(instrId){
    const instr=findInstructor(instrId);
    if(!instr) return;
    groups.push({label:'Online — '+instr.name, podId:null, entries:sortEntries(byOnlineInstr[instrId])});
  });
  return groups;
}
// Who's here right now — grid layout matching the Availability lookup's own look (Sept 2026, per
// Allie: "can we make Who's here right now look like the availability lookup table? similar set up,
// with a different colour per cell, only displaying the pods that have students in them"). Columns
// are Pods with at least one student present right now (per her follow-up: "can we swap for pods to
// be columns?"); rows are seat slots 1..capacity, earliest-to-leave first (matching sortEntries()'s
// own order); every cell is coloured the same simple occupied(red)/empty(green) way the app's other
// capacity badges already use — per her clarification, NOT a distinct colour per Pod and NOT a
// colour tied to how soon someone's leaving. Online groups have no fixed seat count to grid against
// (they run on the combined 1:9 ratio, not 8 physical seats), so they keep the plain name/leave-time
// list format below the grid, same as before.
function renderLiveOccupancyBoard(dayKey){
  const groups=liveOccupancyGroups(dayKey).filter(function(g){ return g.entries.length; });
  const podGroups=groups.filter(function(g){ return g.podId; });
  const onlineGroups=groups.filter(function(g){ return !g.podId; });
  const live = dayKey===toKey(simNow());
  let html='<div class="card"><h2>Who\'s here'+(live? ' right now':'')+'</h2>';
  if(!groups.length){
    html+='<div class="empty-note">'+(live? 'Nobody checked in yet today.' : 'Nobody was checked in this day.')+'</div></div>';
    return html;
  }
  if(podGroups.length){
    const maxCap=Math.max.apply(null, podGroups.map(function(g){ return podCapacity(g.podId); }));
    html+='<div class="liveboard-grid" style="grid-template-columns:70px repeat('+podGroups.length+',1fr);'+(onlineGroups.length? 'margin-bottom:14px':'')+'">';
    html+='<div></div>'+podGroups.map(function(g){
      const cap=podCapacity(g.podId);
      const occupancy=g.entries.length;
      return '<div class="cal-head">'+g.label+' <span class="badge '+(occupancy>=cap?'full':'available')+'" style="margin-left:4px">'+occupancy+'/'+cap+'</span></div>';
    }).join('');
    for(let seat=0; seat<maxCap; seat++){
      html+='<div class="cal-row-label small muted">Seat '+(seat+1)+'</div>';
      html+=podGroups.map(function(g){
        const cap=podCapacity(g.podId);
        if(seat>=cap) return '<div></div>'; // this Pod's capacity is narrower than the widest column needs
        const entry=g.entries[seat];
        return entry
          ? '<div class="avail-cell full-cell">'+entry.name+'<br><span class="small">'+(entry.exit!=null? minToLabel(entry.exit) : '—')+'</span></div>'
          : '<div class="avail-cell on">Open</div>';
      }).join('');
    }
    html+='</div>';
  }
  if(onlineGroups.length){
    html+='<div style="display:flex;flex-wrap:wrap;gap:16px">'
      +onlineGroups.map(function(g){
        return '<div style="min-width:150px"><h4 style="margin:0 0 4px 0">'+g.label+'</h4>'
          +'<table><tr><th>Student</th><th>Leaves</th></tr>'
          +g.entries.map(function(e){ return '<tr><td>'+e.name+'</td><td>'+(e.exit!=null? minToLabel(e.exit) : '—')+'</td></tr>'; }).join('')
          +'</table></div>';
      }).join('')
      +'</div>';
  }
  html+='</div>';
  return html;
}

function renderPodSummaryStrip(dayKey, weekday){
  const now=simNow();
  const selectedDate=new Date(dayKey);
  const dayList=scheduleListForDay(dayKey);
  const checkedInByPod=checkedInNamesByPod(dayKey);
  let html='<div style="display:flex;flex-direction:column;gap:12px;margin-bottom:12px">';
  pods.forEach(function(pod){
    const cap=podCapacity(pod.id);
    const coverage=podCoverageSummary(pod.id, weekday, selectedDate);
    const checkedIn=checkedInByPod[pod.id]||[];
    // The badge counts who's actually sitting there (live today, the day's full record for any
    // other day — see checkedInNamesByPod()) rather than the day's busiest scheduled overlap, so it
    // climbs 1/8, 2/8, 3/8... as each student is checked in and assigned here, exactly the "seats
    // filling up" view front desk watches through the day (5.28, per Allie).
    const occupancy=checkedIn.length;
    const roster=dayList.filter(function(s){ return s.podId===pod.id && !s.online; });
    html+='<div class="card" style="margin:0"><div class="card-head" style="flex-wrap:wrap;row-gap:6px">'
      +'<h3 style="margin:0">'+pod.name+'</h3>'
      +'<span class="small muted">'+coverage+'</span>'
      +'<span class="badge '+(occupancy>=cap?'full':'available')+'">'+occupancy+'/'+cap+'</span>'
      +'<button class="btn sm ghost" style="margin-left:auto" onclick="openPodAssignForm(\''+pod.id+'\',\''+weekday+'\')">Assign</button>'
    +'</div>'
    +(roster.length? rosterTableHtml(roster, weekday, dayKey, now) : '<div class="empty-note">Nobody assigned here yet.</div>')
    +'</div>';
  });
  // Online cards — one per instructor currently minding an Online group today, shown separately
  // from the Pod cards above (Online is a separate concept, not just another Pod). Only instructors
  // with at least one online student booked today get a card; an on-shift instructor with nobody
  // online yet doesn't clutter this up.
  const onlineByInstructor={};
  dayList.forEach(function(s){ if(s.online){ (onlineByInstructor[s.instructorId]=onlineByInstructor[s.instructorId]||[]).push(s); } });
  Object.keys(onlineByInstructor).forEach(function(instrId){
    const instr=findInstructor(instrId);
    if(!instr) return;
    const occupancy=instructorOccupantCount(instrId, dayKey); // combined (physical + online) headcount actually sitting with this instructor — the number the 1:9 ratio caps
    html+='<div class="card online" style="margin:0"><div class="card-head" style="flex-wrap:wrap;row-gap:6px">'
      +'<h3 style="margin:0">Online — '+instr.name+'</h3>'
      +'<span class="badge '+(occupancy>=ONLINE_COMBINED_CAP?'full':'available')+'">'+occupancy+'/'+ONLINE_COMBINED_CAP+'</span>'
    +'</div>'
    +rosterTableHtml(onlineByInstructor[instrId], weekday, dayKey, now)
    +'</div>';
  });
  // Unassigned — anyone with no Pod and not online: a genuine gap front desk still needs to resolve,
  // called out as its own card rather than silently missing from every Pod's roster.
  const unassigned=dayList.filter(function(s){ return !s.podId && !s.online; });
  if(unassigned.length){
    html+='<div class="card" style="margin:0"><div class="card-head"><h3 style="margin:0;color:var(--danger)">Unassigned</h3></div>'
      +rosterTableHtml(unassigned, weekday, dayKey, now)
    +'</div>';
  }
  html+='</div>';
  return html;
}

// Every student expected on a given day, across every Pod (and Unassigned) at once — replaces the
// old per-Pod roster loop (Sept 2026). Alphabetical by student name, same convention as the old
// per-Pod rosters used (easier to scan and find a specific kid than sorting by time), start time as
// the tie-break.
function scheduleListForDay(dayKey){
  return sessions.filter(function(s){ return toKey(s.date)===dayKey && s.status!=='cancelled'; })
    .slice()
    .sort(function(a,b){
      const an=findStudent(a.studentId), bn=findStudent(b.studentId);
      if(!an || !bn) return 0;
      return an.name.localeCompare(bn.name, undefined, {sensitivity:'base'}) || a.start-b.start;
    });
}

// The Schedule list's own Pod dropdown, onchange — picks freely (Sept 2026: no age or capacity
// blocking on the picker itself), but capacity is still the one thing that can actually refuse the
// change (movePodSession still checks it) since that's the one requirement left (the 1:8 ratio).
// An empty value unassigns outright, with no capacity/coverage math needed for that.
function setSessionPod(sessionId, podId){
  const sess=findSession(sessionId);
  if(!sess) return;
  const student=findStudent(sess.studentId);
  if(!podId){
    sess.podId=null; sess.instructorId=null; sess.instructorId2=null; sess.handoff=null; sess.online=false;
    dbWrite('unassigning a session\'s Pod', function(){ return supabaseClient.from('sessions').update({
      pod_id:null, instructor_id:null, instructor_id_2:null, handoff_min:null, online:false
    }).eq('id', sess.id); });
    toast(student.name+' set to Unassigned.');
    render();
    return;
  }
  const result=movePodSession(sessionId, podId);
  if(!result.ok){ toast(result.error); render(); return; }
  if(result.newPod){
    toast(result.oldPod? (student.name+' moved from '+result.oldPod.name+' to '+result.newPod.name+'.') : (student.name+' assigned to '+result.newPod.name+'.'));
  }
  render();
}

// The Pod seating section's own "Move to" picker (Sept 2026, per Allie: "I think maybe instead of
// having the pre-assigned pods as always visible, that is another section at the bottom default
// collapsed, where we can visually arrange students and any changes made to that section are
// permanent changes from that day onward") — unlike setSessionLocation/setSessionPod above (a
// one-off, this-session-only move), choosing a destination here is a PERMANENT standing change:
// this weekday, from the viewed day forward, using the exact same pin mechanism as the "Change Pod"
// feature (saveStudentPodAssignment) — just invoked directly instead of through its own modal.
// Confirmed sessionRowHtml/rosterTableHtml are only ever rendered inside renderPodSummaryStrip, so
// this is the only picker that needs this behavior; every other Pod/Online picker in the app
// (Schedule list row wasn't a thing anymore, check-in modal, the separate Move-pod modal) stays a
// one-off move via setSessionLocation/confirmMovePod, untouched.
function setPermanentSessionLocation(sessionId, weekday, dayKey, value){
  const sess=findSession(sessionId);
  if(!sess) return;
  const student=findStudent(sess.studentId);
  const isOnline=String(value).indexOf('online:')===0;
  const podId=isOnline? null : (value||null);
  const instructorId=isOnline? value.slice(7) : null;

  // Move the session actually being looked at right now, the same way the one-off pickers always
  // have (movePodSession/setSessionOnline directly, same as confirmMovePod uses) — capacity is still
  // enforced for a future-dated day exactly as before (movePodSession's own isToday check), only
  // relaxed for the day it's actually happening. If this fails, stop — no pin gets written for a
  // move that didn't actually happen.
  if(isOnline){
    const result=setSessionOnline(sessionId, instructorId);
    if(!result.ok){ toast(result.error); render(); return; }
  } else if(podId){
    const result=movePodSession(sessionId, podId);
    if(!result.ok){ toast(result.error); render(); return; }
  } else {
    sess.podId=null; sess.instructorId=null; sess.instructorId2=null; sess.handoff=null; sess.online=false;
    dbWrite('unassigning a session\'s Pod', function(){ return supabaseClient.from('sessions').update({
      pod_id:null, instructor_id:null, instructor_id_2:null, handoff_min:null, online:false
    }).eq('id', sess.id); });
  }

  // Then pin it as a standing change from this weekday forward — identity for "replacing" a prior
  // pin is (effectiveFrom, weekday) together, same convention saveStudentPodAssignment() uses.
  student.podAssignments=(student.podAssignments||[]).filter(function(a){
    return !(toKey(a.effectiveFrom)===dayKey && (a.weekday||null)===weekday);
  });
  student.podAssignments.push({podId:podId, online:isOnline, instructorId:instructorId, effectiveFrom:new Date(dayKey), weekday:weekday});
  dbWrite('pinning standing Pod from seating section', function(){
    return supabaseClient.from('student_pod_assignments').delete().eq('student_id', student.id).eq('effective_from', dayKey).eq('weekday', weekday)
      .then(function(){
        return supabaseClient.from('student_pod_assignments').insert({student_id:student.id, pod_id:podId, online:isOnline, instructor_id:instructorId, effective_from:dayKey, weekday:weekday});
      });
  });

  // Cancel + regenerate already-generated future standing occurrences on that one weekday from this
  // date forward, same as saveStudentPodAssignment() — otherwise only sessions not yet generated
  // would pick up the new pin. The session moved directly above is excluded (already handled, and
  // it may not even be `recurring`, e.g. a one-off staff-placed session).
  let movedCount=0;
  sessions.forEach(function(s){
    if(s.studentId!==student.id || !s.recurring || s.status!=='scheduled' || s.id===sessionId) return;
    if(toKey(s.date) < dayKey) return;
    if(WEEKDAY_KEYS[(new Date(s.date).getDay()+6)%7]!==weekday) return;
    s.status='cancelled';
    movedCount++;
    dbWrite('cancelling a session for a permanent Pod seating change', function(){ return supabaseClient.from('sessions').update({status:'cancelled'}).eq('id', s.id); });
    if(s.creditId){
      const cr=findCredit(s.creditId);
      if(cr && cr.status==='redeemed' && toKey(cr.expiryDate)>=toKey(simNow())){
        cr.status='available'; cr.redeemedSessionId=null;
        dbWrite('restoring a make-up credit', function(){ return supabaseClient.from('credits').update({status:'available', redeemed_session_id:null}).eq('id', cr.id); });
      }
    }
  });
  regenerateAllRecurring();

  const destLabel = isOnline? ('Online — '+findInstructor(instructorId).name) : (podId? findPod(podId).name : 'Unassigned');
  toast(student.name+' permanently moved to '+destLabel+' on '+weekday+'s, from '+fmtShort(new Date(dayKey))+' onward'+(movedCount? ' — '+movedCount+' upcoming standing session'+(movedCount===1?'':'s')+' regenerated to match' : '')+'.');
  render();
}

// Collapse state for front-desk sections lives on `state` (so it survives the full-page
// re-render every action triggers) but isn't persisted anywhere beyond the current browser tab —
// each section just remembers whether it's open or closed for the rest of this visit.
function sectionCollapsed(id){ return !!(state.collapsedSections && state.collapsedSections[id]); }
function toggleSection(id){
  state.collapsedSections = state.collapsedSections || {};
  state.collapsedSections[id] = !state.collapsedSections[id];
  render();
}
// Builds the opening "<div class='card'><div class='card-head'><h2>...</h2>" markup shared by
// every front-desk section, with the collapse toggle wired onto the title itself (not the whole
// header row) so any action buttons placed in extraHeaderHtml stay independently clickable.
function sectionOpen(id, title, extraHeaderHtml){
  return '<div class="card'+(sectionCollapsed(id)?' collapsed':'')+'">'
    +'<div class="card-head"><h2 class="sec-toggle" onclick="toggleSection(\''+id+'\')"><span class="chev">▾</span>'+title+'</h2>'
    +(extraHeaderHtml||'')+'</div>';
}

function renderStaff(){
  const now=simNow();
  const monday=addDays(getMonday(now), state.weekOffset*7);
  const weekDates=[0,1,2,3,4].map(function(i){ return addDays(monday,i); });
  let dayKey=state.selectedDayKey;
  if(!dayKey || !weekDates.some(function(d){ return toKey(d)===dayKey; })){
    const todayInWeek=weekDates.find(function(d){ return sameDay(d,now); });
    dayKey = todayInWeek? toKey(todayInWeek) : toKey(weekDates[0]);
  }
  const selectedDate=new Date(dayKey);
  const weekday=WEEKDAY_KEYS[(selectedDate.getDay()+6)%7];
  const isPast = selectedDate < new Date(toKey(now));
  const closure=closedDayFor(selectedDate);

  let html=renderCheckInSearchPanel();
  html+=renderCoverageRequestsPanel();
  html+=renderEnrollmentRequestsPanel();
  html+=renderCheckedInPanel();
  html+=renderAvailabilityLookup();
  html+=renderWaitlistPanel();
  html+=renderClosedDaysPanel();

  html+=sectionOpen('schedule','Schedule',
      '<div style="display:flex;gap:6px;align-items:center">'
        +'<button class="btn sm'+(state.weekOffset===0?' primary':'')+'" onclick="setWeek(0)">This week</button>'
        +'<button class="btn sm'+(state.weekOffset===1?' primary':'')+'" onclick="setWeek(1)">Next week</button>'
        +'<input type="date" class="small" value="'+dayKey+'" max="'+toKey(addDays(now,365))+'" onchange="jumpToDate(this.value)" title="Jump to any date — including a past day, to see how it was seated"/>'
        +(isPast || closure? '' : '<button class="btn sm primary" onclick="openBooking(null,\''+dayKey+'\')">+ Book a session</button>')
      +'</div>');
  html+='<div class="daypicker">'+weekDates.map(function(d){
    const k=toKey(d);
    return '<button class="daybtn'+(k===dayKey?' active':'')+'" onclick="selectDay(\''+k+'\')">'+WEEKDAY_KEYS[(d.getDay()+6)%7]+'<span class="d2">'+d.toLocaleDateString('en-AU',{month:'short',day:'numeric'})+'</span></button>';
  }).join('')+'</div>';

  if(closure){ html+='<div class="banner danger">Centre closed this day — "'+closure.label+'". Nothing can be booked here; anything already scheduled was cancelled and credited when this closure was added.</div>'; }

  html+=renderCoverageGrid(weekDates);

  html+='</div>'; // closes the Schedule card opened by sectionOpen('schedule', ...) above — the pod
                   // cards just rendered are the last thing that belongs inside it. This was
                   // previously left unclosed (harmless before the collapsible-sections feature,
                   // since it just meant later cards were technically-invalid nested children
                   // rather than siblings) — now that collapsing hides a card's direct children,
                   // that missing tag was making "Schedule" swallow everything after it.

  // Placed directly under Schedule, above Students (Sept 2026, per Allie: "place pod seating -
  // permanent changes right under schedule, above students") — previously all the way at the bottom
  // of the page. Collapsed by default and following whichever day is selected in the Schedule day
  // picker above it, same as before; its "Move to" picker makes a PERMANENT standing change (see
  // setPermanentSessionLocation) rather than a one-off swap, so this reads as an extension of
  // Schedule's own seating rather than a roster-management afterthought.
  html+=sectionOpen('podSeating','Pod seating — permanent changes')
    +'<p class="small muted">Move a student here and it sticks — every '+weekday+' from '+fmtShort(selectedDate)+' onward, not just '+fmtShort(selectedDate)+' itself. For a one-off swap just for a single session, use "Move pod" wherever that session appears instead.</p>'
    +renderPodSummaryStrip(dayKey, weekday)
    +'</div>';

  html+=renderBookingModal();
  html+=renderPodAssignModal();
  html+=renderCheckInModal();
  html+=renderCheckOutModal();
  html+=renderMoveModal();
  html+=renderWaitlistModal();
  html+=renderClosedDayModal();
  html+=renderStudentsPanel();
  html+=renderInstructorsPanel();
  html+=renderParentsPanel();
  html+=renderFrontStaffPanel();
  html+=renderCreditsReport();
  html+=renderInactiveStudentsPanel();
  html+=renderInactiveParentsPanel();

  return html;
}

function renderPodAssignModal(){
  const f=state.podAssignForm;
  if(!f) return '';
  const pod=findPod(f.podId);
  const now=simNow();
  const blocks=podBlocksForDay(f.podId, f.weekday);
  let html='<div class="overlay" onclick="if(event.target===this) closePodAssignForm()"><div class="modal">';
  html+='<h3>Assign '+pod.name+' — '+f.weekday+'</h3>';
  html+='<p>Who runs this Pod on '+f.weekday+'s, and when. Add another shift to hand the Pod off to a different instructor partway through the day — or line up a replacement for an existing shift starting from a future date, without disturbing who\'s covering it until then.</p>';
  if(f.error) html+='<div class="banner danger">'+f.error+'</div>';
  if(blocks.length===0){ html+='<div class="empty-note">Unassigned — nobody covers this Pod on '+f.weekday+'s.</div>'; }
  blocks.forEach(function(b){
    const draft=f.drafts[b.id] || {instructorId:'', effectiveFrom:toKey(now)};
    const currentId=blockInstructorOn(b, now);
    const upcoming=b.assignments.filter(function(a){ return toKey(a.effectiveFrom)>toKey(now); }).sort(function(a,b2){ return toKey(a.effectiveFrom).localeCompare(toKey(b2.effectiveFrom)); });
    const effDate=draft.effectiveFrom? new Date(draft.effectiveFrom) : now;
    const qualifying=qualifyingInstructorsForBlock(f.weekday, b, effDate);

    html+='<div class="pod-card" style="margin-bottom:10px">';
    html+='<div class="block-row">'
      +'<div><label>From</label><select onchange="setPodBlockTime(\''+f.podId+'\',\''+f.weekday+'\',\''+b.id+'\',\'start\',this.value)">'
        +TIME_OPTIONS.map(function(t){ return '<option value="'+t+'"'+(t===b.start?' selected':'')+'>'+minToLabel(t)+'</option>'; }).join('')
      +'</select></div>'
      +'<div><label>To</label><select onchange="setPodBlockTime(\''+f.podId+'\',\''+f.weekday+'\',\''+b.id+'\',\'end\',this.value)">'
        +TIME_OPTIONS.map(function(t){ return '<option value="'+t+'"'+(t===b.end?' selected':'')+'>'+minToLabel(t)+'</option>'; }).join('')
      +'</select></div>'
      +'<button class="btn sm ghost" onclick="removePodShiftBlock(\''+f.podId+'\',\''+f.weekday+'\',\''+b.id+'\')">Remove shift</button>'
    +'</div>';
    html+='<div class="small" style="margin-bottom:8px">Currently: <b>'+(currentId? findInstructor(currentId).name : 'Unassigned')+'</b></div>';
    if(upcoming.length>0){
      html+='<div class="small muted" style="margin-bottom:8px">Scheduled changes: '+upcoming.map(function(a){
        return findInstructor(a.instructorId).name+' from '+fmtShort(a.effectiveFrom)+' <a href="#" onclick="removeAssignment(\''+f.podId+'\',\''+f.weekday+'\',\''+b.id+'\',\''+toKey(a.effectiveFrom)+'\');return false;" style="color:var(--danger)">✕</a>';
      }).join(', ')+'</div>';
    }
    html+='<div class="row2" style="align-items:flex-end">';
    if(qualifying.length===0){
      html+='<div class="small muted">No instructor is currently available for this shift on that date — adjust availability first, or pick a different date.</div>';
    } else {
      html+='<div><label>Assign</label><select onchange="setAssignDraftField(\''+b.id+'\',\'instructorId\',this.value)">'
        +'<option value="">Choose…</option>'
        +qualifying.map(function(i){ return '<option value="'+i.id+'"'+(i.id===draft.instructorId?' selected':'')+'>'+i.name+'</option>'; }).join('')
      +'</select></div>'
      +'<div><label>From</label><input type="date" value="'+draft.effectiveFrom+'" onchange="setAssignDraftField(\''+b.id+'\',\'effectiveFrom\',this.value)"/></div>'
      +'<button class="btn sm primary" onclick="saveAssignmentChange(\''+f.podId+'\',\''+f.weekday+'\',\''+b.id+'\')">Save</button>';
    }
    html+='</div></div>';
  });
  html+='<button class="btn sm ghost" onclick="addPodShiftBlock(\''+f.podId+'\',\''+f.weekday+'\')">+ Add shift</button>';
  html+='<div style="display:flex;gap:8px;margin-top:14px;justify-content:flex-end">'
    +'<button class="btn primary" onclick="closePodAssignForm()">Done</button>'
  +'</div>';
  html+='</div></div>';
  return html;
}

function renderCoverageRequestsPanel(){
  const open=coverageRequests.filter(function(r){ return r.status==='open'; }).sort(function(a,b){ return new Date(a.date)-new Date(b.date); });
  if(open.length===0) return '';
  let html=sectionOpen('coverage','⚠️ Shifts needing coverage','<span class="small muted">'+open.length+'</span>');
  html+='<p>An instructor has flagged they can\'t work one of their shifts — every qualified, available instructor was emailed the moment it was raised. Pick a replacement for just that date — their regular assignment is untouched every other day. If it\'s already been sorted out face-to-face in the centre, use "Assign directly" to record whoever agreed to cover, even if they\'re not in the suggested list. If nobody at all is available, the manager is emailed automatically so it doesn\'t sit unnoticed.</p>';
  html+='<table><tr><th>Date</th><th>Pod / shift</th><th>Requested by</th><th>Emailed</th><th>Cover with</th><th>Assign directly</th></tr>';
  open.forEach(function(r){
    const pod=findPod(r.podId);
    const block=podBlocksForDay(r.podId, r.weekday).find(function(b){ return b.id===r.blockId; });
    const requester=findInstructor(r.requestedBy);
    const notified=(r.notifiedInstructorIds||[]).map(function(id){ const i=findInstructor(id); return i?i.name:null; }).filter(Boolean);
    const emailedCell = notified.length
      ? notified.join(', ')
      : (r.managerNotified? 'Nobody available — manager emailed' : 'Nobody was available yet');
    html+='<tr><td>'+fmtShort(r.date)+' <span class="small muted">('+r.weekday+')</span></td>'
      +'<td>'+pod.name+(block? ' '+rangeLabel(block.start,block.end-block.start) : '')+'</td>'
      +'<td class="small">'+requester.name+(r.note? ' <span class="muted">— '+r.note+'</span>' : '')+'</td>'
      +'<td class="small muted">'+emailedCell+'</td>';
    if(!block){ html+='<td class="small muted">Shift no longer exists</td><td class="small muted">—</td>'; }
    else{
      const subs=availableSubsForCoverage(r.podId, r.weekday, block, r.date, r.requestedBy);
      if(subs.length===0){
        html+='<td class="small muted">No qualified instructor is free that day. <a href="#" onclick="markCoverageUncovered(\''+r.id+'\');return false;">Mark unstaffed</a></td>';
      } else {
        html+='<td>'+subs.map(function(i){ return '<button class="btn sm primary" style="margin:2px" onclick="fillCoverageRequest(\''+r.id+'\',\''+i.id+'\')">'+i.name+'</button>'; }).join('')+'</td>';
      }
      const selId='manualCover_'+r.id;

// Also un-collapses the Schedule section if it's currently collapsed — collapsing hides
// everything in the card except its header (see .card.collapsed CSS), which includes the day
// picker and pod cards these buttons are meant to update. Without this, clicking "Next week"
// while the section happens to be collapsed changes state.weekOffset correctly but produces no
// visible change at all, which looks exactly like the button doing nothing.
function setWeek(w){
  state.weekOffset=w; state.selectedDayKey=null;
  if(state.collapsedSections && state.collapsedSections.schedule){ state.collapsedSections.schedule=false; }
  render();
}

function selectDay(k){ state.selectedDayKey=k; render(); }

// Jumps the Schedule section straight to any date — including one long past — rather than only
// ever reaching "this week" or "next week" one click at a time (5.28, per Allie: front desk wants
// to pull up how a past day was actually seated, for training/adjustment purposes). Works by
// landing on that date's own week (so the existing Mon-Fri day picker and every day-driven render —
// the Pod summary strip, the schedule list with its actual check-in/out times — just work exactly
// as they already do for "this week"/"next week", no separate history view needed). A weekend date
// has no matching day-picker button, so it silently falls back to that week's Monday, same as any
// other selectedDayKey that doesn't land in the visible week.
function jumpToDate(dateStr){
  if(!dateStr) return;
  const target=new Date(dateStr);
  const mondayOfTarget=getMonday(target);
  const mondayOfThisWeek=getMonday(simNow());
  state.weekOffset=Math.round((mondayOfTarget-mondayOfThisWeek)/(7*86400000));
  state.selectedDayKey=toKey(target);
  if(state.collapsedSections && state.collapsedSections.schedule){ state.collapsedSections.schedule=false; }
  render();
}

// Builds each Pod's <option> label for any dropdown that lets front desk choose a Pod directly —
// this booking modal and the flat Schedule list's per-student picker (renderScheduleList) both use
// it, so "which Pod is this, who's covering it, how full is it" always reads identically wherever
// a Pod gets picked. No option is ever disabled here (Sept 2026 — pick freely, no age or capacity
// blocking on the picker itself); capacity is still enforced when the pick is actually confirmed.
function podOptionLabel(pod, weekday, dateKey, start, duration){
  const cov=podCoverageDetail(pod.id, weekday, start, duration, new Date(dateKey));
  const who=cov.primaryInstructorId? findInstructor(cov.primaryInstructorId).name : 'Unassigned';
  const peak=peakConcurrency(pod.id, dateKey, {start, duration});
  const cap=podCapacity(pod.id);
  return pod.name+' — '+who+' — '+peak+'/'+cap;
}

// Same idea as podOptionLabel, for an "Online — [instructor]" choice: shows that instructor's
// COMBINED (physical + online) headcount against the higher online ratio, so front desk can see at
// a glance whether picking them still leaves room. excludeSessionId (see instructorCombinedPeak)
// keeps an already-online session's own current slot from double-counting against itself.
function onlineOptionLabel(instr, dateKey, start, duration, excludeSessionId){
  const peak=instructorCombinedPeak(instr.id, dateKey, {start:start, duration:duration}, excludeSessionId);
  return 'Online — '+instr.name+' — '+peak+'/'+ONLINE_COMBINED_CAP;
}
// A session's current location, encoded as one value for a single Pod/Online <select>: a Pod's own
// id, '' for unassigned, or 'online:<instructorId>' for an Online group — see setSessionLocation().
function sessionLocationValue(sess){ return sess.online? ('online:'+sess.instructorId) : (sess.podId||''); }
// The shared "which Pod, or which Online group" <option> list — every picker that lets front desk
// choose a session's location (the flat Schedule list's row picker, the check-in modal, the booking
// modal) renders from this, so all three always offer the exact same choices in the exact same
// format. Online is deliberately its own <optgroup> — a distinct concept in the picker, not just
// another Pod-shaped row — and only ever lists instructors actually on shift right now (see
// instructorsOnShift()); nothing is ever disabled here (same "pick freely, capacity enforced on
// confirm" convention pods already use), except where the caller wants otherwise (see renderMoveModal,
// which does still disable a full choice).
function locationOptionsHtml(weekday, dateKey, start, duration, selectedValue, excludeSessionId){
  let html=pods.map(function(p){
    return '<option value="'+p.id+'"'+(selectedValue===p.id?' selected':'')+'>'+podOptionLabel(p, weekday, dateKey, start, duration)+'</option>';
  }).join('');
  const onlineInstrs=instructorsOnShift(weekday, start, duration, new Date(dateKey));
  if(onlineInstrs.length){
    html+='<optgroup label="Online">'+onlineInstrs.map(function(instr){
      const val='online:'+instr.id;
      return '<option value="'+val+'"'+(selectedValue===val?' selected':'')+'>'+onlineOptionLabel(instr, dateKey, start, duration, excludeSessionId)+'</option>';
    }).join('')+'</optgroup>';
  }
  return html;
}

function renderBookingModal(){
  if(!state.booking) return '';
  const b=state.booking, f=state.bookingForm;
  const isOnline = String(f.location).indexOf('online:')===0;
  const onlineInstr = isOnline? findInstructor(f.location.slice(7)) : null;
  const pod = (!isOnline && f.location)? findPod(f.location) : null;
  const date=new Date(b.dateKey);
  const weekday=WEEKDAY_KEYS[(date.getDay()+6)%7];
  const student=f.studentId? findStudent(f.studentId): null;
  const starts=possibleStarts(f.duration);
  const end=f.start!=null? f.start+f.duration : null;

  const onlinePeak = (student && f.start!=null && onlineInstr)? instructorCombinedPeak(onlineInstr.id, b.dateKey, {start:f.start, duration:f.duration}) : 0;
  const onlineOverCapacity = (student && f.start!=null && onlineInstr) && onlinePeak>ONLINE_COMBINED_CAP;

  let cov=null, instr1=null, suited1=true, totallyUnassigned=false, instr2=null, suited2=true;
  if(student && f.start!=null && pod){
    cov=podCoverageDetail(pod.id, weekday, f.start, f.duration, date);
    totallyUnassigned = !cov.primaryInstructorId;
    instr1 = cov.primaryInstructorId? findInstructor(cov.primaryInstructorId) : null;
    suited1 = instr1? instructorSuitedFor(instr1, student.year) : true;
    instr2 = cov.secondaryInstructorId? findInstructor(cov.secondaryInstructorId) : null;
    suited2 = instr2? instructorSuitedFor(instr2, student.year) : true;
  }
  // "Best suited for" (5.3) is a preference, not a requirement — it never forces an override. The
  // only thing that still can (Sept 2026 — age/year rules removed entirely) is actual staffing:
  // nobody assigned anywhere near the window, or a gap bigger than the tolerated 15 minutes
  // unattended (UNATTENDED_TOLERANCE_MIN). No Pod chosen at all needs no override either — that
  // just books it unassigned, same as any other uncovered slot.
  const needsOverride = student && pod && cov && !cov.ok;

  const cap=pod? podCapacity(pod.id) : 0;
  const wouldBePeak = (student && f.start!=null && pod)? peakConcurrency(pod.id, b.dateKey, {start:f.start, duration:f.duration}) : 0;
  const isTodayBooking = b.dateKey===toKey(simNow());
  // Same-day capacity bypass (5.34, per Allie: "I also need all front staff to have the ability to
  // overbook a pod on the day, not just me") — a future-dated booking is still hard-capped, no
  // override possible; today's real room can be overbooked directly here, same rule movePodSession
  // already applies to moving an existing session.
  const overCapacity = (student && f.start!=null && pod) && !isTodayBooking && podCapacityBlocked(pod.id, b.dateKey, {start:f.start, duration:f.duration});
  const overCapacityButAllowedToday = (student && f.start!=null && pod) && isTodayBooking && wouldBePeak>cap;

  const credit=b.creditId? findCredit(b.creditId) : null;

  let html='<div class="overlay" onclick="if(event.target===this) closeBooking()"><div class="modal">';
  html+='<h3>'+(credit? 'Book a make-up session' : ('Book a session — '+fmtShort(date)))+'</h3>';
  if(credit){
    // Manually assigning a make-up (Sept 2026, per Allie: "I need a button to manually assign
    // make-up sessions") — the student is fixed to whoever the credit belongs to (a credit can't be
    // reassigned to someone else here), and the date becomes an editable field instead of being
    // fixed by wherever the modal was opened from, since this wasn't opened from any one day's
    // Schedule view.
    html+='<div class="banner info">📌 Booking a make-up for <b>'+student.name+'</b> — using their credit for the session missed '+fmtShort(credit.issuedDate)+' (expires '+fmtShort(credit.expiryDate)+').</div>';
    html+='<label>Date</label><input type="date" value="'+b.dateKey+'" min="'+toKey(simNow())+'" max="'+toKey(addDays(simNow(),365))+'" onchange="setBookingDate(this.value)"/>';
  } else {
    html+='<label>Student</label><select onchange="setBookingStudent(this.value)">'
        +'<option value="">Choose a student…</option>'
        +students.map(function(s){ return '<option value="'+s.id+'"'+(s.id===f.studentId?' selected':'')+'>'+s.name+' ('+yearLabel(s.year)+')</option>'; }).join('')
        +'</select>';
  }
  html+='<div class="row2"><div><label>Length</label><select onchange="setBookingDuration(this.value)">'
      +DURATIONS.map(function(d){ return '<option value="'+d+'"'+(d===f.duration?' selected':'')+'>'+d+' min</option>'; }).join('')
      +'</select></div>'
      +'<div><label>Start time</label><select onchange="setBookingStart(this.value)">'
      +starts.map(function(t){ return '<option value="'+t+'"'+(t===f.start?' selected':'')+'>'+minToLabel(t)+'</option>'; }).join('')
      +'</select></div></div>';
  html+='<label>Pod</label><select onchange="setBookingLocation(this.value)">'
      +'<option value=""'+(f.location===''?' selected':'')+'>Unassigned</option>'
      +locationOptionsHtml(weekday, b.dateKey, f.start||0, f.duration, f.location)
      +'</select>';

  if(student && isStudentOnHold(student.id, date)){
    html+='<div class="banner warn">⏸️ '+student.name+' is on hold for this date — booking them anyway is fine if they\'re actually coming in.</div>';
  }
  if(student && pod && cov && cov.secondaryInstructorId){
    html+='<div class="banner accent">↔️ '+pod.name+' hands off partway through: '+instr1.name+' until '+minToLabel(cov.handoffAt)+', then '+instr2.name+' until '+minToLabel(end)+'. This will book automatically across the handoff.</div>';
  }
  if(student && pod && cov && cov.ok && cov.gapMinutes>0){
    html+='<div class="banner info">ℹ️ '+cov.gapMinutes+' min of this session is unattended in '+pod.name+' — within the '+UNATTENDED_TOLERANCE_MIN+'-minute tolerance, so no override is needed.</div>';
  }
  if(student && pod && needsOverride){
    const coverageReason = !cov.ok
      ? (totallyUnassigned
        ? 'nobody is assigned to '+pod.name+' anywhere near that time'
        : pod.name+' is unattended for '+cov.gapMinutes+' min of this session — more than the '+UNATTENDED_TOLERANCE_MIN+'-minute tolerance')
      : null;
    const reasons=[];
    if(coverageReason) reasons.push(coverageReason);
    html+='<div class="banner warn">⚠️ '+reasons.join('; and ')+'. You can still book it, but confirm below — to fix this properly, adjust the Pod\'s assignment.</div>';
    html+='<label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" '+(f.overrideOk?'checked':'')+' onchange="toggleOverride()" style="width:auto;margin:0"/> Book anyway</label>';
  }
  // Purely informational, never blocking: every instructor can teach any year (5.3), so a mismatch
  // with their usual best-suited range is just a heads-up, not something that needs an override.
  if(student && pod && !totallyUnassigned && (!suited1 || (instr2 && !suited2))){
    const who = !suited1? instr1.name+' ('+yearLabel(instr1.yearMin)+'–'+yearLabel(instr1.yearMax)+')' : instr2.name+' ('+yearLabel(instr2.yearMin)+'–'+yearLabel(instr2.yearMax)+')';
    html+='<div class="banner info">ℹ️ '+yearLabel(student.year)+' isn\'t '+who+'\'s usual focus, but they can teach any year — this books normally, no override needed.</div>';
  }
  if(student && pod && overCapacity){
    html+='<div class="banner danger">⛔ This would put '+pod.name+' over capacity ('+wouldBePeak+'/'+cap+') — not allowed for a future date, no override.</div>';
  }
  if(student && pod && overCapacityButAllowedToday){
    html+='<div class="banner warn">⚠️ This puts '+pod.name+' over capacity ('+wouldBePeak+'/'+cap+') — allowed since it\'s today; you\'re looking at the real room, not a projection.</div>';
  }
  if(student && onlineInstr && onlineOverCapacity){
    html+='<div class="banner danger">⛔ This would put '+onlineInstr.name+"'s Online group over the combined ratio ("+onlinePeak+'/'+ONLINE_COMBINED_CAP+') — not allowed, no override.</div>';
  }
  if(student && !pod && !isOnline){
    html+='<div class="banner info">ℹ️ No Pod chosen — this books '+student.name+' in, unassigned. Pick a Pod for them any time from the Schedule list.</div>';
  }
  // Walk-in convenience (Sept 2026, per Allie: "i need an option to add a student on a day when they
  // show up unexpectedly" — a student whose usual day is different turns up today). Only offered for
  // a same-day booking; a same-day booking made in ADVANCE of an actual arrival (lining up a make-up
  // before the student is actually due in) leaves this unticked.
  if(isTodayBooking){
    html+='<label style="display:flex;align-items:center;gap:6px;cursor:pointer;margin-top:8px"><input type="checkbox" '+(f.checkInNow?'checked':'')+' onchange="setBookingCheckInNow(this.checked)" style="width:auto;margin:0"/> They\'re here right now — check '+(student?student.name:'them')+' in immediately</label>';
    html+='<p class="small muted" style="margin:2px 0 0">Skips finding them in the Schedule list and clicking Check in separately — uses the same closest-to-now arrival time the Check-in screen itself defaults to.</p>';
  }

  const confirmDisabled = !f.studentId || f.start==null || overCapacity || onlineOverCapacity || (needsOverride && !f.overrideOk);
  html+='<div style="display:flex;gap:8px;margin-top:14px;justify-content:flex-end">'
      +'<button class="btn ghost" onclick="closeBooking()">Cancel</button>'
      +'<button class="btn primary" '+(confirmDisabled?'disabled':'')+' onclick="confirmBooking()">Confirm booking</button>'
    +'</div>';
  html+='</div></div>';
  return html;
}

// New instructor setup (5.18): who's covering the roster + what they told us their starting hours
// are. "Best suited for" is shown as a preference-only tag here too — see the comment on
// openNewInstructorForm for why it can never gate a booking or assignment.
function renderInstructorsPanel(){
  let html=sectionOpen('instructors','Instructors',
    '<button class="btn sm primary" onclick="openNewInstructorForm()">+ Add instructor</button>');
  html+='<table><tr><th>Instructor</th><th>Email</th><th>Best suited for</th><th>Availability <span class="small muted" style="font-weight:400">(self-reported)</span></th><th>Rostered shifts <span class="small muted" style="font-weight:400">(you set these)</span></th><th>Login</th><th></th></tr>';
  instructors.slice().sort(function(a,b){ return a.name.localeCompare(b.name); }).forEach(function(instr){
    // Two genuinely separate concepts, shown side by side so front desk never has to guess which
    // one they're looking at: "Availability" is what the instructor says they COULD work (availRules,
    // editable by the instructor themselves, or by front desk via "Adjust availability" below) —
    // it's a declaration, not a commitment. "Rostered shifts" is what front desk has actually
    // assigned them to cover (instructorRosteredShifts(), set via each Pod's "Assign" button in the
    // Schedule section) — that's the real, live staffing record students and other instructors rely
    // on. An instructor can be available Mon-Fri and rostered on only two of those days, or (if a
    // shift was arranged outside their stated hours) rostered on a day they haven't marked available
    // at all — though in practice qualifyingInstructorsForBlock() only offers already-available
    // instructors when assigning a shift, so the two normally line up (Sept 2026).
    const pattern=instructorCurrentWeeklyPattern(instr.id);
    const days=WEEKDAY_KEYS.filter(function(d){ return pattern[d]; });
    const availSummary = days.length? days.map(function(d){ return d+' '+minToLabel(pattern[d].start)+'–'+minToLabel(pattern[d].end); }).join(', ') : 'None on file';
    const shifts=instructorRosteredShifts(instr.id).filter(function(a){ return !a.upcoming; });
    const shiftSummary = shifts.length
      ? shifts.sort(function(a,b){ return WEEKDAY_KEYS.indexOf(a.day)-WEEKDAY_KEYS.indexOf(b.day) || a.start-b.start; })
          .map(function(a){ return a.day+' '+minToLabel(a.start)+'–'+minToLabel(a.end)+' ('+findPod(a.podId).name+')'; }).join(', ')
      : 'Not rostered';
    const inactive = instr.active===false;
    const loginCell = !supabaseClient? '<span class="small muted">—</span>'
      : instr.authUserId==='pending'? '<span class="badge soon">Invited</span>'
      : instr.authUserId? '<span class="badge available">Active</span>'
      : '<button class="btn sm ghost" onclick="inviteLogin(\''+instr.email+'\',\'instructor\',\''+instr.id+'\',\''+instr.name.replace(/'/g,"\\'")+'\')">Invite login</button>';
    html+='<tr'+(inactive?' style="opacity:.55"':'')+'><td>'+instr.name+(inactive?' <span class="small muted">(inactive)</span>':'')+'</td><td class="small">'+instr.email+'</td><td>'+yearLabel(instr.yearMin)+'–'+yearLabel(instr.yearMax)+'</td><td class="small">'+availSummary+'</td><td class="small">'+shiftSummary+'</td>'
      +'<td>'+loginCell+'</td>'
      +'<td><button class="btn sm ghost" onclick="openEditInstructorForm(\''+instr.id+'\')">Edit details</button> <button class="btn sm ghost" onclick="openStaffAvailManager(\''+instr.id+'\')">Adjust availability</button> '
      +(inactive
        ? '<button class="btn sm ghost" onclick="reactivateInstructor(\''+instr.id+'\')">Reactivate</button>'
        : '<button class="btn sm ghost" onclick="deactivateInstructor(\''+instr.id+'\')">Deactivate</button>')
      +'</td></tr>';
  });
  html+='</table></div>';
  html+=renderNewInstructorModal();
  html+=renderEditInstructorModal();
  html+=renderStaffAvailManagerModal();
  return html;
}
/* ---------- standalone parent accounts (usually created inline via new-student enrollment;
   this covers adding one directly, e.g. before their kid is enrolled, or inviting a login for an
   existing parent who doesn't have one yet) ---------- */
function openNewParentForm(){
  state.newParentForm={ name:'', email:'', inviteNow:true, error:'' };
  render();
}
function closeNewParentForm(){ state.newParentForm=null; render(); }
function setNPF(field, value){ state.newParentForm[field]=value; state.newParentForm.error=''; render(); }
function saveNewParent(){
  const f=state.newParentForm;
  if(!f.name.trim()){ f.error='Enter the parent\'s name.'; render(); return; }
  if(!f.email.trim()){ f.error='Enter an email address.'; render(); return; }
  const existingParent=parents.find(function(p){ return p.email.toLowerCase()===f.email.trim().toLowerCase(); });
  if(existingParent){
    if(isParentInactive(existingParent)){
      const kids=inactiveChildrenOf(existingParent);
      f.error='A parent with that email already exists but is inactive (all their children have stopped). Reactivate one instead of creating a duplicate: '
        +kids.map(function(k){ return '<button class="btn sm" style="margin:2px 4px 0 0" onclick="closeNewParentForm();openReactivateStudentForm(\''+k.id+'\')">Reactivate '+k.name+'</button>'; }).join('');
    } else {
      f.error='A parent with that email already exists.';
    }
    render(); return;
  }
  const newParent={id:newId()||('p'+(nextParentId++)), name:f.name.trim(), email:f.email.trim(), studentIds:[]};
  parents.push(newParent);
  dbWrite('adding a new parent', function(){ return supabaseClient.from('parents').insert({id:newParent.id, name:newParent.name, email:newParent.email}); });
  // Straight on to adding their first child, this parent already selected — a parent record on
  // its own isn't useful for anything else in the app, so there's no reason to make this a
  // separate trip back to the Students panel and having to find them in the dropdown.
  const dur=90, spw=2;
  state.newStudentForm={ parentMode:'existing', parentId:newParent.id, parentName:'', parentEmail:'', studentName:'', year:1, sessionsPerWeek:spw, duration:dur, recurring:defaultRecurring(spw,dur), matchedInactiveId:null, confirmNewAnyway:false, error:'' };
  toast(newParent.name+' added — now add their first child below.');
  state.newParentForm=null;
  render();
  if(f.inviteNow) inviteLogin(newParent.email, 'parent', newParent.id, newParent.name);
}

// rather than silently doing something narrower than it looks like it's doing.

function saveEditParent(){
  const f=state.editParentForm;
  const parent=findParent(f.parentId);
  if(!f.name.trim()){ f.error='Enter the parent\'s name.'; render(); return; }
  if(!f.email.trim()){ f.error='Enter an email address.'; render(); return; }
  const clash=parents.find(function(p){ return p.id!==parent.id && p.email.toLowerCase()===f.email.trim().toLowerCase(); });

  state.editParentForm=null;

}

}

// editing a parent's email: it only updates the contact record, not an already-active login.
function openEditStaffForm(staffId){
  const staff=findStaffMember(staffId);
  state.editStaffForm={staffId, name:staff.name, email:staff.email, error:''};
  render();
}
function closeEditStaffForm(){ state.editStaffForm=null; render(); }

function saveEditStaff(){
  const f=state.editStaffForm;
  const staff=findStaffMember(f.staffId);
  if(!f.name.trim()){ f.error='Enter their name.'; render(); return; }
  if(!f.email.trim()){ f.error='Enter an email address.'; render(); return; }
  const clash=staffMembers.find(function(s){ return s.id!==staff.id && s.email.toLowerCase()===f.email.trim().toLowerCase(); });
  if(clash){ f.error='Another staff member already uses that email.'; render(); return; }
  staff.name=f.name.trim();
  staff.email=f.email.trim();
  dbWrite('editing staff member details', function(){ return supabaseClient.from('staff_members').update({name:staff.name, email:staff.email}).eq('id', staff.id); });
  toast(staff.name+'\'s details updated.');
  state.editStaffForm=null;
  render();
}

        +starts.map(function(t){ return '<option value="'+t+'"'+(t===s.start?' selected':'')+'>'+minToLabel(t)+'</option>'; }).join('')
      +'</select></div></div>';
    if(podSetter){
      html+='<div style="margin:-6px 0 12px"><label>Preferred Pod for this session</label><select onchange="'+podSetter+'('+idx+',\'preferredPodId\',this.value)"><option value=""'+(!s.preferredPodId?' selected':'')+'>No preference (auto-assign)</option>'

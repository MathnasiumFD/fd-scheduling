/* ---------- INSTRUCTOR ---------- */
// The instructor-facing view of their rostered shifts deliberately doesn't mention Pods at all —
// that's an internal front-desk scheduling detail. To an instructor this is just "when am I
// working," derived from whatever blocks front desk has assigned them to, across any Pod.
function instructorRosteredShifts(instructorId){
  const now=simNow();
  const out=[];
  pods.forEach(function(pod){
    WEEKDAY_KEYS.forEach(function(day){
      podBlocksForDay(pod.id, day).forEach(function(b){
        if(blockInstructorOn(b, now)===instructorId){
          out.push({day, start:b.start, end:b.end, upcoming:false, podId:pod.id, blockId:b.id});
        }
        const future=b.assignments.filter(function(a){ return toKey(a.effectiveFrom)>toKey(now); })
          .sort(function(a,c){ return toKey(a.effectiveFrom).localeCompare(toKey(c.effectiveFrom)); })[0];
        if(future && future.instructorId===instructorId){
          out.push({day, start:b.start, end:b.end, upcoming:true, from:future.effectiveFrom, podId:pod.id, blockId:b.id});
        }
      });
    });
  });
  return out;
}

// Every one-off cover shift this instructor is currently assigned to, today or any date still to
// come — a proactive reminder of a confirmed one-time commitment, rather than something that only
// shows up (blended silently into "Rostered shifts", indistinguishable from their regular pattern)
// on the day it actually happens (Sept 2026, per Allie: "when i assign an instructor to cover
// another instructor, i need the one-off shift to come up on the instructors page so they're
// reminded of whats coming"). Same oneOffCoverage mechanism blockInstructorOn() already resolves
// from, just listed out directly here instead of collapsed into a single "who's on today" answer.
function instructorUpcomingCoverShifts(instructorId){
  const todayKey=toKey(simNow());
  const out=[];
  pods.forEach(function(pod){
    WEEKDAY_KEYS.forEach(function(day){
      podBlocksForDay(pod.id, day).forEach(function(b){
        (b.oneOffCoverage||[]).forEach(function(o){
          if(o.instructorId===instructorId && toKey(o.date)>=todayKey){
            out.push({date:o.date, day, start:b.start, end:b.end, podId:pod.id});
          }
        });
      });
    });
  });
  return out.sort(function(a,b){ return toKey(a.date).localeCompare(toKey(b.date)) || a.start-b.start; });
}

// Which Pods this instructor actually covers TODAY (per each block's dated assignment history),
// and which students are checked in at any of those Pods right now — used for the instructor's
// own "My Pod today" roster, so they only ever see students physically at their Pod, and only once
// checked in (not the full day's bookings).
function instructorPodIdsToday(instructorId){
  const today=simNow();
  const todayWeekday=WEEKDAY_KEYS[(today.getDay()+6)%7];
  return pods.filter(function(p){
    return podBlocksForDay(p.id, todayWeekday).some(function(b){ return blockInstructorOn(b, today)===instructorId; });
  }).map(function(p){ return p.id; });
}
// Includes both flavours of "checked in with me today": physically seated at one of my Pods, and
// checked in to my own Online group — an instructor is on the hook for both at once, so both show
// up together on their one "My Pod today" panel. Excludes anyone already checked out (Sept 2026,
// once instructors could check students out themselves, this list had to drop them immediately —
// same live-vs-historical rule checkedInTodayStillPresent()/checkedInNamesByPod() already use —
// otherwise a checked-out student would sit on the instructor's own roster, offering a Check out
// button, for the rest of the day).
function checkedInAtInstructorPodToday(instructorId){
  const todayKey=toKey(simNow());
  const myPodIds=instructorPodIdsToday(instructorId);
  // Ordered by exit time, soonest-leaving first (Sept 2026, per Allie: "can the students be shown
  // ordered by exit time, not alphabetical") — same convention the front desk's own live board
  // already uses (see sortEntries() in liveOccupancyGroups()), so an instructor sees who's about to
  // need checking out right at the top of their own list, rather than everyone in whatever order
  // they happened to check in.
  return sessions.filter(function(s){
    if(s.status!=='attended' || toKey(s.date)!==todayKey || s.checkedOut) return false;
    if(s.online) return s.instructorId===instructorId;
    return myPodIds.indexOf(s.podId)>-1;
  }).sort(function(a,b){
    const ea = a.actualEnd!=null? a.actualEnd : a.start+a.duration;
    const eb = b.actualEnd!=null? b.actualEnd : b.start+b.duration;
    return ea-eb;
  });
}

/* ---------- shift coverage requests ---------- */
// An instructor flags one dated occurrence of their own shift as needing coverage (e.g. they're
// sick), front desk sees it and picks a qualified, available replacement for just that date — the
// swap lands in the block's oneOffCoverage list (blockInstructorOn resolves it automatically
// everywhere else: booking, coverage summaries, capacity checks), leaving the instructor's regular
// dated assignment (5.2/5.3) untouched for every other day.
function openCoverageRequestForm(instructorId, podId, weekday, blockId){
  const today=simNow();
  let d=new Date(today);
  while(WEEKDAY_KEYS[(d.getDay()+6)%7]!==weekday){ d=addDays(d,1); }
  state.coverageRequestForm={instructorId, podId, weekday, blockId, date:toKey(d), note:'', error:''};
  render();
}
function closeCoverageRequestForm(){ state.coverageRequestForm=null; render(); }
function setCoverageRequestField(field, value){
  state.coverageRequestForm[field]=value;
  state.coverageRequestForm.error='';
  render();
}
function submitCoverageRequest(){
  const f=state.coverageRequestForm;
  const d=new Date(f.date);
  if(!f.date || toKey(d)<toKey(simNow())){ f.error='Pick today or a future date.'; render(); return; }
  if(WEEKDAY_KEYS[(d.getDay()+6)%7]!==f.weekday){ f.error='That date isn\'t a '+f.weekday+'.'; render(); return; }
  const dup=coverageRequests.find(function(r){ return r.blockId===f.blockId && toKey(r.date)===f.date && r.status==='open'; });
  if(dup){ f.error='There\'s already an open coverage request for that date.'; render(); return; }
  const block=podBlocksForDay(f.podId, f.weekday).find(function(b){ return b.id===f.blockId; });
  // Every qualified, actually-free instructor gets an email the moment the request goes in — a
  // parallel heads-up alongside front desk's own "needs coverage" queue, not a replacement for
  // front desk making the actual assignment (fillCoverageRequest). This is a point-in-time
  // snapshot of who's free right now; it doesn't re-fire later if availability changes.
  const notify=block? availableSubsForCoverage(f.podId, f.weekday, block, d, f.instructorId) : [];
  // If literally nobody qualifies and is free right now, that's already the "nobody can cover this
  // shift" case (5.14) — alert the manager immediately rather than waiting for front desk to notice
  // the request sitting open, or to click "mark unstaffed" themselves days later.
  const managerNotified = notify.length===0;
  const notifiedIds = notify.map(function(i){ return i.id; });
  const req={id:newId()||('cov'+(nextCoverageId++)), podId:f.podId, weekday:f.weekday, blockId:f.blockId, date:d, requestedBy:f.instructorId, note:f.note, status:'open', filledBy:null, notifiedInstructorIds:notifiedIds, managerNotified};
  coverageRequests.push(req);
  dbWrite('submitting coverage request', function(){ return supabaseClient.from('coverage_requests').insert({
    id:req.id, pod_id:req.podId, block_id:req.blockId, weekday:req.weekday, the_date:toKey(req.date),
    requested_by:req.requestedBy, note:req.note, status:'open', filled_by:null, manager_notified:managerNotified
  }).then(function(r){
    if(r.error || !notifiedIds.length) return r;
    return supabaseClient.from('coverage_request_notified_instructors').insert(notifiedIds.map(function(iid){
      return {coverage_request_id:req.id, instructor_id:iid};
    }));
  }); });
  const notifyMsg = notify.length
    ? ' Emailed '+notify.length+' available instructor'+(notify.length===1?'':'s')+' ('+notify.map(function(i){ return i.name; }).join(', ')+').'
    : ' Nobody is currently available — emailed '+MANAGER_EMAIL+' so it doesn\'t sit unnoticed.';
  toast('Coverage requested for '+fmtShort(d)+' — front desk will pick it up.'+notifyMsg);
  state.coverageRequestForm=null;
  render();
}
function cancelCoverageRequest(id){
  const r=coverageRequests.find(function(x){ return x.id===id; });
  if(r) r.status='cancelled';
  dbWrite('cancelling coverage request', function(){ return supabaseClient.from('coverage_requests').update({status:'cancelled'}).eq('id', id); });
  render();
}
// Qualified (5.3) instructors who are also actually free that exact date — not already covering a
// different Pod at an overlapping time, whether via their regular assignment or another swap.
function availableSubsForCoverage(podId, weekday, block, date, excludeInstructorId){
  const qualifying=qualifyingInstructorsForBlock(weekday, block, date).filter(function(i){ return i.id!==excludeInstructorId; });
  return qualifying.filter(function(instr){
    for(const otherPodId in podSchedule){
      const clash=podBlocksForDay(otherPodId, weekday).some(function(ob){
        if(otherPodId===podId && ob.id===block.id) return false;
        return ob.start<block.end && block.start<ob.end && blockInstructorOn(ob, date)===instr.id;
      });
      if(clash) return false;
    }
    return true;
  });
}
// Every currently open coverage request, system-wide (5.19) — not just the ones this instructor
// personally raised. Tagged and sorted so shifts overlapping their own declared weekly availability
// (instructorCurrentWeeklyPattern) surface first — the ones they could plausibly help with — then
// everything else, oldest date first within each group. Visibility only: front desk still makes the
// actual assignment (5.9/5.10); an instructor can't claim one from here.
function openCoverageRequestsSortedForInstructor(instructorId){
  const open=coverageRequests.filter(function(r){ return r.status==='open'; });
  const pattern=instructorCurrentWeeklyPattern(instructorId);
  const tagged=open.map(function(r){
    const block=podBlocksForDay(r.podId, r.weekday).find(function(b){ return b.id===r.blockId; });
    const a=pattern[r.weekday];
    const withinOwnAvailability = !!(block && a && block.start>=a.start && block.end<=a.end);
    return {request:r, withinOwnAvailability:withinOwnAvailability};
  });
  tagged.sort(function(x,y){
    if(x.withinOwnAvailability!==y.withinOwnAvailability) return x.withinOwnAvailability? -1 : 1;
    return new Date(x.request.date)-new Date(y.request.date);
  });
  return tagged;
}
// Re-resolves instructor coverage for every session ALREADY sitting in this Pod on this exact date
// — not just future/still-unassigned ones — whenever a one-off coverage swap changes who's actually
// covering (Sept 2026, root cause of "an instructor covering someone else's shift can't check a
// student out — after they do, the student goes back to the list", reported after a shift-coverage
// swap). generateRecurringSessions()'s own self-heal (see the "previously-unassigned occurrence"
// comment above it) only ever re-resolves a session that had NO instructor at all — a session that
// was already staffed by the ORIGINAL instructor keeps their id untouched, which is correct for
// every other kind of change, but wrong here: a one-off coverage swap is specifically the one case
// where WHO covers an already-assigned session needs to change too. Left as-is, the covering
// instructor could still see the student (coverage lookups like instructorPodIdsToday resolve the
// swap live), but any write they made to that session — check-out, check-in, no-show — was silently
// rejected: instructor_update_own_sessions' RLS only lets an instructor touch a row that already
// lists them as instructor_id/instructor_id_2, and an UPDATE whose RLS condition matches zero rows
// doesn't error, it just quietly succeeds having touched nothing — so the local "checked out" flag
// got overwritten back to false the moment data next reloaded, with no error ever shown.
function reassignSessionsForCoverageChange(podId, weekday, dateKey){
  const date=new Date(dateKey);
  sessions.filter(function(s){ return s.podId===podId && !s.online && toKey(s.date)===dateKey && s.status!=='cancelled'; })
    .forEach(function(s){
      const cov=podCoverageDetail(podId, weekday, s.start, s.duration, date);
      if(cov.primaryInstructorId===s.instructorId && (cov.secondaryInstructorId||null)===(s.instructorId2||null) && (cov.handoffAt||null)===(s.handoff||null)) return; // nothing actually changed for this session
      s.instructorId=cov.primaryInstructorId; s.instructorId2=cov.secondaryInstructorId; s.handoff=cov.handoffAt;
      dbWrite('updating coverage on an already-scheduled session', function(){ return supabaseClient.from('sessions').update({
        instructor_id:s.instructorId, instructor_id_2:s.instructorId2, handoff_min:s.handoff
      }).eq('id', s.id); });
    });
}
function fillCoverageRequest(requestId, instructorId){
  const req=coverageRequests.find(function(r){ return r.id===requestId; });
  const block=podBlocksForDay(req.podId, req.weekday).find(function(b){ return b.id===req.blockId; });
  const dateKey=toKey(req.date);
  block.oneOffCoverage=(block.oneOffCoverage||[]).filter(function(o){ return toKey(o.date)!==dateKey; });
  block.oneOffCoverage.push({date:new Date(req.date), instructorId});
  req.status='filled';
  req.filledBy=instructorId;
  dbWrite('filling coverage request', function(){
    return supabaseClient.from('coverage_requests').update({status:'filled', filled_by:instructorId}).eq('id', requestId).then(function(){
      return supabaseClient.from('pod_shift_one_off_coverage').delete().eq('block_id', block.id).eq('the_date', dateKey);
    }).then(function(){
      return supabaseClient.from('pod_shift_one_off_coverage').insert({block_id:block.id, the_date:dateKey, instructor_id:instructorId});
    });
  });
  reassignSessionsForCoverageChange(req.podId, req.weekday, dateKey);
  regenerateAllRecurring();
  toast(findInstructor(instructorId).name+' is covering '+findPod(req.podId).name+'’s '+req.weekday+' shift on '+fmtShort(req.date)+'.');
  render();
}
// Lets front desk record a coverage arrangement made face-to-face in the centre — any instructor,
// not just the qualification-and-availability shortlist fillCoverageRequest() is normally called
// from. Front desk is trusted to have actually confirmed the arrangement; this just records it.
function assignCoverageManually(requestId, instructorId){
  if(!instructorId){ toast('Choose an instructor first.'); return; }
  const req=coverageRequests.find(function(r){ return r.id===requestId; });
  if(!req || req.status!=='open') return;
  const instr=findInstructor(instructorId);
  fillCoverageRequest(requestId, instructorId);
  toast(instr.name+' is covering '+findPod(req.podId).name+'’s '+req.weekday+' shift on '+fmtShort(req.date)+' (arranged directly).');
}
function markCoverageUncovered(requestId){
  const req=coverageRequests.find(function(r){ return r.id===requestId; });
  const block=podBlocksForDay(req.podId, req.weekday).find(function(b){ return b.id===req.blockId; });
  const dateKey=toKey(req.date);
  block.oneOffCoverage=(block.oneOffCoverage||[]).filter(function(o){ return toKey(o.date)!==dateKey; });
  block.oneOffCoverage.push({date:new Date(req.date), instructorId:null});
  req.status='filled';
  req.filledBy=null;
  // The manager is only emailed once per request — usually this already happened the moment it was
  // raised (submitCoverageRequest, when the shortlist came back empty). Cover the rarer case where
  // it wasn't: someone was available at request time but never actually took it, so front desk is
  // the one confirming, right now, that nobody can cover it.
  const alreadyNotified=!!req.managerNotified;
  req.managerNotified=true;
  dbWrite('marking shift unstaffed', function(){
    return supabaseClient.from('coverage_requests').update({status:'filled', filled_by:null, manager_notified:true}).eq('id', requestId).then(function(){
      return supabaseClient.from('pod_shift_one_off_coverage').delete().eq('block_id', block.id).eq('the_date', dateKey);
    }).then(function(){
      return supabaseClient.from('pod_shift_one_off_coverage').insert({block_id:block.id, the_date:dateKey, instructor_id:null});
    });
  });
  reassignSessionsForCoverageChange(req.podId, req.weekday, dateKey);
  regenerateAllRecurring();
  toast(findPod(req.podId).name+' is marked unstaffed for '+fmtShort(req.date)+' — no replacement found.'+(alreadyNotified? '' : ' Emailed '+MANAGER_EMAIL+'.'));
  render();
}

function renderInstructor(){
  // Live mode (supabaseClient set) is already gated by real Supabase sign-in before rendering ever
  // reaches here — currentUser.instructorId is the real identity. state.instructorLoggedIn is the
  // old pre-Supabase demo mechanism (a fake "pick a sample account" login) and only still applies
  // in offline/test mode, where there's no real auth to check.
  const instrId = supabaseClient ? (currentUser && currentUser.instructorId) : state.instructorLoggedIn;
  if(!instrId) return supabaseClient? '<div class="card"><p class="small muted">Your login isn\'t linked to an instructor record — ask front desk to check your account.</p></div>' : renderInstructorLogin();
  const instr=findInstructor(instrId);
  // Same class of bug as the parent-view guard just below (and #205/#206 before it) — instrId being
  // SET doesn't guarantee it still matches a loaded instructor row (a stale/orphaned link, or one RLS
  // is filtering out), which used to throw "Cannot read properties of undefined (reading 'name')" on
  // the very next line. Sept 2026, added defensively after the same crash surfaced for a parent.
  if(!instr) return '<div class="card"><p class="small muted">Your login isn\'t linked to an instructor record — ask front desk to check your account.</p></div>';
  let html='<div class="card"><div class="card-head"><h2>Welcome, '+instr.name+'</h2><button class="btn sm ghost" onclick="'+(supabaseClient?'logOut()':'instructorLogout()')+'">Log out</button></div>'
    +'<p>Best suited for: <b>'+yearLabel(instr.yearMin)+'–'+yearLabel(instr.yearMax)+'</b> <span class="small muted">(a preference only — you can be assigned or booked for any year)</span></p>'
    +'<p>You can only see and manage your own availability — not other instructors\'.</p></div>';

  const myPodIdsToday=instructorPodIdsToday(instr.id);
  const checkedInAtMyPods=checkedInAtInstructorPodToday(instr.id);
  // A lone student turning orange at 5 minutes is plenty of notice; a genuine rush — 3 or more
  // leaving at the exact same time — needs the earlier 10-minute warning instead, since that's a
  // few check-outs to get through at once (Sept 2026, per Allie: "if you have 3 or more students
  // leaving at the same time, can it go orange with 10 min to go, 5 min otherwise"). Grouped by
  // each student's own actual exit time (not their scheduled one), same value the countdown itself
  // is built from.
  const exitTimeCounts={};
  checkedInAtMyPods.forEach(function(s){
    const exit=s.actualEnd!=null? s.actualEnd : s.start+s.duration;
    exitTimeCounts[exit]=(exitTimeCounts[exit]||0)+1;
  });
  html+='<div class="card"><h2>My Pod today</h2><p>Students checked in today at the Pod(s) you\'re covering. If one needs to be somewhere else, move them to another Pod here — front desk sees the change immediately.</p>';
  if(myPodIdsToday.length===0){ html+='<div class="empty-note">You\'re not rostered to cover a Pod today.</div>'; }
  else if(checkedInAtMyPods.length===0){ html+='<div class="empty-note">Nobody\'s checked in yet today.</div>'; }
  else{
    html+='<table><tr><th>Student</th><th>Pod</th><th>Time</th><th>Time left</th><th></th></tr>'
      +checkedInAtMyPods.map(function(s){
        const student=findStudent(s.studentId);
        const pod=findPod(s.podId);
        const locLabel=s.online? 'Online' : (pod? pod.name : '—');
        const exit=s.actualEnd!=null? s.actualEnd : s.start+s.duration;
        const soonThreshold=exitTimeCounts[exit]>=3? 10 : 5;
        // Harry's own board uses his custom 3-tier scheme instead of the standard 2-tier one — see
        // countdownInfoPackUpCustom() (Sept 2026, per Allie, for him only).
        const cd=instr.packUpCustomColors? countdownInfoPackUpCustom(exit) : countdownInfo(exit, soonThreshold);
        // Actual (check-in-adjusted) times, not the original scheduled window — this row is only
        // ever a student who's already checked in (checkedInAtInstructorPodToday() filters to
        // status==='attended'), so actualStart/actualEnd are always set by then. Previously showed
        // rangeLabel(s.start,s.duration) — the plain scheduled range — which silently disagreed with
        // front desk's own "Checked in today" panel (renderCheckedInPanel()) any time a check-in was
        // late/early or its exit time was manually adjusted (Sept 2026, per Allie: "the instructor
        // view of sign out times are different to front staff view").
        const timeLabel=(s.actualStart!=null && s.actualEnd!=null)? minToLabel(s.actualStart)+'–'+minToLabel(s.actualEnd) : rangeLabel(s.start,s.duration);
        // Flags this as the student's very first session at the centre — worth an instructor
        // knowing on sight, not just something front desk sees on their own Today tab (Sept 2026,
        // per Allie: "i also want it to say first day during their first session when sitting with
        // an instructor").
        const firstDayTag=isStudentStartingToday(student)? ' <span class="badge firstday">First day!</span>' : '';
        return '<tr><td>'+student.name+firstDayTag+' <span class="small muted">'+yearLabel(student.year)+'</span></td><td>'+locLabel+'</td><td>'+timeLabel+'</td>'
          +'<td><span class="badge '+cd.cls+'">'+cd.label+'</span></td>'
          +'<td><button class="btn sm" onclick="openCheckOut(\''+s.id+'\')">Check out</button> '
          +'<button class="btn sm ghost" onclick="openMoveForm(\''+s.id+'\')">Move pod</button></td></tr>';
      }).join('')
      +'</table>';
  }
  html+='</div>';
  html+=renderMoveModal();
  // Instructors can now check out their own students directly (Sept 2026, per Allie: "can we do it
  // so the instructors can check out the kids on their pod as well as front staff") — same modal
  // front desk uses, but scoped to just this instructor's own checked-in students (see
  // checkedInPresentForCurrentViewer()), not the whole centre.
  html+=renderCheckOutModal();

  html+=renderAvailabilityManager(instr, 'My availability');
  html+=renderAvailRuleModal();
  html+=renderOneOffModal();

  const shifts=instructorRosteredShifts(instr.id);
  html+='<div class="card"><h2>Rostered shifts</h2><p>The shifts front desk has scheduled you to work. Can\'t make one? Request coverage for that specific date — front desk lines up a replacement, and your regular assignment is untouched every other week.</p>';
  if(shifts.length===0) html+='<div class="empty-note">No shifts currently rostered.</div>';
  else{
    html+='<table><tr><th>Day</th><th>Time</th><th></th><th></th></tr>'
      +shifts.sort(function(a,b){ return WEEKDAY_KEYS.indexOf(a.day)-WEEKDAY_KEYS.indexOf(b.day) || a.start-b.start; })
        .map(function(a){ return '<tr><td>'+a.day+'</td><td>'+rangeLabel(a.start,a.end-a.start)+'</td><td class="small muted">'+(a.upcoming? 'Starting '+fmtShort(a.from) : '')+'</td>'
          +'<td>'+(a.upcoming? '' : '<button class="btn sm ghost" onclick="openCoverageRequestForm(\''+instr.id+'\',\''+a.podId+'\',\''+a.day+'\',\''+a.blockId+'\')">Request coverage</button>')+'</td></tr>'; }).join('')
      +'</table>';
  }
  html+='</div>';

  // A confirmed one-off cover shift for another instructor — shown as its own reminder, separate from
  // "Rostered shifts" above, since it's a one-time swap rather than part of the regular pattern (Sept
  // 2026, per Allie: "when i assign an instructor to cover another instructor, i need the one-off
  // shift to come up on the instructors page so they're reminded of whats coming").
  const upcomingCoverShifts=instructorUpcomingCoverShifts(instr.id);
  if(upcomingCoverShifts.length>0){
    html+='<div class="card"><h2>Upcoming cover shifts</h2><p>One-off shifts you\'ve taken on to cover for another instructor — these are one-time only and won\'t show here again once the date passes.</p>';
    html+='<table><tr><th>Date</th><th>Day</th><th>Time</th><th>Pod</th></tr>'
      +upcomingCoverShifts.map(function(c){ return '<tr><td>'+fmtShort(c.date)+'</td><td>'+c.day+'</td><td>'+rangeLabel(c.start,c.end-c.start)+'</td><td>'+findPod(c.podId).name+'</td></tr>'; }).join('')
      +'</table></div>';
  }

  const openForMe=openCoverageRequestsSortedForInstructor(instr.id);
  if(openForMe.length>0){
    html+='<div class="card"><h2>Shifts needing coverage</h2><p>Every currently open coverage request across the centre — the ones during your own usual hours are listed first, since those are the ones you could most plausibly help with. Front desk still makes the actual assignment; this is visibility only, so let them know if you\'re able to step in.</p>';
    html+='<table><tr><th>Date</th><th>Pod / shift</th><th>Requested by</th><th></th></tr>'
      +openForMe.map(function(x){
        const r=x.request;
        const pod=findPod(r.podId);
        const block=podBlocksForDay(r.podId, r.weekday).find(function(b){ return b.id===r.blockId; });
        const requester=findInstructor(r.requestedBy);
        return '<tr><td>'+fmtShort(r.date)+'</td><td class="small">'+pod.name+(block? ' '+rangeLabel(block.start,block.end-block.start) : '')+'</td>'
          +'<td class="small">'+(requester? requester.name : '—')+(r.requestedBy===instr.id? ' <span class="small muted">(you)</span>' : '')+'</td>'
          +'<td>'+(x.withinOwnAvailability? '<span class="badge available">During your hours</span>' : '<span class="small muted">Outside your hours</span>')+'</td></tr>';
      }).join('')
      +'</table></div>';
  }

  const myRequests=coverageRequests.filter(function(r){ return r.requestedBy===instr.id; }).sort(function(a,b){ return new Date(b.date)-new Date(a.date); });
  if(myRequests.length>0){
    html+='<div class="card"><h2>Your coverage requests</h2>';
    html+='<table><tr><th>Date</th><th>Pod / shift</th><th>Emailed</th><th>Status</th><th></th></tr>'
      +myRequests.map(function(r){
        const pod=findPod(r.podId);
        const block=podBlocksForDay(r.podId, r.weekday).find(function(b){ return b.id===r.blockId; });
        const notified=(r.notifiedInstructorIds||[]).map(function(id){ const i=findInstructor(id); return i?i.name:null; }).filter(Boolean);
        const emailedCell = notified.length
          ? notified.join(', ')
          : (r.managerNotified? 'Nobody available — manager emailed' : 'Nobody yet');
        const statusLabel = r.status==='open'? '<span class="badge soon">Open</span>'
          : r.status==='cancelled'? '<span class="small muted">Cancelled</span>'
          : (r.filledBy? '<span class="badge available">Covered by '+findInstructor(r.filledBy).name+'</span>' : '<span class="badge full">Unstaffed</span>');
        return '<tr><td>'+fmtShort(r.date)+'</td><td class="small">'+pod.name+(block? ' '+rangeLabel(block.start,block.end-block.start) : '')+'</td>'
          +'<td class="small muted">'+emailedCell+'</td><td>'+statusLabel+'</td>'
          +'<td>'+(r.status==='open'? '<button class="btn sm ghost" onclick="cancelCoverageRequest(\''+r.id+'\')">Cancel</button>' : '')+'</td></tr>';
      }).join('')
      +'</table></div>';
  }
  html+=renderCoverageRequestModal();

  return html;
}

  const rules=instr.availRules.slice().sort(function(a,b){ return toKey(b.effectiveFrom).localeCompare(toKey(a.effectiveFrom)); });

      +rules.map(function(r){

          +'<td><button class="btn sm ghost" onclick="removeAvailRule(\''+instr.id+'\','+idx+')">Remove</button></td></tr>';
      }).join('')
      +'</table>';

  const oneOffs=instr.oneOffs.slice().sort(function(a,b){ return toKey(a.date).localeCompare(toKey(b.date)); });
  html+='<h3 style="margin-top:16px">One-off changes</h3>';
  if(oneOffs.length===0) html+='<div class="empty-note">None on file.</div>';
  else{
    html+='<table><tr><th>Date</th><th>Hours</th><th></th></tr>'

          +'<td><button class="btn sm ghost" onclick="removeOneOff(\''+instr.id+'\','+idx+')">Remove</button></td></tr>';
      }).join('')
      +'</table>';
  }
  html+='</div>';
  return html;
}

var PARENT_TABS=[
  {id:'home', label:'My Schedule'},
  {id:'summer', label:'Summer Schedule'},
];
function setParentTab(id){ state.parentTab=id; render(); }
function renderParentTabsBar(activeTab){
  return '<div class="subtabs">'+PARENT_TABS.map(function(t){

function renderParent(){
  // See the matching comment in renderInstructor() — same old pre-Supabase demo mechanism, same fix.
  const parentId = supabaseClient ? (currentUser && currentUser.parentId) : state.parentLoggedIn;
  if(!parentId) return supabaseClient? '<div class="card"><p class="small muted">Your login isn\'t linked to a parent record — ask front desk to check your account.</p></div>' : renderParentLogin();
  const parent=parents.find(function(p){ return p.id===parentId; });
  // Same class of bug as #205/#206 (parent login crashing on an unguarded lookup) — here it's the
  // parent record itself: their login is linked to a parentId that doesn't match any row actually
  // loaded into `parents` (a stale/orphaned link, or a row RLS is filtering out), which used to throw
  // "Cannot read properties of undefined (reading 'name')" on the very next line and take down their
  // whole view. Sept 2026, after Allie reported "loading data has failed" for a parent at login.
  if(!parent) return '<div class="card"><p class="small muted">Your login isn\'t linked to a parent record — ask front desk to check your account.</p></div>';
  const tab=PARENT_TABS.some(function(t){ return t.id===state.parentTab; })? state.parentTab : 'home';
  let html=renderParentTabsBar(tab);
  if(tab==='summer'){ html+=renderParentSummerTab(parent); html+=renderTermBreakBookingModal(); html+=renderTermBreakRecurringModal(); return html; }

  html+='<div class="card"><div class="card-head"><h2>Welcome, '+parent.name+'</h2><button class="btn sm ghost" onclick="'+(supabaseClient?'logOut()':'parentLogout()')+'">Log out</button></div>'
    +'<p>This is your MATHQ hub for your child’s Mathnasium sessions — see what’s upcoming, request a permanent day/time change, cancel a session, or book a make-up using our live availability calendar.</p>'
    +'<p>You’ll only ever see times that are actually available to book — never other families’ bookings or private centre information.</p>'
    +'<p>Please make all cancellations, schedule-change requests and make-up bookings here rather than by phone, email or text. Cancellations and make-up bookings update instantly; a permanent day/time change is reviewed by front desk first, same as a hold or cancelling enrolment.</p>'
    +'<p>Quick, easy, all in one place.</p></div>';

  parent.studentIds.forEach(function(sid){
    const student=findStudent(sid);
    // Belt-and-suspenders alongside the studentIds-resync fix in fetchStudentsGroup(): if this id
    // still somehow doesn't resolve (a stale render mid-refresh, a genuinely removed student), skip
    // just this card instead of crashing the whole parent view on the next line's student.name.
    if(!student) return;
    const studentCredits=credits.filter(function(c){ return c.studentId===sid; })
      .sort(function(a,b){ return a.expiryDate-b.expiryDate; });
    const initials=student.name.split(' ').filter(Boolean).slice(0,2).map(function(w){ return w[0]; }).join('').toUpperCase();

    html+='<div class="card parent-card">';
    // Holds are the one request type a parent can have more than one open at once (Sept 2026, per
    // Allie: "parents need to be able to make multiple hold requests") — e.g. a family with two
    // separate trips planned this term shouldn't have to wait for the first hold to be reviewed
    // before asking about the second. So "Request a hold" always stays clickable; a pending count
    // is just shown alongside it rather than replacing the link. Schedule-change and cancellation
    // requests are still one-at-a-time, since a second one before the first is resolved would just
    // be ambiguous about which the parent actually wants.
    const openHoldCount=enrollmentRequests.filter(function(r){ return r.studentId===sid && r.type==='hold' && r.status==='open'; }).length;
    // A permanent day/time change no longer creates a pending request at all (Sept 2026, per Allie —
    // see submitTimeChangeRequest()), so this can only ever be true for a stray pre-existing
    // 'time_change' row from before that change shipped. Left in place purely so a parent can't open
    // a second, conflicting change on top of one of those old leftover rows before front desk gets
    // to it the old way; it'll simply never trigger for anything submitted going forward.
    const pendingTimeChange=enrollmentRequests.some(function(r){ return r.studentId===sid && r.type==='time_change' && r.status==='open'; });
    const pendingCancel=enrollmentRequests.some(function(r){ return r.studentId===sid && r.type==='cancel' && r.status==='open'; });
    html+='<div class="parent-header"><div class="avatar-circle">'+initials+'</div>'
      +'<div><h2>'+student.name+'</h2><div class="small muted">'+yearLabel(student.year)+' · '+student.sessionsPerWeek+'x/week · '+student.duration+'-min sessions</div>'
      +'<div class="small muted">Regular schedule: '+recurringSummary(student)+'</div></div>'
      +'<div style="margin-left:auto;display:flex;flex-direction:column;gap:4px;align-items:flex-end">'
        +'<a href="#" class="small" onclick="openHoldRequestForm(\''+sid+'\');return false;">Request a hold</a>'
        +(openHoldCount>0? '<span class="small muted">'+openHoldCount+' hold request'+(openHoldCount===1?'':'s')+' pending</span>' : '')
        +(pendingTimeChange? '<span class="small muted">Schedule change request pending</span>' : '<a href="#" class="small" onclick="openTimeChangeRequestForm(\''+sid+'\');return false;">Change regular day/time</a>')
        +(pendingCancel? '<span class="small muted">Cancellation request pending</span>' : '<a href="#" class="small" onclick="openCancelRequestForm(\''+sid+'\');return false;">Request to cancel enrolment</a>')
      +'</div></div>';

    // -- This child's own waitlist entries (5.17, parent self-service Sept 2026) — a parent can see
    // and leave whatever they've personally added, same as front desk sees the full queue. --
    const myWaiting=waitlist.filter(function(w){ return w.studentId===sid && w.status==='waiting'; })
      .sort(function(a,b){ return WEEKDAY_KEYS.indexOf(a.weekday)-WEEKDAY_KEYS.indexOf(b.weekday) || a.start-b.start; });
    if(myWaiting.length>0){
      html+='<div class="section-label">On the waitlist</div>';
      html+='<div class="session-list">'+myWaiting.map(function(w){
        const seat=waitlistOpenSeat(w);
        const statusNote = seat
          ? '<span class="badge available">Seat open — let front desk know you\'d like it</span>'
          : '<span class="small muted">Still waiting</span>';
        return '<div class="session-row"><div class="session-main"><b>'+w.weekday+' '+rangeLabel(w.start,w.duration)+'</b>'
          +(w.swapWeekday? '<div class="small muted">Swapping out: '+w.swapWeekday+' '+minToLabel(w.swapStart)+'</div>' : '')
          +(w.note? '<div class="small muted">'+w.note+'</div>' : '')+'</div>'+statusNote
          +'<button class="btn sm ghost" onclick="parentRemoveWaitlistEntry(\''+w.id+'\')">Leave waitlist</button></div>';
      }).join('')+'</div>';
    }

    const changes=upcomingChangesForStudent(sid);
    if(changes.length>0){
      html+='<div class="banner info">'+changes.map(describeUpcomingChange).join('<br/>')+'</div>';
    }

    const allUpcoming=sessions.filter(function(s){ return s.studentId===sid && s.status==='scheduled' && toKey(s.date)>=toKey(simNow()); })
      .sort(function(a,b){ return toKey(a.date).localeCompare(toKey(b.date)) || a.start-b.start; });
    const viewAll=!!(state.parentViewAllSessions && state.parentViewAllSessions[sid]);
    const upcomingSessions=viewAll? allUpcoming : allUpcoming.slice(0,5);
    html+='<div class="section-label" style="display:flex;justify-content:space-between;align-items:center">'
      +'<span>Upcoming sessions</span>'
      +(allUpcoming.length>5? '<a href="#" onclick="toggleViewAllSessions(\''+sid+'\');return false;" class="small">'+(viewAll?'Show fewer':'View all ('+allUpcoming.length+')')+'</a>' : '')
    +'</div>';
    if(upcomingSessions.length===0){ html+='<div class="empty-note">No upcoming sessions scheduled.</div>'; }
    else{
      html+='<div class="session-list">'+upcomingSessions.map(function(s){
        const pod=findPod(s.podId);
        const instr=s.instructorId? findInstructor(s.instructorId) : null;
        const isMakeUp=credits.some(function(c){ return c.redeemedSessionId===s.id; });
        // Sept 2026: a session the family self-booked during summer/term break hours gets its own
        // badge and its own cancel path (parentCancelTermBreakSession — a plain cancel, never a
        // make-up credit, since nothing regular was actually missed to earn one).
        const typeBadge=s.termBreak? '<span class="badge soon">Summer</span>' : (s.recurring? '<span class="badge booked">Regular</span>' : (isMakeUp? '<span class="badge available">Make-Up</span>' : '<span class="badge soon">One-off</span>'));
        // Cancelling is always allowed, even same-day past the 10am cutoff — it just won't come
        // with a make-up credit past that point (5.26, per Allie: previously refused outright,
        // which just pushed the family to phone in instead). Flag it here too, not only in the
        // confirm dialog, so it's not a surprise after they've already clicked Cancel.
        const noMakeUpToday = !s.termBreak && toKey(s.date)===toKey(simNow()) && sameDayMakeUpCutoffPassed();
        return '<div class="session-row">'
          +'<div class="session-date-chip"><div class="sd-day">'+s.date.toLocaleDateString('en-AU',{weekday:'short'})+'</div><div class="sd-num">'+s.date.getDate()+'</div></div>'
          +'<div class="session-main"><b>'+rangeLabel(s.start,s.duration)+'</b><div class="small muted">'+(s.online?'Online':(pod?pod.name:'—'))+' · '+(instr?instr.name:'Unassigned')+'</div>'
            +(noMakeUpToday? '<div class="small" style="color:var(--danger)">Past 10am — cancelling now won\'t include a make-up credit</div>' : '')
          +'</div>'
          +typeBadge
          +'<button class="btn sm ghost" onclick="'+(s.termBreak? 'parentCancelTermBreakSession' : 'parentCancelSession')+'(\''+s.id+'\')">Cancel</button>'
        +'</div>';
      }).join('')+'</div>';
    }

    html+='<div class="section-label">Make-up credits</div>';
    if(studentCredits.length===0){ html+='<div class="empty-note">No make-up credits on file.</div>'; }
    else{
      const availableCount=studentCredits.filter(function(c){ const s=creditDisplayStatus(c); return s==='available'||s==='soon'; }).length;
      const soonest=studentCredits.filter(function(c){ const s=creditDisplayStatus(c); return s==='available'||s==='soon'; })
        .sort(function(a,b){ return a.expiryDate-b.expiryDate; })[0];
      if(availableCount>0){
        html+='<div class="makeup-summary"><div><div class="makeup-count">'+availableCount+'</div><div class="makeup-count-label">available</div></div>'
          +(soonest? '<div><div class="small muted">Next expiry</div><b>'+fmtShort(soonest.expiryDate)+'</b><div class="small muted">'+daysUntil(simNow(),soonest.expiryDate)+' days remaining</div></div>' : '')
          +(soonest? '<button class="btn primary" style="margin-left:auto" onclick="startBookMakeUp(\''+soonest.id+'\')">Book a make-up</button>' : '')
        +'</div>';
      }
      studentCredits.forEach(function(c){ html+=renderParentCredit(c, student); });
    }

    // Hold periods (Sept 2026, per Allie). Every hold request this student's family has ever
    // submitted stays visible here permanently — front desk resolving it doesn't remove the row,
    // it just settles which single badge it shows: exactly one of Pending, Approved, or Denied,
    // never more than one at a time (Allie: "each request visible just only one copy... not all
    // three, and they must not disappear"). Newest first.
    const holdHistory=enrollmentRequests.filter(function(r){ return r.studentId===sid && r.type==='hold'; })
      .sort(function(a,b){ return b.createdAt-a.createdAt; });
    html+='<div class="section-label">Hold periods</div>';
    if(holdHistory.length===0){ html+='<div class="empty-note">No hold requests on file.</div>'; }
    else{
      html+='<div class="session-list">'+holdHistory.map(function(r){
        const statusBadge = r.status==='open' ? '<span class="badge soon">Pending</span>'
          : r.status==='approved' ? '<span class="badge available">Approved</span>'
          : '<span class="badge full">Denied</span>';
        return '<div class="session-row"><div class="session-main"><b>'+fmtShort(r.start)+'–'+fmtShort(r.end)+'</b>'
          +(r.note? '<div class="small muted">'+r.note+'</div>' : '')+'</div>'+statusBadge+'</div>';
      }).join('')+'</div>';
    }
    html+='</div>';
  });
  html+=renderHoldRequestModal();
  html+=renderTimeChangeRequestModal();
  html+=renderCancelRequestModal();
  html+=renderParentWaitlistModal();
  return html;
}
// Sept 2026, per Allie: a dedicated Summer Schedule tab in the parent view — shows "Coming soon"
// until front desk flips a break's "Visible to parents" toggle on (see setTermBreakVisibility),
// then a per-child tally of summer session credits (their normal sessions/week x however many weeks
// the break spans) plus the two ways to spend them: one recurring weekly time (auto-books every
// matching week at once) or individual singular sessions — both draw from the same tally.
function renderParentSummerTab(parent){
  const activeOrUpcomingTermBreak=termBreaks.filter(function(t){ return t.visibleToParents; }).find(function(t){ return termBreakOn(simNow())===t; })
    || termBreaks.filter(function(t){ return t.visibleToParents && toKey(t.startDate)>=toKey(simNow()); }).sort(function(a,b){ return toKey(a.startDate).localeCompare(toKey(b.startDate)); })[0]
    || null;
  if(!activeOrUpcomingTermBreak){
    return '<div class="card"><h2>Summer Schedule</h2><p class="small muted">Coming soon — check back here once we open summer/term break bookings.</p></div>';
  }
  const tb=activeOrUpcomingTermBreak;
  let html='<div class="card"><h2>Summer Schedule</h2>'
    +'<p>'+tb.label+', '+fmtShort(tb.startDate)+'–'+fmtShort(tb.endDate)+' — the centre runs '+minToLabel(tb.morningStart)+'–'+minToLabel(tb.morningEnd)+' during this period, in place of the usual regular schedule.</p>'
    +'<p>Set up one recurring weekly time (it books every matching week at once) and/or book individual sessions one at a time — whichever suits you, both use the same summer session tally below.</p></div>';

  parent.studentIds.forEach(function(sid){
    const student=findStudent(sid);
    if(!student) return; // same defensive guard as renderParent() — see its own comment
    const total=studentTermBreakCredits(tb, sid);
    const remaining=studentTermBreakRemaining(tb, sid);
    const used=total-remaining;
    const picks=studentTermBreakRecurringPicks(tb, sid);
    const atRecurringCap=picks.length>=(student.sessionsPerWeek||0);
    const upcoming=sessions.filter(function(s){ return s.studentId===sid && s.termBreak && s.status==='scheduled' && toKey(s.date)>=toKey(simNow()); })
      .sort(function(a,b){ return toKey(a.date).localeCompare(toKey(b.date)) || a.start-b.start; });

    html+='<div class="card parent-card"><div class="parent-header"><div><h2>'+student.name+'</h2>'
      +'<div class="small muted">'+student.sessionsPerWeek+'x/week normally · '+termBreakWeekCount(tb)+' week'+(termBreakWeekCount(tb)===1?'':'s')+' of summer hours</div></div></div>';
    html+='<div class="makeup-summary"><div><div class="makeup-count">'+remaining+'</div><div class="makeup-count-label">available</div></div>'
      +'<div><div class="small muted">Used so far</div><b>'+used+' of '+total+'</b></div>'
      +'<div style="margin-left:auto;display:flex;gap:8px">'
        +'<button class="btn sm'+(remaining<=0?' ghost':' primary')+'" '+(remaining<=0?'disabled':'')+' onclick="openTermBreakBookingForm(\''+sid+'\')">Book a single session</button>'
        +'<button class="btn sm ghost" '+((remaining<=0||atRecurringCap)?'disabled':'')+' onclick="openTermBreakRecurringForm(\''+sid+'\')">+ Add a recurring time</button>'
      +'</div></div>';
    if(remaining<=0){ html+='<p class="small muted">No summer session credits left for '+student.name+' this period.</p>'; }

    if(picks.length>0){
      html+='<div class="section-label">Recurring summer times</div>';
      html+='<div class="session-list">'+picks.map(function(p){
        return '<div class="session-row"><div class="session-main"><b>Every '+p.weekday+' '+minToLabel(p.start)+'</b></div>'
          +'<button class="btn sm ghost" onclick="removeTermBreakRecurringPick(\''+sid+'\',\''+p.weekday+'\','+p.start+')">Remove</button></div>';
      }).join('')+'</div>';
    }

    html+='<div class="section-label">Upcoming summer sessions</div>';
    if(upcoming.length===0){ html+='<div class="empty-note">No summer sessions booked yet.</div>'; }
    else{
      html+='<div class="session-list">'+upcoming.map(function(s){
        const pod=findPod(s.podId);
        const instr=s.instructorId? findInstructor(s.instructorId) : null;
        return '<div class="session-row">'
          +'<div class="session-date-chip"><div class="sd-day">'+s.date.toLocaleDateString('en-AU',{weekday:'short'})+'</div><div class="sd-num">'+s.date.getDate()+'</div></div>'
          +'<div class="session-main"><b>'+rangeLabel(s.start,s.duration)+'</b><div class="small muted">'+(pod?pod.name:'—')+' · '+(instr?instr.name:'Unassigned')+(s.recurring?' · recurring':'')+'</div></div>'
          +'<button class="btn sm ghost" onclick="parentCancelTermBreakSession(\''+s.id+'\')">Cancel</button>'
        +'</div>';
      }).join('')+'</div>';
    }
    html+='</div>';
  });
  return html;
}
function renderTermBreakRecurringModal(){
  const f=state.termBreakRecurringForm;
  if(!f) return '';
  const tb=termBreaks.find(function(t){ return t.id===f.termBreakId; });
  if(!tb) return '';
  const student=findStudent(f.studentId);
  let html='<div class="overlay" onclick="if(event.target===this) closeTermBreakRecurringForm()"><div class="modal">';
  html+='<h3>Set up a recurring summer time for '+student.name+'</h3>';
  html+='<p>Pick one weekday and time — we\'ll book it for every matching week of the '+tb.label.toLowerCase()+' period at once, as long as there\'s room and summer session credits remain.</p>';
  if(f.error) html+='<div class="banner danger">'+f.error+'</div>';
  html+='<label>Weekday</label><select onchange="setTermBreakRecurringField(\'weekday\',this.value)">'
    +WEEKDAY_KEYS.map(function(wd){ return '<option value="'+wd+'"'+(wd===f.weekday?' selected':'')+'>'+wd+'</option>'; }).join('')
  +'</select>';
  const starts=termBreakPossibleStarts(tb, f.duration);
  // Preview against the FIRST real occurrence of this weekday still ahead (today or the break's
  // start, whichever's later) — a plain tb.startDate reference would usually show every time as
  // wide open even when every week's already fully booked, since it'd be checking a date that isn't
  // even this weekday. confirmTermBreakRecurringBooking() below still separately checks each actual
  // week when it books, so this is only ever a preview.
  const now=simNow();
  let previewDate=new Date(toKey(tb.startDate)<toKey(now)? toKey(now) : toKey(tb.startDate));
  while(WEEKDAY_KEYS[(previewDate.getDay()+6)%7]!==f.weekday && toKey(previewDate)<=toKey(tb.endDate)){ previewDate=addDays(previewDate,1); }
  const hasOccurrence=toKey(previewDate)<=toKey(tb.endDate);
  const openStarts=hasOccurrence? starts.filter(function(st){ return termBreakOpenSeatsAt(tb, f.weekday, toKey(previewDate), st, f.duration).seats>0; }) : [];
  if(!hasOccurrence){
    html+='<p class="small muted">No '+f.weekday+'s left in this summer hours period — try a different weekday.</p>';
  } else if(openStarts.length===0){
    html+='<p class="small muted">No open times for '+f.weekday+' — try a different weekday.</p>';
  } else {
    html+='<label>Time</label><select onchange="setTermBreakRecurringField(\'start\',this.value)"><option value="">Choose…</option>'
      +openStarts.map(function(st){ return '<option value="'+st+'"'+(st===f.start?' selected':'')+'>'+minToLabel(st)+'</option>'; }).join('')
    +'</select>';
  }
  html+='<div style="display:flex;gap:8px;margin-top:14px;justify-content:flex-end">'
    +'<button class="btn ghost" onclick="closeTermBreakRecurringForm()">Cancel</button>'
    +'<button class="btn primary" '+(f.start==null?'disabled':'')+' onclick="confirmTermBreakRecurringBooking()">Book every week</button>'
  +'</div>';
  html+='</div></div>';
  return html;
}

// Parent-facing summer/term-break self-booking (Sept 2026, per Allie: "when I give parents access

// inside the break's own range, not closed), then only shows times that are genuinely open right
// now, using the exact same termBreakOpenSeatsAt()/termBreakPickBestPod() math the confirm step
// itself relies on — so nothing offered here can ever fail to book once picked.
function renderTermBreakBookingModal(){
  const f=state.termBreakBookingForm;
  if(!f) return '';
  const tb=termBreaks.find(function(t){ return t.id===f.termBreakId; });
  if(!tb) return '';
  const student=findStudent(f.studentId);
  let html='<div class="overlay" onclick="if(event.target===this) closeTermBreakBookingForm()"><div class="modal">';
  html+='<h3>Book a '+tb.label.toLowerCase()+' session for '+student.name+'</h3>';
  html+='<p>Pick any weekday between '+fmtShort(tb.startDate)+' and '+fmtShort(tb.endDate)+' — the centre runs '+minToLabel(tb.morningStart)+'–'+minToLabel(tb.morningEnd)+' during this period, in place of the usual regular schedule.</p>';
  if(f.error) html+='<div class="banner danger">'+f.error+'</div>';
  html+='<label>Date</label><input type="date" value="'+f.date+'" min="'+toKey(tb.startDate)+'" max="'+toKey(tb.endDate)+'" onchange="setTermBreakBookingField(\'date\',this.value)"/>';
  if(f.date){
    const date=new Date(f.date);
    const weekday=WEEKDAY_KEYS[(date.getDay()+6)%7];
    if(!weekday){
      html+='<p class="small" style="color:var(--danger)">The centre is only open Monday–Friday during this period — pick a weekday.</p>';

      html+='<p class="small" style="color:var(--danger)">The centre is closed that day.</p>';
    } else {
      const starts=termBreakPossibleStarts(tb, f.duration);
      const openStarts=starts.filter(function(st){ return termBreakOpenSeatsAt(tb, weekday, f.date, st, f.duration).seats>0; });
      if(openStarts.length===0){
        html+='<p class="small muted">No open times that day for a '+f.duration+'-minute session — try another date.</p>';

  +'</div>';

  return html;
}

      +'<input id="loginPassword" type="password" autocomplete="current-password" style="width:100%;box-sizing:border-box;padding-right:40px"/>'
      +'<button type="button" id="loginPwToggle" onclick="toggleLoginPasswordVisibility()" aria-label="Show password" title="Show password" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:4px;font-size:16px;line-height:1">👁</button>'
    +'</div>'

// Lets someone see exactly what's actually in the password field before submitting — added Sept
// 2026 alongside the "invalid login details" investigation, since the most likely cause turned out
// to be Chrome autofill silently filling in a stale saved password: it looks right (dots, right
// length) but isn't, and there was previously no way to check without retyping blind.
function toggleLoginPasswordVisibility(){
  const pw=document.getElementById('loginPassword');
  const btn=document.getElementById('loginPwToggle');
  if(!pw || !btn) return;
  const showing = pw.type==='text';
  pw.type = showing ? 'password' : 'text';
  btn.textContent = showing ? '👁' : '🚫';
  btn.title = showing ? 'Show password' : 'Hide password';
  btn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
}

function doLogin(){
  // Trimmed on both ends (Sept 2026, per Allie: "sometimes it says invalid login details") — a
  // trailing/leading space (easy to pick up from autocomplete, or a keyboard's own autocorrect on
  // a phone) makes the password no longer match, and Supabase's error for that is the same generic
  // "Invalid login credentials" as an actually-wrong password, so it looks identical from here.
  // This can't fix every cause of that message (a genuinely wrong password still needs a reset —
  // see "Forgot password?" below), but it removes the one silent, invisible-to-the-user cause.
  const email=(document.getElementById('loginEmail').value||'').trim();
  const password=(document.getElementById('loginPassword').value||'').trim();
  if(!email || !password){ showLoginScreen('Enter your email and password.'); return; }
  supabaseClient.auth.signInWithPassword({email, password}).then(function(res){
    if(res.error){ showLoginScreen(res.error.message); return; }
    afterLogin();
  }).catch(function(err){
    // A network hiccup (dropped connection, Supabase briefly unreachable) previously failed
    // silently here — the button just did nothing, with no feedback at all — since only res.error
    // was ever handled, never a rejected promise. Sept 2026, per Allie: "sometimes it says invalid
    // login details" — this doesn't produce that exact message, but it's the other way a sign-in
    // attempt can go wrong unexplained, so it gets its own clear message instead of failing quietly.
    showLoginScreen('Could not reach the server — check your connection and try again.');
  });
}

// Live sync across open tabs/devices (Sept 2026, per Allie: "if there are two members of staff
// logged on at the same time, how can we see what the other has done in real time?"). Before this,
// every tab held only a frozen snapshot from whenever it last loaded — someone else's check-in,
// booking, or Pod change was invisible until a full page reload. Subscribes to every table
// loadAllData() reads from; ANY insert/update/delete on ANY of them (from anyone, including this
// tab's own writes echoing back — harmless) schedules a fresh loadAllData(). Debounced so a burst of
// related writes (e.g. regenerateAllRecurring() touching dozens of rows in one go) collapses into a
// single re-fetch instead of one per row.
//
// Deliberately just re-runs loadAllData() + render() — nothing fancier. Every modal/form lives in
// the separate `state` object and stores plain field values (a studentId string, a date, a number),
// never a direct reference into `students`/`sessions`/etc., so swapping those arrays out for fresh
// ones from the server can never yank a form out from under whoever has one open. regenerateAllRecurring()
// is deliberately NOT re-run here — whichever tab actually made the change already ran it (and
// persisted the result), so re-running it again on every other tab's every refresh would risk two
// tabs racing to fill the same gap at once for no benefit.
// Which in-memory "group" each realtime table feeds. A change to any ONE table only needs the
// group(s) it belongs to re-fetched and re-applied — not the other ~14 groups' worth of tables,
// which is what a bare loadAllData() re-run used to do on every single write anywhere (Sept 2026,
// found while tracing a Supabase egress/fair-use warning: every open tab — staff, instructor, or
// parent — was pulling the ENTIRE database on every write from ANYONE, plus again on an
// unconditional 30s timer, compounding hard across concurrently-open tabs and growing history).
var DATA_GROUP_TABLES={
  instructors:['instructors','instructor_avail_rules','instructor_one_offs'],
  pods:['pods','pod_shift_blocks','pod_shift_assignments','pod_shift_one_off_coverage'],
  podDayOverrides:['pod_day_overrides'],
  students:['students','student_recurring_slots','student_holds','student_pod_assignments','student_plan_changes','student_plan_change_recurring'],
  parents:['parents'],
  sessions:['sessions'],
  credits:['credits'],
  coverageRequests:['coverage_requests','coverage_request_notified_instructors'],
  waitlist:['waitlist_entries'],
  closedDays:['closed_days'],
  enrollmentRequests:['enrollment_requests','enrollment_request_recurring','enrollment_request_previous_recurring'],
  staffMembers:['staff_members'],
  staffRosteredShifts:['staff_rostered_shifts'],
  staffAttendance:['staff_attendance'],
  termBreaks:['term_breaks','term_break_coverage'],
};
var TABLE_TO_GROUP={};
Object.keys(DATA_GROUP_TABLES).forEach(function(g){ DATA_GROUP_TABLES[g].forEach(function(t){ TABLE_TO_GROUP[t]=g; }); });
var LIVE_SYNC_TABLES=Object.keys(TABLE_TO_GROUP);

var liveSyncTimer=null;
var pendingLiveSyncTables={};
function scheduleLiveSync(tableName){
  if(tableName) pendingLiveSyncTables[tableName]=true;
  if(liveSyncTimer) clearTimeout(liveSyncTimer);
  liveSyncTimer=setTimeout(function(){
    liveSyncTimer=null;
    const tables=Object.keys(pendingLiveSyncTables);
    pendingLiveSyncTables={};
    const groups={};
    tables.forEach(function(t){ const g=TABLE_TO_GROUP[t]; if(g) groups[g]=true; });
    loadDataGroups(Object.keys(groups)).then(renderUnlessEditing).catch(function(err){ console.error('Live sync refresh failed', err); });
  }, 500);
}
function subscribeToLiveUpdates(){
  let channel=supabaseClient.channel('live-updates');
  LIVE_SYNC_TABLES.forEach(function(t){
    channel=channel.on('postgres_changes', {event:'*', schema:'public', table:t}, function(){ scheduleLiveSync(t); });
  });
  // Logged rather than silent — Realtime depends on several things lining up (the table actually
  // being in the supabase_realtime publication, the project's Realtime feature, the connecting
  // user's own permissions) that can fail in ways invisible from the UI itself. If SUBSCRIBED never
  // shows up in the console, the 30-second heartbeat below is still catching every change anyway —
  // this is a "faster when it works" layer, not the only thing keeping tabs in sync.
  channel.subscribe(function(status, err){
    if(status==='SUBSCRIBED'){ console.log('Live sync connected — changes from other logins arrive within about a second.'); }
    else if(status==='CHANNEL_ERROR' || status==='TIMED_OUT' || status==='CLOSED'){
      console.error('Live sync could not connect ('+status+') — still syncing every 30 seconds via the fallback refresh.', err||'');
    }
  });
}

// Guards the one-time-only setup below (the Realtime subscription + the fallback heartbeat) against
// running more than once per page load (Sept 2026, root cause of "Signed in, but loading your data
// failed: cannot add postgres_changes callbacks for realtime:live-updates after subscribe()") —
// afterLogin() itself can legitimately run more than once (doLogin()'s own success callback calls it
// directly, AND supabaseClient.auth.signInWithPassword() separately fires a SIGNED_IN event through
// the onAuthStateChange listener further below for that SAME login, which calls it again; same
// double-call shape for setNewPassword()/updateUser()). Re-running the data load on a second call is
// harmless — but subscribeToLiveUpdates() calling supabaseClient.channel('live-updates') a second
// time returns the SAME channel object the first call already subscribed, and Supabase's realtime-js
// client refuses to add more postgres_changes listeners to an already-subscribed channel, throwing
// exactly that error and aborting the rest of afterLogin() — which is why data "failed to load" even
// though sign-in itself succeeded. A real logout always does a full page reload (see logOut()), so
// this only ever needs to guard one page load's worth of logins, never a genuine later one.
var liveSyncStarted=false;
function afterLogin(){
  supabaseClient.auth.getUser().then(function(res){
    if(res.error || !res.data.user){ showLoginScreen('Session expired — sign in again.'); return; }
    const uid=res.data.user.id;
    supabaseClient.from('app_users').select('role,instructor_id,parent_id').eq('auth_user_id', uid).single().then(function(r){
      if(r.error || !r.data){ showLoginScreen("Your account isn't set up yet — ask front desk to add you."); return; }
      currentUser={role:r.data.role, instructorId:r.data.instructor_id, parentId:r.data.parent_id, email:res.data.user.email};
      loadAllData().then(function(){
        state.role=currentUser.role;
        applyPromotions();
        applyPlanChanges();
        regenerateAllRecurring();
        autoCheckOutPastClose();
        render();
        // Live mode has no demo-clock button to trigger applyPromotions()/applyPlanChanges() as
        // days actually pass — real time just ticks forward on its own. Re-checking both on this
        // heartbeat (already needed for the checked-in "time left" countdown, see the offline-mode
        // comment below) means a scheduled promotion or plan change takes effect within 30 seconds
        // of its date arriving, not only the next time someone happens to re-open the page.
        //
        // This heartbeat also re-runs loadAllData() itself now (5.36, live sync) — a guaranteed,
        // always-works fallback for seeing another login's changes even if the faster Realtime push
        // subscription below never actually connects (it depends on several things — the table
        // being in the right Supabase publication, project settings, permissions — that can silently
        // fail in ways invisible from here). Worst case with Realtime working, staff see each
        // other's changes within about a second; worst case without it, within 3 minutes; either
        // way, never "not until someone reloads the page" again.
        //
        // Stretched from every 30s to every 3 minutes (Sept 2026, egress fix) — this is purely a
        // fallback for the rare case Realtime isn't connected, and it was doing a FULL re-fetch of
        // every table, unconditionally, per open tab, every 30 seconds, all day — one of the two
        // biggest contributors (with the old whole-database live-sync refresh above) to a Supabase
        // Fair Use Policy bandwidth warning. Realtime (subscribeToLiveUpdates below) is now the fast
        // path for real changes; this timer only needs to be frequent enough to catch a missed push.
        // Guarded by liveSyncStarted (see afterLogin() above) — this block sets up long-lived,
        // page-scoped resources (a repeating timer, a Realtime subscription), so it must only ever
        // run once per page load even though afterLogin() itself can legitimately run more than once.
        if(!liveSyncStarted){
          liveSyncStarted=true;
          setInterval(function(){
            loadAllData().then(function(){ applyPromotions(); applyPlanChanges(); autoCheckOutPastClose(); renderUnlessEditing(); })
              .catch(function(err){ console.error('Heartbeat refresh failed', err); });
          }, 180000);
          subscribeToLiveUpdates();
        }
      }).catch(function(err){
        console.error(err);
        // Surface the actual database error (missing table, RLS permission denial, etc.) instead of a
        // generic "check your connection" message — the connection is almost never the real cause,
        // and the vague message left this undiagnosable without pulling up the browser console (Sept
        // 2026, after "still saying loading data failed" persisted even once the expected fix — a
        // missing migration — had already been applied, meaning the true cause was something else
        // entirely and we needed the real error text to find it).
        const detail=(err && (err.message||err.error_description||err.hint||err.details)) || String(err);
        showLoginScreen('Signed in, but loading your data failed: '+detail);
      });
    });
  });
}

// Fetches every table this logged-in user can see (Row Level Security already scopes each query
// to their role) and reshapes it into the exact in-memory structures the rest of the app already
// reads/writes — so every existing render/business-logic function keeps working completely
// unchanged, whether its data came from the demo arrays or from a real database.
//
// Restructured (Sept 2026, egress fix) into one small fetch-and-apply function per DATA_GROUP_TABLES
// group above, so a targeted live-sync refresh can re-run just the 1-2 groups a given write actually
// touched instead of always re-running every group. loadAllData() itself is unchanged in effect —
// it's now just "run every group" — so the login/heartbeat full-reload path behaves exactly as
// before, table-for-table and column-for-column.
//
// Supabase/PostgREST silently caps a plain .select() at 1000 rows (its default page size) — with
// well over 1000 real session rows once a centre's been running a few months, a plain select()
// here was quietly loading only an arbitrary ~1000-row slice of the sessions table and treating
// that as the whole schedule. Every "session per student per day" dedup check downstream then
// saw a huge blind spot: a real, already-booked session that just didn't happen to be in that
// slice looked exactly like "nothing booked yet" and got a brand-new duplicate row inserted for
// it — on every single page load, forever, since the new duplicate had no better a chance of
// landing in the next arbitrary 1000-row slice either. That's what actually produced the tens of
// thousands of duplicate rows discovered Sept 2026 (see the one-time cleanup script), and why the
// schedule looked like it was silently rewriting itself. Paginate every table in full via .range()
// so this can never truncate silently again, no matter how large any of them grow.
function fetchTablePaginated(name, sel){
  const PAGE=1000;
  return (function fetchPage(from, acc){
    return supabaseClient.from(name).select(sel).range(from, from+PAGE-1).then(function(r){
      if(r.error) throw r.error;
      const rows=r.data||[];
      const all=acc.concat(rows);
      if(rows.length<PAGE) return all; // last page — fewer than a full page means nothing left
      return fetchPage(from+PAGE, all);
    });
  })(0, []);
}

function fetchPodsGroup(){
  return Promise.all([
    fetchTablePaginated('pods','id,name,capacity'),
    fetchTablePaginated('pod_shift_blocks','id,pod_id,weekday,start_min,end_min'),
    fetchTablePaginated('pod_shift_assignments','block_id,instructor_id,effective_from'),
    fetchTablePaginated('pod_shift_one_off_coverage','block_id,the_date,instructor_id'),
  ]).then(function(t){
    const [podRows,blockRows,assignRows,coverRows]=t;
    pods=podRows.map(function(r){ return {id:r.id, name:r.name, capacity:r.capacity}; });

    podSchedule={};
    pods.forEach(function(p){ podSchedule[p.id]={}; });
    blockRows.forEach(function(b){
      const assignments=assignRows.filter(function(a){ return a.block_id===b.id; }).map(function(a){
        return {instructorId:a.instructor_id, effectiveFrom:new Date(a.effective_from)};
      });
      const oneOffCoverage=coverRows.filter(function(c){ return c.block_id===b.id; }).map(function(c){
        return {date:new Date(c.the_date), instructorId:c.instructor_id};
      });
      const block={id:b.id, start:b.start_min, end:b.end_min, assignments, oneOffCoverage};
      if(!podSchedule[b.pod_id]) podSchedule[b.pod_id]={};
      if(!podSchedule[b.pod_id][b.weekday]) podSchedule[b.pod_id][b.weekday]=[];
      podSchedule[b.pod_id][b.weekday].push(block);
    });
  });
}

function fetchStudentsGroup(){
  return Promise.all([
    fetchTablePaginated('students','id,parent_id,name,year,base_year,year_baseline,duration,sessions_per_week,notes,start_date'),
    fetchTablePaginated('student_recurring_slots','student_id,weekday,start_min'),
    fetchTablePaginated('student_holds','id,student_id,start_date,end_date,note,credits_issued'),
    fetchTablePaginated('student_pod_assignments','id,student_id,pod_id,effective_from,weekday,online,instructor_id'),
    fetchTablePaginated('student_plan_changes','id,student_id,effective_from,stopped,sessions_per_week'),
    fetchTablePaginated('student_plan_change_recurring','plan_change_id,weekday,start_min'),
  ]).then(function(t){
    const [studentRows,slotRows,holdRows,podAssignRows,planChangeRows,planChangeRecurRows]=t;
    students=studentRows.map(function(r){ return {
      id:r.id, parentId:r.parent_id, name:r.name, year:r.year, baseYear:r.base_year, yearBaseline:r.year_baseline,
      duration:r.duration, sessionsPerWeek:r.sessions_per_week, startDate: r.start_date? new Date(r.start_date) : null,
      recurring: slotRows.filter(function(s){ return s.student_id===r.id; }).map(function(s){ return {weekday:s.weekday, start:s.start_min}; }),
      holds: holdRows.filter(function(h){ return h.student_id===r.id; }).map(function(h){ return {id:h.id, start:new Date(h.start_date), end:new Date(h.end_date), note:h.note||'', creditsIssued:h.credits_issued||0}; }),
      podAssignments: podAssignRows.filter(function(a){ return a.student_id===r.id; }).map(function(a){ return {podId:a.pod_id, effectiveFrom:new Date(a.effective_from), weekday:a.weekday||null, online:a.online||false, instructorId:a.instructor_id||null}; }),
      planChanges: planChangeRows.filter(function(pc){ return pc.student_id===r.id; }).map(function(pc){ return {
        id:pc.id, effectiveFrom:new Date(pc.effective_from), stopped:pc.stopped, sessionsPerWeek:pc.sessions_per_week,
        recurring: planChangeRecurRows.filter(function(rec){ return rec.plan_change_id===pc.id; }).map(function(rec){ return {weekday:rec.weekday, start:rec.start_min}; }),
      }; }),
    }; });
    // parents[].studentIds is derived FROM students, not its own column — so it goes stale the
    // instant students refreshes without parents also refreshing in the same batch, which is exactly
    // what a targeted live-sync refresh does most of the time (editing/enrolling a student changes
    // only the students table, not parents). Left unrepaired, a parent's studentIds could keep
    // pointing at an id that's dropped out of the fresh `students` array, and renderParent()'s
    // findStudent(sid) would come back undefined — crashing on the very next line reading .name
    // ("Cannot read properties of undefined (reading 'name')", Sept 2026, Allie: this exact error at
    // parent login). Recomputing it here, every time students loads, keeps it correct regardless of
    // which groups were actually requested — no extra network call, since `parents` itself is
    // already in memory; this just re-derives one field on it from the students array just fetched.
    if(typeof parents!=='undefined' && parents && parents.length){
      parents.forEach(function(p){
        p.studentIds = students.filter(function(s){ return s.parentId===p.id; }).map(function(s){ return s.id; });
      });
    }
  });
}

var GROUP_LOADERS={
  instructors:fetchInstructorsGroup, pods:fetchPodsGroup, podDayOverrides:fetchPodDayOverridesGroup,
  students:fetchStudentsGroup, parents:fetchParentsGroup, sessions:fetchSessionsGroup, credits:fetchCreditsGroup,
  coverageRequests:fetchCoverageRequestsGroup, waitlist:fetchWaitlistGroup, closedDays:fetchClosedDaysGroup,
  enrollmentRequests:fetchEnrollmentRequestsGroup, staffMembers:fetchStaffMembersGroup,
  staffRosteredShifts:fetchStaffRosteredShiftsGroup, staffAttendance:fetchStaffAttendanceGroup, termBreaks:fetchTermBreaksGroup,
};
var ALL_DATA_GROUPS=Object.keys(DATA_GROUP_TABLES);

// Fetches + applies only the requested groups (see DATA_GROUP_TABLES above). `students` and
// `parents` are special-cased to run in that order, never in parallel, since parents' mapping
// reads the just-built `students` array — every other requested group is independent and safe to
// run alongside the rest at once.
function loadDataGroups(groupIds){
  const set={};
  groupIds.forEach(function(g){ if(GROUP_LOADERS[g]) set[g]=true; });
  const tasks=[];
  if(set.students){
    // Sept 2026 fix: this used to read `set.parents` from INSIDE the .then() callback below, but
    // `delete set.parents` on the very next line ran synchronously, immediately after — long before
    // that callback ever actually fired (it only runs once fetchStudentsGroup()'s own fetch resolves,
    // well after this line). So the callback always saw `set.parents` as already-deleted/undefined
    // and fetchParentsGroup() silently never ran, in EVERY call — including the full-reload path at
    // login — leaving `parents` permanently stuck at whatever it was before this bug shipped (its
    // demo-seed/empty initial value on a fresh page load, since nothing else ever wrote to it). Root
    // cause of "cannot read properties of undefined (reading 'name')" at parent login. Fixed by
    // capturing the flag into a plain local boolean BEFORE deleting anything, so the callback reads
    // a value that was safely captured at the right time instead of the mutated `set` object later.
    const alsoParents=!!set.parents;
    tasks.push(fetchStudentsGroup().then(function(){ return alsoParents? fetchParentsGroup() : null; }));
    delete set.students; delete set.parents;
  } else if(set.parents){
    tasks.push(fetchParentsGroup());
    delete set.parents;
  }
  Object.keys(set).forEach(function(g){ tasks.push(GROUP_LOADERS[g]()); });
  return Promise.all(tasks);
}

function loadAllData(){
  return loadDataGroups(ALL_DATA_GROUPS);
}

if(supabaseClient){
  // Driven off onAuthStateChange rather than a one-off getSession() call, since the SDK sometimes
  // fires an early "no session yet" event before it's actually finished parsing the invite/recovery
  // token out of the URL — a direct getSession() (or treating that first event as final) can catch
  // that premature moment and show the plain login screen, permanently ignoring the correct
  // "you're actually signed in via this link" event that arrives a beat later. So instead: a
  // "no session" result is treated as provisional (shows login, but keeps listening) while a real
  // signed-in result is treated as final and always wins, whenever it arrives.
  var routedToApp = false; // true once we've acted on an actual session — later events can't undo it
  supabaseClient.auth.onAuthStateChange(function(event, session){
    // PASSWORD_RECOVERY is supposedly Supabase's dedicated event for this, but it isn't firing
    // reliably for this project's link format — so both invite and recovery links are now decided
    // purely from the link's own type (captured synchronously from the URL at the very top of this
    // script, and independently confirmed correct), on whichever session-bearing event fires first.
    if(session && (event==='SIGNED_IN' || event==='INITIAL_SESSION' || event==='PASSWORD_RECOVERY') && !routedToApp){
      routedToApp=true;
      // An invite or password-reset link lands here with a session already established (Supabase's
      // SDK parses the token from the URL on its own) — but they still need to actually choose a
      // password before going any further, so this takes priority over the normal "already signed
      // in, skip straight to the app" path.
      if(AUTH_REDIRECT_TYPE==='invite' || AUTH_REDIRECT_TYPE==='recovery'){ showSetPasswordScreen(); } else { afterLogin(); }
      return;
    }
    if(!session && event==='INITIAL_SESSION' && !routedToApp){
      showLoginScreen(); // provisional — a following SIGNED_IN with a real session still overrides this
    }
  });
} else {
  // Offline / test-harness fallback — exactly the original demo bootstrap, untouched.
  students.forEach(function(s){ s.baseYear=s.year; s.yearBaseline=schoolYearIndex(BASE); s.holds=s.holds||[]; });
  regenerateAllRecurring();
  autoCheckOutPastClose();
  render();
  // Keeps the checked-in "time left" countdown ticking against the real clock without anyone
  // touching the page — a plain re-render every 30s is plenty of resolution for a minutes-level
  // countdown, and cheap enough for a page this size. Also sweeps for anyone still checked in
  // past closing time (see autoCheckOutPastClose()) so a forgotten check-out doesn't sit "in
  // progress" forever once close has actually arrived.
  setInterval(function(){ autoCheckOutPastClose(); renderUnlessEditing(); }, 30000);
}
